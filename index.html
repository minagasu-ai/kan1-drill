<style>
/* Layout: one centered study column (max 760px); sticky top bar; home = mode tabs + lists, quiz = one question card at a time */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface2:#e9edf1; --ink:#17212f; --muted:#5a6676; --line:#d5dbe2;
  --navy:#1e3a5f; --navy-ink:#ffffff; --red:#c62a1f; --ok:#1d7a4a; --ok-bg:#e3f3ea; --ng:#b8321f; --ng-bg:#fbe8e4;
  --star:#b7791f; --shadow:0 1px 2px rgba(23,33,47,.06),0 4px 14px rgba(23,33,47,.06);
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-q:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111821; --surface:#18222e; --surface2:#212d3b; --ink:#e6ebf1; --muted:#9aa7b6; --line:#2e3b4b;
  --navy:#6fa0d8; --navy-ink:#0d1520; --red:#ef6a5c; --ok:#5cc58e; --ok-bg:#16301f; --ng:#f08470; --ng-bg:#3a1d18;
  --star:#e3b155; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111821; --surface:#18222e; --surface2:#212d3b; --ink:#e6ebf1; --muted:#9aa7b6; --line:#2e3b4b;
  --navy:#6fa0d8; --navy-ink:#0d1520; --red:#ef6a5c; --ok:#5cc58e; --ok-bg:#16301f; --ng:#f08470; --ng-bg:#3a1d18;
  --star:#e3b155; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top::before{content:"";display:block;height:4px;background:var(--red)}
.topin{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:18px;letter-spacing:.04em;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.iconbtn:hover{border-color:var(--navy)}
h1,h2,h3{text-wrap:balance;margin:0}
.hero{padding-block:22px 6px;display:grid;gap:14px}
.hero h1{font-size:24px;letter-spacing:.02em}
.hero p{margin:0;color:var(--muted);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.stat strong{font-size:20px;font-variant-numeric:tabular-nums}
.stat strong em{font-style:normal;font-size:12px;color:var(--muted);margin-left:2px}
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:700}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.panel{padding-top:16px;display:grid;gap:12px}
.ycard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.yhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.yhead h3{font-size:17px}
.yhead small{color:var(--muted);font-size:12px}
.yhead .sc{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-ng{background:var(--ng)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--navy);color:var(--navy)}
.chip.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:700}
.chip.primary:hover{opacity:.9;color:var(--navy-ink)}
.chip .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.primary .n{color:inherit;opacity:.8}
.sechead{display:flex;align-items:center;gap:10px;margin-top:6px}
.sechead h3{font-size:15.5px}
.sechead .tag{font-size:11px;letter-spacing:.08em;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:0 6px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.opt{display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap}
.opt select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);text-align:center;font-size:13.5px}
.list{display:grid;gap:6px}
.li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;width:100%}
.li:hover{border-color:var(--navy)}
.li .mk{flex:none;width:22px;text-align:center;font-weight:700}
.li .mk.o{color:var(--ok)} .li .mk.x{color:var(--ng)}
.li .tx{min-width:0;font-size:13.5px}
.li .tx small{display:block;color:var(--muted);font-size:11.5px}
.li .tx span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* quiz */
.qprog{display:flex;align-items:center;gap:10px;padding-top:14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.qprog .bar{flex:1}
.qcard{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.qmeta .no{font-weight:700;color:var(--ink);font-size:15px}
.qmeta .pill{border:1px solid var(--line);border-radius:999px;padding:0 9px;background:var(--surface2)}
.qmeta .star{margin-left:auto;border:0;background:none;cursor:pointer;font-size:13px;color:var(--muted);padding:2px 4px}
.qmeta .star[aria-pressed="true"]{color:var(--star);font-weight:700}
.qbody{padding:16px 18px 6px}
.stem{font-family:var(--f-q);font-size:16.5px;line-height:1.85;white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
.fig{margin:12px 0 0;display:grid;gap:8px}
.fig img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.choices{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.cbtn{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;cursor:pointer;line-height:1.7;transition:border-color .12s,background .12s}
.cbtn:hover:not(:disabled){border-color:var(--navy);background:var(--surface2)}
.cbtn:disabled{cursor:default}
.cnum{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:1px;font-variant-numeric:tabular-nums}
.ctx{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.cbtn.is-ans{border-color:var(--ok);background:var(--ok-bg)}
.cbtn.is-ans .cnum{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.cbtn.is-ng{border-color:var(--ng);background:var(--ng-bg)}
.cbtn.is-ng .cnum{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.cbtn.dim{opacity:.62}
.verdict{margin:14px 0 0;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;font-weight:700}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.ng{background:var(--ng-bg);color:var(--ng)}
.verdict .mark{font-size:30px;line-height:1;font-family:var(--f-q)}
.verdict .msg{font-size:16px}
.verdict .msg small{display:block;font-size:12.5px;font-weight:400;color:var(--ink)}
.expl{margin:14px 0 0;border-top:1px solid var(--line);padding:14px 0 6px}
.expl h4{margin:0 0 6px;font-size:13px;letter-spacing:.1em;color:var(--red)}
.expl .tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.85}
.expl .src{font-size:11.5px;color:var(--muted);margin-top:8px}
.qnav{display:flex;gap:10px;padding:14px 18px 18px;flex-wrap:wrap}
.qnav .chip{padding:9px 18px;font-size:14px}
.qnav .sp{flex:1}
.kbd{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px}
/* result */
.res{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;box-shadow:var(--shadow)}
.res .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.res .big strong{font-size:40px;font-variant-numeric:tabular-nums;line-height:1}
.res .big span{color:var(--muted)}
.judge{font-weight:700;padding:2px 10px;border-radius:6px;font-size:13px}
.judge.ok{background:var(--ok-bg);color:var(--ok)} .judge.ng{background:var(--ng-bg);color:var(--ng)}
.rsec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rsec div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.rsec b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:480px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat strong{font-size:17px}
  .rsec{grid-template-columns:1fr}
  .qbody{padding:14px 14px 4px} .qmeta{padding:10px 14px} .qnav{padding:12px 14px 16px}
  .stem{font-size:16px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* additions for 1kan drill */
.top::before{background:var(--navy)}
.tab[aria-selected="true"]{border-bottom-color:var(--navy)}
.cnum.sel{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.cbtn.sel{border-color:var(--navy);background:var(--surface2)}
.pill.two{background:var(--ng-bg);color:var(--ng);border-color:transparent;font-weight:700}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.ghead{display:flex;gap:12px;align-items:center}
.rank{flex:none;width:34px;height:34px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.rank.top{background:var(--navy);color:var(--navy-ink)}
.ghead h3{font-size:15.5px;line-height:1.4}
.ghead .cnt{margin-left:auto;text-align:right;white-space:nowrap}
.ghead .cnt b{font-size:22px;font-variant-numeric:tabular-nums}
.ghead .cnt small{font-size:11.5px;color:var(--muted);display:block;line-height:1.2}
.ydots{display:flex;gap:4px;flex-wrap:wrap}
.ydots span{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);font-variant-numeric:tabular-nums}
.ydots span.on{background:var(--surface2);color:var(--ink);border-color:var(--muted)}
details.more summary{cursor:pointer;font-size:13px;color:var(--navy);font-weight:700;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ "}
details.more[open] summary::before{content:"▾ "}
.reps{display:grid;gap:8px;margin-top:10px}
.rep{border-left:3px solid var(--line);padding:4px 10px;font-size:13.5px;line-height:1.7}
.rep .occ{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px;font-size:12px;color:var(--muted)}
.rep .occ button{border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;text-decoration:underline dotted}
.mk-o{color:var(--ok);font-weight:700} .mk-x{color:var(--ng);font-weight:700}
.sub{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin:4px 0 0}
.origbtn{margin-top:12px}
.orig{margin-top:10px;display:grid;gap:8px}
.orig img{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.note2{margin:10px 0 0;font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--surface2)}
.simrow{margin-top:12px;font-size:12.5px;color:var(--muted)}
.simrow button{border:0;background:none;color:var(--navy);cursor:pointer;font:inherit;font-weight:700;padding:0}
.search{width:100%;font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.fn{font-size:11.5px;color:var(--muted);text-align:center;margin-top:28px}

<script>

const IMGP={};
window.__imgLoaded=function(y){const r=IMGP[y]; if(r){r.res();}};
function loadYear(y){ if(!IMGP[y]){let res;const pr=new Promise(r=>res=r);IMGP[y]={pr,res};const sc=document.createElement('script');sc.src='img'+y+'.js';sc.onerror=()=>res();document.head.appendChild(sc);} return IMGP[y].pr; }
function fillImgs(root){ root.querySelectorAll('img[data-src]').forEach(im=>{const k=im.dataset.src;const y=k.slice(4).match(/^(H\d\d|R\d)/)[1];loadYear(y).then(()=>{if(window.IMG&&IMG[k]) im.src=IMG[k]; else im.alt='画像を読み込めませんでした';});}); }
const DATA={"q":[{"id":"H29A01","y":"H29","p":"A","no":1,"s":"日射に関する記述のうち、適当でないものはどれか。","c":["日射のエネルギーは、紫外線部より赤外線部に含まれる量の方が大きい。","大気における日射の吸収量は、大気中に含まれる水蒸気の多いときに増大する。","大気を通過して直接地表に到達する日射を、天空日射という。","大気の透過率は、地表に到達する日射と大気層の入り口における日射の強さの比である。"],"a":[3],"m":"exact","n":"","e":"大気を通過して直接地表に到達する日射は直達日射。天空日射は大気中で散乱・反射して天空の全方向から届く日射。","f":[],"o":["img/H29A01_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H29A02","y":"H29","p":"A","no":2,"s":"冬季における外壁の結露に関する記述のうち、適当でないものはどれか。","c":["外壁に断熱材を用いると、熱貫流抵抗が大きくなり、結露を生じにくい。","外壁の室内側に繊維質の断熱材を設ける場合は、断熱材の室内側に防湿層を設ける。","多層壁の構造体の内部における各点の水蒸気分圧を、その点における飽和水蒸気圧より低くすることにより、結露を防止することができる。","暖房している室内では、一般的に、天井付近に比べて床付近の方が、結露を生じにくい。"],"a":[4],"m":"exact","n":"","e":"暖房時の室内では床付近の方が温度が低く、結露を生じ「やすい」。","f":[],"o":["img/H29A02_o0.png"],"g":30,"cat":"A基礎・電気・建築","neg":true},{"id":"H29A03","y":"H29","p":"A","no":3,"s":"浮遊粉じんに関する記述のうち、適当でないものはどれか。","c":["浮遊粉じんは、在室者の活動により、衣類の繊維の組織やほこりなどが原因で発生し、その量は空気の乾燥により減少する傾向にある。","）「建築物における衛生的環境の確保に関する法律」においては、居室における浮遊粉じんの量の測定は、相対沈降径がおおむね10μm以下の浮遊粉じんを測定する機器等を用いて行うこととなっている。","）「建築物における衛生的環境の確保に関する法律」においては、居室における浮遊粉じんの量は、おおむね空気1m³につき0.15mg以下とすることとなっている。","浮遊粉じんの濃度表示には、一般的に、個数濃度又は質量濃度が使われる。"],"a":[1],"m":"exact","n":"","e":"浮遊粉じんは空気が乾燥すると舞い上がりやすくなり、増加する傾向にある。","f":[],"o":["img/H29A03_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H29A04","y":"H29","p":"A","no":4,"s":"流体に関する記述のうち、適当でないものはどれか。","c":["レイノルズ数は、慣性力と粘性力の比で表される無次元数であり、層流と乱流の判定の目安になる。","粘性係数が一定のニュートン流体では、粘性によるせん断応力は速度勾配に反比例する。","粘性流体の運動に影響を及ぼす動粘性係数は、粘性係数を流体の密度で除した値である。","密閉容器内に静止している流体の一部に加えた圧力は、流体のすべての部分にそのまま伝達される。"],"a":[2],"m":"exact","n":"","e":"ニュートン流体のせん断応力は速度勾配に「比例」する（τ＝μ・du/dy）。","f":[],"o":["img/H29A04_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H29A05","y":"H29","p":"A","no":5,"s":"管路内の流体に関する文中、 内に当てはまる用語の組合せとして、適当なものはどれか。流体が管路の直管部を流れるとき、 Ａ のために流体摩擦が働き、圧力損失が生じる。この圧力損失は、ダルシー・ワイスバッハの式より、平均流速の2乗に Ｂ することが知られている。\n(Ａ) (Ｂ)","c":["粘性 比例","粘性 反比例","慣性 比例","慣性 反比例"],"a":[1],"m":"exact","n":"","e":"流体摩擦は粘性によって生じ、ダルシー・ワイスバッハの式では圧力損失は平均流速の2乗に比例する。","f":[],"o":["img/H29A05_o0.png"],"g":8,"cat":"A基礎・電気・建築","neg":false},{"id":"H29A06","y":"H29","p":"A","no":6,"s":"流体に関する文中、 内に当てはまるものの組合せとして、適当なものはどれか。下図に示す断面積の大きい開放水槽の水面と流出孔との間の流線において、エネルギー保存則である Ａ が成り立ち、流出孔における流速は Ｂ である。\nただし、gは重力加速度、ρは流体の密度、Hは流出孔から水面までの高さとする。","c":["パスカルの定理　√(2H/ρ)","ベルヌーイの定理　√(2H/ρ)","パスカルの定理　√(2gH)","ベルヌーイの定理　√(2gH)"],"a":[4],"m":"exact","n":"","e":"水面と流出孔の間でベルヌーイの定理が成り立ち、流出速度は v＝√(2gH)（トリチェリの定理）。","f":["img/H29A06_f0.png","img/H29A06_f1.png"],"o":["img/H29A06_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"H29A07","y":"H29","p":"A","no":7,"s":"理想気体のカルノーサイクルに関する文中、 内に当てはまるものとして、適当なものはどれか。下図に示すカルノーサイクルにおいて、外部の高温熱源から熱量を受け取る過程は、である。","c":["①→②","②→③","③→④","④→①"],"a":[1],"m":"exact","n":"","e":"カルノーサイクルで高温熱源から熱量を受け取るのは等温膨張の過程（①→②）。","f":["img/H29A07_f0.png"],"o":["img/H29A07_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"H29A08","y":"H29","p":"A","no":8,"s":"湿り空気に関する記述のうち、適当でないものはどれか。","c":["電気加熱器で加熱した場合、相対湿度は変化しない。","飽和湿り空気では、乾球温度と湿球温度は等しい。","比エンタルピーを一定に保ちながら相対湿度を上げた場合、乾球温度は下降する。","シリカゲルを用いた固体吸着減湿を行った場合、吸着熱が発生するため乾球温度は上昇する。"],"a":[1],"m":"exact","n":"","e":"加熱しても絶対湿度は変わらないが、温度が上がるため相対湿度は低下する。","f":[],"o":["img/H29A08_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H29A09","y":"H29","p":"A","no":9,"s":"燃焼に関する記述のうち、適当でないものはどれか。","c":["高発熱量とは、燃料が完全燃焼したときに放出する熱量で、燃焼によって生じた水蒸気の潜熱分を含んでいる。","ガスの単位体積当たりの総発熱量をガスの比重の平方根で除したものを、ウォッべ指数という。","気体燃料より固体燃料の方が、一般的に、理論空気量に近い空気量で完全燃焼する。","単位量の燃料が理論空気量で完全燃焼したときに生成するガス量を、理論燃焼ガス量という。"],"a":[3],"m":"exact","n":"","e":"気体燃料は空気と混合しやすく、固体燃料より理論空気量に近い空気量で完全燃焼する。記述は逆。","f":[],"o":["img/H29A09_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H29A10","y":"H29","p":"A","no":10,"s":"金属材料の腐食に関する記述のうち、適当でないものはどれか。","c":["配管のフランジ接合部など、金属と金属、あるいは、金属と非金属の合わさったすきま部が優先的に腐食される現象をすきま腐食という。","水中における銅管の腐食は、pH6.5程度の微酸性の水では、中性の水と比較して高い腐食速度を示す。","開放系配管における炭素鋼の腐食速度は、水温の上昇とともに80℃位までは増加する。","水中でイオン化傾向が異なる金属を接触させた場合、イオン化傾向が小さい金属の方が腐食しやすい。"],"a":[4],"m":"exact","n":"","e":"異種金属を接触させると、イオン化傾向が「大きい」（卑な）金属の方が腐食する。","f":[],"o":["img/H29A10_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H29A11","y":"H29","p":"A","no":11,"s":"点検できない乾燥した隠ぺい場所に施設できる300V以下の低圧屋内配線工事の種類として、適当でないものはどれか。","c":["金属管工事","金属線ぴ工事","合成樹脂管工事","金属可とう電線管工事"],"a":[2],"m":"exact","n":"","e":"金属線ぴ工事は、点検できない隠ぺい場所には施設できない。","f":[],"o":["img/H29A11_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H29A12","y":"H29","p":"A","no":12,"s":"三相誘導電動機に関する記述のうち、適当でないものはどれか。","c":["200V回路では、一般的に、定格出力11kW以上で始動装置を使用する。","三相の電線のうちいずれかの2線を入れ替えると、回転方向が逆向きになる。","スターデルタ始動方式では、全電圧直入始動方式と比較して、始動トルクは1/3となる。","同期速度は、電動機の極数に比例し、電源の周波数に反比例する。"],"a":[4],"m":"exact","n":"","e":"同期速度Ns＝120f/pで、電源の周波数に比例し、極数に反比例する。記述は逆。","f":[],"o":["img/H29A12_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H29A13","y":"H29","p":"A","no":13,"s":"コンクリートに関する記述のうち、適当でないものはどれか。","c":["水セメント比とは、セメントペースト中のセメントに対する水の質量百分率をいう。","単位水量とは、フレッシュコンクリート1m³に含まれる水量をいう。","水セメント比は、施工に支障をきたさない範囲で大きいことが望ましい。","単位水量を大きくすると、コンクリートの流動性が増す。"],"a":[3],"m":"exact","n":"","e":"水セメント比は、施工に支障のない範囲でできるだけ「小さい」方が強度・耐久性の面で望ましい。","f":[],"o":["img/H29A13_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H29A14","y":"H29","p":"A","no":14,"s":"鉄筋コンクリート造の開口部の補強に関する記述のうち、適当でないものはどれか。","c":["窓などの開口部は、開口部周囲を鉄筋で補強し、隅角部には斜め筋を配置する。","梁貫通孔の径が梁せいの1/5以下のときは、径によらず補強筋を必要としない。","梁貫通孔の外面は、一般的に、柱面から梁せいの1.5倍以上離す。","梁貫通孔は、上下方向では梁せいの中心付近の位置とし、その径の大きさは梁せいの1/3以下とする。"],"a":[2],"m":"exact","n":"","e":"補強筋を省略できるのは、径が梁せいの1/10以下かつ150mm未満程度の小さな孔に限られる。1/5以下なら径によらず不要というのは誤り。","f":[],"o":["img/H29A14_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H29A15","y":"H29","p":"A","no":15,"s":"定風量単一ダクト方式における冷房の部分負荷時の特徴に関する記述として、適当でないものはどれか。\nただし、外気絶対湿度は、室内設定絶対湿度より高いものとする。","c":["最大負荷時に比べて、室内湿度は下がる。","最大負荷時に比べて、吹出し温度差が小さくなる。","最大負荷時に比べて、コイル出口空気温度が高くなる。","最大負荷時と同じ換気量を確保できる。"],"a":[1],"m":"exact","n":"","e":"定風量単一ダクト方式の部分負荷時は吹出し温度が上がって除湿量が減るため、室内湿度は「上がる」。","f":[],"o":["img/H29A15_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"H29A16","y":"H29","p":"A","no":16,"s":"空気調和方式に関する記述のうち、適当でないものはどれか。","c":["大温度差送風（低温送風）方式は、送風量の減少によりダクトサイズを小さくできる。","床吹出し方式は、冷房運転時の吹出し温度差を天井吹出し方式より大きくできる。","定風量単一ダクト方式は、同一系統内の部分的な空調の運転・停止ができない。","変風量単一ダクト方式は、ある程度の間仕切り変更に対応しやすい。"],"a":[2],"m":"exact","n":"","e":"床吹出し方式は居住域に直接吹き出すため、冷房時の吹出し温度差は天井吹出し方式より「小さく」する。","f":[],"o":["img/H29A16_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"H29A17","y":"H29","p":"A","no":17,"s":"下図に示す冷房時の湿り空気線図において、空気調和機の外気取入れ量として、適当なものはどれか。\nただし、送風量は8,000m³/h、空気の密度は1.2kg/m³とする。","c":["2,400m³/h","3,000m³/h","3,600m³/h","4,000m³/h"],"a":[1],"m":"exact","n":"","e":"外気量の比＝(混合65－室内56)÷(外気86－室内56)＝9/30＝0.3。外気取入れ量＝8,000×0.3＝2,400m³/h。","f":["img/H29A17_f0.png"],"o":["img/H29A17_o0.png"],"g":31,"cat":"A空調","neg":false},{"id":"H29A18","y":"H29","p":"A","no":18,"s":"熱負荷に関する記述のうち、適当でないものはどれか。","c":["冷房時における人体からの発生熱量は、温度が上がるほど顕熱が小さくなり、潜熱が大きくなる。","暖房時におけるすきま風負荷は、玄関まわりや地下エントランス部については考慮すべきである。","冷房負荷の計算においては、南側の外壁の負荷は、一般的に、内外温度差を用いて計算する。","冷房負荷の計算においては、一般的に、土間床、地中壁からの熱負荷は無視できる。"],"a":[3],"m":"exact","n":"","e":"冷房負荷計算では、南側を含め外壁の負荷は実効温度差を用いて計算する。","f":[],"o":["img/H29A18_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"H29A19","y":"H29","p":"A","no":19,"s":"空気調和設備の自動制御及び機器に関する記述のうち、適当でないものはどれか。","c":["外気導入量の最適化制御は、室内のCO₂濃度が設定値になるようにCO₂濃度センサーにより外気ダンパーの開度を制御することにより行う。","ダクト挿入型温度検出器は、エルボ、ダンパーの直下流などを避け、偏流が生じない場所に設置する。","室内型温度検出器は、吹出口からの冷温風、太陽からの放射熱などの影響がない場所に設置する。","冷却塔のファンは、外気温度により二位置制御する。"],"a":[4],"m":"exact","n":"","e":"冷却塔のファンは冷却水温度（出口水温）により制御する。外気温度ではない。","f":[],"o":["img/H29A19_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"H29A20","y":"H29","p":"A","no":20,"s":"地域冷暖房に関する記述のうち、適当でないものはどれか。","c":["建物ごとに熱源機器を設置する必要がないため、建物の床面積の利用率がよくなる。","熱源の集約化により、熱効率の高い機器の採用やエネルギーの有効利用が図れる。","地域冷暖房の採算面においては、一般的に、地域の熱需要密度は小さい方が有利である。","熱源の集約化により、各建物に燃焼機器を設置する場合より、ばい煙の管理が容易である。"],"a":[3],"m":"exact","n":"","e":"地域冷暖房は熱需要密度が「大きい」地域ほど配管コスト当たりの需要が多く、採算上有利。","f":[],"o":["img/H29A20_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"H29A21","y":"H29","p":"A","no":21,"s":"氷蓄熱に関する記述のうち、適当でないものはどれか。","c":["冷凍機の冷媒蒸発温度が低いため、冷凍機成績係数（COP）が低くなる。","氷蓄熱方式は、氷の融解潜熱を利用するため、水蓄熱方式に比べて蓄熱槽容量を小さくできる。","氷蓄熱方式は、冷水温度を低くできるため、水蓄熱方式に比べて搬送動力を小さくできる。","ダイナミック方式は、スタティック方式に比べて冷凍機成績係数（COP）が低くなる。"],"a":[4],"m":"exact","n":"","e":"ダイナミック方式は薄い氷を製氷・剥離するため蒸発温度を高くでき、スタティック方式よりCOPが「高い」。","f":[],"o":["img/H29A21_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"H29A22","y":"H29","p":"A","no":22,"s":"室内の二酸化炭素の濃度を1,000ppm以下に保つために必要な最小換気量として、適当なものはどれか。\nただし、外気中の二酸化炭素の濃度は400ppm、室内における二酸化炭素発生量は0.3m³/hとする。","c":["300m³/h","500m³/h","1,000m³/h","2,000m³/h"],"a":[2],"m":"exact","n":"","e":"Q＝0.3÷(1,000×10⁻⁶－400×10⁻⁶)＝0.3÷0.0006＝500m³/h。","f":[],"o":["img/H29A22_o0.png"],"g":2,"cat":"A換気・排煙","neg":false},{"id":"H29A23","y":"H29","p":"A","no":23,"s":"換気設備に関する記述のうち、適当でないものはどれか。","c":["火気使用室の換気を自然換気方式で行う場合、排気筒の有効断面積は、燃料の燃焼に伴う理論廃ガス量、排気筒の高さなどから算出する。","事務室内での極軽作業時（二酸化炭素発生量 0.02m³/(h・人））の必要換気量の目安は、外気の二酸化炭素濃度が350ppmのとき、約30m³/(h・人）である。","一般建築物の居室において、床面積の1/20以上の換気上有効な開口を取れない場合は、換気設備を設けなければならない。","居室の換気を、中央管理方式の空気調和設備で行う場合の有効換気量の算出においては、窓等の開口面積に応じた値を減じることができる。"],"a":[4],"m":"exact","n":"","e":"中央管理方式の空気調和設備で換気を行う場合は、窓等の開口面積に応じた値を有効換気量から減じることはできない。","f":[],"o":["img/H29A23_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"H29A24","y":"H29","p":"A","no":24,"s":"天井チャンバー方式の排煙（排煙ダンパー（排煙口）を天井内に設け、火災煙を天井面に配置された吸込口から天井チャンバーを経て排煙口に導く方式の排煙）の設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」上の「階及び全館避難安全検証法」及び「特殊な構造」によらないものとする。","c":["天井内防煙区画部分の直下の天井面には、防煙壁を設ける必要がある。","天井内の小梁、ダクト等により排煙が不均等になるおそれがある場合は、均等に排煙できるように排煙ダクトを延長する必要がある。","同一排煙区画内であっても、間仕切りを変更する場合には排煙ダクト工事を行う必要がある。","排煙口の開放が目視できないので、手動開放装置には開放表示用のパイロットランプを設ける必要がある。"],"a":[3],"m":"exact","n":"","e":"天井チャンバー方式は、同一排煙区画内であれば間仕切りを変更しても排煙ダクト工事が不要なことが利点。","f":[],"o":["img/H29A24_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"H29A25","y":"H29","p":"A","no":25,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」上の「階及び全館避難安全検証法」及び「特殊な構造」によらないものとする。","c":["特別避難階段の付室又は非常用エレベーターの乗降ロビーに機械排煙方式の排煙設備を設けた場合の排煙風量は、その付室又はロビーの面積にかかわらず4m³/s以上とする。","電源を必要とする排煙設備の予備電源は、15分間継続して排煙設備を作動できる容量とし、かつ、常用の電源が断たれた場合に自動的に切り替えられるようにする。","パネル形排煙口は、排煙口扉の回転軸が排煙気流方向と平行になるように取り付け、排煙気流により排煙口が閉じないようにする。","排煙設備を設けなければならない居室の防煙垂れ壁は、防火戸上部、天井チャンバー方式等を除き、その下端から天井までの距離が50cm以上となるようにする。"],"a":[2],"m":"exact","n":"","e":"排煙設備の予備電源は30分間継続して作動できる容量とする。","f":[],"o":["img/H29A25_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"H29A26","y":"H29","p":"A","no":26,"s":"上水道における配水管に関する記述のうち、適当でないものはどれか。","c":["配水支管から給水管に分岐する箇所での最大静水圧は、0.74MPaを超えないようにする。","配水管は、他の水道事業体又は水道用水供給事業体の水道施設と接続してはならない。","配水支管から給水管に分岐する箇所での最小動水圧は、0.15MPaを下回らないようにする。","配水支管に設けた消火栓は、配水支管の充水・排水時には排気・吸気に利用できる。"],"a":[2],"m":"exact","n":"","e":"配水管は、災害時の相互融通等のため、他の水道事業体等の水道施設と連絡管で接続することがある。接続してはならないわけではない。","f":[],"o":["img/H29A26_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H29A27","y":"H29","p":"A","no":27,"s":"下水道管きょに関する記述のうち、適当でないものはどれか。","c":["合流式の下水道管きょでは、降雨規模により、処理施設を経ない未処理の下水が公共用水域に放流されることがある。","分流式の汚水管きょは、合流式に比べれば小口径のため、管きょの勾配が急になり埋設が深くなる場合がある。","取付管は、管きょ内の背水の影響を受けるため、本管の管頂から左右90度の位置に水平に設置する。","汚水管きょの段差接合において、段差が0.6m以上ある場合は、原則として、副管を使用する。"],"a":[3],"m":"exact","n":"","e":"取付管は本管の中心線より上方に取り付ける。管頂から左右90度の位置に水平に設置するのではない。","f":[],"o":["img/H29A27_o0.png"],"g":32,"cat":"A衛生","neg":true},{"id":"H29A28","y":"H29","p":"A","no":28,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["水道直結増圧ポンプの送水量は、原則として、時間平均予想給水量に基づき決定する。","受水タンクの容量を過大に設定すると、タンク内滞留中に残留塩素が消費され、水が腐敗しやすくなる。","受水タンクの保守点検スペースは、上部は1m以上とし、周囲及び下部は0.6m以上とする。","受水タンクの底部には吸込みピットを設け、底面の勾配をピットに向かって1/100程度とする。"],"a":[1],"m":"exact","n":"","e":"水道直結増圧ポンプの送水量は、瞬時最大予想給水量に基づいて決定する。","f":[],"o":["img/H29A28_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H29A29","y":"H29","p":"A","no":29,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["大便器洗浄弁の必要給水圧力は、一般的に、70kPa程度である。","洗面器の吐水口空間とは、給水栓の吐水口端とあふれ縁の垂直距離のことである。","揚水ポンプの揚程が30mを超える場合、吐出側の逆止め弁は、衝撃吸収式とする。","大気圧式バキュームブレーカーは、常時圧力がかかる配管部分に設ける。"],"a":[4],"m":"exact","n":"","e":"大気圧式バキュームブレーカーは、常時圧力がかからない部分（器具の最終止水弁の下流側）に設ける。","f":[],"o":["img/H29A29_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H29A30","y":"H29","p":"A","no":30,"s":"給湯設備に関する記述のうち、適当でないものはどれか。","c":["給湯循環ポンプの揚程は、最高位の給湯栓の最低必要圧力を考慮して算定する。","密閉式膨張タンクの容量は、水圧の低い位置に設置した方が小さくできる。","中央式給湯設備における貯湯タンク内の湯温は、レジオネラ属菌などの繁殖を防止するため、原則として、60℃以上とする。","中央式給湯設備の返湯管の管径は、一般的に、給湯管の呼び径の1/2程度とし、循環流量を確認して決定する。"],"a":[1],"m":"exact","n":"","e":"給湯循環ポンプの揚程は、循環管路の摩擦損失から算定する。給湯栓の必要圧力は関係しない。","f":[],"o":["img/H29A30_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H29A31","y":"H29","p":"A","no":31,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["トラップの誘導サイホン作用の対策のうち、管内圧力を緩和させる方法としては、一般的に、ループ通気方式より伸頂通気方式のほうが有効である。","排水立て管の垂直に対して45度を超えるオフセットの管径は、排水横主管として決定する。","器具排水負荷単位法によって通気管径を求める場合の通気管長さは、通気管の実長とし、局部損失相当管長を加算しない。","通気管どうしを接続する場合は、その階における最高位の器具のあふれ縁より150mm以上立ち上げて接続する。"],"a":[1],"m":"exact","n":"","e":"誘導サイホン作用の対策（管内圧力の緩和）としては、伸頂通気方式よりループ通気方式の方が有効。","f":[],"o":["img/H29A31_o0.png"],"g":33,"cat":"A衛生","neg":true},{"id":"H29A32","y":"H29","p":"A","no":32,"s":"排水槽に関する記述のうち、適当でないものはどれか。","c":["排水の腐敗の進行が速くなるため、厨房排水と汚水は同一の排水槽としない。","排水槽の清掃や維持管理を考慮して、排水槽の近くに水栓を設ける。","排水槽のマンホールは、維持管理を考慮して、直径45cmのものを2個設ける。","排水槽の通気管は、最小管径を50mmとし、直接単独で大気に衛生上有効に開放する。"],"a":[3],"m":"exact","n":"","e":"排水槽のマンホールは、維持管理のため直径60cm以上とする。","f":[],"o":["img/H29A32_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H29A33","y":"H29","p":"A","no":33,"s":"特殊継手排水システムに関する文中、 内に当てはまる用語の組合せとして、適当なものはどれか。特殊継手排水システムは、一般的に、 Ａ 方式とした排水立て管をもつ高層の集合住宅などに採用されている。本システムの特徴は、排水横枝管の流れを排水立て管内に円滑に流入させ、立て管内の流速を Ｂ にある。\n(Ａ) (Ｂ)","c":["伸頂通気 増すこと","ループ通気 増すこと","伸頂通気 減ずること","ループ通気 減ずること"],"a":[3],"m":"exact","n":"","e":"特殊継手排水システムは伸頂通気方式の排水立て管をもつ集合住宅等に採用され、立て管内の流速を「減ずる」ことが特徴。","f":[],"o":["img/H29A33_o0.png"],"g":null,"cat":"A衛生","neg":false},{"id":"H29A34","y":"H29","p":"A","no":34,"s":"屋内消火栓設備における1号消火栓及び易操作性1号消火栓に関する記述のうち、適当でないものはどれか。","c":["1号消火栓は、通常2人により操作を行う。","1号消火栓は、開閉弁の開放と連動して消火ポンプが起動できる。","易操作性1号消火栓のノズルは、棒状放水と噴霧放水の切換えができる。","易操作性1号消火栓は、防火対象物の階ごとに、その階の各部からの水平距離が25m以下となるように設ける。"],"a":[2],"m":"exact","n":"","e":"1号消火栓は起動用押しボタン等で起動する。開閉弁の開放（ホースの延長操作）と連動して起動できるのは易操作性1号消火栓・2号消火栓。","f":[],"o":["img/H29A34_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H29A35","y":"H29","p":"A","no":35,"s":"ガス設備に関する記述のうち、適当でないものはどれか。","c":["常温、常圧で気化した状態の液化天然ガス（LNG）の比重は、同じ状態の液化石油ガス（LPG）の比重より小さい。","液化石油ガス（LPG）は、「液化石油ガスの保安の確保及び取引の適正化に関する法律」で、「い号」、「ろ号」、「は号」に区別され、「い号」が最もプロパン、プロピレンの含有率が低い。","液化天然ガス（LNG）は、無色・無臭の液体であり、硫黄分やその他の不純物を含んでいない。","）「ガス事業法」では、ガスによる圧力が0.1MPa以上1MPa未満を中圧としている。"],"a":[2],"m":"exact","n":"","e":"LPGは「い号」がプロパン・プロピレンの含有率が最も高い（80％以上）。","f":[],"o":["img/H29A35_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H29A36","y":"H29","p":"A","no":36,"s":"浄化槽に関する記述のうち、適当でないものはどれか。","c":["好気性処理法は生物処理法の一つであり、最終的には、有機物質のかなりの部分がメタンガスなどのガス体に分解される。","病院の臨床検査室、放射線検査室、手術室などからの特殊排水は、浄化槽に流入させてはならない。","流入排水に油脂類濃度の高い厨房系統の割合が多い場合、厨房系統の排水は油脂分離装置で前処理した後に浄化槽に流入させる。","処理水の塩素消毒に用いられる薬剤には、次亜塩素酸カルシウム、次亜塩素酸イソシアヌールなどがある。"],"a":[1],"m":"exact","n":"","e":"有機物がメタンガス等に分解されるのは嫌気性処理。好気性処理では主に二酸化炭素と水に分解される。","f":[],"o":["img/H29A36_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H29A37","y":"H29","p":"A","no":37,"s":"浄化槽の処理対象人員の算定に関する記述のうち、適当でないものはどれか。","c":["小学校・中学校の処理対象人員は、定員に定数を乗じて算定する。","事務所の処理対象人員は、業務用厨房の有無により、算定基準が異なる。","公衆便所の処理対象人員は、利用想定数に定数を乗じて算定する。","飲食店の処理対象人員は、延べ面積に定数を乗じて算定する。"],"a":[3],"m":"exact","n":"","e":"公衆便所の処理対象人員は、総便器数に定数（16）を乗じて算定する。利用想定数ではない。","f":[],"o":["img/H29A37_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H29A38","y":"H29","p":"A","no":38,"s":"吸収冷凍機に関する記述のうち、適当でないものはどれか。","c":["二重効用型の冷凍サイクルは、再生器及び溶液熱交換器が高温と低温にそれぞれ分かれている。","同じ冷凍能力の圧縮式の冷凍機と比べて、冷却塔の必要能力が大きくなる。","二重効用型の容量制御は、加熱源が蒸気の場合、蒸気調節弁で高温再生器への加熱量を制御する方式が一般的である。","遠心冷凍機に比べて、運転開始から定格能力に達するまでの時間が短い。"],"a":[4],"m":"exact","n":"","e":"吸収冷凍機は遠心冷凍機に比べて、運転開始から定格能力に達するまでの時間が「長い」。","f":[],"o":["img/H29A38_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"H29A39","y":"H29","p":"A","no":39,"s":"遠心ポンプに関する記述のうち、適当でないものはどれか。","c":["ポンプの揚程は、羽根車の回転速度の2乗に比例して変化する。","同一配管系で、同じ特性のポンプを2台並列運転して得られる吐出し量は、それぞれのポンプを単独運転した場合の吐出し量の和より小さくなる。","ポンプの吸込み側が正圧の場合、吸込み口径と吐出し口径が同じときの全揚程は、吐出し側圧力計の読みと吸込み側圧力計の読みの差となる。","ポンプ及び配管系に外部から強制的な力が与えられていないにもかかわらず、管路の流量と圧力が周期的に変動する現象をキャビテーションという。"],"a":[4],"m":"exact","n":"","e":"記述はサージング。キャビテーションは、液体の圧力が飽和蒸気圧以下となり気泡が発生する現象。","f":[],"o":["img/H29A39_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"H29A40","y":"H29","p":"A","no":40,"s":"温熱源機に関する記述のうち、適当でないものはどれか。","c":["真空式温水発生機本体内の圧力は、大気圧以下である。","炉筒煙管ボイラーは、小型貫流ボイラーに比べて、高度な水処理が必要である。","鋳鉄製ボイラーは、分割搬入が可能で、鋼鈑製に比べ耐食性に優れている。","小型貫流ボイラーは、保有水量が少いため、起動時間が短い。"],"a":[2],"m":"exact","n":"","e":"保有水量が少ない小型貫流ボイラーの方が、炉筒煙管ボイラーより高度な水処理が必要。","f":[],"o":["img/H29A40_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"H29A41","y":"H29","p":"A","no":41,"s":"配管材料及び配管付属品に関する記述のうち、適当でないものはどれか。","c":["圧力配管用炭素鋼鋼管は、蒸気、高温水などの圧力の高い配管に使用され、スケジュール番号により管の厚さが区分されている。","フレキシブルジョイントは、一般的に、接続口径が大きいほど全長を長くする必要がある。","排水用硬質塩化ビニルライニング鋼管を圧力変動が大きい系統に使用する場合、その接合にはねじ込み式排水管継手を使用する。","鋼管とステンレス鋼管など、イオン化傾向が大きく異なる異種金属管の接合には、絶縁フランジを使用する。"],"a":[3],"m":"exact","n":"","e":"排水用硬質塩化ビニルライニング鋼管（DVLP）は管厚が薄くねじ加工できないため、MD継手（排水鋼管用可とう継手）で接合する。","f":[],"o":["img/H29A41_o0.png"],"g":4,"cat":"A機材・設計図書・約款","neg":true},{"id":"H29A42","y":"H29","p":"A","no":42,"s":"ダクト及びダクト付属品に関する記述のうち、適当でないものはどれか。","c":["シーリングディフューザー形吹出口は、中コーンを上げると拡散半径が大きくなる。","排煙ダクトに設ける防火ダンパーには、作動温度が280℃の温度ヒューズを使用する。","防火ダンパーの温度ヒューズの作動温度は、一般系統は72℃、厨房排気系統は120℃とする。","線状吹出口は、風向調整ベーンを動かすことにより吹出し気流方向を変えることができる。"],"a":[1],"m":"exact","n":"","e":"シーリングディフューザーは中コーンを下げると水平吹出しで拡散半径が大きく、上げると下向き吹出しで小さくなる。","f":[],"o":["img/H29A42_o0.png"],"g":34,"cat":"A機材・設計図書・約款","neg":true},{"id":"H29A43","y":"H29","p":"A","no":43,"s":"「公共工事標準請負契約約款」に関する記述のうち、適当でないものはどれか。","c":["工事材料は、設計図書にその品質が明示されていない場合にあっては、中等の品質を有するものとする。","現場代理人、主任技術者及び専門技術者は、これを兼ねることができない。","発注者が設計図書を変更し、請負代金が3分の2以上減少した場合、受注者は契約を解除することができる。","発注者は、完成通知を受けたときは、通知を受けた日から14日以内に完成検査を完了し、その結果を受注者に通知しなければならない。"],"a":[2],"m":"exact","n":"","e":"約款では、現場代理人・主任技術者（監理技術者）・専門技術者はこれを兼ねることが「できる」。","f":[],"o":["img/H29A43_o0.png"],"g":9,"cat":"A機材・設計図書・約款","neg":true},{"id":"H29A44","y":"H29","p":"A","no":44,"s":"配管材料とその記号（規格）の組合せのうち、適当でないものはどれか。\n(配管材料) (記号（規格）)","c":["リサイクル硬質ポリ塩化ビニル三層管 RS−VU（JIS）","一般配管用ステンレス鋼鋼管 SUS−TPD（JIS）","水道用硬質塩化ビニルライニング鋼管（黒管) SGP−VA（JWWA)","排水用硬質塩化ビニルライニング鋼管 SGP−VD（JWWA)"],"a":[4],"m":"exact","n":"","e":"排水用硬質塩化ビニルライニング鋼管の記号はDVLP（WSP042）。SGP-VDは水道用硬質塩化ビニルライニング鋼管（JWWA K116）。","f":[],"o":["img/H29A44_o0.png"],"g":10,"cat":"A機材・設計図書・約款","neg":true},{"id":"H29B01","y":"H29","p":"B","no":1,"s":"施工計画に関する記述のうち、適当でないものはどれか。","c":["労務計画は、施工内容を十分把握し、施工方法、工程、施工条件などを考慮して作成する。","施工方法は、設計図書に特別の定めがない場合、受注者がその責任において定めることが一般的である。","搬入計画は、材料、機器類の品種、数量、大きさ、質量、時期などを考慮して作成する。","仮設物は、工事期間中一時的に使用されるものなので、火災予防や騒音対策は考慮しないのが一般的である。"],"a":[4],"m":"exact","n":"","e":"仮設物でも、火災予防・騒音対策・安全対策などを十分に考慮して計画する。","f":[],"o":["img/H29B01_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"H29B02","y":"H29","p":"B","no":2,"s":"工事の申請・届出書類と関係法に基づく提出先の組合せとして、適当でないものはどれか。\n(申請・届出書類) (関係法に基づく提出先)","c":["ボイラー設置届 労働基準監督署長","ばい煙発生施設設置届書 経済産業局長","工事整備対象設備等着工届出書 消防長又は消防署長","振動の特定建設作業実施届出書 市町村長"],"a":[2],"m":"exact","n":"","e":"ばい煙発生施設設置届の提出先は都道府県知事（政令市長）。経済産業局長ではない。","f":[],"o":["img/H29B02_o0.png"],"g":11,"cat":"B施工管理","neg":true},{"id":"H29B03","y":"H29","p":"B","no":3,"s":"工程管理に関する記述のうち、適当でないものはどれか。","c":["総合工程表は、工事全体の作業の施工順序、労務・資材などの段取り、それらの工程などを総合的に把握するために作成する。","総合工程表で利用されることが多いネットワーク工程表には、前作業が遅れた場合の後続作業への影響度が把握しやすいという長所がある。","ネットワーク工程表で全体工程の短縮を検討する場合は、当初のクリティカルパス上の作業についてのみ日程短縮を検討すればよい。","バーチャート工程表は、作成が容易で、作業の所要時間と流れが比較的分かりやすいので、詳細工程表によく用いられる。"],"a":[3],"m":"exact","n":"","e":"工期短縮の検討では、短縮により新たにクリティカルパスとなる経路も検討する必要がある。","f":[],"o":["img/H29B03_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"H29B04","y":"H29","p":"B","no":4,"s":"下図に示すネットワーク工程表に関する記述のうち、適当でないものはどれか。\nただし、図中のイベント間のＡ〜Ｉは作業内容、日数は作業日数を表す。","c":["クリティカルパスは2本あり、所要日数は20日である。","作業Cの所要日数を2日短縮すれば、工期も2日間短縮できる。","イベント⑦の最早開始時刻、最遅完了時刻はともに14日である。","作業Gのトータルフロートは3日である。"],"a":[2],"m":"exact","n":"","e":"最早時刻は②5、③5、④10、⑤10、⑥13、⑦14、⑧20日。クリティカルパスはA→D→F→IとA→E→F→Iの2本で20日。作業C（A→C→H/I経路は19日以下）は非クリティカルで、短縮しても工期は短縮されない。","f":["img/H29B04_f0.png"],"o":["img/H29B04_o0.png"],"g":0,"cat":"B施工管理","neg":true},{"id":"H29B05","y":"H29","p":"B","no":5,"s":"品質管理に用いられる下図の名称として、適当なものはどれか。","c":["パレート図","ヒストグラム","散布図","特性要因図"],"a":[1],"m":"exact","n":"","e":"不良件数を大きい順に並べた棒グラフと累積比率の折れ線グラフはパレート図。","f":["img/H29B05_f0.png"],"o":["img/H29B05_o0.png"],"g":null,"cat":"B施工管理","neg":false},{"id":"H29B06","y":"H29","p":"B","no":6,"s":"品質管理に関する記述のうち、適当でないものはどれか。","c":["品質管理とは、品質の目標や管理体制等を記載した品質計画に基づいて、設計図書で要求された品質を確保する方法である。","品質管理には、施工図の検討、機器の工場検査、装置の試運転調整などがある。","全数検査は、大型機器、防災機器の検査や配管の水圧試験、空気調和機等の試運転調整について実施する。","抜取検査は、不良品の混入が許されない製品を、安価に検査する場合に適用する。"],"a":[4],"m":"exact","n":"","e":"不良品の混入が許されない製品は全数検査とする。","f":[],"o":["img/H29B06_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"H29B07","y":"H29","p":"B","no":7,"s":"建設工事現場における安全管理に関する記述のうち、適当でないものはどれか。","c":["作業床の高さが10m以上の高所作業車の運転（道路上を走行させる運転を除く）業務は、事業者が行う当該業務に関わる特別の教育を修了した者に行わせなければならない。","暑さ指数（WBGT）は、気温、湿度及び輻射熱に関係する値により算出される指数で、熱中症予防のための指標である。","事業者は、建築物の解体を行う場合、石綿等による労働者の健康障害を防止するために、石綿等の使用の有無を目視、設計図書などにより調査し、記録しなければならない。","リスクアセスメントとは、建設現場に潜在する危険性又は有害性を洗い出し、それによるリスクを見積もり、その大きいものから優先してリスクを除去、低減する手法である。"],"a":[1],"m":"exact","n":"","e":"作業床の高さが10m以上の高所作業車の運転は技能講習修了者が行う。特別教育で足りるのは10m未満。","f":[],"o":["img/H29B07_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"H29B08","y":"H29","p":"B","no":8,"s":"建設工事現場における危険防止に関する記述のうち、適当でないものはどれか。","c":["屋外で金属をアーク溶接する作業者に使用させるため、呼吸用保護具等の適切な保護具を備える。","枠組足場以外の高さ2mの作業床には、墜落のおそれがある箇所に、高さ65cmの手すりと中さんを取り付ける。","作業場所の空気中の酸素濃度が18％以上に保たれるように換気を行う。","墜落防止のために労働者に安全帯を使用させるときは、安全帯及びその取付け設備等の異常の有無について、随時点検する。"],"a":[2],"m":"exact","n":"","e":"枠組足場以外の高さ2m以上の作業床には、高さ85cm以上の手すりと中さん（35〜50cm）等を設ける。65cmでは低い。","f":[],"o":["img/H29B08_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H29B09","y":"H29","p":"B","no":9,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["吸収冷温水機は、脚部の振動の振幅値が小さいため、屋上や中間階設置の場合、防振パッド上に据え付けることが多い。","送風機の防振基礎には、地震による横ずれや、転倒防止のためのストッパーを設ける。","送風機とモーターのプーリーの心出しは、外側面に定規や水糸などを当てて調整する。","真空又は窒素加圧の状態で据え付けられた冷凍機は、機内を大気に開放した後、配管を接続する。"],"a":[4],"m":"exact","n":"","e":"真空・窒素加圧で据え付けた冷凍機は、湿気や異物が入らないよう大気に開放せずに配管を接続する。","f":[],"o":["img/H29B09_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H29B10","y":"H29","p":"B","no":10,"s":"アンカーボルトに関する記述のうち、適当でないものはどれか。","c":["あと施工のアンカーボルトにおいては、下向き取付けの場合、金属拡張アンカーに比べて、接着系アンカーの許容引抜き力は小さい。","あと施工のメカニカルアンカーボルトは、めねじ形よりおねじ形の方が許容引抜き力が大きい。","アンカーボルトの径及び埋込み長さは、アンカーボルトに加わる引抜き力、せん断力及びアンカーボルトの本数などから決定する。","アンカーボルトの埋込み位置と基礎縁の距離が不十分な場合、地震時に基礎が破損することがある。"],"a":[1],"m":"exact","n":"","e":"下向き取付けでは、一般に接着系アンカーの方が金属拡張アンカーより許容引抜き力が大きい。","f":[],"o":["img/H29B10_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H29B11","y":"H29","p":"B","no":11,"s":"配管材とその継手又は接合方法の組合せのうち、適当でないものはどれか。\n(配管材) (継手又は接合方法)","c":["配管用炭素鋼鋼管 ねじ込み式可鍛鋳鉄製管継手","配管用ステンレス鋼鋼管 B形ソケット接合","ポリエチレン管 クランプ式管継手","耐火二層管 TS式差込み接合"],"a":[2],"m":"exact","n":"","e":"B形ソケット接合は鋳鉄管の接合方法。配管用ステンレス鋼鋼管はメカニカル形・ハウジング形管継手や溶接で接合する。","f":[],"o":["img/H29B11_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H29B12","y":"H29","p":"B","no":12,"s":"配管の施工に関する記述のうち、適当でないものはどれか。1 1","c":["ポンプの吸込み管は、ポンプに向かって から の上り勾配とする。50 100","中央式の強制循環給湯配管は、リバースリターン方式とする必要はない。","パッケージ形空気調和機の冷媒配管は、勾配を設ける必要はない。","呼び径65A以下の排水管は、床からの高さが2m以内の場合、共吊りしてもよい。"],"a":[4],"m":"exact","n":"","e":"排水管は勾配を確保する必要があり、管径や高さにかかわらず他の配管と共吊りしてはならない。","f":[],"o":["img/H29B12_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H29B13","y":"H29","p":"B","no":13,"s":"ダクト及びダクト付属品の施工に関する記述のうち、適当でないものはどれか。","c":["アングルフランジ工法ダクトの角の継目は、長辺が800mmの長方形ダクトの場合、1か所とする。","共板フランジ工法ダクトのフランジ押さえ金具（クリップなど）は再使用しない。","風量調整ダンパーは、対向翼ダンパーの方が平行翼ダンパーより風量調整機能が優れている。","アングルフランジ工法ダクトは、フランジ接続部分の鉄板の折返しを5mm以上とする。"],"a":[1],"m":"exact","n":"","e":"長方形ダクトの角の継目は2か所以上とする（長辺750mm以下の場合は1か所以上でよい）。長辺800mmでは2か所以上必要。","f":[],"o":["img/H29B13_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H29B14","y":"H29","p":"B","no":14,"s":"ダクト及びダクト付属品の施工に関する記述のうち、適当でないものはどれか。","c":["負圧となるチャンバーに設ける点検口の開閉方向は、原則として、外開きとする。","共板フランジ工法のフランジ押さえ金具（クリップなど）の取付けは、ダクト寸法にかかわらず、四隅のボルトの間に1か所とする。","長方形ダクトに取り付ける風量測定口は、ダクト辺に200mmから300mmピッチ程度で取り付ける。","変風量（VAV）ユニットは、原則として、ユニット入口長辺寸法の2倍以上の長さの直管が上流側にある位置に取り付ける。"],"a":[2],"m":"exact","n":"","e":"共板フランジの押え金具は、ダクト寸法に応じた所定の間隔で取り付ける。四隅のボルトの間に1か所ではない。","f":[],"o":["img/H29B14_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H29B15","y":"H29","p":"B","no":15,"s":"保温・保冷・塗装に関する記述のうち、適当でないものはどれか。","c":["ポリスチレンフォーム保温筒は、保温筒1本につき鉄線を2か所以上巻き締める。","室内露出配管の床貫通部は、その保温材の保護のため、床面より少なくとも高さ150mm程度までステンレス鋼板等で被覆する。","冷温水管の保温施工において、ポリエチレンフィルムは、防湿及び防水のため、補助材として使用される。","塗装は、原則として、塗装場所の気温が5℃以下、湿度が85％以上、換気が十分でなく結露する等、塗料の乾燥に不適当な場所では行わない。"],"a":[1],"m":"exact","n":"","e":"ポリスチレンフォーム保温筒は、鉄線ではなく粘着テープで止める（1本につき2か所以上）。","f":[],"o":["img/H29B15_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H29B16","y":"H29","p":"B","no":16,"s":"腐食・防食に関する記述のうち、適当でないものはどれか。","c":["ステンレス鋼管の溶接は、内面の酸化防止として管内にアルゴンガスを充てんして行う。","冷温水管に用いる呼び径100A以下の配管用炭素鋼鋼管は、溝状腐食のおそれの少ない鍛接鋼管を使用する。","給湯用銅管は、管内流速を1.2m/s以下とし、曲がり部直近で発生するかい食を防止する。","ステンレス鋼管に接続する青銅製仕切弁は、弁棒を黄銅製として脱亜鉛腐食を防止する。"],"a":[4],"m":"exact","n":"","e":"青銅製弁の弁棒を黄銅製にすると脱亜鉛腐食が起こりやすい。弁棒は耐脱亜鉛黄銅や青銅・ステンレス製とする。","f":[],"o":["img/H29B16_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H29B17","y":"H29","p":"B","no":17,"s":"試運転調整時の確認事項に関する記述のうち、適当でないものはどれか。","c":["渦巻きポンプは、ポンプと電動機の主軸が一直線になるようにカップリングに定規を当てて水平度を確認する。","吸収冷温水機は、減水時システム停止のインターロックを確認するほか、換気ファンとのインターロックを確認する。","排水ポンプは、排水槽の満水警報の発報により2台交互運転することを確認する。","無圧式温水発生機は、地震又はこれに相当する衝撃により燃焼が自動停止することを確認する。"],"a":[3],"m":"exact","n":"","e":"排水ポンプは、満水警報（異常高水位）で2台同時運転となることを確認する。交互運転は通常水位での運転。","f":[],"o":["img/H29B17_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H29B18","y":"H29","p":"B","no":18,"s":"建設工事現場における安全管理体制に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["特定元方事業者は、下請けも含めた作業場の労働者が50人以上となる場合は、統括安全衛生責任者を選任しなければならない。","統括安全衛生責任者を選任すべき事業者以外の請負人で、仕事を自ら行うものは、総括安全衛生管理者を選任しなければならない。","特定元方事業者による元方安全衛生管理者の選任は、その事業場に専属の者を選任して行わなければならない。","特定元方事業者は、毎作業日に少なくとも1回、作業場所の巡視を行わなければならない。"],"a":[2],"m":"exact","n":"","e":"統括安全衛生責任者を選任すべき事業者以外の請負人で仕事を自ら行うものは「安全衛生責任者」を選任する。","f":[],"o":["img/H29B18_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"H29B19","y":"H29","p":"B","no":19,"s":"建設工事現場における安全管理に関する文中、 内に当てはまる、「労働安全衛生法」上に定められた数値の組合せとして、正しいものはどれか。架設通路の勾配は、 Ａ 度以下とする。ただし、階段を設けたもの又は高さが2m未満で丈夫な手掛を設けたものはこの限りでない。また、屋内に設ける通路については、通路面から高さ Ｂ m以内に障害物を置いてはならない。\n(Ａ) (Ｂ)","c":["20 1.8","20 2","30 1.8","30 2"],"a":[3],"m":"exact","n":"","e":"架設通路の勾配は30度以下。屋内通路は通路面から高さ1.8m以内に障害物を置いてはならない。","f":[],"o":["img/H29B19_o0.png"],"g":null,"cat":"B法規","neg":false},{"id":"H29B20","y":"H29","p":"B","no":20,"s":"次の記述のうち、「労働基準法」上、誤っているものはどれか。","c":["使用者とは、事業主又は事業の経営担当者その他その事業の労働者に関する事項について、事業主のために行為をするすべての者をいう。","使用者は、労働者が業務上負傷し、労働することができないために賃金を受けない場合、労働者の療養中、平均賃金の100分の50の休業補償を行わなければならない。","使用者は、満18才に満たない者に、最大積載荷重2t以上の人荷共用のエレベーターの運転業務を行わせてはならない。","使用者は、満18才に満たない者を使用する場合、その年齢を証明する戸籍証明書を事業場に備え付けなければならない。"],"a":[2],"m":"exact","n":"","e":"業務上の負傷による休業補償は、平均賃金の100分の60。","f":[],"o":["img/H29B20_o0.png"],"g":35,"cat":"B法規","neg":true},{"id":"H29B21","y":"H29","p":"B","no":21,"s":"建築物の階及び階数に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["各階に居室のある地上2階地下1階の建築物は、政令で定める技術的基準に従って、避難上及び消火上支障がないようにしなければならない。","建築物の1階の隣地境界線より3m以下の距離にある部分であっても、防火上有効な公園、広場、川等の空地若しくは水面に面する場合は、延焼のおそれのある部分ではない。","建築物の敷地が斜面又は段地である場合その他建築物の部分によって階数が異なる場合は、これらの階数のうち最大のものを当該建築物の階数とする。","地階の居室の水平投影面積の合計が、当該建築物の建築面積の1/8以下である場合は、階数に算入しない。"],"a":[4],"m":"exact","n":"","e":"階数に算入しないのは、地階の倉庫・機械室その他これらに類する部分で水平投影面積が建築面積の1/8以下のもの。居室は対象外。","f":[],"o":["img/H29B21_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"H29B22","y":"H29","p":"B","no":22,"s":"建築設備に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["非常用エレベーターの乗降ロビーは、屋内消火栓、連結送水管の放水口、非常コンセント設備等の消火設備を設置できる構造としなければならない。","建築物（換気設備を設けるべき調理室等を除く。）に設ける自然換気設備の排気口は、給気口より高い位置に設け、常時開放された構造とし、かつ、排気筒の立上り部分に直結しなければならない。","階数が2で、かつ、延べ面積が500m²の事務所に排水槽を設ける場合、排水槽の底の勾配は吸い込みピットに向かって10分の1以上5分の1以下としなければならない。","階数が2で、かつ、延べ面積が500m²の事務所において、有効容量が5m³を超える給水タンク等の上にポンプ、ボイラー、空気調和機等の機器を設ける場合、飲料水を汚染することのないように衛生上必要な措置を講じなければならない。"],"a":[3],"m":"exact","n":"","e":"排水槽の底の勾配は、吸込みピットに向かって1/15以上1/10以下とする。","f":[],"o":["img/H29B22_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"H29B23","y":"H29","p":"B","no":23,"s":"管工事業の許可を受けた建設業者が管工事を施工するときに、工事現場に置く主任技術者又は監理技術者に関する記述のうち、「建設業法」上、誤っているものはどれか。","c":["主任技術者の専任が必要な管工事のうち密接な関係のある二つの管工事を同一の建設業者が同一の場所において施工する場合は、同一の専任の主任技術者とすることができる。","共同住宅の建設工事において、請負代金の額が3,500万円以上の管工事を下請負人として施工する場合は、当該工事現場に置く主任技術者を専任の者としなければならない。","国又は地方公共団体が注文者である施設又は工作物に関する建設工事において、管工事を施工する場合は、請負代金の額にかかわらず、当該工事現場に置く主任技術者又は監理技術者を専任の者としなければならない。","事務所の建設工事において、請負代金の額が3,500万円未満の管工事を施工する場合は、発注者から当該建設工事を直接請け負った場合にあっても、当該工事現場に置く主任技術者を専任の者としないことができる。"],"a":[3],"m":"exact","n":"","e":"主任技術者・監理技術者の専任が必要なのは、公共性のある施設等の工事で請負代金が一定額以上（現行は4,500万円以上）の場合。額にかかわらず専任ではない。","f":[],"o":["img/H29B23_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"H29B24","y":"H29","p":"B","no":24,"s":"管工事業の許可を受けた建設業者が管工事を施工するときに、工事現場に置く監理技術者の要件に該当する者として、「建設業法」上、正しいものはどれか。\nＡ：1級管工事施工管理技術検定に合格した者Ｂ：2級管工事施工管理技術検定に合格し、かつ、発注者から直接請け負った管工事で、その請負代金の額が4,500万円以上であるものに関し2年以上指導監督的な実務の経験を有する者Ｃ：管工事に関し10年以上の実務の経験を有し、かつ、発注者から直接請け負った管工事で、その請負代金の額が4,500万円以上であるものに関し2年以上指導監督的な実務の経験を有する者Ｄ：「建築士法」による一級建築士の免許を受けた者Ｅ：国土交通大臣が1級管工事施工管理技術検定に合格した者等と同等以上の能力を有するものと認定した者","c":["Ａ、Ｂ及びＥ","Ａ、Ｃ及びＥ","Ａ、Ｄ及びＥ","Ａ及びＥ"],"a":[4],"m":"exact","n":"","e":"管工事業は指定建設業のため、監理技術者は1級管工事施工管理技士等（A）か国土交通大臣認定者（E）に限られ、実務経験のみの者は不可。","f":[],"o":["img/H29B24_o0.png"],"g":null,"cat":"B法規","neg":false},{"id":"H29B25","y":"H29","p":"B","no":25,"s":"1号消火栓を用いた屋内消火栓設備に関する記述のうち、「消防法」上、誤っているものはどれか。","c":["加圧送水装置には、定格負荷運転時のポンプの性能を試験するための配管設備を設ける。","加圧送水装置には、消火栓のノズルの先端における放水圧力が0.7MPaを超えないための措置を講ずる。","ポンプには、その吐出側に圧力計及び連成計を設ける。","消火栓の主配管のうち、立上り管は管の呼びで50mm以上のものとする。"],"a":[3],"m":"exact","n":"","e":"ポンプの吐出側には圧力計、吸込側には連成計を設ける。","f":[],"o":["img/H29B25_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"H29B26","y":"H29","p":"B","no":26,"s":"不活性ガス消火設備に関する記述のうち、「消防法」上、誤っているものはどれか。","c":["非常電源は、当該設備を有効に1時間作動できる容量以上としなければならない。","手動式の起動装置は、一の防護区画ごとに設けなければならない。","駐車の用に供される部分及び通信機械室であって常時人がいない部分は、局所放出方式としなければならない。","貯蔵容器は、防護区画外の場所に設けなければならない。"],"a":[3],"m":"exact","n":"","e":"常時人がいない駐車場・通信機器室は全域放出方式とする。","f":[],"o":["img/H29B26_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"H29B27","y":"H29","p":"B","no":27,"s":"分別解体等に関する記述のうち、「建設工事に係る資材の再資源化等に関する法律」上、誤っているものはどれか。","c":["対象建設工事の元請業者は、工事着手の時期及び工程の概要、分別解体等の計画等の事項を都道府県知事に届け出なければならない。","対象建設工事受注者は、分別解体等に伴って生じた特定建設資材廃棄物に該当するコンクリートは、再資源化をしなければならない。","）「建設業法」上の管工事業のみの許可を受けた者が解体工事業を営もうとする場合は、当該業を行おうとする区域を管轄する都道府県知事の登録を受けなければならない。","対象建設工事（他の者から請け負ったものを除く。）を発注しようとする者から直接当該工事を請け負おうとする建設業を営む者は、当該発注しようとする者に対し、分別解体等の計画等の事項を記載した書面を交付して説明しなければならない。"],"a":[1],"m":"exact","n":"","e":"対象建設工事の届出は、工事着手の7日前までに「発注者」（自主施工者）が都道府県知事に行う。元請業者ではない。","f":[],"o":["img/H29B27_o0.png"],"g":12,"cat":"B法規","neg":true},{"id":"H29B28","y":"H29","p":"B","no":28,"s":"指定地域内における特定建設作業に関する記述のうち、「騒音規制法」上、誤っているものはどれか。\nただし、災害その他非常の事態の発生により当該特定建設作業を緊急に行う必要がある場合及び人の生命又は身体に対する危険を防止するため特に当該特定建設作業を行う必要がある場合を除く。","c":["特定建設作業を伴う建設工事を施工しようとする者は、特定建設作業の場所及び実施の期間等の事項を都道府県知事に届け出なければならない。","特定建設作業の実施の届け出は、当該特定建設作業の開始の日の7日前までに行わなければならない。","建設工事として行われる作業のうち、著しい騒音を発生する作業であっても、当該作業がその作業を開始した日に終わるものは、特定建設作業に該当しない。","特定建設作業の騒音は、当該特定建設作業の場所において連続して6日を超えて行われる特定建設作業に伴って発生するものであってはならない。"],"a":[1],"m":"exact","n":"","e":"特定建設作業の実施の届出先は市町村長。都道府県知事ではない。","f":[],"o":["img/H29B28_o0.png"],"g":36,"cat":"B法規","neg":true},{"id":"H29B29","y":"H29","p":"B","no":29,"s":"産業廃棄物の処理に関する記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","c":["建設工事に伴って発生する産業廃棄物の処理責任を負う排出事業者は、実際の工事の施工は下請業者が行っている場合であっても、発注者から直接工事を請け負った元請業者である。","産業廃棄物の処分を業として行おうとする者は、都道府県知事から産業廃棄物処分業者の許可を受けることにより、産業廃棄物の運搬及び処分を一括して受託することができる。","専ら再生利用の目的となる産業廃棄物のみの収集若しくは運搬又は処分を業として行う者に当該産業廃棄物のみの運搬又は処分を委託する場合は、産業廃棄物管理票の交付を要しない。","産業廃棄物管理票を交付した事業者は、当該管理票に関する報告書を作成し、都道府県知事に提出しなければならない。"],"a":[2],"m":"exact","n":"","e":"処分業の許可だけでは運搬はできない。運搬を受託するには収集運搬業の許可も必要。","f":[],"o":["img/H29B29_o0.png"],"g":13,"cat":"B法規","neg":true},{"id":"H30A01","y":"H30","p":"A","no":1,"s":"地球環境に関する記述のうち、適当でないものはどれか。","c":["オゾン層が破壊されると、太陽光に含まれる紫外線の地表への到達量が増大して、生物に悪影響を与える。","HFC-134aは、オゾン層破壊係数が0（ゼロ）で、地球温暖化係数が二酸化炭素より小さい冷媒である。","酸性雨は、大気中の硫黄酸化物や窒素酸化物が溶け込んで、pH値が概ね5.6以下の酸性となった雨のことで、湖沼や森林の生態系に悪影響を与える。","温室効果とは、日射エネルギーにより加熱された地表面からの放射熱の一部が、大気中の水蒸気、二酸化炭素などにより吸収され、大気の温度が上昇することをいう。"],"a":[2],"m":"exact","n":"","e":"HFC-134aはオゾン層破壊係数は0だが、地球温暖化係数は約1,430と二酸化炭素よりはるかに大きい。","f":[],"o":["img/H30A01_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A02","y":"H30","p":"A","no":2,"s":"温熱環境に関する記述のうち、適当でないものはどれか。","c":["人体の代謝量はメット（met）で表され、1metは椅座安静状態の代謝量で単位体表面積（m²）当たり概ね100Wである。","人体は周囲空間との間で対流と放射による熱交換を行っており、これと同じ量の熱を交換する均一温度の閉鎖空間の温度を作用温度（OT）という。","新有効温度（ET＊）は、湿度50％を基準とし、気温、湿度、気流、放射温度、代謝量（met）及び着衣量（clo）の6つの要素を総合的に評価した温熱環境指標である。","予想平均申告（PMV）は、大多数の人が感ずる温冷感を+3から−3までの数値で示すものである。"],"a":[1],"m":"exact","n":"","e":"1metは椅座安静時の代謝量で、単位体表面積当たり約58.2W/m²。100Wではない。","f":[],"o":["img/H30A02_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A03","y":"H30","p":"A","no":3,"s":"排水の水質に関する記述のうち、適当でないものはどれか。","c":["BODは、河川等の水質汚濁の指標として用いられ、主に水中に含まれる有機物が酸化剤で化学的に酸化したときに消費する酸素量をいう。","TOCは、水の汚染度を判断する指標として用いられ、水中に存在する有機物中の炭素量をいう。","SSとは、不溶性懸濁物質量のことで、全蒸発残留物から溶解性残留物を除いた物質量をいう。","ノルマルヘキサン抽出物質含有量は、油脂類による水質汚濁の指標として用いられ、水中に含まれる油分等がヘキサンで抽出される物質量をいう。"],"a":[1],"m":"exact","n":"","e":"記述はCOD（化学的酸素要求量）。BODは微生物が有機物を分解する際に消費する酸素量（生物化学的酸素要求量）。","f":[],"o":["img/H30A03_o0.png"],"g":37,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A04","y":"H30","p":"A","no":4,"s":"流体に関する記述のうち、適当でないものはどれか。","c":["水の粘性係数は、水温の上昇とともに大きくなる。","水の密度は、1気圧のもとでは4℃付近で最大となる。","液体の自由な表面で、その表面を縮小しようとする性質により表面に働く力を、表面張力という。","一様な流れの中に置いた円柱などの物体の下流側において、交互に発生する渦をカルマン渦という。"],"a":[1],"m":"exact","n":"","e":"水の粘性係数は、水温が上昇すると「小さく」なる（気体は逆に大きくなる）。","f":[],"o":["img/H30A04_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A05","y":"H30","p":"A","no":5,"s":"図に示す水平な管路内を空気が流れる場合、B点の流速として適当なものはどれか。\nただし、A点における全圧は40Pa、B点の静圧は20Pa、A点とB点の間の圧力損失は5Pa、空気の密度は1.2kg/m³とする。","c":["3m/s","5m/s","10m/s","15m/s"],"a":[2],"m":"exact","n":"","e":"B点の全圧＝40－5＝35Pa。動圧＝35－20＝15Pa＝1/2×1.2×v² → v²＝25、v＝5m/s。","f":["img/H30A05_f0.png"],"o":["img/H30A05_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"H30A06","y":"H30","p":"A","no":6,"s":"流体に関する用語の組合せのうち、関係のないものはどれか。","c":["レイノルズ数 粘性力","ベルヌーイの定理 エネルギーの保存","ダルシー・ワイスバッハの式 圧力損失","トリチェリの定理 毛管現象"],"a":[4],"m":"exact","n":"","e":"トリチェリの定理は水槽からの流出速度に関する定理で、毛管現象（表面張力）とは関係がない。","f":[],"o":["img/H30A06_o0.png"],"g":38,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A07","y":"H30","p":"A","no":7,"s":"熱に関する用語の組合せのうち、関係のないものはどれか。","c":["気体の状態式 ボイル・シャルルの法則","熱力学の第二法則 エントロピー","熱伝導 ステファン・ボルツマン定数","熱伝達 ニュートンの冷却則"],"a":[3],"m":"exact","n":"","e":"ステファン・ボルツマン定数は熱放射（放射エネルギー∝絶対温度の4乗）に関する定数で、熱伝導とは関係がない。","f":[],"o":["img/H30A07_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A08","y":"H30","p":"A","no":8,"s":"伝熱に関する記述のうち、適当でないものはどれか。","c":["熱放射は、物体が電磁波の形で熱エネルギーを放出・吸収する現象であり、その伝達には媒体の存在を必要とするため真空中では生じない。","自然対流は、流体温度の異なる部分の密度差により浮力を生じ、上昇流と下降流が起こることで生じる。","熱伝導は、異なる温度の物質が隣接する場合に、高温の物質から低温の物質に、物質の移動なく熱エネルギーが伝わる現象である。","等質な固体内部における熱伝導による熱移動量は、その固体内の温度勾配に比例する。"],"a":[1],"m":"exact","n":"","e":"熱放射は電磁波によるもので、媒体を必要とせず真空中でも生じる。","f":[],"o":["img/H30A08_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A09","y":"H30","p":"A","no":9,"s":"冷凍に関する記述のうち、適当でないものはどれか。","c":["冷凍とは、物質あるいは空間を周囲の大気温度以下の所定温度に冷却する操作をいう。","冷媒による冷凍とは、冷凍すべき物体から冷媒が蒸発する際に必要とする顕熱を奪うことである。","現在、冷凍に広く使用されている冷媒には、アンモニア、フロン、ハイドロカーボン、水などがある。","冷媒の状態変化を表したモリエ線図は、縦軸に絶対圧力、横軸に比エンタルピーをとったもので、冷媒の特性を分析する場合などに用いられる。"],"a":[2],"m":"exact","n":"","e":"冷凍は、冷媒が蒸発する際に必要な「蒸発潜熱」を物体から奪うことで行う。顕熱ではない。","f":[],"o":["img/H30A09_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A10","y":"H30","p":"A","no":10,"s":"音に関する記述のうち、適当でないものはどれか。","c":["ロックウールやグラスウールは、一般的に、中・高周波数域よりも低周波数域の音をよく吸収する。","音速は、一定の圧力のもとでは、空気の温度が高いほど速くなる。","音の強さとは、音の進行方向に垂直な平面内の単位面積を単位時間に通過する音のエネルギー量をいう。","NC曲線で示される音圧レベルの許容値は、周波数が低いほど大きい。"],"a":[1],"m":"exact","n":"","e":"ロックウール・グラスウールなどの多孔質材料は、中・高周波数域の音をよく吸収し、低周波数域の吸音率は小さい。","f":[],"o":["img/H30A10_o0.png"],"g":14,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A11","y":"H30","p":"A","no":11,"s":"低圧屋内配線に関する記述のうち、適当でないものはどれか。","c":["非耐燃性（自己消火性がない。）の合成樹脂製可とう電線管の色は、オレンジ色である。","金属管工事における三相3線式回路の電線は、1回路の電線全部を同一の金属管に収めなければならない。","使用電圧が400Vの場合、合成樹脂製可とう電線管に使用する金属製ボックスの接地工事は、乾燥した場所に施設する場合は省略することができる。","使用電圧が400Vの場合、金属管工事に使用する金属管にはC種接地工事を施す。"],"a":[3],"m":"exact","n":"","e":"300Vを超える低圧で使用する金属製ボックスにはC種接地工事が必要で、乾燥した場所でも省略できない。","f":[],"o":["img/H30A11_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A12","y":"H30","p":"A","no":12,"s":"三相誘導電動機の回路に関する記述のうち、適当でないものはどれか。","c":["出力が0.2kW以下の電動機は、過負荷保護装置の設置を省略することができる。","スターデルタ始動方式の始動トルクは、じか入れ始動方式の1/√3 となる。","じか入れ始動方式では、一般的に、始動電流は定格電流の5〜7倍となる。","インバータの一次側に設置する漏電遮断器は、高調波・サージ対応品の使用が望ましい。"],"a":[2],"m":"exact","n":"","e":"スターデルタ始動の始動トルク（及び始動電流）は、じか入れ始動の1/3となる。1/√3ではない。","f":[],"o":["img/H30A12_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A13","y":"H30","p":"A","no":13,"s":"鉄筋コンクリート造の配筋等に関する記述のうち、適当でないものはどれか。","c":["スパイラル筋は、柱のせん断補強のほか、耐震補強壁のアンカー周辺の補強としても設置される。","あばら筋は梁のせん断補強のために、帯筋は柱のせん断補強と座屈防止のために設置される。","梁貫通孔補強筋は、せん断力によって発生する応力に抵抗できるように配筋する。","梁を貫通する配管用スリーブは、コンクリート打設時のずれ防止のため、最寄りの鉄筋に接して緊結する。"],"a":[4],"m":"exact","n":"","e":"配管用スリーブは鉄筋に接して緊結せず、かぶり厚さを確保して鉄筋から離して設ける。","f":[],"o":["img/H30A13_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A14","y":"H30","p":"A","no":14,"s":"コンクリートの調合、試験に関する記述のうち、適当でないものはどれか。","c":["スランプ試験は、コンクリートの流動性と材料分離に対する抵抗性の程度を測定する試験である。","スランプが大きいと、コンクリートの打設効率が低下し、充填不足を生じることがある。","単位セメント量を少なくすると、水和熱及び乾燥収縮によるひび割れを防止することができる。","単位水量が多く、スランプの大きいコンクリートほど、コンクリート強度は低くなる。"],"a":[2],"m":"exact","n":"","e":"スランプが「小さい」と流動性が悪く、打設効率の低下や充填不足を生じやすい。スランプが大きすぎると材料分離が起きやすい。","f":[],"o":["img/H30A14_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"H30A15","y":"H30","p":"A","no":15,"s":"空調システムの省エネルギーに効果がある建築的手法の記述のうち、適当でないものはどれか。","c":["建物の平面形状をなるべく正方形に近づける。","建物の外周の東西面に、非空調室を配置する。","外壁面積に対する窓面積の比率を小さくする。","窓ガラスは、日射熱取得に係る遮へい係数の大きいものを計画する。"],"a":[4],"m":"exact","n":"","e":"窓ガラスは、日射熱の取得を抑えるため遮へい係数の「小さい」ものを計画する。","f":[],"o":["img/H30A15_o0.png"],"g":39,"cat":"A空調","neg":true},{"id":"H30A16","y":"H30","p":"A","no":16,"s":"空気調和方式に関する記述のうち、適当でないものはどれか。","c":["床吹出し方式では、冷房時には効率的な居住域空調が行えるが、居住域の垂直温度差が避けられない。","ダクト併用ファンコイルユニット方式は、全空気方式に比べ、外気冷房の効果を得にくい。","定風量単一ダクト方式は、変風量単一ダクト方式に比べ、負荷特性の異なる複数のゾーンに対しての負荷変動対応が容易である。","変風量単一ダクト方式に用いる変風量（VAV）ユニットは、試運転時の風量調整に利用できる。"],"a":[3],"m":"exact","n":"","e":"負荷特性の異なる複数ゾーンの負荷変動に対応しやすいのは変風量単一ダクト方式。定風量方式は対応しにくい。","f":[],"o":["img/H30A16_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"H30A17","y":"H30","p":"A","no":17,"s":"空気調和機の機内に設ける加湿装置に関する記述のうち、適当でないものはどれか。","c":["蒸気方式には、電力を利用し装置内で加湿蒸気を発生させるパン型加湿器がある。","気化方式では、加湿後の空気の温度降下は生じない。","気化方式では、加湿前の空気が低温・高湿であるほど加湿量が少なくなる。","水噴霧方式では、加湿水の中に含まれる硬度成分などが機内に放出される。"],"a":[2],"m":"exact","n":"","e":"気化式加湿では、水が蒸発する際に気化熱を奪うため、加湿後の空気温度は降下する。","f":[],"o":["img/H30A17_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"H30A18","y":"H30","p":"A","no":18,"s":"冷房負荷に関する記述のうち、適当でないものはどれか。","c":["人体からの全発熱量は、室内温度が変わっても、ほぼ一定である。","北側のガラス窓からの熱負荷には、日射の影響も考慮する。","北側の外壁の冷房負荷計算には、一般的に、実効温度差は用いない。","ガラス面積の大きいアトリウムの熱負荷の特徴は、日射熱負荷が大きいことである。"],"a":[3],"m":"exact","n":"","e":"冷房負荷計算では、北側の外壁も含め外壁には実効温度差を用いる。","f":[],"o":["img/H30A18_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"H30A19","y":"H30","p":"A","no":19,"s":"変風量単一ダクト方式の自動制御において、「制御する機器」と「検出要素」の組合せのうち、関係の少ないものはどれか。\n(制御する機器) (検出要素)","c":["冷温水の制御弁 空気調和機出口空気の温度","外気用電動ダンパー 還気ダクト内の二酸化炭素濃度","変風量（VAV）ユニット 室内の温度","空気調和機のファン 還気ダクト内の静圧"],"a":[4],"m":"exact","n":"","e":"変風量方式の送風機制御は、給気ダクト内の静圧を検出して行う。還気ダクトではない。","f":[],"o":["img/H30A19_o0.png"],"g":1,"cat":"A空調","neg":true},{"id":"H30A20","y":"H30","p":"A","no":20,"s":"コージェネレーションシステムに関する記述のうち、適当でないものはどれか。","c":["発電電力と商用電力の系統連系により、電力供給の信頼性が上がる。","システムの経済性は、イニシャルコスト及びランニングコストの試算結果により評価される。","ガスタービンを用いるシステムの発電効率は、ディーゼルエンジン、ガスエンジンを用いるシステムに比べて高い。","燃料電池を用いるシステムは、発電効率が高く、騒音や振動の発生が少ない。"],"a":[3],"m":"exact","n":"","e":"ガスタービンの発電効率は、ディーゼルエンジン・ガスエンジンより「低い」（その分、高温の排熱が得られる）。","f":[],"o":["img/H30A20_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"H30A21","y":"H30","p":"A","no":21,"s":"蓄熱方式に関する記述のうち、適当でないものはどれか。","c":["蓄熱方式の装置容量は、熱源機器能力に関係なく、蓄熱容量（蓄熱槽容積）で決定される。","夜間に蓄熱運転をすることで、電力の平準化や契約電力の低減を図ることができる。","熱源機器は、空調負荷の変動に直接追従する必要がなく、高効率の連続運転ができる。","二次側配管系を開回路とした場合、ポンプの揚程が増大する。"],"a":[1],"m":"exact","n":"","e":"蓄熱方式の装置容量は、熱源機器の能力と蓄熱容量の組合せで決まる。熱源能力に関係なく決まるのではない。","f":[],"o":["img/H30A21_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"H30A22","y":"H30","p":"A","no":22,"s":"関係法令等で定められている換気設備に関する記述のうち、誤っているものはどれか。","c":["）「建築基準法」では、床面積の1/30以上の換気上有効な開口がない居室には、換気設備を設けなければならないこととしている。","）「駐車場法」では、建築物である一定規模の路外駐車場であって、換気に有効な開口面積を有さないものにおいては、床面積1m²につき14m³/h以上の能力を有する換気設備を設けなければならないこととしている。","）「建築物における衛生的環境の確保に関する法律」では、特定建築物の居室における二酸化炭素の含有率が概ね1,000ppm以下になるように管理することとしている。","）「建築基準法」では、特殊建築物の居室に機械換気設備を設ける場合、有効換気量を求めるための1人当たりの占有面積は、3m²を上限としている。"],"a":[1],"m":"exact","n":"","e":"建築基準法で換気設備が必要となるのは、換気上有効な開口が床面積の1/20未満の居室。1/30ではない。","f":[],"o":["img/H30A22_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"H30A23","y":"H30","p":"A","no":23,"s":"エレベーター機械室において発生した熱を、換気設備によって排除するのに必要な最小換気量として、適当なものはどれか。\nただし、エレベーター機器の発熱量は8kW、エレベーター機械室の許容温度は40℃、外気温度は35℃、空気の定圧比熱は1.0kJ/(kg・K）、空気の密度は1.2kg/m³とする。","c":["1,200m³/h","2,400m³/h","3,600m³/h","4,800m³/h"],"a":[4],"m":"exact","n":"","e":"Q＝(8kW×3,600)÷(1.2×1.0×(40－35))＝28,800÷6＝4,800m³/h。","f":[],"o":["img/H30A23_o0.png"],"g":7,"cat":"A換気・排煙","neg":false},{"id":"H30A24","y":"H30","p":"A","no":24,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」上の「階及び全館避難安全検証法」及び「特殊な構造」によらないものとする。","c":["排煙口の吸込み風速は10m/s以下とし、ダクト内風速は20m/s以下となるようにする。","排煙口の位置は、避難方向と煙の流れが反対になるように配置する。","排煙機の設置位置は、最上階の排煙口よりも下の位置にならないようにする。","排煙口の手動開放装置の手で操作する部分の高さは、天井から吊り下げる場合、床面から概ね1.5mの高さとする。"],"a":[4],"m":"exact","n":"","e":"天井から吊り下げる手動開放装置の操作部分は、床面からおおむね1.8mの高さとする。","f":[],"o":["img/H30A24_o0.png"],"g":40,"cat":"A換気・排煙","neg":true},{"id":"H30A25","y":"H30","p":"A","no":25,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」上の「階及び全館避難安全検証法」及び「特殊な構造」によらないものとする。","c":["天井高さが3m未満の壁面に排煙口を設ける場合は、天井から80cm以内、かつ防煙垂れ壁の下端より上の部分とする。","排煙口は、防煙区画の各部分から水平距離で30m以下になるように設ける。","廊下の横引き排煙ダクトは、立てダクト（メインダクト）まで、居室の横引き排煙ダクトと別系統にする。","常時閉鎖型の排煙口は、2以上の防煙区画を1台の排煙機で受け持つ場合には適さない形式である。"],"a":[4],"m":"exact","n":"","e":"常時閉鎖型の排煙口は、2以上の防煙区画を1台の排煙機で受け持つ場合に適した形式。不適なのは常時開放型。","f":[],"o":["img/H30A25_o0.png"],"g":15,"cat":"A換気・排煙","neg":true},{"id":"H30A26","y":"H30","p":"A","no":26,"s":"上水道に関する記述のうち、適当でないものはどれか。","c":["導水施設は、取水施設から浄水施設までの施設をいい、導水方式には自然流下式、ポンプ加圧式及び併用式がある。","浄水施設には消毒設備を設け、需要家の給水栓における水の遊離残留塩素濃度を0.1mg/L以上に保持できるようにする。","送水施設の計画送水量は、計画1日最大給水量（1年を通じて、1日の給水量のうち最も多い量）を基準として定める。","浄水施設における緩速ろ過方式は、急速ろ過方式では対応できない原水水質の場合や、敷地面積に制約がある場合に採用される。"],"a":[4],"m":"exact","n":"","e":"緩速ろ過方式は原水水質が比較的良好な場合に用いられ、ろ過速度が遅いため広い敷地面積を必要とする。","f":[],"o":["img/H30A26_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H30A27","y":"H30","p":"A","no":27,"s":"下水道に関する記述のうち、適当でないものはどれか。","c":["管きょ内で必要とする最小流速は、雨水管きょに比べて、汚水管きょの方が大きい。","地表勾配が急な場合の管きょの接続は、地表勾配に応じて段差接合又は階段接合とする。","伏越し管きょ内の流速は、上流管きょ内の流速よりも速くする。","下水本管への取付管の最小管径は、150mmを標準とする。"],"a":[1],"m":"exact","n":"","e":"管きょの最小流速は汚水管きょ0.6m/s、雨水管きょ0.8m/sで、雨水管きょの方が大きい。","f":[],"o":["img/H30A27_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H30A28","y":"H30","p":"A","no":28,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["直結増圧方式は、高置タンク方式に比べて、給水引込み管の管径が大きくなる。","飲料用受水タンクの上部にやむをえず排水管を通す場合、排水管の下に受け皿を設置し、受水タンクから1m以上離す。","共同住宅の設計に用いる1人当たりの使用水量は、100L/日である。","高置タンク方式における揚水ポンプの揚水量は、時間最大予想給水量に基づき決定する。"],"a":[3],"m":"exact","n":"","e":"共同住宅の1人当たり使用水量は、一般に200〜350L/日程度。100L/日では少ない。","f":[],"o":["img/H30A28_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H30A29","y":"H30","p":"A","no":29,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["高置タンク方式とした学校等の受水タンクは、給水負荷の季節変動による水質劣化を防止するため、タンクの分割や水位調整装置の設置などの措置を講じる。","直結増圧方式の立て管には、断水時に配管内が負圧にならないように、最上部に吸排気弁を設置する。","ウォーターハンマー防止等のため、給水管内の流速は、一般的に、4.0m/s程度とする。","高層建物などでは、給水圧力が0.4MPaを超えないように、系統を高層階と低層階に分ける。"],"a":[3],"m":"exact","n":"","e":"ウォーターハンマー防止のため、給水管内の流速は一般に2.0m/s以下とする。","f":[],"o":["img/H30A29_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H30A30","y":"H30","p":"A","no":30,"s":"給湯設備に関する記述のうち、適当でないものはどれか。","c":["中央式給湯設備の下向き循環方式の場合、配管の空気抜きを考慮して、給湯管、返湯管とも先下り勾配とする。","中央式給湯設備の循環ポンプの循環量は、循環配管路の熱損失と許容温度降下により決定する。","給湯管の管径は、主管、各枝管ごとの給湯量に応じて、流速及び許容摩擦損失により決定する。","中央式給湯設備の循環ポンプは、強制循環させるため、貯湯タンクの出口側に設置する。"],"a":[4],"m":"exact","n":"","e":"中央式給湯の循環ポンプは、返湯管（貯湯タンクの入口側）に設置する。","f":[],"o":["img/H30A30_o0.png"],"g":41,"cat":"A衛生","neg":true},{"id":"H30A31","y":"H30","p":"A","no":31,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["伸頂通気方式において、誘導サイホン作用の防止には、排水用特殊継手を用いて管内圧力の緩和を図る方法がある。","自己サイホン作用の防止には、脚断面積比の小さなトラップの方が大きなトラップに比べて有効である。","通気弁は、大気に開放された伸頂通気管のような正圧緩和の効果は期待できない。","排水立て管に接続する排水横枝管の垂直距離の間隔が2.5mを超える場合、その間隔を1ブランチ間隔という。"],"a":[2],"m":"exact","n":"","e":"自己サイホン作用の防止には、脚断面積比の「大きい」トラップの方が有効。","f":[],"o":["img/H30A31_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H30A32","y":"H30","p":"A","no":32,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["工場製造のグリース阻集器は、許容流量及び標準阻集グリース量を確認した上で選定する。","伸頂通気方式では、高さ30mを超える排水立て管の許容流量は、低減率を乗じて算出する。","定常流量法により通気管径を決定する際には、通気管の実管長に局部損失を加えた相当管長から許容圧力損失を求める。","排水ポンプの容量は、排水槽への流入量の変動が著しい場合、毎時平均排水量とする。"],"a":[4],"m":"exact","n":"","e":"流入量の変動が著しい場合の排水ポンプ容量は、時間最大排水量（流入量の最大値）で決める。毎時平均では不足する。","f":[],"o":["img/H30A32_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H30A33","y":"H30","p":"A","no":33,"s":"排水設備に関する記述のうち、適当でないものはどれか。","c":["排水立て管に対して45°以下のオフセットの管径は、垂直な排水立て管とみなして決定してよい。","雑排水用水中モーターポンプの口径は、50mm以上とする。1 1","排水槽底部の勾配は、吸込みピットに向かい1/15〜1/10とする。15 10","間接排水管の排水口空間は、管径65mmの場合、最小100mmとする。"],"a":[4],"m":"exact","n":"","e":"間接排水管の排水口空間は、管径65mm以上では最小150mm（25mm以下50mm、30〜50mm100mm）。","f":[],"o":["img/H30A33_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H30A34","y":"H30","p":"A","no":34,"s":"消火設備の消火原理に関する記述のうち、適当でないものはどれか。","c":["泡消火設備は、燃焼物を泡の層で覆い、窒息効果と冷却効果により消火するものである。","粉末消火設備は、粉末状の消火剤を放射し、熱分解で発生した炭酸ガスや水蒸気による窒息効果と冷却効果により消火するものである。","不活性ガス消火設備は、不活性ガスを放出し、ガス成分の化学反応により消火するものである。","水噴霧消火設備は、水を霧状に噴射し、噴霧水による冷却効果と噴霧水が火炎に触れて発生する水蒸気による窒息効果により消火するものである。"],"a":[3],"m":"exact","n":"","e":"不活性ガス消火設備は、放出により酸素濃度を下げる窒息効果で消火する。化学反応によるものではない。","f":[],"o":["img/H30A34_o0.png"],"g":16,"cat":"A衛生","neg":true},{"id":"H30A35","y":"H30","p":"A","no":35,"s":"ガス設備に関する記述のうち、適当でないものはどれか。","c":["都市ガスの種類において、13AはLNGを主体として製造されたガスである。","都市ガスの発熱量は、一般的に、総発熱量（高発熱量）から蒸発熱を差し引いた低発熱量で表示される。","都市ガスの供給において、ガス消費量が多い熱源機器を使用する施設には中圧供給方式とする場合がある。","ガス事業法では、ガス供給圧力が0.1MPa未満を低圧、1MPa以上を高圧と区分している。"],"a":[2],"m":"exact","n":"","e":"都市ガスの発熱量は、一般に総発熱量（高発熱量）で表示される。","f":[],"o":["img/H30A35_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H30A36","y":"H30","p":"A","no":36,"s":"浄化槽の構造方法を定める告示に示された、処理対象人員30人以下の嫌気ろ床接触ばっ気方式の浄化槽のフローシート中、 内に当てはまる槽の名称の組合せとして、正しいものはどれか。","c":["嫌気ろ床槽 接触ばっ気槽 沈殿槽","嫌気ろ床槽 沈殿分離槽 接触ばっ気槽","接触ばっ気槽 嫌気ろ床槽 沈殿分離槽","沈殿分離槽 接触ばっ気槽 沈殿槽"],"a":[1],"m":"exact","n":"","e":"嫌気ろ床接触ばっ気方式の構成は、嫌気ろ床槽→接触ばっ気槽→沈殿槽→消毒槽。","f":["img/H30A36_f0.png"],"o":["img/H30A36_o0.png"],"g":null,"cat":"A衛生","neg":false},{"id":"H30A37","y":"H30","p":"A","no":37,"s":"JISに規定する「建築物の用途別による屎尿浄化槽の処理対象人員算定基準」に示されている処理対象人員の算定式に関する記述のうち、適当でないものはどれか。","c":["ホテルの処理対象人員は、延べ面積に結婚式場又は宴会場の有無により異なる定数を乗じて算定する。","喫茶店の処理対象人員は、席数に定数を乗じて算定する。","高速道路のサービスエリアの処理対象人員は、駐車ます数にサービスエリアの機能別に異なる定数を乗じて算定する。","駅・バスターミナルの処理対象人員は、乗降客数に定数を乗じて算定する。"],"a":[2],"m":"exact","n":"","e":"喫茶店の処理対象人員は、延べ面積に定数を乗じて算定する。席数ではない。","f":[],"o":["img/H30A37_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"H30A38","y":"H30","p":"A","no":38,"s":"冷凍機に関する記述のうち、適当でないものはどれか。","c":["二重効用の直だき吸収冷温水機の高温再生機内の圧力は、大気圧以下である。","スクリュー冷凍機は、高い圧縮比でも体積効率がよいので、空気熱源ヒートポンプとして多く用いられている。","往復動冷凍機は、遠心冷凍機に比べて、負荷変動に対する追従性がよく、容量制御も容易である。","吸収冷凍機は、遠心冷凍機に比べて、一般的に、運転開始から定格能力に達するまでの時間が長い。"],"a":[3],"m":"exact","n":"","e":"往復動冷凍機の容量制御は段階的で、負荷変動への追従性や容量制御の容易さは遠心冷凍機の方が優れる。","f":[],"o":["img/H30A38_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"H30A39","y":"H30","p":"A","no":39,"s":"ボイラー等に関する記述のうち、適当でないものはどれか。","c":["鋳鉄製ボイラーは、分割搬入が可能で、鋼板製に比べて、耐食性が優れている。","小型貫流ボイラーは、蒸発量に対する保有水量が少なく、ボイラー水の濃縮度が大きいため、水質管理には注意を要する。","炉筒煙管ボイラーは、保有水量は多いが、煙管群内に燃焼ガスを高速に対流させ加熱するため、予熱時間が短い。","真空式温水発生機は、運転中の内部圧力が大気圧より低いため、ボイラーの適用を受けず、取扱い資格も不要である。"],"a":[3],"m":"exact","n":"","e":"炉筒煙管ボイラーは保有水量が多いため、予熱（立上り）時間が「長い」。","f":[],"o":["img/H30A39_o0.png"],"g":42,"cat":"A機材・設計図書・約款","neg":true},{"id":"H30A40","y":"H30","p":"A","no":40,"s":"空気清浄装置に関する記述のうち、適当でないものはどれか。","c":["自動巻取形フィルターは、タイマーや差圧により電動機を駆動して、ロール状に巻いたろ材を巻き取る機構となっている。","静電式の空気清浄装置は、高圧電界による荷電及び吸引付着力により粉じんを除去するものであり、粉じん捕集率は面風速の大小に左右されない。","活性炭フィルターは、素材の細孔を利用し、空気中に含まれる臭気成分ガスを除去するものである。","HEPAフィルターは、捕集した粉じんによる圧力損失の上昇が早いため、一般的に、プレフィルターを設ける。"],"a":[2],"m":"exact","n":"","e":"静電式空気清浄装置の粉じん捕集率は、面風速が大きくなると低下する。面風速に左右される。","f":[],"o":["img/H30A40_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"H30A41","y":"H30","p":"A","no":41,"s":"配管付属品に関する記述のうち、適当でないものはどれか。","c":["圧力調整弁は、弁の一次側の圧力を一定に保つ目的で、ポンプのバイパス弁などに使用される。","温度調整弁は、通過流体の量を調整して、貯湯槽内の温水温度を一定に保つ目的で使用される。","フロート分離型の定水位調整弁は、主弁が作動不良の場合、フロートの作動により副弁から給水を開始又は停止するものである。","定流量弁は、送水圧力の変動が生じた場合においても流量を一定に保つ目的で、ファンコイルユニットなどに使用される。"],"a":[3],"m":"exact","n":"","e":"フロート分離型定水位調整弁は、フロートで副弁（パイロット弁）を開閉し、その圧力変化で主弁を開閉する。主弁不良時の予備給水の仕組みではない。","f":[],"o":["img/H30A41_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"H30A42","y":"H30","p":"A","no":42,"s":"ダクトに関する記述のうち、適当でないものはどれか。","c":["フレキシブルダクトは、無理な屈曲による取付け方をした場合、圧力損失が大きくなる。","低圧ダクトは、常用圧力において、正圧、負圧ともに500Pa以内で使用する。","幅又は高さが450mmを超えるダクトで保温を施さないものには、300mm以下のピッチで補強リブを設ける。","アングルフランジ工法ダクトは、共板フランジ工法ダクトに比べて、フランジ接合部の締付け力が小さい。"],"a":[4],"m":"exact","n":"","e":"アングルフランジ工法ダクトの方が、共板フランジ工法ダクトよりフランジ接合部の締付け力は大きい。","f":[],"o":["img/H30A42_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"H30A43","y":"H30","p":"A","no":43,"s":"「公共工事標準請負契約約款」に関する記述のうち、適当でないものはどれか。","c":["受注者は、設計図書に定めるところにより、工事目的物及び工事材料等に火災保険、建設工事保険等に付さなければならない。","発注者が監督員を置いたときは、約款に定める請求、通知、報告、申出、承諾及び解除については、設計図書に定めるものを除き、監督員を経由して行う。","発注者は、必要があると認めるときは、設計図書の変更内容を受注者に通知して、設計図書を変更することができる。","発注者が完成検査を行う際に、必要と認められる理由を受注者に通知して、工事目的物を最小限度破壊して検査する場合、検査又は復旧に直接要する費用は発注者の負担となる。"],"a":[4],"m":"exact","n":"","e":"完成検査で必要により最小限度破壊した場合の検査・復旧費用は「受注者」の負担。","f":[],"o":["img/H30A43_o0.png"],"g":43,"cat":"A機材・設計図書・約款","neg":true},{"id":"H30A44","y":"H30","p":"A","no":44,"s":"JISに規定する配管に関する記述のうち、適当でないものはどれか。","c":["硬質ポリ塩化ビニル管のVPは、VUより管の肉厚が厚い。","水配管用亜鉛めっき鋼管は、配管用炭素鋼鋼管（白管）に比べて、亜鉛の付着量が多い。","銅管のLタイプは、Mタイプより管の肉厚が薄い。","圧力配管用炭素鋼鋼管は、スケジュール番号の大きい方が管の肉厚が厚い。"],"a":[3],"m":"exact","n":"","e":"JISの銅管の肉厚はKタイプ＞Lタイプ＞Mタイプの順。LタイプはMタイプより厚い。","f":[],"o":["img/H30A44_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"H30B01","y":"H30","p":"B","no":1,"s":"公共工事における施工管理に関する記述のうち、適当でないものはどれか。","c":["工事原価とは直接工事費と共通仮設費とを合わせた費用のことであり、現場従業員の給与等の現場経費は含まない。","仮設計画は、現場事務所、足場など施工に必要な諸設備を整えることであり、主としてその工事の受注者がその責任において計画する。","総合施工計画書は受注者の責任において作成されるが、設計図書に特記された事項については監督員の承諾を受ける。","工事中に設計変更や追加工事が必要となった場合は、工期及び請負代金額の変更について、発注者と受注者で協議する。"],"a":[1],"m":"exact","n":"","e":"工事原価＝純工事費（直接工事費＋共通仮設費）＋現場管理費で、現場従業員の給与等は現場管理費として含まれる。","f":[],"o":["img/H30B01_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H30B02","y":"H30","p":"B","no":2,"s":"工事の「申請・届出書類」と「関係法に基づく提出先」の組合せとして、適当でないものはどれか。\n(申請・届出書類) (関係法に基づく提出先)","c":["指定数量以上の危険物貯蔵所設置許可申請書 市町村長又は都道府県知事","高圧ガス製造届 都道府県知事","道路占用許可申請書 警察署長","ボイラー設置届 労働基準監督署長"],"a":[3],"m":"exact","n":"","e":"道路占用許可申請書の提出先は道路管理者。警察署長は道路使用許可。","f":[],"o":["img/H30B02_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"H30B03","y":"H30","p":"B","no":3,"s":"工程管理に関する記述のうち、適当でないものはどれか。","c":["マンパワースケジューリングとは、工程計画における配員計画のことをいい、作業員の人数が経済的、合理的になるように作業の予定を決めることである。","総工事費が最小となる最も経済的な施工速度を経済速度といい、このときの工期を最適工期という。","ネットワーク工程表において、クリティカルパスは、最早開始時刻と最遅完了時刻の等しいクリティカルイベントを通る。","ネットワーク工程表において、ダミーは、架空の作業を意味し、作業及び時間の要素は含まないため、フォローアップ時には工程に影響しない。"],"a":[4],"m":"exact","n":"","e":"ダミーは作業の前後関係を表すもので、先行作業の遅れはダミーを通じて後続作業に影響する。","f":[],"o":["img/H30B03_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"H30B04","y":"H30","p":"B","no":4,"s":"下図のネットワーク工程表に関する記述のうち、適当でないものはどれか。\nただし、図中のイベント間のＡ〜Ｉは作業内容、日数は作業日数を表す。","c":["クリティカルパスは、①→②→③→④→⑤→⑦→⑧で、所要日数は21日である。","イベント⑥の最早開始時刻と最遅完了時刻は同じで、15日である。","作業Eのトータルフロートは1日、フリーフロートは0日である。","作業Eの所要時間を1日短縮しても、工期は1日短縮されない。"],"a":[2],"m":"exact","n":"","e":"最早時刻は②5、③5、④11、⑤11、⑥14、⑦15、⑧21日。イベント⑥の最早開始時刻は14日、最遅完了時刻は15日で同じではない。","f":["img/H30B04_f0.png"],"o":["img/H30B04_o0.png"],"g":0,"cat":"B施工管理","neg":true},{"id":"H30B05","y":"H30","p":"B","no":5,"s":"品質管理に関する記述のうち、適当でないものはどれか。","c":["品質管理のためのQC工程図には、工事の作業フローに沿って、管理項目、管理水準、管理方法等を記載する。","PDCAサイクルは、計画→実施→チェック→処理→計画のサイクルを繰り返すことであり、品質の改善に有効である。","品質管理として行う行為には、搬入材料の検査、配管の水圧試験、風量調整の確認等がある。","品質管理のメリットは品質の向上や均一化であり、デメリットは工事費の増加である。"],"a":[4],"m":"exact","n":"","e":"品質管理は手直しの減少などにより工事費の低減にもつながり、工事費の増加はデメリットではない。","f":[],"o":["img/H30B05_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"H30B06","y":"H30","p":"B","no":6,"s":"品質管理に用いられる「統計的手法の名称」と「特徴」の組合せとして、適当でないものはどれか。\n(統計的手法の名称) (特 徴)","c":["特性要因図 各不良項目の件数の全体不良件数に占める割合がわかる。","ヒストグラム データの全体分布やばらつきの状況がわかる。","散布図 プロットされた点の分布の状態により2つの特性の相関関係がわかる。","管理図 データの時間的変化や異常なばらつきがわかる。"],"a":[1],"m":"exact","n":"","e":"各不良項目の件数の割合がわかるのはパレート図。特性要因図は特性と要因の関係を体系的に整理した図。","f":[],"o":["img/H30B06_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"H30B07","y":"H30","p":"B","no":7,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["ZD（ゼロ・ディフェクト）運動とは、作業方法のマニュアル化と作業員に対する監視を徹底することにより、労働災害ゼロを目指す運動である。","不安全行動とは、手間や労力、時間やコストを省くことを優先し、労働者本人又は関係者の安全を阻害する可能性のある行動を意図的に行う行為をいう。","指差呼称とは、対象を指で差し、声に出して確認する行動のことをいい、意識のレベルを上げて緊張感、集中力を高める効果をねらった行為である。","4S活動とは、整理、整頓、清掃、清潔のことをいい、安全で健康な職場づくりと生産性の向上を目指す活動である。"],"a":[1],"m":"exact","n":"","e":"ZD運動は、作業者一人ひとりの自主的な工夫・注意により欠陥（災害）ゼロを目指す運動。監視の徹底による運動ではない。","f":[],"o":["img/H30B07_o0.png"],"g":44,"cat":"B施工管理","neg":true},{"id":"H30B08","y":"H30","p":"B","no":8,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["労働災害の発生状況を評価する指標には、被災者数の他に、度数率、強度率、年千人率がある。","労働災害による労働者の休業が4日に満たない場合は、事業者は、労働者死傷病報告書を労働基準監督署に四半期最後の月の翌月末日までに提出する。","ツールボックスミーティングは、危険予知活動の一環として、作業関係者が行う短時間のミーティングで、作業が長期間継続する場合は1週間に1回程度行われる。","ヒヤリハット活動とは、仕事中に怪我をする危険を感じてヒヤリとしたことなどを報告させることにより、危険有害要因を把握し改善を図っていく活動である。"],"a":[3],"m":"exact","n":"","e":"ツールボックスミーティングは、毎日の作業開始前などに行う短時間のミーティング。週1回程度ではない。","f":[],"o":["img/H30B08_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"H30B09","y":"H30","p":"B","no":9,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["パッケージ形空気調和機の屋外機の設置場所に季節風が吹き付ける場合、屋外機は、原則として、空気の吸込み面や吹出し面が季節風の方向に正対しないように設置する。","3階建ての建築物の屋上に2台の冷却塔を近接して設置する場合、2台の冷却塔は、原則として、ルーバー面の高さの2倍以上離して設置する。","呼び番号3の送風機を天井吊りとする場合、送風機は形鋼をかご型に溶接した架台上に防振材を介して設置し、当該架台は建築構造体に固定する。","大型ボイラーをコンクリート基礎に据え付ける場合、ボイラーは、基礎のコンクリートを打設後、5日が経過してから据え付ける。"],"a":[4],"m":"exact","n":"","e":"ボイラー等の機器は、基礎コンクリート打設後10日以上養生してから据え付ける。","f":[],"o":["img/H30B09_o0.png"],"g":45,"cat":"B施工","neg":true},{"id":"H30B10","y":"H30","p":"B","no":10,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["ゲージ圧力が0.2MPaを超える温水ボイラーを設置する場合、安全弁その他の附属品の検査及び取扱いに支障がない場合を除き、ボイラーの最上部からボイラーの上部にある構造物までの距離は、0.8m以上とする。","軸封部がメカニカルシール方式の冷却水ポンプをコンクリート基礎上に設置する場合、コンクリート基礎表面に排水目皿及び当該目皿からの排水管を設けないこととしてもよい。","機器を吊り上げる場合、ワイヤーロープの吊り角度を大きくすると、ワイヤーロープに掛かる張力も大きくなる。","冷凍機の設置において、アンカーボルト選定のための耐震計算をする場合、設計用地震力は、一般的に、機器の重心に作用するものとして計算を行う。"],"a":[1],"m":"exact","n":"","e":"ボイラー最上部から上部構造物までの距離は1.2m以上。","f":[],"o":["img/H30B10_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H30B11","y":"H30","p":"B","no":11,"s":"配管及び配管付属品の施工に関する記述のうち、適当でないものはどれか。","c":["鋼管のねじ接合において、転造ねじの場合のねじ部強度は、鋼管本体の強度とほぼ同程度となる。","青銅製の仕切弁の最高許容圧力は、管内の流体が脈動水の場合と静流水の場合とで同じである。","ステンレス鋼管の溶接接合は、管内にアルゴンガス又は窒素ガスを充満させてから、TIG溶接により行う。","弁棒が弁体の中心にある中心型のバタフライ弁は、冷水温水切替え弁などの全閉全開用に適している。"],"a":[2],"m":"exact","n":"","e":"脈動水（ウォーターハンマー等を伴う）の場合の最高許容圧力は、静流水の場合より「低い」。","f":[],"o":["img/H30B11_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H30B12","y":"H30","p":"B","no":12,"s":"配管及び配管付属品の施工に関する記述のうち、適当でないものはどれか。","c":["複式伸縮管継手を使用する場合は、当該伸縮管継手が伸縮を吸収する配管の両端を固定し、伸縮管継手本体は固定しない。","硬質塩化ビニルライニング鋼管のねじ切りの際のリーマ掛けは、ライニング厚の1/2程度とする。","伸縮する立て管を振れ止め支持する場合は、支持点で管が上下にスライドできるようにする。","揚水管の試験圧力は、揚水ポンプの全揚程の2倍とするが、0.75MPaに満たない場合は0.75MPaとする。"],"a":[1],"m":"exact","n":"","e":"複式伸縮管継手は継手本体を固定し、両側の配管にガイドを設ける。","f":[],"o":["img/H30B12_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H30B13","y":"H30","p":"B","no":13,"s":"ダクト及びダクト付属品の施工に関する記述のうち、適当でないものはどれか。","c":["フランジ用ガスケットの厚さは、アングルフランジ工法ダクトでは3mm以上、コーナーボルト工法ダクトでは5mm以上を標準とする。","コーナーボルト工法ダクトのフランジ用ガスケットは、フランジ幅の中心線より内側に貼り付け、コーナー部でオーバーラップさせる。","コーナーボルト工法ダクトのフランジのコーナー部では、コーナー金具まわりと四隅のダクト内側のシールを確実に行う。","コーナーボルト工法ダクトの角部のはぜは、アングルフランジ工法ダクトの場合と同じ構造としてよい。"],"a":[2],"m":"exact","n":"","e":"コーナーボルト工法のガスケットはフランジ幅の中心線より内側に貼り付け、継目はコーナー部を避けて重ね合わせる。","f":[],"o":["img/H30B13_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H30B14","y":"H30","p":"B","no":14,"s":"ダクト及びダクト付属品の施工に関する記述のうち、適当でないものはどれか。","c":["シーリングディフューザー形吹出口は、最大拡散半径が重ならないように配置する。","シーリングディフューザー形吹出口では、一般的に、中コーンが下にあるとき、気流は天井面に沿って水平に拡散する。","スパイラルダクトの接続には、一般的に、小口径には差込み継手、大口径にはフランジ継手が使用される。","送風機の吐出し口直後に風量調節ダンパーを設ける場合は、風量調節ダンパーの軸が送風機羽根車の軸に対し直角となるようにする。"],"a":[1],"m":"exact","n":"","e":"シーリングディフューザーは「最小」拡散半径が重ならないように配置する。最大拡散半径は重なってもよい。","f":[],"o":["img/H30B14_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H30B15","y":"H30","p":"B","no":15,"s":"保温、保冷、塗装に関する記述のうち、適当でないものはどれか。","c":["ポリスチレンフォーム保温材は、優れた独立気泡体を有し、吸水、吸湿による断熱性能の低下が小さい。","立て管の外装用テープは、ずれを少なくするために、一般的に、立て管の上方より下向きに巻き進める。","亜鉛めっき面に合成樹脂調合ペイント塗りを施す場合、中塗り及び上塗りの塗装工程における放置時間及び最終養生時間は、一般的に、気温20℃では両工程とも24時間以上とする。","保温帯を二層以上重ねて所要の厚さにする場合は、保温帯の各層をそれぞれ鉄線で巻き締める。"],"a":[2],"m":"exact","n":"","e":"立て管の外装用テープは、ずれを防ぐため下方から上向きに巻き上げる。","f":[],"o":["img/H30B15_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H30B16","y":"H30","p":"B","no":16,"s":"配管用炭素鋼鋼管（白管）の管内の水の性状に関する記述のうち、管の腐食速度が増大する要因として、適当でないものはどれか。","c":["pHの値が中性域よりも高pH側である。","密閉系の配管で水温が高い。","溶存酸素濃度が高い。","硬度が低い軟水である。"],"a":[1],"m":"exact","n":"","e":"白管の腐食はpHが低い（酸性）ほど増大する。高pH側は腐食速度が増大する要因ではない。","f":[],"o":["img/H30B16_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H30B17","y":"H30","p":"B","no":17,"s":"騒音・振動の「現象」、「発生部位」及び「原因」の組合せとして、適当でないものはどれか。\n(現 象) (発生部位) (原 因)","c":["振動 遠心ポンプ キャビテーション","流水音 給水管 水圧が低い","流水音 排水管 流水の乱れ","ウォーターハンマー 揚水管 水圧が高い"],"a":[2],"m":"exact","n":"","e":"給水管の流水音は、水圧が「高く」流速が大きいことが原因。水圧が低いことではない。","f":[],"o":["img/H30B17_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"H30B18","y":"H30","p":"B","no":18,"s":"建設工事において、統括安全衛生責任者が統括管理しなければならない事項として、「労働安全衛生法」上、定められていないものはどれか。","c":["協議組織の設置及び運営","関係請負人が行う労働者の安全又は衛生のための教育に対する指導及び援助","労働災害の原因の調査及び再発防止対策","作業間の連絡及び調整"],"a":[3],"m":"exact","n":"","e":"統括安全衛生責任者の統括管理事項は、協議組織の設置・運営、作業間の連絡調整、作業場所の巡視、教育の指導援助等。労働災害の原因調査・再発防止対策は定められていない。","f":[],"o":["img/H30B18_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"H30B19","y":"H30","p":"B","no":19,"s":"建設現場における安全管理に関する文中、 内に当てはまる、「労働安全衛生法」上に定められた数値の組合せとして、正しいものはどれか。事業者は、つり上げ荷重が Ａ トン未満の移動式クレーンの運転（道路上を走行させる運転を除く。）の業務、又は、つり上げ荷重が Ｂ トン未満の移動式クレーンの玉掛けの業務を作業員にさせる場合は、当該業務に関する安全又は衛生のための特別の教育を行わなければならない。\n(Ａ) (Ｂ)","c":["1 1","1 5","5 1","5 5"],"a":[1],"m":"exact","n":"","e":"特別教育が必要なのは、つり上げ荷重1t未満の移動式クレーンの運転と、1t未満のクレーン等の玉掛け業務。","f":[],"o":["img/H30B19_o0.png"],"g":null,"cat":"B法規","neg":false},{"id":"H30B20","y":"H30","p":"B","no":20,"s":"次の記述のうち、「労働基準法」上、誤っているものはどれか。","c":["使用者は、満18歳に満たない者をクレーンの玉掛けの業務に就かせてはならない。","使用者は、労働者名簿、賃金台帳及び雇入れ、解雇、災害補償、賃金その他労働関係に関する重要な書類を3年間保存しなければならない。","常時20人未満の労働者を使用する使用者は、就業規則を行政官庁に届け出なくてよい。","使用者の責に帰すべき事由による休業の場合において、使用者は、休業期間中当該労働者に、その平均賃金の100分の60以上の手当を支払わなければならない。"],"a":[3],"m":"exact","n":"","e":"就業規則の作成・届出義務は、常時「10人」以上の労働者を使用する使用者。20人未満ではない。","f":[],"o":["img/H30B20_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"H30B21","y":"H30","p":"B","no":21,"s":"次の記述のうち、「建築基準法」上、誤っているものはどれか。","c":["エレベーターの昇降路の床面積は、容積率算定の延べ面積に算入しない。","映画館から劇場へ用途変更する場合は、確認申請書を提出しなくてよい。","3階建ての学校は、準耐火構造の木造建築物にすることができない。","延べ面積90m²の戸建て住宅を寄宿舎に用途変更する場合は、確認申請書を提出しなくてよい。"],"a":[3],"m":"exact","n":"","e":"3階建ての学校も、一定の基準（1時間準耐火構造等）を満たせば準耐火構造の木造建築物とすることができる。","f":[],"o":["img/H30B21_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"H30B22","y":"H30","p":"B","no":22,"s":"建築設備に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["給水管が防火区画を貫通する場合、貫通する部分及び貫通する部分からそれぞれ両側1m以内の距離にある部分を不燃材料で造る。","雨水排水立て管を除く雨水排水管を汚水排水のための配管設備に連結する場合、当該雨水排水管に排水トラップを設けてはならない。","延べ面積が3,000m²を超える建築物の屋内に設ける換気設備のダクトは、防火上支障がないものとして国土交通大臣が定める部分を除き、不燃材料で造らなければならない。","地上11階以上の建築物の屋上に2台の冷却塔を設置する場合、一の冷却塔から他の冷却塔までの距離を2m以上とする。"],"a":[2],"m":"exact","n":"","e":"雨水排水管（立て管を除く）を汚水排水の配管設備に連結する場合は、雨水排水管に排水トラップを設ける。","f":[],"o":["img/H30B22_o0.png"],"g":46,"cat":"B法規","neg":true},{"id":"H30B23","y":"H30","p":"B","no":23,"s":"技術者制度に関する記述のうち、「建設業法」上、誤っているものはどれか。","c":["管工事業は指定建設業であるため、管工事の監理技術者は、請負代金の額が4,500万円以上の発注者から直接請け負った管工事に関し2年以上指導監督的な実務の経験を有する者でなければならない。","公共性のある施設又は多数の者が利用する施設に関する重要な建設工事で、専任の者でなければならない監理技術者は、監理技術者資格者証の交付を受けている者であって、監理技術者講習を過去5年以内に受講した者でなければならない。","公共性のある施設又は多数の者が利用する施設に関する重要な建設工事で、管工事において主任技術者又は監理技術者を工事現場ごとに専任の者としなければならないのは、工事1件の請負代金の額が3,500万円以上の場合である。","発注者から直接請け負った管工事において、主任技術者を置き工事を開始した後、工事途中で下請契約の請負代金の総額が4,000万円以上となった場合、主任技術者に替えて監理技術者を置かなければならない。"],"a":[1],"m":"exact","n":"","e":"指定建設業である管工事業の監理技術者は1級管工事施工管理技士等又は大臣認定者に限られ、指導監督的実務経験だけでは監理技術者になれない。","f":[],"o":["img/H30B23_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"H30B24","y":"H30","p":"B","no":24,"s":"元請負人の義務に関する記述のうち、「建設業法」上、誤っているものはどれか。","c":["元請負人は、その請け負った建設工事を施工するために必要な工程の細目、作業方法その他元請負人において定めるべき事項を定めようとするときは、あらかじめ、下請負人の意見をきかなければならない。","元請負人は、請負代金の出来形部分に対する支払又は工事完成後における支払を受けたときは、当該支払の対象となった建設工事を施工した下請負人に対して、相応する下請代金を、当該支払を受けた日から1か月以内で、かつ、できる限り短い期間内に支払わなければならない。","元請負人は、前払金の支払を受けたときは、下請負人に対して、資材の購入、労働者の募集その他建設工事の着手に必要な費用を前払金として支払うよう適切な配慮をしなければならない。","元請負人は、下請負人からその請け負った建設工事が完成した旨の通知を受けたときは、当該通知を受けた日から1か月以内で、かつ、できる限り短い期間内に、その完成を確認するための検査を完了しなければならない。"],"a":[4],"m":"exact","n":"","e":"下請工事の完成通知を受けた元請負人は、通知を受けた日から「20日以内」で、できる限り短い期間内に検査を完了しなければならない。","f":[],"o":["img/H30B24_o0.png"],"g":5,"cat":"B法規","neg":true},{"id":"H30B25","y":"H30","p":"B","no":25,"s":"スプリンクラー設備に関する記述のうち、「消防法」上、誤っているものはどれか。\nただし、特定施設水道連結型スプリンクラー設備は除く。","c":["消防ポンプ自動車が容易に接近することのできる位置に、双口形の送水口を設置する。","加圧送水装置には、スプリンクラーヘッドにおける放水圧力が1.5MPaを超えない措置を講じる。","閉鎖型スプリンクラーヘッドを用いるスプリンクラー設備の配管の末端には、末端試験弁を設ける。","予作動式は、スプリンクラーヘッドが開放されてから放水までの時間を1分以内とする。"],"a":[2],"m":"exact","n":"","e":"スプリンクラーの加圧送水装置は、ヘッドの放水圧力が1MPaを超えない措置を講じる。","f":[],"o":["img/H30B25_o0.png"],"g":47,"cat":"B法規","neg":true},{"id":"H30B26","y":"H30","p":"B","no":26,"s":"1号屋内消火栓設備のポンプを用いる加圧送水装置に関する記述のうち、「消防法」上、誤っているものはどれか。","c":["ポンプは、直接操作による停止又は消火栓箱の直近に設けられた操作部からの遠隔操作による停止ができるものとする。","ポンプの原動機は、電動機に限る。","水源水位がポンプより低い場合、専用の呼水槽を設ける。","ポンプの始動を明示する表示灯は、赤色とし、消火栓箱の内部又はその直近に設ける。"],"a":[1],"m":"exact","n":"","e":"屋内消火栓のポンプは、直接操作によってのみ停止できるものとし、遠隔操作による停止はできない。","f":[],"o":["img/H30B26_o0.png"],"g":17,"cat":"B法規","neg":true},{"id":"H30B27","y":"H30","p":"B","no":27,"s":"分別解体等に関する記述のうち、「建設工事に係る資材の再資源化等に関する法律」上、誤っているものはどれか。","c":["分別解体等に伴って生じた特定建設資材廃棄物である木材について、工事現場から50km以内に再資源化をするための施設がない場合は、再資源化に代えて縮減をすれば足りる。","特定建設資材を用いた建築物の解体工事で、当該解体工事に係る部分の床面積の合計が100m²以下の場合は、分別解体をしなくてもよい。","対象建設工事の元請業者は、当該工事に係る特定建設資材廃棄物の再資源化等が完了したときは、その旨を当該工事の発注者に書面で報告するとともに、当該再資源化等の実施状況に関する記録を作成し、これを保存しなければならない。","対象建設工事の請負契約の当事者は、分別解体等の方法、解体工事に要する費用その他の事項を書面に記載し、相互に交付しなければならない。"],"a":[2],"m":"exact","n":"","e":"特定建設資材を用いた建築物の解体工事は、床面積の合計80m²以上が分別解体等の対象。100m²以下でも80m²以上なら対象。","f":[],"o":["img/H30B27_o0.png"],"g":48,"cat":"B法規","neg":true},{"id":"H30B28","y":"H30","p":"B","no":28,"s":"「高齢者、障害者等の移動等の円滑化の促進に関する法律」に関する文中、 内に当てはまる数値と用語の組合せとして、正しいものはどれか。建築主等は、床面積の合計が Ａ m²以上の特別特定建築物に該当する図書館の建築をしようとするときは、当該建築物を、 Ｂ に適合させなければならない。\n(Ａ) (Ｂ)","c":["1,000 建築物移動等円滑化基準","1,000 建築物移動等円滑化誘導基準","2,000 建築物移動等円滑化基準","2,000 建築物移動等円滑化誘導基準"],"a":[3],"m":"exact","n":"","e":"床面積2,000m²以上の特別特定建築物（図書館等）の建築主等は、建築物移動等円滑化基準に適合させなければならない。","f":[],"o":["img/H30B28_o0.png"],"g":null,"cat":"B法規","neg":false},{"id":"H30B29","y":"H30","p":"B","no":29,"s":"産業廃棄物の処理に関する記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","c":["事業者が自らその産業廃棄物を産業廃棄物処理施設へ運搬する場合においても、産業廃棄物運搬の業の許可を受けなければならない。","もっぱら再生利用の目的となる産業廃棄物の品目のみの収集運搬を行う者は、産業廃棄物収集運搬業の許可を受ける必要がない。","石綿建材除去事業において使用されたプラスチックシートは、石綿が付着している恐れがあるため、特別管理産業廃棄物として処分する。","事業者は、排出した産業廃棄物の運搬又は処分を委託する場合、電子情報処理組織を使用して、産業廃棄物の種類、数量、受託者の氏名等を情報処理センターに登録したときは、産業廃棄物管理票を交付しなくてもよい。"],"a":[1],"m":"exact","n":"","e":"事業者が自ら運搬する場合は、産業廃棄物運搬業の許可は不要。","f":[],"o":["img/H30B29_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R1A01","y":"R1","p":"A","no":1,"s":"日射に関する記述のうち、適当でないものはどれか。","c":["日射の大気透過率は、大気中に含まれる水蒸気の量に影響される。","天空日射とは、大気を通過して直接地表に到達する日射をいう。","日射のエネルギーは、紫外線部よりも赤外線部及び可視線部に多く含まれている。","太陽定数とは、大気上端で、太陽光線に対して垂直な面で受けた単位面積当たりの太陽放射エネルギーの強さをいう。"],"a":[2],"m":"exact","n":"","e":"大気を通過して直接地表に到達する日射は直達日射。天空日射は大気中で散乱・反射して天空の全方向から届く日射。","f":[],"o":["img/R1A01_o0.png"],"g":18,"cat":"A基礎・電気・建築","neg":true},{"id":"R1A02","y":"R1","p":"A","no":2,"s":"室内の空気環境に関する記述のうち、適当でないものはどれか。","c":["燃焼において、酸素濃度が18％近くに低下すると不完全燃焼が著しくなり、一酸化炭素の発生量が多くなる。","ホルムアルデヒド及び揮発性有機化合物（VOCS）のうちのいくつかは、発がん性物質である可能性が高いとされている。","浮遊粉じんは、在室者の活動により、衣類の繊維、ほこり等が原因で発生し、その量は空気の乾燥によって減少する傾向がある。","臭気は、臭気強度や臭気指数で表され、空気汚染を知る指標とされている。"],"a":[3],"m":"exact","n":"","e":"浮遊粉じんは空気が乾燥すると舞い上がりやすく、増加する傾向にある。","f":[],"o":["img/R1A02_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R1A03","y":"R1","p":"A","no":3,"s":"排水の水質に関する記述のうち、適当でないものはどれか。","c":["CODは、主に水中に含まれる有機物を酸化剤で化学的に酸化したときに消費される酸素量である。","DOは、水中に存在する有機物に含まれる炭素量のことで、水中の総炭素量から無機性炭素量を差し引いて求める。","大腸菌は、病原菌が存在する可能性を示す指標として用いられている。","SSは、浮遊物質量のことで、水の汚濁度を視覚的に判断する指標として使用される。"],"a":[2],"m":"exact","n":"","e":"記述はTOC（全有機炭素）。DOは水中に溶けている酸素の量（溶存酸素）。","f":[],"o":["img/R1A03_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R1A04","y":"R1","p":"A","no":4,"s":"流体に関する記述のうち、適当でないものはどれか。","c":["密閉容器内に静止している流体の一部に加えた圧力は、流体のすべての部分にそのまま伝わる。","管路に流れる液体の密度が小さいほど、管路閉止時の水撃圧は高くなる。","ニュートン流体とは、粘性による摩擦応力が速度勾配に比例する流体をいう。","レイノルズ数は、流体に作用する慣性力と粘性力の比で表される無次元数で、流体の平均流速に比例する。"],"a":[2],"m":"exact","n":"","e":"水撃圧Δp＝ρ・a・Δvで、液体の密度が「大きい」ほど高くなる。","f":[],"o":["img/R1A04_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R1A05","y":"R1","p":"A","no":5,"s":"管路内の流体に関する文中、 内に当てはまる用語の組合せとして、適当なものはどれか。流体が水平管路の直管部を流れている場合、 Ａ のために流体摩擦が働いて、圧力損失を生じる。この圧力損失は、ダルシー・ワイスバッハの式から、 Ｂ に反比例することが知られている。\n(Ａ) (Ｂ)","c":["慣性 管径","慣性 平均流速の2乗","粘性 管径","粘性 平均流速の2乗"],"a":[3],"m":"exact","n":"","e":"流体摩擦は粘性によって生じ、ダルシー・ワイスバッハの式では圧力損失は管径に反比例する（流速の2乗・管長に比例）。","f":[],"o":["img/R1A05_o0.png"],"g":8,"cat":"A基礎・電気・建築","neg":false},{"id":"R1A06","y":"R1","p":"A","no":6,"s":"非圧縮性の完全流体の定常流に関する文中、 内に当てはまる用語の組合せとして適当なものはどれか。流路断面積を連続的に変化させたくびれのある水平管路において、流路断面積が最小となる場所では、流体の Ａ が最大、 Ｂ が最小となる。\n(Ａ) (Ｂ)","c":["流速 静圧","流速 全圧","流量 静圧","流量 全圧"],"a":[1],"m":"exact","n":"","e":"ベルヌーイの定理より、断面積が最小の部分で流速が最大となり、その分静圧が最小となる（全圧は一定）。","f":[],"o":["img/R1A06_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R1A07","y":"R1","p":"A","no":7,"s":"熱に関する記述のうち、適当でないものはどれか。","c":["異なる2種類の金属線を両端で接合した回路において、2つの接合点に温度差を与えると、熱起電力が生じる。","エンタルピーは、物質の持つエネルギーの状態量の一つで、その物質の内部エネルギーに、外部への体積膨張仕事量を加えたもので表される。","融解熱、気化熱等のように、状態変化のみに費やされる熱を潜熱という。","気体の定圧比熱と定容比熱を比べると、常に定容比熱の方が大きい。"],"a":[4],"m":"exact","n":"","e":"気体の比熱は、常に定圧比熱の方が定容比熱より大きい。","f":[],"o":["img/R1A07_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"i
