d":"R1A08","y":"R1","p":"A","no":8,"s":"燃焼に関する記述のうち、適当でないものはどれか。","c":["ボイラーの燃焼において、空気過剰率が大きいほど熱損失は小さくなる。","燃焼ガス中の窒素酸化物の量は、低温燃焼時よりも高温燃焼時の方が多い。","不完全燃焼時における燃焼ガスには、二酸化炭素、水蒸気、窒素酸化物のほか、一酸化炭素等が含まれている。","低発熱量とは、高発熱量から潜熱分を差し引いた熱量をいう。"],"a":[1],"m":"exact","n":"","e":"空気過剰率が大きすぎると、排ガスが持ち去る熱が増え、熱損失は「大きく」なる。","f":[],"o":["img/R1A08_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R1A09","y":"R1","p":"A","no":9,"s":"湿り空気に関する記述のうち、適当でないものはどれか。","c":["飽和湿り空気の温度を上げると、相対湿度は低下する。","飽和湿り空気の温度を下げると、絶対湿度は低下する。","湿り空気を蒸気スプレーで加湿すると、絶対湿度と相対湿度はともに上昇するが、湿球温度は変わらない。","湿り空気をその露点温度より高い温度の冷却コイルで冷却しても、絶対湿度は変わらない。"],"a":[3],"m":"exact","n":"","e":"蒸気スプレーによる加湿では、絶対湿度・相対湿度とともに湿球温度（比エンタルピー）も上昇する。","f":[],"o":["img/R1A09_o0.png"],"g":49,"cat":"A基礎・電気・建築","neg":true},{"id":"R1A10","y":"R1","p":"A","no":10,"s":"金属材料の腐食に関する記述のうち、適当でないものはどれか。","c":["異種金属の接触腐食は、貴な金属と卑な金属を水中で組み合わせた場合、それぞれの電極電位差によって卑な金属が腐食する現象である。","水中における炭素鋼の腐食は、pH4以下では、ほとんど起こらない。","溶存酸素の供給が多い開放系配管における配管用炭素鋼鋼管の腐食速度は、水温の上昇とともに80℃位までは増加する。","配管用炭素鋼鋼管の腐食速度は、管内流速が速くなると増加するが、ある流速域では表面の不動態化が促進され腐食速度が減少する。"],"a":[2],"m":"exact","n":"","e":"pH4以下の酸性域では水素発生型の腐食となり、炭素鋼の腐食は激しく進行する。","f":[],"o":["img/R1A10_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R1A11","y":"R1","p":"A","no":11,"s":"三相誘導電動機に関する記述のうち、適当でないものはどれか。","c":["インバータによる運転は、電圧波形にひずみを含むため、インバータを用いない運転よりも電動機の温度が高くなる。","スターデルタ始動方式は、全電圧直入始動方式と比較して、始動電流を1/√3 に低減できる。","トップランナーモータは、銅損低減のため抵抗を低くしている場合があり、標準モータに比べて始動電流が大きくなる傾向がある。","インバータで運転すると、騒音が増加することがある。"],"a":[2],"m":"exact","n":"","e":"スターデルタ始動の始動電流（及び始動トルク）は、全電圧直入れ始動の1/3。1/√3ではない。","f":[],"o":["img/R1A11_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R1A12","y":"R1","p":"A","no":12,"s":"電気工事に関する記述のうち、適当でないものはどれか。","c":["乾燥した場所に敷設した合成樹脂製可とう管（PF管）内には、電線の接続部を設けてもよい。","使用電圧が300V以下の金属管には、D種接地工事を施す。","合成樹脂製可とう管（PF管）相互の接続は、直接接続としてはならない。","金属管相互は、堅ろうに、かつ、電気的に完全に接続しなければならない。"],"a":[1],"m":"exact","n":"","e":"電線の接続は、ボックス内等で行い、電線管（PF管）内に接続部を設けてはならない。","f":[],"o":["img/R1A12_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R1A13","y":"R1","p":"A","no":13,"s":"鉄筋コンクリート構造の建築物の鉄筋に関する記述のうち、適当でないものはどれか。","c":["柱、梁の鉄筋のかぶり厚さとは、コンクリート表面から最も外部側に位置する帯筋、あばら筋等の表面までの最短距離をいう。","耐力壁の鉄筋のかぶり厚さは、柱、梁のかぶり厚さと同じ厚さとする。","基礎の鉄筋のかぶり厚さは、捨てコンクリート部分を含めた厚さとする。","鉄筋の定着長さは、鉄筋径により異なる。"],"a":[3],"m":"exact","n":"","e":"基礎の鉄筋のかぶり厚さには、捨てコンクリート部分の厚さを含めない。","f":[],"o":["img/R1A13_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R1A14","y":"R1","p":"A","no":14,"s":"鉄筋コンクリート構造の建築物に関する記述のうち、適当でないものはどれか。","c":["構造部材に生じる応力は、軸方向応力、曲げモーメントの2種類である。","単位水量が多いほど、乾燥収縮によるひび割れが発生しやすい。","躯体を打設するコンクリートは、設計基準強度を割り増した強度とする。","水セメント比を小さくすると、コンクリートの耐久性は高くなる。"],"a":[1],"m":"exact","n":"","e":"構造部材に生じる応力は、軸方向力、せん断力、曲げモーメントの3種類。","f":[],"o":["img/R1A14_o0.png"],"g":50,"cat":"A基礎・電気・建築","neg":true},{"id":"R1A15","y":"R1","p":"A","no":15,"s":"空調熱源に関する記述のうち、適当でないものはどれか。","c":["二重効用の吸収冷凍機は、低温再生器と高温再生器を設けるため、必要とする加熱量が少なく、単効用に比べて成績係数が高い。","ロータリー冷凍機は、圧縮機の構造が簡単で、往復動冷凍機に比べて振動が小さい。","ヒートポンプ方式では、空気熱源方式に比べて水熱源方式の方が成績係数が高い。","同じ冷凍能力の吸収冷凍機と圧縮冷凍機では、必要となる冷却塔の冷却能力は同じである。"],"a":[4],"m":"exact","n":"","e":"吸収冷凍機は加熱量の分だけ排熱が多く、同じ冷凍能力でも冷却塔の冷却能力は圧縮冷凍機より大きく（約1.5〜2倍）必要。","f":[],"o":["img/R1A15_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R1A16","y":"R1","p":"A","no":16,"s":"空気調和方式に関する記述のうち、適当でないものはどれか。","c":["ペリメーター空気処理方式は、コールドドラフトの防止に有効である。","変風量単一ダクト方式は、定風量単一ダクト方式に比べて搬送動力を節減できる。","ファンコイルユニット・ダクト併用方式は、一般的に、全空気方式に比べて搬送動力が小さい。","床吹出し方式は、天井吹出し方式に比べて暖房運転時の居住域における垂直温度差が大きい。"],"a":[4],"m":"exact","n":"","e":"床吹出し方式は暖房時に足元から温風を供給するため、居住域の上下温度差は天井吹出しより「小さい」。","f":[],"o":["img/R1A16_o0.png"],"g":6,"cat":"A空調","neg":true},{"id":"R1A17","y":"R1","p":"A","no":17,"s":"図に示す暖房時の湿り空気線図において、空気調和機のコイルの加熱負荷量として、適当なものはどれか。\nただし、送風量は10,000m³/h、空気の密度は1.2kg/m³とする。","c":["28,700W","35,000W","42,000W","58,700W"],"a":[3],"m":"exact","n":"","e":"加熱負荷＝(10,000×1.2÷3,600)×(42.0－29.4)＝3.33×12.6≒42kW＝42,000W。","f":["img/R1A17_f0.png"],"o":["img/R1A17_o0.png"],"g":3,"cat":"A空調","neg":false},{"id":"R1A18","y":"R1","p":"A","no":18,"s":"熱負荷に関する記述のうち、適当でないものはどれか。","c":["サッシからの隙間風負荷は、導入外気量と排気量を調整し、室内を正圧に保つことが期待できる場合、見込まなくてよい。","暖房負荷計算では、一般的に、土間床、地中壁からの熱負荷は見込まなくてよい。","人体負荷は、室内温度が変わっても全発熱量はほとんど変わらないが、温度が上がるほど顕熱量が小さくなり、潜熱量が大きくなる。","外気に面したドアを有する空調対象室において、ドアからの隙間風を考慮する場合は、隙間風量を換気回数法により算定してよい。"],"a":[2],"m":"exact","n":"","e":"暖房負荷計算では、土間床や地中壁からの熱損失も見込む。","f":[],"o":["img/R1A18_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R1A19","y":"R1","p":"A","no":19,"s":"空気調和設備における自動制御に関する記述のうち、適当でないものはどれか。","c":["外気取入れダンパは、空気調和機の運転開始時に一定時間、閉とする。","外気取入れダンパ及び排気ダンパは、二酸化炭素濃度により比例制御とする。","冷却塔のファンは、外気温度により二位置制御とする。","外気冷房が有効な場合、外気取入れダンパ及び排気ダンパは、給気温度により比例制御とする。"],"a":[3],"m":"exact","n":"","e":"冷却塔のファンは冷却水温度（出口水温）により制御する。外気温度ではない。","f":[],"o":["img/R1A19_o0.png"],"g":19,"cat":"A空調","neg":true},{"id":"R1A20","y":"R1","p":"A","no":20,"s":"地域冷暖房に関する記述のうち、適当でないものはどれか。","c":["地域冷暖房の熱需要者側の建物は、床面積の利用率が低くなる。","地下鉄の排熱、ゴミ焼却熱等の未利用排熱を有効に利用することが可能である。","建物ごとに熱源機器を設置する必要がないため、火災や騒音のおそれが小さくなる。","地域冷暖房の社会的な利点には、大気汚染防止効果がある。"],"a":[1],"m":"exact","n":"","e":"地域冷暖房では需要者側の建物に熱源機械室が不要となり、床面積の利用率は「高く」なる。","f":[],"o":["img/R1A20_o0.png"],"g":51,"cat":"A空調","neg":true},{"id":"R1A21","y":"R1","p":"A","no":21,"s":"空気熱源ヒートポンプに関する記述のうち、適当でないものはどれか。","c":["ヒートポンプでは、外気温度が低くなると暖房能力が低下する。","ヒートポンプの成績係数は、圧縮仕事の駆動エネルギーが追加されるため、往復動冷凍機の成績係数より高くなる。","ヒートポンプの除霜運転は、一般的に、四方弁を冷房サイクルに切り替えて行う。","ヒートポンプでは、外気温度が低くなると蒸発圧力、蒸発温度が高くなる。"],"a":[4],"m":"exact","n":"","e":"外気温度が低くなると、空気熱源ヒートポンプの蒸発圧力・蒸発温度は「低く」なる。","f":[],"o":["img/R1A21_o0.png"],"g":52,"cat":"A空調","neg":true},{"id":"R1A22","y":"R1","p":"A","no":22,"s":"換気設備に関する記述のうち、適当でないものはどれか。","c":["集会所等の用途に供する特殊建築物の居室において、床面積の1/20以上の換気上有効な開口部を有する場合、換気設備を設けなくてもよい。","密閉式燃焼器具のみを設けた室には、火気を使用する室としての換気設備を設けなくてもよい。","発熱量の合計が6kW以下の火を使用する設備又は器具を設けた室（調理室を除く。）は、換気上有効な開口部を有する場合、火気を使用する室としての換気設備を設けなくてもよい。","自然換気設備の排気口は、給気口より高い位置に設け、常時解放された構造とし、かつ、排気筒の立ち上がり部分に直結する必要がある。"],"a":[1],"m":"exact","n":"","e":"集会場等の特殊建築物の居室は、開口部の大きさにかかわらず換気設備を設けなければならない。","f":[],"o":["img/R1A22_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R1A23","y":"R1","p":"A","no":23,"s":"換気上有効な開口部を有しない居室aと居室bの換気を1つの機械換気設備で行う場合に必要な最小の有効換気量V［m³/h］として、「建築基準法」上、正しいものはどれか。居室aの床面積は150m²、在室人員15人とする。居室bの床面積は200m²、在室人員15人とする。\nただし、居室a、bは特殊建築物の居室ではないものとする。","c":["600［m³/h］","700［m³/h］","900［m³/h］","1,050［m³/h］"],"a":[2],"m":"exact","n":"","e":"有効換気量V＝20Af/N（Nは1人当たり占有面積で10m²を上限）。居室a：150/15＝10 → 20×150/10＝300。居室b：200/15≒13.3→10 → 20×200/10＝400。合計700m³/h。","f":[],"o":["img/R1A23_o0.png"],"g":null,"cat":"A換気・排煙","neg":false},{"id":"R1A24","y":"R1","p":"A","no":24,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」上の「階及び全館避難安全検証法」及び「特殊な構造」によらないものとする。","c":["自然排煙口は、防煙区画部分の床面積の1/50以上の排煙上有効な開口面積を有する必要がある。","排煙立てダクト（メインダクト）の風量は、最遠の階から順次比較し、各階ごとの排煙風量のうち大きい方の風量とする。","防煙垂れ壁は、防火戸上部及び天井チャンバー方式を除き、天井面より40cm以上下方に突出した不燃材料で造られたものとする。","排煙機は、多翼形、軸流形等、一般の送風機に使用されている機種を用いるが、サージングやオーバーロードがないように排煙ダクト系に合う機種を選定する。"],"a":[3],"m":"exact","n":"","e":"防煙垂れ壁は、天井面から50cm以上下方に突出した不燃材料で造る。40cmでは不足。","f":[],"o":["img/R1A24_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R1A25","y":"R1","p":"A","no":25,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」上の「階及び全館避難安全検証法」及び「特殊な構造」によらないものとする。","c":["排煙立てダクト（メインダクト）には、原則として、防火ダンパを設けない。","2以上の防煙区画を対象とする場合の排煙風量は、1分間に120m³以上で、かつ、最大防煙区画の床面積1m²につき2m³以上とする。","電源を必要とする排煙設備の予備電源は、20分間継続して排煙設備を作動できる容量とし、かつ、常用の電源が断たれた場合に自動的に切り替えられるものとする。","同一防煙区画に複数の排煙口を設ける場合は、排煙口の1つを開放することで他の排煙口を同時に開放する連動機構付とする。"],"a":[3],"m":"exact","n":"","e":"排煙設備の予備電源は30分間継続して作動できる容量とする。","f":[],"o":["img/R1A25_o0.png"],"g":53,"cat":"A換気・排煙","neg":true},{"id":"R1A26","y":"R1","p":"A","no":26,"s":"上水道の配水管に関する記述のうち、適当でないものはどれか。","c":["給水管を分岐する箇所での配水管内の動水圧は、0.1MPaを標準とする。","配水管より分水栓又はサドル付分水栓によって給水管を取り出す場合は、他の給水装置の取付口から30cm以上離す。","配水管を他の地下埋設物と交差又は近接して敷設する場合は、少なくとも30cm以上の間隔を保つ。1 1","配水管を敷設する場合の配管の基礎は、軟弱層が深い場合、管径の1/3〜1/1程度（最小3 150cm）を砂又は良質土に置き換える。"],"a":[1],"m":"exact","n":"","e":"配水管の最小動水圧は0.15MPa以上を確保する。0.1MPaでは低い。","f":[],"o":["img/R1A26_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R1A27","y":"R1","p":"A","no":27,"s":"下水道の管きょに関する記述のうち、適当でないものはどれか。","c":["汚水管きょの流速は、計画下水量に対し0.6〜3.0m/sとする。","管きょの最小口径は、雨水管きょでは150mm、汚水管きょでは250mmを標準とする。","管きょ径が変化する場合の接続方法は、原則として水面接合又は管頂接合とする。","管きょに取付管を接続する場合、取付管の管底が本管の中心部より上方になるように取り付ける。"],"a":[2],"m":"exact","n":"","e":"管きょの最小口径は、汚水管きょ200mm、雨水管きょ（合流管きょ）250mm。記述は逆で数値も誤り。","f":[],"o":["img/R1A27_o0.png"],"g":54,"cat":"A衛生","neg":true},{"id":"R1A28","y":"R1","p":"A","no":28,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["受水タンクを設ける場合の高置タンクの容量は、一般的に、時間最大予想給水量に0.5〜1.0を乗じた量とする。","給水管の管径は、ヘーゼン・ウィリアムスの式を用いて算定することができる。","水道直結増圧ポンプの給水量は、時間平均予想給水量とする。","受水タンクには吸込みピットを設け、タンクの底面は、ピットに向かって1/100程度の勾配をとる。"],"a":[3],"m":"exact","n":"","e":"水道直結増圧ポンプの給水量は、瞬時最大予想給水量とする。","f":[],"o":["img/R1A28_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R1A29","y":"R1","p":"A","no":29,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["衛生器具の同時使用率は、器具数が増えるほど小さくなる。","一般水栓の最低必要吐出圧力は、30kPaである。","受水タンクの水抜き管は、間接排水として排水口空間を設ける。","揚水管の横引配管が長くなる場合、上層階で横引きをする方が水柱分離を生じにくい。"],"a":[4],"m":"exact","n":"","e":"揚水管の横引きは、停止時の負圧による水柱分離を防ぐため、低層階で行う。上層階で横引きすると水柱分離を生じやすい。","f":[],"o":["img/R1A29_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R1A30","y":"R1","p":"A","no":30,"s":"給湯設備に関する記述のうち、適当でないものはどれか。","c":["中央式給湯設備の熱源に使用する真空式温水発生機の運転には、有資格者を必要としない。","循環ポンプの揚程は、貯湯タンクから最高所の給湯栓までの配管の摩擦損失抵抗及び給湯栓の最低必要吐出圧力を考慮して求める。","循環式浴槽設備では、レジオネラ症防止対策のため、循環している浴槽水をシャワーや打たせ湯には使用しない。","瞬間湯沸器の1号は、流量1L/minの水の温度を25℃上昇させる能力を表しており、加熱能力は約1.74kWである。"],"a":[2],"m":"exact","n":"","e":"給湯循環ポンプの揚程は、循環管路（最長経路）の摩擦損失から求める。給湯栓の必要吐出圧力は考慮しない。","f":[],"o":["img/R1A30_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R1A31","y":"R1","p":"A","no":31,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["器具排水負荷単位法により通気管径を算定する場合の通気管長さは、通気管の実長に局部損失相当長を加算する。","結合通気管の管径は、通気立て管と排水立て管のうち、いずれか小さい方の管径以上とする。","建物の階層が多い場合の最下階の排水横枝管は、排水立て管に接続せず、単独で排水桝に接続する。","排水立て管に45度を超えるオフセットを設ける場合、オフセットの上部及び下部600mm以内には排水横枝管を接続しない。"],"a":[1],"m":"exact","n":"","e":"器具排水負荷単位法で通気管径を求める際の通気管長さは実長を用い、局部損失相当長は加算しない。","f":[],"o":["img/R1A31_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R1A32","y":"R1","p":"A","no":32,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["通気立て管の上部は、管径を縮小せずに延長し、大気に開放する。","トラップ桝は、50〜100mmの封水深を確保できるものとする。","管径150mmの排水横主管には、掃除口を30mごとに取り付ける。","特殊継手排水システムには、排水横枝管の流れを排水立て管内に円滑に流入させ、排水立て管内の流速を高める効果がある。"],"a":[4],"m":"exact","n":"","e":"特殊継手排水システムは、排水立て管内の流速を「減ずる」効果がある。","f":[],"o":["img/R1A32_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R1A33","y":"R1","p":"A","no":33,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["汚物ポンプは、固形物を多く含んだ水を排水するため、それに適したノンクロッグ形ポンプ、ボルテックス形ポンプ等を用いる。","排水ポンプの排水量は、排水量が一定に近い場合、毎時平均排水量の1.2〜1.5倍とする。","ブランチ間隔10以上を持つ排水立て管は、最上階から数えてブランチ間隔10以内に結合通気管を設ける。","飲料用貯水タンクに設ける管径50mmの間接排水管の排水口空間は、最小100mmとする。"],"a":[4],"m":"exact","n":"","e":"飲料用貯水タンクの間接排水管の排水口空間は、管径にかかわらず最小150mm。","f":[],"o":["img/R1A33_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R1A34","y":"R1","p":"A","no":34,"s":"不活性ガス消火設備に関する記述のうち、適当でないものはどれか。","c":["局所放出方式の不活性ガス消火設備は、常時人がいるおそれのある部分に設けることができる。","不活性ガス消火設備を設置する防護区画には、その放出された消火剤及び燃焼ガスを安全な場所に排出するための措置を講ずる。","不活性ガス消火設備を設置する防護区画が2以上あり、貯蔵容器を共用する場合は、防護区画ごとに選択弁を設けなければならない。","全域放出方式又は局所放出方式に附置する非常電源は、当該設備を有効に1時間作動できる容量以上とする。"],"a":[1],"m":"exact","n":"","e":"不活性ガス（二酸化炭素等）消火設備は、局所放出方式であっても常時人がいない部分に設ける。","f":[],"o":["img/R1A34_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R1A35","y":"R1","p":"A","no":35,"s":"ガス設備に関する記述のうち、適当でないものはどれか。","c":["都市ガスの種類A・B・Cにおける燃焼速度は、Aが最も速くB・Cの順で遅くなる。","液化天然ガスには、通常、一酸化炭素は含まれていない。","都市ガスのガス漏れ警報器は、天井面が0.6m以上の梁等により区画されている場合は、燃焼器等側に設置する。","液化石油ガス設備士でなければ、液化石油ガス配管の気密試験の作業に従事できない。"],"a":[1],"m":"exact","n":"","e":"都市ガスの燃焼速度の区分はA（遅い）・B（中間）・C（速い）で、Aが最も遅い。","f":[],"o":["img/R1A35_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R1A36","y":"R1","p":"A","no":36,"s":"JISに規定する「建築物の用途別による屎尿浄化槽の処理対象人員算定基準」に示されている、処理対象人員の算定式に関する記述のうち、適当でないものはどれか。","c":["事務所の処理対象人員は、延べ面積に、業務用厨房設備の有無により異なる定数を乗じて算定する。","病院の処理対象人員は、ベッド数を用いて算定する。","飲食店の処理対象人員は、延べ面積に定数を乗じて算定する。","戸建て住宅の処理対象人員は、住宅の延べ面積により3人又は6人に区分される。"],"a":[4],"m":"exact","n":"","e":"戸建て住宅の処理対象人員は、延べ面積130m²以下で5人、130m²を超えると7人。3人又は6人ではない。","f":[],"o":["img/R1A36_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R1A37","y":"R1","p":"A","no":37,"s":"合併処理浄化槽において、流入水が下表のとおりで、BOD除去率が95％の場合、放流水のBOD濃度として、適当なものはどれか。","c":["6.2mg/L","9.8mg/L","13.5mg/L","18.7mg/L"],"a":[2],"m":"exact","n":"","e":"流入水の平均BOD＝(50×260＋200×180)÷250＝196mg/L。除去率95％なので196×0.05≒9.8mg/L。","f":["img/R1A37_f0.png"],"o":["img/R1A37_o0.png"],"g":92,"cat":"A衛生","neg":false},{"id":"R1A38","y":"R1","p":"A","no":38,"s":"遠心ポンプに関する記述のうち、適当でないものはどれか。","c":["キャビテーションは、ポンプの羽根車入口部等で局部的に生じる場合があり、騒音や振動の原因となる。","同一配管系で、同じ特性の2台のポンプを直列運転して得られる揚程は、ポンプを単独運転した場合の揚程の2倍より小さくなる。","同一配管系で、同じ特性の2台のポンプを並列運転して得られる吐出量は、ポンプを単独運転した場合の吐出量の2倍になる。","ポンプの軸動力は回転速度の3乗に比例し、揚程は回転速度の2乗に比例する。"],"a":[3],"m":"exact","n":"","e":"同じ特性のポンプ2台を並列運転しても、配管抵抗が増すため吐出量は単独運転の2倍にはならない。","f":[],"o":["img/R1A38_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R1A39","y":"R1","p":"A","no":39,"s":"冷却塔に関する記述のうち適当でないものはどれか。","c":["密閉式冷却塔は、熱交換器などの空気抵抗が大きく、開放式冷却塔に比べて送風機動力が大きくなる。","開放式冷却塔で使用される送風機には、風量が大きく静圧が小さい軸流送風機が使用される。","冷却塔の微小水滴が、気流によって塔外へ飛散することをキャリーオーバーという。","冷却塔の冷却水入口温度と出口温度の差をアプローチという。"],"a":[4],"m":"exact","n":"","e":"冷却水入口温度と出口温度の差はレンジ。アプローチは冷却水出口温度と外気湿球温度の差。","f":[],"o":["img/R1A39_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R1A40","y":"R1","p":"A","no":40,"s":"ユニット形空気調和機に関する記述のうち、適当でないものはどれか。","c":["スクロールダンパ方式では、回転操作ハンドルにより送風機ケーシングのスクロールの形状を変えて送風特性を変化させる。","冷却コイルは、供給冷水温度は通常5〜7℃、コイル面通過風速は2.5m/s前後で選定される。","デシカント除湿ローターは、高温の排気と外気とを熱交換する際に外気の湿度を除去する。","加熱コイルには温水コイルと蒸気コイルがあり、温水コイル、蒸気コイルとも冷却コイルと兼用することができる。"],"a":[4],"m":"exact","n":"","e":"温水コイルは冷却コイルと兼用できるが、蒸気コイルは兼用できない。","f":[],"o":["img/R1A40_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R1A41","y":"R1","p":"A","no":41,"s":"配管材料に関する記述のうち、適当でないものはどれか。","c":["圧力配管用炭素鋼鋼管は、350℃程度以下の蒸気や高温水などの圧力の高い配管に使用される。","配管用炭素鋼鋼管の使用に適した流体の温度は、−15〜350℃程度である。","硬質ポリ塩化ビニル管（VP）の設計圧力の上限は、1.0MPaである。","水道用硬質塩化ビニルライニング鋼管の使用に適した流体の温度は、60℃以下である。"],"a":[4],"m":"exact","n":"","e":"水道用硬質塩化ビニルライニング鋼管の使用温度は40℃以下。","f":[],"o":["img/R1A41_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R1A42","y":"R1","p":"A","no":42,"s":"ダクト及びダクト付属品に関する記述のうち、適当でないものはどれか。","c":["低圧ダクトと高圧ダクトは、通常運転時におけるダクト内圧が正圧、負圧ともに300Paで区分される。","定風量ユニット（CAV）は、上流側の圧力が変動する場合でも、風量を一定に保つ機能を持っている。","変風量ユニット（VAV）は、外部からの制御信号により風量を変化させる機能を持っている。","材料、断面積、風量が同じ場合、円形ダクトの方が長方形ダクトより単位摩擦抵抗が小さい。"],"a":[1],"m":"exact","n":"","e":"低圧ダクトと高圧ダクトの区分は、常用圧力±500Pa。300Paではない。","f":[],"o":["img/R1A42_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R1A43","y":"R1","p":"A","no":43,"s":"「公共工事標準請負契約約款」に関する記述のうち、適当でないものはどれか。","c":["受注者は、工事現場内に搬入した材料を監督員の承諾を受けないで工事現場外に搬出してはならない。","受注者は、工事目的物及び工事材料等を設計図書に定めるところにより、火災保険、建設工事保険等に付さなければならない。","設計図書の表示が明確でない場合は、工事現場の状況を勘案し、受注者の判断で施工する。","約款及び設計図書に特別な定めがない仮設、施工方法等は、受注者がその責任において定める。"],"a":[3],"m":"exact","n":"","e":"設計図書の表示が明確でない場合は、受注者の判断で施工せず、監督員に確認を請求する。","f":[],"o":["img/R1A43_o0.png"],"g":55,"cat":"A機材・設計図書・約款","neg":true},{"id":"R1A44","y":"R1","p":"A","no":44,"s":"設計図書に記載する「ユニット形空気調和機」の仕様に関する文中、 内に当てはまる用語の組合せとして、適当なものはどれか。設計図書には、ユニット形空気調和機の形式、冷却能力、加熱能力、風量、 Ａ 、コイル通過風速、コイル列数、水量、冷水入口温度、温水入口温度、コイル出入口空気温度、加湿器形式、有効加湿量、電動機の電源種別、 Ｂ 、基礎形式等を記載する。\n(Ａ) (Ｂ)","c":["機外静圧 電動機出力","機外静圧 電流値","全静圧 電動機出力","全静圧 電流値"],"a":[1],"m":"exact","n":"","e":"設計図書のユニット形空気調和機の仕様には、機外静圧と電動機出力を記載する。","f":[],"o":["img/R1A44_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":false},{"id":"R1B01","y":"R1","p":"B","no":1,"s":"公共工事における施工計画等に関する記述のうち、適当でないものはどれか。","c":["現場代理人は、当該工事現場に常駐してその運営取り締まりを行うほか、請負代金の変更に関する権限も付与されている。","工事材料は、設計図書にその品質が明示されていない場合、中等の品質を有するものとする。","施工計画書には、総合施工計画書、工種別施工計画書があり、一般的に、仮設計画や施工要領書も含まれる。","総合工程表は、現場での仮設工事や機器製作手配から試運転調整、後片付け、清掃、検査までの全体の工程の大要を表すものである。"],"a":[1],"m":"exact","n":"","e":"現場代理人の権限からは、請負代金額の変更、請負代金の請求・受領等は除かれる。","f":[],"o":["img/R1B01_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R1B02","y":"R1","p":"B","no":2,"s":"工事の「申請・届出書類」と「提出先」の組合せとして、適当でないものはどれか。\n(申請・届出書類) (提出先)","c":["振動の特定建設作業実施届 市町村長","ばい煙発生施設設置届 労働基準監督署長","浄化槽設置届 都道府県知事(保健所を設置する市又は特別区にあっては、市長又は区長)","工事整備対象設備等着工届 消防長又は消防署長"],"a":[2],"m":"exact","n":"","e":"ばい煙発生施設設置届の提出先は都道府県知事（政令市長）。労働基準監督署長ではない。","f":[],"o":["img/R1B02_o0.png"],"g":11,"cat":"B施工管理","neg":true},{"id":"R1B03","y":"R1","p":"B","no":3,"s":"工程管理に関する記述のうち、適当でないものはどれか。","c":["工期の途中で工程計画をチェックし、現実の推移を入れて調整することをフォローアップという。","通常考えられる標準作業時間を限界まで短縮したときの作業時間を特急作業時間（クラッシュタイム）という。","配員計画において、割り付けた人員等の不均衡の平滑化を図っていくことを山崩しという。","クリティカルパスに次ぐ重要な経路で、工事の日程を短縮した場合、クリティカルパスになりやすい経路をインターフェアリングフロートという。"],"a":[4],"m":"exact","n":"","e":"記述は「準クリティカルパス」に近い説明。インターフェアリングフロートは、使用すると後続作業のトータルフロートに影響する余裕（TF－FF）。","f":[],"o":["img/R1B03_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R1B04","y":"R1","p":"B","no":4,"s":"図に示すネットワーク工程表に関する記述のうち、適当でないものはどれか。\nただし、図中のイベント間のA〜Iは作業内容、日数は作業日数を表す。","c":["クリティカルパスは、①→④→⑤→⑦→⑧で所要日数は15日である。","作業Cのトータルフロートは、2日である。","作業Dのフリーフロートは、3日である。","イベント④と⑤の最遅完了時刻と最早開始時刻は同じで、7日である。"],"a":[3],"m":"exact","n":"","e":"最早時刻は②2、③3、④7、⑤7、⑥8、⑦11、⑧15日。作業D（②→⑤、3日）は2＋3＝5日で終わり、⑤の最早時刻7日との差でフリーフロートは2日。","f":["img/R1B04_f0.png"],"o":["img/R1B04_o0.png"],"g":0,"cat":"B施工管理","neg":true},{"id":"R1B05","y":"R1","p":"B","no":5,"s":"品質管理で用いられる統計的手法（パレート図と特性要因図）に関する記述のうち、適当でないものはどれか。","c":["パレート図とは、関係のある2つの対になったデータの1つを縦軸に、他の1つを横軸にとり両者の対応する点をグラフにプロットした図である。","パレート図では、大きな不良項目、不良項目の順位、各不良項目が全体に占める割合等を読み取ることができる。","特性要因図とは、問題としている特性とそれに影響を与えると想定される要因の関係を魚の骨のような図に体系的に整理したものである。","特性要因図は、不良の原因と考えられる事項が整理されるため、関係者の意見を引き出したり、改善の手段を決めたりすることに有用である。"],"a":[1],"m":"exact","n":"","e":"記述は散布図。パレート図は不良項目等を件数の多い順に並べた棒グラフと累積比率の折れ線。","f":[],"o":["img/R1B05_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R1B06","y":"R1","p":"B","no":6,"s":"建設工事における品質管理に関する記述のうち、適当でないものはどれか。","c":["建設工事における品質管理とは、品質計画に基づき施工を実施し、品質を保証することである。","建設工事は現場ごとの一品生産であることから、統計的な手法による品質管理は有効とならない。","建設工事における品質管理の効果には、施工品質の向上、施工不良やクレームの減少等がある。","建設工事における日常の品質管理には、異常が出たときの処置や、問題解決と再発防止も含まれる。"],"a":[2],"m":"exact","n":"","e":"一品生産の建設工事でも、統計的手法による品質管理は有効。","f":[],"o":["img/R1B06_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R1B07","y":"R1","p":"B","no":7,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["重大災害とは、一時に3人以上の労働者が業務上死亡した災害をいい、労働者が負傷又はり病した災害は含まない。","建設工事において発生件数の多い労働災害には、墜落・転落災害、建設機械・クレーン災害、土砂崩壊・倒壊災害がある。","災害の発生頻度を示す度数率とは、延べ実労働時間100万時間当たりの労働災害による死傷者数である。","災害の規模及び程度を示す強度率とは、延べ実労働時間1,000時間当たりの労働災害による労働損失日数である。"],"a":[1],"m":"exact","n":"","e":"重大災害は、一時に3人以上の労働者が業務上死傷又はり病した災害で、負傷やり病も含む。","f":[],"o":["img/R1B07_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R1B08","y":"R1","p":"B","no":8,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["屋内でアーク溶接作業を行う場合は、粉じん障害を防止するため、全体換気装置による換気の実施又はこれと同等以上の措置を講じる。","導電体に囲まれた著しく狭隘な場所で、交流アーク溶接等の作業を行うときは、自動溶接の場合を除き、交流アーク溶接機用自動電撃防止装置は使用しない。","リスクアセスメントとは、潜在する労働災害のリスクを評価し、当該リスクの低減対策を実施することである。","リスクアセスメントの実施においては、個々の事業場における労働者の就業に係るすべての危険性又は有害性が対象となる。"],"a":[2],"m":"exact","n":"","e":"導電体に囲まれた著しく狭い場所で交流アーク溶接を行うときは、交流アーク溶接機用自動電撃防止装置を使用しなければならない。","f":[],"o":["img/R1B08_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R1B09","y":"R1","p":"B","no":9,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["1日の冷凍能力が法定50トン未満の冷凍機の据付けにおいて、冷凍機の操作盤前面の空間距離は、大型ボイラー等に面する場合を除き、1.2mとしてよい。","屋内設置の飲料用受水タンクの据付けにおいて、コンクリート基礎上の鋼製架台の高さを100mmとする場合、コンクリート基礎の高さは500mmとしてよい。","呼び番号3の送風機の設置において、4方向に振れ止めを設ける場合、天井から吊りボルトにより吊り下げてよい。","雑排水用水中モーターポンプ2台を排水槽内に設置する場合、ポンプケーシングの中心間距離は、ポンプケーシングの直径の3倍としてよい。"],"a":[3],"m":"exact","n":"","e":"呼び番号2以上の送風機は、天井吊りボルトで吊らず、形鋼製の架台等で堅固に支持する。","f":[],"o":["img/R1B09_o0.png"],"g":56,"cat":"B施工","neg":true},{"id":"R1B10","y":"R1","p":"B","no":10,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["貯湯タンクの据付けにおいては、周囲に450mm以上の保守・点検スペースを確保するほか、加熱コイルの引抜きスペース及び内部点検用マンホール部分のスペースを確保する。","防振基礎に設ける耐震ストッパは、地震時における機器の横移動の自由度を確保するため、機器本体との間の隙間を極力大きくとって取り付ける。","あと施工アンカーの設置においては、所定の許容引抜き力を確保するため、使用するドリルにせん孔する深さの位置をマーキングして所定のせん孔深さを確保する。","天井スラブの下面において、あと施工アンカーを上向きに設置する場合、接着系アンカーは使用しない。"],"a":[2],"m":"exact","n":"","e":"耐震ストッパーは、機器との隙間をできるだけ小さくして取り付ける。","f":[],"o":["img/R1B10_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R1B11","y":"R1","p":"B","no":11,"s":"空気調和設備の配管の施工に関する記述のうち、適当でないものはどれか。","c":["空気調和機への冷温水量を調整する混合型電動3方弁は、一般的に、空調機コイルからの還り管に設ける。","空気調和機への冷温水配管の接続では、往き管を空調機コイルの下部接続口に、還り管を上部接続口に接続する。","冷温水配管からの膨張管を開放形膨張タンクに接続する際は、接続口の直近にメンテナンス用バルブを設ける。","複数の空気調和機に冷温水を供給する冷温水配管において、各空気調和機を通る経路の摩擦損失抵抗を等しくする方式にリバースリターン方式がある。"],"a":[3],"m":"exact","n":"","e":"膨張管には弁を設けてはならない（閉止されると安全装置として機能しない）。","f":[],"o":["img/R1B11_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R1B12","y":"R1","p":"B","no":12,"s":"配管の施工に関する記述のうち、適当でないものはどれか。","c":["ポンプの振動が防振継手により配管と絶縁されている場合は、配管の防振支持の検討は不要である。","配管の防振支持に吊り形の防振ゴムを使用する場合は、防振ゴムに加わる力の方向が鉛直下向きとなるようにする。","強制循環式の下向き給湯配管では、給湯管、返湯管とも先下がりとし、勾配は1/200以上とする。","通気横走り管を通気立て管に接続する場合は、通気立て管に向かって上り勾配とし、配管途中で鳥居配管や逆鳥居配管とならないようにする。"],"a":[1],"m":"exact","n":"","e":"防振継手を設けても、配管を通じた振動・騒音の伝搬防止のため、配管の防振支持を検討する。","f":[],"o":["img/R1B12_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R1B13","y":"R1","p":"B","no":13,"s":"ダクト及びダクト付属品の施工に関する記述のうち、適当でないものはどれか。","c":["亜鉛鉄板製スパイラルダクトは、亜鉛鉄板をらせん状に甲はぜ機械掛けしたもので、高圧ダクトにも使用できる。","横走りの主ダクトに設ける振れ止め支持の支持間隔は12m以下とするが、梁貫通箇所等の振れを防止できる箇所は振れ止め支持とみなしてよい。","立てダクトの支持は1フロア1か所とするが、階高が4mを超える場合には中間に支持を追加する。","サプライチャンバーやレタンチャンバーの点検口の扉は、原則として、チャンバー内が正圧の場合は外開き、負圧の場合は内開きとする。"],"a":[4],"m":"exact","n":"","e":"点検口の扉は、圧力で閉まる方向に開くようにする。正圧なら内開き、負圧なら外開き。","f":[],"o":["img/R1B13_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R1B14","y":"R1","p":"B","no":14,"s":"ダクト及びダクト付属品の施工に関する記述のうち、適当でないものはどれか。","c":["長方形ダクトの分岐には、一般的に、割込み分岐に比べて加工が容易な片テーパ付き直付け分岐が用いられる。","直径500mm以下のスパイラルダクトの吊り金物には、棒鋼にかえて亜鉛鉄板を帯状に加工したバンドを使用してもよい。","長方形ダクトの直角エルボには案内羽根を設け、案内羽根の板厚はダクトの板厚と同じ厚さとする。","パネル形の排煙口は、排煙ダクトの気流方向とパネルの回転軸が平行となる向きに取り付ける。"],"a":[2],"m":"exact","n":"","e":"亜鉛鉄板の帯状バンドで吊ることができるのは小口径のスパイラルダクトに限られ、直径500mmでは棒鋼の吊りボルト等で吊る。","f":[],"o":["img/R1B14_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R1B15","y":"R1","p":"B","no":15,"s":"保温に関する記述のうち、適当でないものはどれか。","c":["ステンレス鋼板製（SUS444製を除く。）貯湯タンクを保温する際は、タンク本体にエポキシ系塗装等を施すことにより、タンク本体と保温材とを絶縁する。","ポリスチレンフォーム保温筒を冷水管の保温に使用する場合、保温筒1本につき2か所以上粘着テープ巻きを行うことにより、合わせ目の粘着テープ止めは省略できる。","保温を施した屋内露出配管が床を貫通する場合は、床面より少なくとも150mm程度の高さまでステンレス鋼帯製バンド等で被覆する。","JISに規定される40Kのグラスウール保温板は、32Kの保温板に比較して、熱伝導率（平均温度70℃）の上限値が小さい。"],"a":[2],"m":"exact","n":"","e":"冷水管のポリスチレンフォーム保温筒は防湿のため合わせ目をすべて粘着テープで止め、さらに1本につき2か所以上テープを巻く。合わせ目のテープ止めは省略できない。","f":[],"o":["img/R1B15_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R1B16","y":"R1","p":"B","no":16,"s":"防食方法等に関する記述のうち、適当でないものはどれか。","c":["溶融めっきは、金属を高温で溶融させた槽中に被処理材を浸漬したのち引き上げ、被処理材の表面に金属被覆を形成させる防食方法である。","金属溶射は、加熱溶融した金属を圧縮空気で噴射して、被処理材の表面に金属被覆を形成させる防食方法である。","配管の防食に使用される防食テープには、防食用ポリ塩化ビニル粘着テープ、ペトロラタム系防食テープ等がある。","電気防食法における外部電源方式では、直流電源装置から被防食体に防食電流が流れるように、直流電源装置のプラス端子に被防食体を接続する。"],"a":[4],"m":"exact","n":"","e":"外部電源方式では、被防食体を直流電源装置の「マイナス」端子に、陽極（電極）をプラス端子に接続する。","f":[],"o":["img/R1B16_o0.png"],"g":20,"cat":"B施工","neg":true},{"id":"R1B17","y":"R1","p":"B","no":17,"s":"機器の試運転に関する記述のうち、適当でないものはどれか。","c":["冷凍機の試運転では、冷水ポンプ、冷却水ポンプ及び冷却塔が起動した後に冷凍機が起動することを確認する。","ボイラーの試運転では、ボイラーを運転する前に、ボイラー給水ポンプ、オイルポンプ、給気ファン等の単体運転の確認を行う。","ポンプの試運転では、軸封部がメカニカルシール方式の場合、メカニカルシールから水滴が連続滴下していることを確認する。","空気調和機の試運転では、加湿器は、空気調和機の送風機とインターロックされていることを確認する。"],"a":[3],"m":"exact","n":"","e":"メカニカルシールは漏れがほとんどないことを確認する。水滴が連続滴下するのはグランドパッキン方式の場合。","f":[],"o":["img/R1B17_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R1B18","y":"R1","p":"B","no":18,"s":"建設現場における安全管理体制に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["特定元方事業者は、毎作業日に少なくとも1回、作業場所の巡視を行わなければならない。","元方安全衛生管理者は、その事業場に専属の者でなければならない。","事業場に安全委員会を設置した場合、当該安全委員会は毎月1回以上開催されなければならない。","特定元方事業者は、安全衛生責任者を選任して、統括安全衛生責任者との連絡等を行わせなければならない。"],"a":[4],"m":"exact","n":"","e":"安全衛生責任者を選任するのは関係請負人。特定元方事業者は統括安全衛生責任者を選任する。","f":[],"o":["img/R1B18_o0.png"],"g":21,"cat":"B法規","neg":true},{"id":"R1B19","y":"R1","p":"B","no":19,"s":"建設業の事業場において新たに職務につくこととなった職長等（作業主任者を除く。）に対し、事業者が行わなければならない安全又は衛生のための教育における教育事項のうち、「労働安全衛生法」上、規定されていないものはどれか。","c":["作業効率の確保及び品質管理の方法に関すること","労働者に対する指導又は監督の方法に関すること","法に定める事項の危険性又は有害性等の調査及びその結果に基づき講ずる措置に関すること","異常時等における措置に関すること"],"a":[1],"m":"exact","n":"","e":"職長教育の事項は、作業方法の決定・労働者の配置、指導・監督の方法、危険性等の調査と措置、異常時の措置など。作業効率や品質管理は規定されていない。","f":[],"o":["img/R1B19_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R1B20","y":"R1","p":"B","no":20,"s":"次の記述のうち、「労働基準法」上、誤っているものはどれか。","c":["使用者は、労働契約に附随して貯蓄の契約をさせ、又は貯蓄金を管理する契約をしてはならない。","使用者は、満20才に満たない者を使用する場合、その年齢を証明する戸籍証明書を事業場に備え付けなければならない。","使用者は、労働契約の不履行について違約金を定め、又は損害賠償額を予定する契約をしてはならない。","労働基準法で定める基準に達しない労働条件を定める労働契約は、その部分については無効であり、労働基準法に定められた基準が適用される。"],"a":[2],"m":"exact","n":"","e":"年齢証明書（戸籍証明書）を備え付ける必要があるのは、満「18才」に満たない者を使用する場合。","f":[],"o":["img/R1B20_o0.png"],"g":22,"cat":"B法規","neg":true},{"id":"R1B21","y":"R1","p":"B","no":21,"s":"建築の用語に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["地階の機械室で、水平投影面積の合計が建築物の建築面積の1/8以下のものは、当該建築物の階数に算入しない。","最下階の床は、主要構造部に該当しない。","小規模な会議室のみを設けた地階は、階数に算入しない。","建築物内の配管全体を更新する工事は、大規模の修繕に該当しない。"],"a":[3],"m":"exact","n":"","e":"階数に算入しないのは、地階の倉庫・機械室その他これらに類する部分で建築面積の1/8以下のもの。会議室は対象外。","f":[],"o":["img/R1B21_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R1B22","y":"R1","p":"B","no":22,"s":"建築設備に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["給水管が準耐火構造の防火区画を貫通する場合、当該管と防火区画との隙間をモルタルその他の不燃材料で埋めなければならない。","換気設備の風道が準耐火構造の防火区画を貫通する部分に近接する部分に防火ダンパを設ける場合、防火ダンパと防火区画の間の風道は、厚さ1.5mm以上の鉄板とする。","空気調和設備の風道は、火を使用する設備又は器具を設けた室の換気設備の風道その他これらに類するものに連結してはならない。1 1","排水槽の底の勾配は、吸い込みピットに向かって1/10以上1/5以下としなければならない。10 5"],"a":[4],"m":"exact","n":"","e":"排水槽の底の勾配は、吸込みピットに向かって1/15以上1/10以下とする。","f":[],"o":["img/R1B22_o0.png"],"g":23,"cat":"B法規","neg":true},{"id":"R1B23","y":"R1","p":"B","no":23,"s":"建築工事の請負契約に関する記述のうち、「建設業法」上、誤っているものはどれか。\nただし、電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法によらないものとする。","c":["共同住宅を新築する建設工事を請け負った建設業者は、あらかじめ発注者から書面による承諾を得た場合であっても、その工事を一括して他人に請け負わせてはならない。","注文者は、請負契約の締結後、自己の取引上の地位を不当に利用して、その注文した建設工事に使用する資材もしくは機械器具又はこれらの購入先を指定してはならない。","注文者は、工事現場に監督員を置く場合においては、当該監督員の行為についての請負人の注文者に対する意見の申し出の方法を、請負人と協議しなければならない。","発注者と請負人との請負契約において、工事内容を変更するときは、その変更の内容を書面に記載し、署名又は記名押印をして相互に交付しなければならない。"],"a":[3],"m":"exact","n":"","e":"注文者が監督員を置く場合は、その権限や意見の申出方法を書面で請負人に「通知」しなければならない。協議ではない。","f":[],"o":["img/R1B23_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R1B24","y":"R1","p":"B","no":24,"s":"建設工事における施工体制に関する記述のうち、「建設業法」上、誤っているものはどれか。","c":["施工体制台帳の作成を要する建設工事を請け負った建設業者は、当該建設工事における各下請負人の施工の分担関係を表示した施工体系図を作成しなければならない。","施工体制台帳の作成を要する建設工事を請け負った建設業者は、建設工事の目的物の引渡しをするまで、施工体系図を工事現場の見やすい場所に掲示しなければならない。","主任技術者の専任が必要な工事で、密接な関係のある二つの建設工事を同一の場所において施工する場合は、同一の専任の主任技術者とすることができる。","監理技術者は、工事現場における建設工事を適正に実施するため、当該建設工事の請負代金の管理及び当該建設工事の施工に従事する者の技術上の指導監督の職務を誠実に行わなければならない。"],"a":[4],"m":"exact","n":"","e":"監理技術者の職務は施工計画の作成、工程管理、品質管理その他の技術上の管理と技術上の指導監督。請負代金の管理は含まれない。","f":[],"o":["img/R1B24_o0.png"],"g":24,"cat":"B法規","neg":true},{"id":"R1B25","y":"R1","p":"B","no":25,"s":"1号消火栓を用いた屋内消火栓設備に関する記述のうち、「消防法」上、誤っているものはどれか。","c":["主配管のうち、立上がり管は呼び径で50mm以上のものとする。","加圧送水装置は、消火栓のノズルの先端における放水圧力が0.7MPaを超えるようにしなければならない。","配管の耐圧力は、当該配管に給水する加圧送水装置の締切圧力の1.5倍以上の水圧を加えた場合において、当該水圧に耐えるものとする。","水源の水量は、屋内消火栓の設置個数が最も多い階における当該設置個数（当該設置個数が2を超えるときは、2とする。）に2.6m³を乗じて得た量以上でなければならない。"],"a":[2],"m":"exact","n":"","e":"1号消火栓の放水圧力は0.17MPa以上0.7MPa以下。0.7MPaを超えないようにする。","f":[],"o":["img/R1B25_o0.png"],"g":25,"cat":"B法規","neg":true},{"id":"R1B26","y":"R1","p":"B","no":26,"s":"スプリンクラー設備に関する記述のうち、「消防法」上、誤っているものはどれか。\nただし、特定施設水道連結型スプリンクラー設備は除く。","c":["末端試験弁は、閉鎖型スプリンクラーヘッドの作動を試験するために設ける。","閉鎖型スプリンクラーヘッドのうち標準型ヘッドは、給排気用ダクト等でその幅又は奥行が1.2mを超えるものがある場合には、当該ダクト等の下面にも設けなければならない。","補助散水栓は、防火対象物の階ごとに、その階の未警戒となる各部分からホース接続口までの水平距離が15m以下となるように設けなければならない。","ポンプによる加圧送水装置には、締切運転時における水温上昇防止のための逃し配管を設ける。"],"a":[1],"m":"exact","n":"","e":"末端試験弁は、流水検知装置や圧力検知装置の作動を試験するために設ける。ヘッドの作動試験ではない。","f":[],"o":["img/R1B26_o0.png"],"g":57,"cat":"B法規","neg":true},{"id":"R1B27","y":"R1","p":"B","no":27,"s":"「建築物における衛生的環境の確保に関する法律」の特定建築物の維持管理に関して、空気調和設備を設けている場合の空気環境における管理項目とおおむね適合すべきとされる管理基準の組合せとして、誤っているものはどれか。\n(管理項目) (管理基準)","c":["一酸化炭素の含有率 10ppm以下","相対湿度 40％以上70％以下","気流 0.5m/s以下","ホルムアルデヒドの量 1.0mg/m³以下"],"a":[4],"m":"exact","n":"","e":"ホルムアルデヒドの基準は0.1mg/m³以下。","f":[],"o":["img/R1B27_o0.png"],"g":58,"cat":"B法規","neg":true},{"id":"R1B28","y":"R1","p":"B","no":28,"s":"分別解体等に関する記述のうち、「建設工事に係る資材の再資源化等に関する法律」上、誤っているものはどれか。","c":["対象建設工事受注者は、解体する建築物等の構造、工事着手の時期及び工程の概要、分別解体等の計画等の事項を都道府県知事に届け出なければならない。","対象建設工事受注者は、分別解体等に伴って生じた特定建設資材廃棄物である木材は、再資源化施設が工事現場から50km以内にない場合は、再資源化に代えて縮減をすれば足りる。","）「建設業法」上の管工事業のみの許可を受けた者が解体工事業を営もうとする場合は、当該業を行おうとする区域を管轄する都道府県知事の登録を受けなければならない。","対象建設工事受注者は、その請け負った建設工事の全部又は一部を他の建設業を営む者に請け負わせようとするときは、当該他の建設業を営む者に対し、当該対象建設工事について届け出られた分別解体等の計画等の事項を告げなければならない。"],"a":[1],"m":"exact","n":"","e":"対象建設工事の届出は「発注者」（自主施工者）が工事着手の7日前までに都道府県知事に行う。","f":[],"o":["img/R1B28_o0.png"],"g":12,"cat":"B法規","neg":true},{"id":"R1B29","y":"R1","p":"B","no":29,"s":"産業廃棄物の処理に関する記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","c":["事業者は、電子情報処理組織を使用して産業廃棄物の運搬又は処分を委託する場合、委託者に産業廃棄物を引き渡した後、3日以内に情報処理センターに登録する必要がある。","事業者は、他人に委託した産業廃棄物の運搬または処分が終了したことを確認した後、産業廃棄物管理票（マニフェスト）の写しの送付を受けた日から5年間は当該管理票の写しを保存しなければならない。","運搬受託者は、産業廃棄物の運搬を終了した日から20日以内に産業廃棄物管理票（マニフェスト）の写しを管理票交付者に送付しなければならない。","事業者は、建設工事に伴い発生した産業廃棄物を事業場の外の300m²以上の保管場所に保管する場合、非常災害のために必要な応急措置として行う場合を除き、事前にその旨を都道府県知事に届け出なければならない。"],"a":[3],"m":"exact","n":"","e":"運搬受託者は、運搬を終了した日から「10日以内」に管理票の写しを交付者に送付する（処分受託者も処分終了後10日以内）。","f":[],"o":["img/R1B29_o0.png"],"g":59,"cat":"B法規","neg":true},{"id":"R2A01","y":"R2","p":"A","no":1,"s":"環境に配慮した建築計画及び地球環境に関する記述のうち、適当でないものはどれか。","c":["事務所用途の建築物の二酸化炭素排出量をライフサイクルでみると、一般的に、設計・建設段階、運用段階、改修段階、廃棄段階のうち、設計・建設段階が全体の過半を占めている。","代替フロンであるHFCは、オゾン層を破壊しないが、地球の温暖化に影響を与える程度を示す地球温暖化係数（GWP）は二酸化炭素より大きい。","酸性雨は、大気中の硫黄酸化物や窒素酸化物が溶け込んで酸性となった雨のことで、湖沼や森林の生態系へ悪影響を与えるほか、建築構造物にも被害を与える。","ZEBとは、大幅な省エネルギー化の実現と再生可能エネルギーの導入により、室内環境の質を維持しつつ年間一次エネルギー消費量の収支をゼロとすることを目指した建築物のことである。"],"a":[1],"m":"exact","n":"","e":"事務所ビルのライフサイクルCO₂は、運用段階（空調・照明等のエネルギー消費）が全体の過半を占める。","f":[],"o":["img/R2A01_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A02","y":"R2","p":"A","no":2,"s":"冬期暖房時における外壁の室内側表面結露及び内部結露に関する記述のうち、適当でないものはどれか。","c":["室内側より屋外側の面積が大きくなる建物出隅部分は、他の部分に比べ室内側の表面温度が低下するため、表面結露を生じやすい。","窓ガラス表面の結露対策として、カーテンを掛け、窓ガラスを露出させないことが有効である。","繊維系断熱材を施した外壁における内部結露を防止するため、断熱材の室内側に防湿層を設ける。","外壁を構成する仕上げ材の内部空隙における水蒸気分圧を、その点における飽和水蒸気圧より低くすると、内部結露を防止することができる。"],"a":[2],"m":"exact","n":"","e":"カーテンで窓ガラスを覆うと室内の暖かい空気が当たらずガラス表面温度が下がり、かえって結露しやすくなる。","f":[],"o":["img/R2A02_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A03","y":"R2","p":"A","no":3,"s":"排水の水質に関する記述のうち、適当でないものはどれか。","c":["ヒ素、六価クロム化合物等の重金属は毒性が強く、水質汚濁防止法に基づく有害物質として排水基準が定められている。","BODは、河川等の水質汚濁の指標として用いられ、主に水中に含まれる有機物が酸化剤で化学的に酸化したときに消費する酸素量をいう。","ノルマルヘキサン抽出物質含有量は、油脂類による水質汚濁の指標として用いられ、ヘキサンで抽出される油分等の物質量をいう。","TOCは、水の汚染度を判断する指標として用いられ、水中に存在する有機物中の炭素量をいう。"],"a":[2],"m":"exact","n":"","e":"記述はCOD（化学的酸素要求量）。BODは微生物が有機物を分解する際に消費する酸素量。","f":[],"o":["img/R2A03_o0.png"],"g":37,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A04","y":"R2","p":"A","no":4,"s":"流体に関する記述のうち、適当でないものはどれか。","c":["キャビテーションとは、流体の静圧が局部的に飽和蒸気圧より低下し、気泡が発生する現象をいう。","カルマン渦とは、一様な流れの中に置いた円柱等の下流側に交互に発生する渦のことをいう。","流体の粘性による摩擦応力の影響は、一般的に、物体の表面近くで顕著に現れる。","粘性流体の運動に影響を及ぼす動粘性係数は、粘性係数を流体の速度で除した値である。"],"a":[4],"m":"exact","n":"","e":"動粘性係数は粘性係数を流体の「密度」で除した値。速度ではない。","f":[],"o":["img/R2A04_o0.png"],"g":60,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A05","y":"R2","p":"A","no":5,"s":"図に示す水平な管路内を空気が流れる場合において、A点とB点の間の圧力損失ΔPの値として適当なものはどれか。\nただし、A点における全圧は80Pa、B点の静圧は10Pa、B点の流速は10m/s、空気の密度は1.2kg/m³とする。","c":["5Pa","10Pa","15Pa","20Pa"],"a":[2],"m":"exact","n":"","e":"B点の全圧＝10＋1/2×1.2×10²＝70Pa。圧力損失＝A点全圧80－70＝10Pa。","f":["img/R2A05_f0.png"],"o":["img/R2A05_o0.png"],"g":61,"cat":"A基礎・電気・建築","neg":false},{"id":"R2A06","y":"R2","p":"A","no":6,"s":"流体に関する用語の組合せのうち、関係のないものはどれか。\n(Ａ) (Ｂ)","c":["ダルシー・ワイスバッハの式 圧力損失","ベンチュリー管 流量測定","トリチェリの定理 毛管現象","ウォーターハンマー 水柱分離"],"a":[3],"m":"exact","n":"","e":"トリチェリの定理は水槽からの流出速度に関するもので、毛管現象（表面張力）とは関係がない。","f":[],"o":["img/R2A06_o0.png"],"g":38,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A07","y":"R2","p":"A","no":7,"s":"熱に関する記述のうち、適当でないものはどれか。","c":["固体や液体では、定圧比熱と定容比熱はほぼ同じ値である。","気体を断熱圧縮させた場合、その温度は上昇する。","結晶が等方性を有する固体の体膨張係数は、線膨張係数のほぼ3倍である。","圧縮式冷凍サイクルでは、蒸発温度を低くすれば、成績係数は大きくなる。"],"a":[4],"m":"exact","n":"","e":"蒸発温度を低くすると圧縮仕事が増え、成績係数は「小さく」なる。","f":[],"o":["img/R2A07_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A08","y":"R2","p":"A","no":8,"s":"伝熱に関する記述のうち、適当でないものはどれか。","c":["等質な固体壁内部における熱伝導による熱移動量は、その固体壁内の温度勾配に比例する。","自然対流は、流体の密度の差により生じる浮力により、上昇流や下降流が起こることで生じる。","物体から放出される放射熱量は、その物体の絶対温度の4乗に比例する。","固体壁表面の熱伝達率の大きさは、固体壁表面に当たる気流の影響を受けない。"],"a":[4],"m":"exact","n":"","e":"熱伝達率は、壁面に当たる気流の速度が大きいほど大きくなり、気流の影響を受ける。","f":[],"o":["img/R2A08_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A09","y":"R2","p":"A","no":9,"s":"湿り空気に関する記述のうち、適当でないものはどれか。","c":["湿り空気を固体吸着減湿器（シリカゲル）で減湿する場合、湿り空気の状態変化は、一般的に、乾球温度一定の変化としてよい。","湿り空気を水噴霧加湿器で加湿する場合、湿り空気の状態変化は、近似的に湿球温度一定の変化としてよい。","湿り空気を蒸気加湿器で加湿する場合、湿り空気の状態変化における熱水分比は、水蒸気の比エンタルピーと同じ値としてよい。","熱水分比とは、湿り空気の状態変化における比エンタルピーの変化量の絶対湿度の変化量に対する比をいう。"],"a":[1],"m":"exact","n":"","e":"固体吸着減湿では吸着熱により乾球温度が上昇し、比エンタルピーがほぼ一定の変化となる。乾球温度一定ではない。","f":[],"o":["img/R2A09_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A10","y":"R2","p":"A","no":10,"s":"音に関する記述のうち、適当でないものはどれか。","c":["同じ音圧レベルの2つの音を合成すると、音圧レベルは約3dB大きくなる。","人の可聴範囲は、周波数では概ね20〜20,000Hzであるが、同じ音圧レベルの音であっても3,000〜4,000Hz付近の音が最も大きく聞こえる。","NC曲線で示される音圧レベルの許容値は、周波数が高いほど大きい。","点音源から放射された音が球面状に一様に広がる場合、音源からの距離が2倍になると音圧レベルは約6dB低下する。"],"a":[3],"m":"exact","n":"","e":"NC曲線の許容音圧レベルは、周波数が高いほど「小さく」なる。","f":[],"o":["img/R2A10_o0.png"],"g":14,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A11","y":"R2","p":"A","no":11,"s":"低圧屋内配線工事に関する記述のうち、適当でないものはどれか。","c":["厨房内の電動機用配線工事において、金属管と金属製ボックスを接続するボンド線（裸銅線）を省略する。","三相3線200Vの電動機用配線工事において、金属管にD種接地工事を施す。","合成樹脂で被覆した機械器具に接続する三相3線200Vの電路において、漏電遮断器（ELCB）を省略する。","CD管（合成樹脂製可とう電線管）を直接コンクリートに埋め込んで施設する。"],"a":[1],"m":"exact","n":"","e":"厨房のような湿気・水気のある場所では、金属管と金属製ボックスを接続するボンド線（接地の連続性確保）を省略できない。","f":[],"o":["img/R2A11_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A12","y":"R2","p":"A","no":12,"s":"低圧の三相電動機の保護回路に関する記述のうち、適当でないものはどれか。","c":["過負荷及び欠相を保護する回路に、保護継電器と電磁接触器を組み合わせて使用する。","配線用遮断器と電磁開閉器を組み合わせた回路において、過負荷に対して、電磁開閉器より配線用遮断器が先に動作するように設定する。","スターデルタ始動の冷却水ポンプの回路に、過負荷・欠相保護継電器（2Eリレー）を使用する。","全電圧始動（直入始動）の水中モーターポンプの回路に、過負荷・欠相・反相保護継電器（3Eリレー）を使用する。"],"a":[2],"m":"exact","n":"","e":"過負荷に対しては電磁開閉器（熱動継電器）が先に動作するように設定し、配線用遮断器は主に短絡保護を受け持つ。","f":[],"o":["img/R2A12_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A13","y":"R2","p":"A","no":13,"s":"鉄筋コンクリート造の壁の開口補強及び梁貫通孔に関する記述のうち、適当でないものはどれか。","c":["壁の開口補強には、鉄筋に代えて溶接金網を使用することができる。","小さな壁開口が密集している場合、その全体を大きな開口とみなして開口補強を行うことができる。","梁貫通孔の径の大きさは、梁せいの1/3以下とする。","2つの大きさの異なる梁貫通孔の中心間隔は、梁貫通孔の径の平均値の2倍以上とする。"],"a":[4],"m":"exact","n":"","e":"大きさの異なる梁貫通孔の中心間隔は、径の平均値の3倍以上とする。","f":[],"o":["img/R2A13_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R2A14","y":"R2","p":"A","no":14,"s":"図に示す単純梁の2点に集中荷重Pが作用する場合の曲げモーメント図として、適当なものはどれか。","c":["（図⑴）","（図⑵）","（図⑶）","（図⑷）"],"a":[3],"m":"exact","n":"","e":"スパンを3等分する2点に等しい荷重Pが作用すると、曲げモーメントは支点から荷重点まで直線的に増え、荷重点間は一定（Pl/3）となる台形の図（⑶）になる。","f":["img/R2A14_f0.png"],"o":["img/R2A14_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false,"ci":["img/R2A14_f1.png","img/R2A14_f2.png","img/R2A14_f3.png","img/R2A14_f4.png"]},{"id":"R2A15","y":"R2","p":"A","no":15,"s":"空調システムの省エネルギーに効果がある建築的手法の記述のうち、適当でないものはどれか。","c":["窓は、ひさし、高遮熱ガラス、ブラインド等による日射遮へい性能の高いものを採用し、日射熱取得を減らす。","建物の平面形状は、東西面を長辺とした場合、長辺の短辺に対する比率を大きくする。","屋上緑化は、植物や土壌による熱の遮断だけでなく、屋外空間の温度上昇を緩和する効果がある。","外壁の塗装には、赤外線を反射し、建物の温度上昇を抑制する効果のある塗料を採用する。"],"a":[2],"m":"exact","n":"","e":"東西面は日射負荷が大きいため、長辺は南北面とし、平面は正方形に近い形が有利。東西面を長辺として比率を大きくするのは不利。","f":[],"o":["img/R2A15_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R2A16","y":"R2","p":"A","no":16,"s":"空気調和方式に関する記述のうち、適当でないものはどれか。","c":["定風量単一ダクト方式は、送風温度を変化させるため、各室の負荷変動パターンが異なる建物の空調に適している。","大温度差送風（低温送風）方式は、送風量の低減によりダクトサイズを小さくすることができる。","床吹き出し方式は、居住域空間を効率的に空調することができるが、冷房運転時には室内の垂直温度差が大きくなる。","天井放射冷房方式は、ドラフトが生じないため快適性が高いが、結露防止に配慮する必要がある。"],"a":[1],"m":"exact","n":"","e":"定風量単一ダクト方式は全室同じ温度で送風するため、負荷変動パターンが異なる建物には適さない（変風量方式等が適する）。","f":[],"o":["img/R2A16_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R2A17","y":"R2","p":"A","no":17,"s":"図に示す冷房時の湿り空気線図における空気調和機のコイルの冷却負荷の値として、適当なものはどれか。\nただし、送風量は6,000m³/h、空気の密度は1.2kg/m³とする。","c":["28kW","40kW","50kW","78kW"],"a":[2],"m":"exact","n":"","e":"冷却負荷＝(6,000×1.2÷3,600)×(66－46)＝2×20＝40kW。","f":["img/R2A17_f0.png"],"o":["img/R2A17_o0.png"],"g":3,"cat":"A空調","neg":false},{"id":"R2A18","y":"R2","p":"A","no":18,"s":"冷房熱負荷計算に関する記述のうち、適当でないものはどれか。","c":["人体からの発熱量は、室内温度が下がると顕熱分が大きくなり、潜熱分が小さくなる。","土間床、地中壁からの通過熱負荷は、一般的に、年中熱損失側であるため無視する。","北面のガラス窓からの日射負荷は、一般的に、直達日射が当たらないため無視する。","日射及び夜間放射の影響を受ける外壁の負荷計算には、通常の温度差の代わりに、実効温度差を用いる。"],"a":[3],"m":"exact","n":"","e":"北面のガラス窓でも天空日射による日射負荷があり、無視しない。","f":[],"o":["img/R2A18_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R2A19","y":"R2","p":"A","no":19,"s":"変風量単一ダクト方式の自動制御において、「制御する機器」と「検出要素」の組合せのうち、適当でないものはどれか。\n(制御する機器) (検出要素)","c":["空気調和機の冷温水コイルの制御弁 空気調和機入口空気の温度","VAVユニット 空調室内の温度","外気及び排気用電動ダンパー 還気ダクト内の二酸化炭素濃度","空気調和機のファン VAVユニットの風量"],"a":[1],"m":"exact","n":"","e":"冷温水コイルの制御弁は、給気（吹出し）温度又は還気・室内温度を検出して制御する。空調機入口空気温度ではない。","f":[],"o":["img/R2A19_o0.png"],"g":1,"cat":"A空調","neg":true},{"id":"R2A20","y":"R2","p":"A","no":20,"s":"コージェネレーションシステムに関する記述のうち、適当でないものはどれか。","c":["受電並列運転（系統連系）は、コージェネレーションシステムによる電力を商用電力と接続し、一体的に電力を供給する方式である。","燃料電池を用いるシステムは、原動機式と比べて発電効率が高く、騒音や振動が小さい。","熱機関からの排熱は、高温から低温に向けて順次多段階に活用するように計画する。","マイクロガスタービン発電機を用いたシステムでは、工事、維持、運用に係る保安の監督を行う者として、ボイラー・タービン主任技術者の選任が必要である。"],"a":[4],"m":"exact","n":"","e":"一定出力未満のマイクロガスタービン発電設備では、ボイラー・タービン主任技術者の選任は不要とされている。","f":[],"o":["img/R2A20_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R2A21","y":"R2","p":"A","no":21,"s":"蓄熱方式に関する記述のうち、適当でないものはどれか。","c":["蓄熱を利用した空調方式では、ピークカットにより熱源機器の容量を低減することができる。","二次側配管系を開放回路とした場合、ポンプの揚程には循環の摩擦損失のほかに押上げ揚程が加わるため、ポンプの動力が大きくなる。","氷蓄熱方式は、氷の融解潜熱を利用するため、水蓄熱方式に比べて蓄熱槽の容量が大きくなる。","蓄熱槽を利用することで、熱源機器を低効率で連続運転することがなくなり、最適な効率で運転できる。"],"a":[3],"m":"exact","n":"","e":"氷蓄熱は融解潜熱を利用でき、水蓄熱より蓄熱槽の容量は「小さく」なる。","f":[],"o":["img/R2A21_o0.png"],"g":26,"cat":"A空調","neg":true},{"id":"R2A22","y":"R2","p":"A","no":22,"s":"在室人員24人の居室の二酸化炭素濃度を1,000ppm以下に保つために必要な最小の換気量として、適当なものはどれか。\nただし、外気中の二酸化炭素の濃度は400ppm、人体からの二酸化炭素発生量は0.03m³/(h・人）とする。","c":["400m³/h","600m³/h","800m³/h","1,200m³/h"],"a":[4],"m":"exact","n":"","e":"Q＝(24×0.03)÷(1,000×10⁻⁶－400×10⁻⁶)＝0.72÷0.0006＝1,200m³/h。","f":[],"o":["img/R2A22_o0.png"],"g":2,"cat":"A換気・排煙","neg":false},{"id":"R2A23","y":"R2","p":"A","no":23,"s":"換気設備に関する記述のうち、適当でないものはどれか。","c":["開放式燃焼器具を使用した調理室は、燃焼空気の供給のため、機械換気で室内を正圧にする。","喫煙室は、発生する有害ガスや粉じんを除去し、室外に拡散させないため、空気清浄機を設置し、機械換気で室内を負圧にする。","火気使用室の換気を自然換気方式で行う場合、排気筒の有効断面積は、燃料の燃焼に伴う理論廃ガス量、排気筒の高さ等から算出する。","エレベーター機械室の換気は、熱の除去が主な目的であり、サーモスタットにて換気ファンの発停を行い、室温が許容値以下となるようにする。"],"a":[1],"m":"exact","n":"","e":"開放式燃焼器具を使用する調理室は、燃焼排ガスや臭気が他室へ漏れないよう、周囲より負圧に保つ（第一種又は第三種換気）。","f":[],"o":["img/R2A23_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R2A24","y":"R2","p":"A","no":24,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」上の「階及び全館避難安全検証法」及び「特殊な構造」によらないものとする。","c":["排煙ダクトに設ける防火ダンパーは、作動温度280℃のものを使用する。","同一の防煙区画において、自然排煙と機械排煙を併用してはならない。","常時開放型の排煙口は、2以上の防煙区画を1台の排煙機で受け持つ場合に適した形式である。","同一防煙区画内に可動間仕切りがある場合、間仕切られる室それぞれに排煙口を設け連動させる。"],"a":[3],"m":"exact","n":"","e":"常時開放型の排煙口は、1防煙区画を1台の排煙機で受け持つ場合に用いる。2以上の防煙区画を受け持つ場合は常時閉鎖型。","f":[],"o":["img/R2A24_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R2A25","y":"R2","p":"A","no":25,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」上の「階及び全館避難安全検証法」及び「特殊な構造」によらないものとする。","c":["排煙設備が設置対象となる建築物において、一般事務室の防煙区画の床面積は、1,000m²以下とする。","天井高さが3m以上の居室に設ける排煙口は、床面からの高さが2.1m以上で、かつ天井高さの1/2以上の壁の部分に設けることができる。","排煙口の位置は、避難方向と煙の流れが反対になるように配置する。","高さ31mを超える建築物における排煙設備の制御及び作動状態の監視は、中央管理室において行うことができるものとする。"],"a":[1],"m":"exact","n":"","e":"防煙区画の床面積は500m²以下とする。","f":[],"o":["img/R2A25_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R2A26","y":"R2","p":"A","no":26,"s":"上水道の配水管路に関する記述のうち、適当でないものはどれか。","c":["2階建て建物への直結の給水を確保するためには、配水管の最小動水圧は0.15〜0.2MPaを標準とする。","伸縮自在でない継手を用いた管路の露出配管部には、40〜50mの間隔で伸縮継手を設ける。","公道に埋設する配水管の土被りは、1.2mを標準とする。","公道に埋設する外径80mm以上の配水管には、原則として、占用物件の名称、管理者名、埋設した年等を明示するテープを取り付ける。"],"a":[2],"m":"exact","n":"","e":"伸縮自在でない継手の露出配管部には、20〜30m程度の間隔で伸縮継手を設ける。","f":[],"o":["img/R2A26_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R2A27","y":"R2","p":"A","no":27,"s":"下水道に関する記述のうち、適当でないものはどれか。","c":["合流式の下水道では、降雨の規模によっては、処理施設を経ない下水が公共用水域に放流されることがある。","地表勾配が急な場合の管きょの接合は、原則として、地表勾配に応じて段差接合又は階段接合とする。","硬質塩化ビニル管、強化プラスチック複合管等の可とう性のある管きょの基礎は、原則として、自由支承の砂又は砕石基礎とする。","分流式の下水道において、管きょ内の必要最小流速は、雨水管きょに比べて、汚水管きょの方が大きい。"],"a":[4],"m":"exact","n":"","e":"管きょの最小流速は汚水管きょ0.6m/s、雨水管きょ0.8m/sで、雨水管きょの方が大きい。","f":[],"o":["img/R2A27_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R2A28","y":"R2","p":"A","no":28,"s":"上水の給水設備に関する記述のうち、適当でないものはどれか。","c":["給水量の算定をする場合、1人1日当たりの単位給水量は、事務所の方が集合住宅より多い。","受水タンクには、地震時の対応として緊急遮断弁を設ける。","高置タンク方式における揚水ポンプの揚水量は、時間最大予想給水量に基づき決定する。","受水タンクの容量は、一般的に、1日予想給水量の半分程度とする。"],"a":[1],"m":"exact","n":"","e":"1人1日当たりの給水量は、集合住宅（200〜350L）の方が事務所（60〜100L程度）より多い。","f":[],"o":["img/R2A28_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R2A29","y":"R2","p":"A","no":29,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["高層建築物では、高層部、低層部等の給水系統のゾーニング等により、給水圧力が400〜500kPaを超えないようにする。","揚水ポンプの吐出側の逆止め弁は、揚程が30mを超える場合、ウォーターハンマーの発生を防止するため衝撃吸収式とする。","クロスコネクションの防止対策には、飲料用とその他の配管との区分表示のほか、減圧式逆流防止装置の使用等がある。","大気圧式のバキュームブレーカーは、常時水圧のかかる配管部分に設ける。"],"a":[4],"m":"exact","n":"","e":"大気圧式バキュームブレーカーは、常時水圧のかからない部分（最終止水弁の下流側）に設ける。","f":[],"o":["img/R2A29_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R2A30","y":"R2","p":"A","no":30,"s":"給湯設備に関する記述のうち、適当でないものはどれか。","c":["中央式給湯設備の返湯管の管径は、一般的に、給湯管の1/2程度とし、循環流量から管内流速を確認して決定する。","貯湯タンクには、加熱による水の膨張で装置全体の圧力を異常に上昇させないため、逃し管又は安全弁（逃し弁）を設ける。","住宅のセントラル給湯に使用する瞬間式ガス湯沸器は、冬期におけるシャワーと台所の湯の同時使用、及び、浴槽の湯張り時間を考慮して、一般的に、12号程度の能力が必要である。","小型貫流ボイラーは、保有水量が少ないため負荷変動の追随性が良く、伝熱面積が30m²以下の場合、取扱いにボイラー技士を必要としない。"],"a":[3],"m":"exact","n":"","e":"冬期のシャワーと台所の同時使用や浴槽の湯張りを考慮すると、住宅のセントラル給湯には一般に24号程度の能力が必要。12号では不足する。","f":[],"o":["img/R2A30_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R2A31","y":"R2","p":"A","no":31,"s":"排水設備に関する記述のうち、適当でないものはどれか。","c":["ブランチ間隔とは、汚水又は雑排水立て管に接続する排水横枝管の垂直距離の間隔のことであり、2.5mを超える場合を1ブランチ間隔という。","管径65mm以上の間接排水管の末端と、間接排水口のあふれ縁との排水口空間は、最小150mmとする。","器具排水負荷単位は、大便器の排水流量を標準に、器具の同時使用率等を考慮して定められたものである。","グリース阻集器の容量算定には、阻集グリースの質量、たい積残さの質量及び阻集グリースの掃除周期を考慮する。"],"a":[3],"m":"exact","n":"","e":"器具排水負荷単位は、洗面器の排水流量（28.5L/min）を1として、同時使用率等を考慮して定めたもの。大便器が基準ではない。","f":[],"o":["img/R2A31_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R2A32","y":"R2","p":"A","no":32,"s":"通気設備に関する記述のうち、適当でないものはどれか。","c":["通気立て管の上部は、管径を縮小せずに延長し、上端は単独で大気に開放するか、最高位の衛生器具のあふれ縁より150mm以上立ち上げて伸頂通気管に接続する。","通気管の開口部が、建物の出入り口、窓、換気口等の付近にある場合は、水平距離で600mm以上離す。","各個通気管の取り出し位置は、器具トラップのウェアから管径の2倍以上離れた位置とする。","排水横枝管に分岐がある場合は、それぞれの排水横枝管に通気管を設ける。"],"a":[2],"m":"exact","n":"","e":"通気管の開口部は、窓・換気口等の上端から600mm以上立ち上げるか、水平距離で3m以上離す。","f":[],"o":["img/R2A32_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R2A33","y":"R2","p":"A","no":33,"s":"排水槽及び排水ポンプに関する記述のうち、適当でないものはどれか。","c":["排水槽の容量は、一般的に、流入排水の負荷変動、ポンプの最短運転時間、槽内貯留時間等を考慮して決定する。","通気弁は、大気開口された伸頂通気のような正圧緩和の効果がないため、排水槽の通気管末端には使用してはならない。","排水の貯留時間が長くなるおそれがある場合は、臭気の問題等から、一定時間を経過するとタイマーでポンプを起動させる制御方法を考慮する。","汚水用水中モーターポンプは、小さな固形物が混入した排水に用いられ、口径の40％程度の径の固形物が通過可能なものである。"],"a":[4],"m":"exact","n":"","e":"記述は雑排水用ポンプ。汚水用ポンプは湧水や空調排水など固形物をほとんど含まない排水用。","f":[],"o":["img/R2A33_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R2A34","y":"R2","p":"A","no":34,"s":"消火設備の消火原理に関する記述のうち、適当でないものはどれか。","c":["水噴霧消火設備は、霧状の水の放射による冷却効果及び発生する水蒸気による窒息効果により消火するものである。","粉末消火設備は、粉末状の消火剤を放射し、消火剤の熱分解で発生した二酸化炭素や水蒸気による窒息効果、冷却効果等により消火するものである。","不活性ガス消火設備は、不活性ガスを放射し、ガス成分の化学反応による負触媒効果により消火するものである。","泡消火設備は、泡状の消火剤を放射し、燃焼物を泡の層で覆い、窒息効果と冷却効果により消火するものである。"],"a":[3],"m":"exact","n":"","e":"不活性ガス消火設備は、放射により酸素濃度を下げる窒息効果で消火する。化学反応（負触媒）ではない。","f":[],"o":["img/R2A34_o0.png"],"g":16,"cat":"A衛生","neg":true},{"id":"R2A35","y":"R2","p":"A","no":35,"s":"ガス設備に関する記述のうち、適当でないものはどれか。","c":["内容積が20L以上の液化石油ガスの容器を設置する場合は、容器の設置位置から2m以内にある火気を遮る措置を行う。","特定地下室等に都市ガスのガス漏れ警報器を設置する場合、導管の外壁貫通部より10m以内に設置する。","一般消費者等に供給される液化石油ガスは、「い号」、「ろ号」、「は号」に区分され、「い号」が最もプロパン及びプロピレンの合計量の含有率が高い。","液化プロパンが気化した場合のプロパンの密度は、標準状態で約2kg/m³である。"],"a":[2],"m":"exact","n":"","e":"特定地下室等の都市ガス用警報器は、導管の外壁貫通部から8m以内に設置する。10mではない。","f":[],"o":["img/R2A35_o0.png"],"g":62,"cat":"A衛生","neg":true},{"id":"R2A36","y":"R2","p":"A","no":36,"s":"FRP製浄化槽の設置に関する記述のうち、適当でないものはどれか。","c":["地下水位が高い場所に設置する場合は、浄化槽本体の浮上防止対策を講ずる。","浄化槽の水平は、水準器、槽内に示されている水準目安線等で確認する。","浄化槽本体の設置にあたって、据付け高さの調整は、山砂を用いて行う。","浄化槽の設置工事を行う場合は、浄化槽設備士が実地に監督する。"],"a":[3],"m":"exact","n":"","e":"FRP製浄化槽の据付け高さの調整は、底版コンクリート上でライナー等により行う。山砂では行わない。","f":[],"o":["img/R2A36_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R2A37","y":"R2","p":"A","no":37,"s":"接触ばっ気方式の浄化槽の特徴に関する記述のうち、適当でないものはどれか。","c":["流入水が高負荷の場合、生物膜の肥厚が早くなるため、長時間ばっ気方式に比べて、浄化機能を保ちやすい。","出現する生物の種類が多く、比較的大型の生物が発生するため、長時間ばっ気方式に比べて、汚泥発生量はやや少なくなる。","生物膜のはく離と移送が生物管理の主たる作業となるため、長時間ばっ気方式に比べて、生物管理は容易である。","接触材に生物が付着しているため、長時間ばっ気方式に比べて、水量変動の影響はあまり受けない。"],"a":[1],"m":"exact","n":"","e":"接触ばっ気方式は、高負荷になると生物膜が肥厚して閉塞やはく離を起こしやすく、浄化機能を保ちにくい。","f":[],"o":["img/R2A37_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R2A38","y":"R2","p":"A","no":38,"s":"ボイラー等に関する記述のうち、適当でないものはどれか。","c":["ボイラー本体は、ガスや油の燃焼を行わせる燃焼室と、燃焼ガスとの接触伝熱によって熱を吸収する対流伝熱面で構成される。","鋳鉄製ボイラーは、鋼製ボイラーに比べて急激な温度変化に弱いが、高温、高圧、大容量のものの製作が可能である。","真空式温水発生機は、運転中の内部圧力が大気圧より低いため、「労働安全衛生法」におけるボイラーに該当せず、取扱いにボイラー技士を必要としない。","炉筒煙管ボイラーは、胴内部に炉筒（燃焼室）と多数の煙管を配置したもので、胴内のボイラー水は煙管内を通過する燃焼ガスで加熱される。"],"a":[2],"m":"exact","n":"","e":"鋳鉄製ボイラーは低圧・小容量向けで、高温・高圧・大容量のものは製作できない。","f":[],"o":["img/R2A38_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R2A39","y":"R2","p":"A","no":39,"s":"保温及び保冷に関する記述のうち、適当でないものはどれか。","c":["ロックウール保温材は、グラスウール保温材より使用温度の上限が低い。","ポリエチレンフォーム保温材には、板状又は筒状に発泡成形したものや、板又はシート状に発泡した後に筒状に加工したものがある。","保冷とは、常温以下の物体を被覆し侵入熱量を小さくすること、又は、被覆後の表面温度を露点温度以上とし表面に結露を生じさせないことである。","ロックウール保温材のブランケットは、密度により1号と2号に区分される。"],"a":[1],"m":"exact","n":"","e":"ロックウール保温材の方がグラスウール保温材より使用温度の上限が「高い」。","f":[],"o":["img/R2A39_o0.png"],"g":63,"cat":"A機材・設計図書・約款","neg":true},{"id":"R2A40","y":"R2","p":"A","no":40,"s":"送風機に関する記述のうち、適当でないものはどれか。","c":["多翼送風機は、高い圧力を出すことはできないが、他の遠心送風機に比べて、小型で大風量を扱うことができるため、空調用として広く用いられる。","横流送風機は、羽根車の軸方向の長さを変えることで風量の増減が可能で、エアカーテン等に利用される。","斜流送風機の軸動力は、風量の変化に対してほぼ変わらず、圧力曲線の山の付近で最大となるリミットロード特性を持つ。","軸流送風機にはプロペラ型、チューブラ型、ベーン型があり、プロペラ型が最も効率がよく、高圧力に対応できる。"],"a":[4],"m":"exact","n":"","e":"プロペラ型は低圧・大風量向けで効率は低い。高い圧力に対応できるのはベーン型。","f":[],"o":["img/R2A40_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R2A41","y":"R2","p":"A","no":41,"s":"配管材料に関する記述のうち、適当でないものはどれか。","c":["排水用硬質塩化ビニルライニング鋼管の接合には、排水鋼管用可とう継手のほか、ねじ込み式排水管継手が用いられる。","鋼管とステンレス鋼管等、イオン化傾向が大きく異なる異種金属管の接合には、絶縁フランジを使用する。","架橋ポリエチレン管は、中密度・高密度ポリエチレンを架橋反応させることで、耐熱性、耐クリープ性を向上させた配管である。","圧力配管用炭素鋼鋼管（黒管）は、蒸気、高温水等の圧力の高い配管に使用され、スケジュール番号により管の厚さが区分されている。"],"a":[1],"m":"exact","n":"","e":"排水用硬質塩化ビニルライニング鋼管は管厚が薄くねじ加工できないため、排水鋼管用可とう継手（MD継手）で接合し、ねじ込み式排水管継手は用いない。","f":[],"o":["img/R2A41_o0.png"],"g":4,"cat":"A機材・設計図書・約款","neg":true},{"id":"R2A42","y":"R2","p":"A","no":42,"s":"ダクト及びダクト付属品に関する記述のうち、適当でないものはどれか。","c":["吸込口へ向かう気流は、吹出口からの気流のような指向性はなく、前面から一様に吸込口へ向かう気流となるため、可動羽根や風向調節ベーン等は不要である。","スパイラルダクトは、亜鉛鉄板をスパイラル状に甲はぜ機械がけしたもので、甲はぜが補強の役目を果たすため補強は不要である。","たわみ継手は、たわみ部が負圧になる場合、正圧部が全圧300Paを超える場合等には、補強用のピアノ線が挿入されたものを使用する。","等摩擦法（定圧法）で寸法を決定したダクトでは、各吹出口に至るダクトの長さが著しく異なる場合でも、各吹出口での圧力差は生じにくい。"],"a":[4],"m":"exact","n":"","e":"等摩擦法では、各吹出口までのダクト長さが著しく異なると圧力差が生じるため、ダンパー等での調整が必要。","f":[],"o":["img/R2A42_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R2A43","y":"R2","p":"A","no":43,"s":"「公共工事標準請負契約約款」に関する記述のうち、適当でないものはどれか。","c":["発注者が設計図書を変更し、請負代金額が2/3以上減少した場合、受注者は契約を解除することができる。","発注者は完成検査合格後、受注者から請負代金の支払い請求があったときは、請求を受けた日から30日以内に請負代金を支払わなければならない。","受注者は、請負代金内訳書に健康保険、厚生年金保険及び雇用保険に係る法定福利費を明示するものとする。","発注者は、受注者が正当な理由なく、工事に着手すべき期日を過ぎても工事に着手しないときは、必要な手続きを経た後、契約を解除することができる。"],"a":[2],"m":"exact","n":"","e":"完成検査合格後の請負代金の支払いは、請求を受けた日から40日以内。","f":[],"o":["img/R2A43_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R2A44","y":"R2","p":"A","no":44,"s":"JISに規定する配管に関する記述のうち、適当でないものはどれか。","c":["配管用ステンレス鋼鋼管は、一般配管用ステンレス鋼鋼管に比べて、管の肉厚が厚く、ねじ加工が可能である。","一般配管用ステンレス鋼鋼管は、給水、給湯、冷温水、蒸気還水等の配管に用いる。","硬質ポリ塩化ビニル管には、VP、VM、VUの3種類があり、設計圧力の上限が最も低いものはVMである。","水道用硬質ポリ塩化ビニル管のVP及びHIVPの最高使用圧力は、同じである。"],"a":[3],"m":"exact","n":"","e":"硬質ポリ塩化ビニル管で設計圧力の上限が最も低いのは薄肉のVU。VMではない。","f":[],"o":["img/R2A44_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R2B01","y":"R2","p":"B","no":1,"s":"公共工事における施工計画等に関する記述のうち、適当でないものはどれか。","c":["工事目的物を完成させるための施工方法は、設計図書等に特別の定めがない限り、受注者の責任において定めなければならない。","予測できなかった大規模地下埋設物の撤去に要する費用は、設計図書等に特別の定めがない限り、受注者の負担としなくてもよい。","総合施工計画書は受注者の責任において作成されるが、設計図書等に特記された事項については監督員の承諾を受けなければならない。","受注者は、設計図書等に基づく請負代金内訳書及び実行予算書を、工事契約の締結後遅滞なく発注者に提出しなければならない。"],"a":[4],"m":"exact","n":"","e":"実行予算書は受注者の内部管理資料で、発注者への提出義務はない。","f":[],"o":["img/R2B01_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R2B02","y":"R2","p":"B","no":2,"s":"工事の「申請書等」、「提出時期」及び「提出先」の組合せとして適当でないものはどれか。\n(申請書等) (提出時期) (提出先)","c":["労働安全衛生法における 工事開始の 労働基準監督署長第一種圧力容器設置届 30日前まで","消防法における指定数量以上の 着工前 消防長又は消防署長危険物貯蔵所設置許可申請書","道路法における 着工前 道路管理者道路の占用許可申請書","建設工事に係る資材の 工事着手の 都道府県知事再資源化等に関する法律における 7日前まで対象建設工事の届出"],"a":[2],"m":"exact","n":"","e":"危険物貯蔵所の設置許可申請の提出先は市町村長等（市町村長・都道府県知事等）。消防長又は消防署長ではない。","f":[],"o":["img/R2B02_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R2B03","y":"R2","p":"B","no":3,"s":"工程管理に関する記述のうち、適当でないものはどれか。","c":["手持資源等の制約のもとで工期を計画全体の所定の期間に合わせるために調整することをスケジューリングという。","ネットワーク工程表は、作業内容を矢線で表示するアロー形と丸で表示するイベント形に大別することができる。","ネットワーク工程表において日程短縮を検討する際は、日程短縮によりトータルフロートが負となる作業について作業日数の短縮を検討する。","ネットワーク工程表において日程短縮を検討する際は、直列作業を並行作業に変更したり、作業の順序を変更したりしてはならない。"],"a":[4],"m":"exact","n":"","e":"直列作業の並行化や作業順序の変更は、日程短縮の有効な手段である。","f":[],"o":["img/R2B03_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R2B04","y":"R2","p":"B","no":4,"s":"下図に示すネットワーク工程表に関する記述のうち、適当でないものはどれか。\nただし、図中のイベント間のA〜Jは作業内容、日数は作業日数を表す。","c":["作業Gのトータルフロートは、作業Jよりも1日多い。","作業A及び作業Cのフリーフロートは、0である。","イベント⑤の最早開始時刻と最遅完了時刻は同じである。","イベント⑦の最遅完了時刻は、16日である。"],"a":[1],"m":"exact","n":"","e":"最早時刻は②4、③5、④9、⑤11、⑥11、⑦16、⑧16、⑨24日。作業G・Jはともにクリティカルパス上でトータルフロートは0日。G がJより1日多いは誤り。","f":["img/R2B04_f0.png"],"o":["img/R2B04_o0.png"],"g":0,"cat":"B施工管理","neg":true},{"id":"R2B05","y":"R2","p":"B","no":5,"s":"品質管理に用いられる下図（図Ａ、図Ｂ）の名称の組合せのうち、適当なものはどれか。","c":["特性要因図 パレート図","管理図 ヒストグラム","特性要因図 ヒストグラム","管理図 パレート図"],"a":[3],"m":"exact","n":"","e":"図Aは特性と要因の関係を整理した特性要因図、図Bは度数分布を柱状に表したヒストグラム。","f":["img/R2B05_f0.png","img/R2B05_f1.png"],"o":["img/R2B05_o0.png"],"g":null,"cat":"B施工管理","neg":false},{"id":"R2B06","y":"R2","p":"B","no":6,"s":"品質管理に関する記述のうち、適当でないものはどれか。","c":["品質管理において、品質の向上と工事原価の低減は、常にトレードオフの関係にある。","PDCAサイクルは、計画→実施→確認→処理→計画のサイクルを繰り返すことであり、品質の改善に有効である。","全数検査は、特注機器の検査、配管の水圧試験、空気調和機の試運転調整等に適用する。","抜取検査は、合格ロットの中に、ある程度の不良品の混入が許される場合に適用する。"],"a":[1],"m":"exact","n":"","e":"品質の向上と工事原価の低減は、手直しの減少などにより両立しうるもので、常にトレードオフではない。","f":[],"o":["img/R2B06_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R2B07","y":"R2","p":"B","no":7,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["高さが2m以上、6.75m以下の作業床がない箇所での作業において、胴ベルト型の墜落制止用器具を使用する場合、当該器具は一本つり胴ベルト型とする。","ヒヤリハット活動とは、作業中に怪我をする危険を感じてヒヤリとしたこと等を報告させることにより、危険有害要因を把握し改善を図っていく活動である。","ZD（ゼロ・ディフェクト）運動とは、作業方法のマニュアル化と作業員に対する監視を徹底することにより、労働災害ゼロを目指す運動である。","安全施工サイクルとは、安全朝礼から始まり、安全ミーティング、安全巡回、安全工程打合せ、後片付け、終業時確認までの作業日ごとの安全活動サイクルのことである。"],"a":[3],"m":"exact","n":"","e":"ZD運動は、作業者一人ひとりの自主的な工夫・注意により欠陥（災害）ゼロを目指す運動。監視の徹底による運動ではない。","f":[],"o":["img/R2B07_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R2B08","y":"R2","p":"B","no":8,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["ツールボックスミーティングは、職場安全会議ともいい、作業関係者が作業終了後に集まり、その日の作業、安全等について反省、再確認等を行う活動である。","暑さ指数（WBGT）は、気温、湿度及び輻射熱に関係する値により算出される指数で、熱中症予防のための指標である。","不安全行動とは、手間や労力、時間やコストを省くことを優先し、労働者本人又は関係者の安全を阻害する可能性のある行動を意図的に行う行為をいう。","4S活動とは、整理、整頓、清掃、清潔の4Sにより、安全で健康な職場づくりと生産性の向上を目指す活動である。"],"a":[1],"m":"exact","n":"","e":"ツールボックスミーティングは作業開始前に行う短時間のミーティング。記述は作業終了後の反省会。","f":[],"o":["img/R2B08_o0.png"],"g":44,"cat":"B施工管理","neg":true},{"id":"R2B09","y":"R2","p":"B","no":9,"s":"機器の据付けに関する記述のうち、適当ではないものはどれか。","c":["低層建築物の屋上に2台の冷却塔を近接して設置する場合、2台の冷却塔は、原則として、冷却塔本体のルーバー面の高さの2倍以上離して設置する。","横形ポンプを2台以上並べて設置する場合、各ポンプの基礎の間隔は、一般的に、500mm以上とする。","真空又は窒素加圧状態で分割搬入した密閉型遠心冷凍機は、大気開放してから組み立て据え付ける。","大型冷凍機をコンクリート基礎に据え付ける場合、冷凍機は、基礎のコンクリートを打設後、10日が経過してから据え付ける。"],"a":[3],"m":"exact","n":"","e":"真空・窒素加圧状態で搬入した冷凍機は、湿気や異物が入らないよう大気開放せずに組み立てる。","f":[],"o":["img/R2B09_o0.png"],"g":45,"cat":"B施工","neg":true},{"id":"R2B10","y":"R2","p":"B","no":10,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["あと施工のメカニカルアンカーボルトは、めねじ形よりおねじ形の方が許容引抜き力が大きい。","カプセル方式の接着系アンカーボルトを施工する場合、マーキング位置までアンカーボルトを埋込み後、アンカーボルトの回転により接着剤を十分攪拌する。","地震時にアンカーボルトに加わる荷重は、原則として、機器を剛体とみなし、当該機器の重心の位置に水平及び鉛直の地震力が作用するものとして算定する。","あと施工の接着系アンカーボルトの打設間隔は、呼び径の10倍以上を標準とする。"],"a":[2],"m":"exact","n":"","e":"カプセル方式は、アンカー筋を回転・打撃しながら埋め込んでカプセルを破砕・攪拌し、マーキング位置に達したら回転を止める。埋込み後に回転させるのではない。","f":[],"o":["img/R2B10_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R2B11","y":"R2","p":"B","no":11,"s":"配管及び配管付属品の施工に関する記述のうち、適当でないものはどれか。","c":["冷温水配管の空気抜きに自動空気抜き弁を設ける場合、当該空気抜き弁は、管内が正圧になる箇所に設ける。","冷温水配管の主管から枝管を分岐する場合、エルボを3個程度用いて、管の伸縮を吸収できるようにする。","排水立て管に鉛直に対して45°を超えるオフセットを設ける場合、当該オフセット部には、原則として、通気管を設ける。","冷温水横走り配管の径違い管を偏心レジューサーで接続する場合、管内の下面に段差ができないように接続する。"],"a":[4],"m":"exact","n":"","e":"上り勾配の冷温水横走り管の径違いは、空気だまりを防ぐため管内の「上面」に段差ができないように接続する。","f":[],"o":["img/R2B11_o0.png"],"g":64,"cat":"B施工","neg":true},{"id":"R2B12","y":"R2","p":"B","no":12,"s":"配管及び配管付属品の施工に関する記述のうち、適当でないものはどれか。","c":["屋外埋設の排水管には、合流、屈曲等がない直管部であっても、管径の120倍以内に1箇所、排水桝を設ける。","ステンレス鋼管の溶接接合は、管内にアルゴンガス又は窒素ガスを充満させてから、TIG溶接により行う。","遠心ポンプの吸込み管は、ポンプに向かって1/100程度の下り勾配とし、管内の空気がポンプ側に抜けないようにする。","配管用炭素鋼鋼管を溶接接合する場合、管外面の余盛高さは3mm程度以下とし、それを超える余盛はグラインダー等で除去する。"],"a":[3],"m":"exact","n":"","e":"遠心ポンプの吸込み管は、ポンプに向かって上り勾配とし、空気だまりができないようにする。","f":[],"o":["img/R2B12_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R2B13","y":"R2","p":"B","no":13,"s":"ダクト及びダクト付属品の施工に関する記述のうち、適当でないものはどれか。","c":["ダクトの系統において、常用圧力（通常の運転時におけるダクト内圧）が±500Paを超える部分は、高圧ダクトとする。","送風機の吐出し口直後に風量調節ダンパーを取り付ける場合、風量調節ダンパーの軸が送風機の羽根車の軸に対し平行となるようにする。","亜鉛鉄板製の排煙ダクトと排煙機の接続は、原則として、たわみ継手等を介さずに、直接フランジ接合とする。","送風機の吐出し口直後にエルボを取り付ける場合、吐出し口からエルボまでのダクトの長さは、送風機の羽根車の径の1.5倍以上とする。"],"a":[2],"m":"exact","n":"","e":"吐出し直後の風量調節ダンパーは、軸が送風機の羽根車の軸と「直角」になるように取り付ける。","f":[],"o":["img/R2B13_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R2B14","y":"R2","p":"B","no":14,"s":"ダクト及びダクト付属品の施工に関する記述のうち、適当でないものはどれか。","c":["口径が600mm以上のスパイラルダクトの接続は、一般的に、フランジ継手が使用される。","排煙ダクトに使用する亜鉛鉄板製の長方形ダクトの板厚は、高圧ダクトの板厚とする。","シーリングディフューザー形吹出口は、最小拡散半径が重なるように配置する。","長辺が450mmを超える保温を施さない亜鉛鉄板製ダクトには、補強リブを入れる。"],"a":[3],"m":"exact","n":"","e":"シーリングディフューザーは、最小拡散半径が重ならないように配置する。","f":[],"o":["img/R2B14_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R2B15","y":"R2","p":"B","no":15,"s":"保温、保冷の施工に関する記述のうち、適当でないものはどれか。","c":["スパイラルダクトの保温に帯状保温材を用いる場合は、原則として、鉄線を150mm以下のピッチでらせん状に巻き締める。","保温材相互のすきまはできる限り少なくし、保温材の重ね部の継目は同一線上とならないようにする。","保温材の取付けが必要な機器の扉、点検口廻りは、その開閉に支障がなく、保温効果を減じないように施工する。","テープ巻き仕上げの重ね幅は15mm以上とし、垂直な配管の場合は、上方から下方へ巻く。"],"a":[4],"m":"exact","n":"","e":"垂直な配管のテープ巻きは、下方から上方へ巻き上げる。","f":[],"o":["img/R2B15_o0.png"],"g":65,"cat":"B施工","neg":true},{"id":"R2B16","y":"R2","p":"B","no":16,"s":"ボイラーの単体試運転調整に関する記述のうち、適当でないものはどれか。","c":["ガスだきの場合は、ガス配管の空気抜きを行い、ガス圧の調整を行う。","煙道ダンパーを開き、炉内ガスを排出し、蒸気ボイラーの場合は、主蒸気弁を開く。","オイルヒーターがある場合、オイルヒーターの電源を入れ、油を予熱する。","火炎監視装置（フレームアイ）の前面をふさぎ、不着火や失火の場合のバーナー停止の作動を確認する。"],"a":[2],"m":"exact","n":"","e":"点火前の炉内換気（プレパージ）では煙道ダンパーを開くが、蒸気ボイラーの主蒸気弁は閉じておき、昇圧後に徐々に開く。","f":[],"o":["img/R2B16_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R2B17","y":"R2","p":"B","no":17,"s":"防振に関する記述のうち、適当でないものはどれか。","c":["共通架台に複数個の回転機械を設置する場合、防振材は一番低い回転数に合わせて選定する。","金属バネは、防振ゴムに比べて、一般的に、低周波数の振動の防振に優れている。","金属バネは、減衰比が大きいため、共振時の振幅が小さく、サージング現象が起こりにくい。","金属バネは、防振ゴムに比べて、一般的に、耐寒性、耐熱性、耐水性、耐油性に優れている。"],"a":[3],"m":"exact","n":"","e":"金属バネは減衰比が「小さい」ため、共振時の振幅が大きく、サージング現象も起こりやすい。","f":[],"o":["img/R2B17_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R2B18","y":"R2","p":"B","no":18,"s":"建設業を行う事業者の安全衛生管理体制に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["特定元方事業者は、選任した統括安全衛生責任者に、安全管理者、衛生管理者等を指揮させなければならない。","特定元方事業者は、下請を含めた現場の労働者の数が常時50人以上の場合（ずい道等の建設の仕事等を除く。）、統括安全衛生責任者を選任しなければならない。","事業者は、常時50人以上の労働者を使用する事業場ごとに、産業医を選任しなければならない。","事業者は、選任した産業医に、労働者の健康管理その他の厚生労働省令で定める事項を行わせなければならない。"],"a":[1],"m":"exact","n":"","e":"統括安全衛生責任者が指揮するのは元方安全衛生管理者等。安全管理者・衛生管理者を指揮するのは事業場単位の総括安全衛生管理者。","f":[],"o":["img/R2B18_o0.png"],"g":66,"cat":"B法規","neg":true},{"id":"R2B19","y":"R2","p":"B","no":19,"s":"建設工事現場における安全衛生管理に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["事業者は、高さが2m以上の作業床のない箇所でフルハーネス型墜落制止用器具を用いて行う作業に係る業務に労働者をつかせるときは、当該業務に関する特別の教育を行わなければならない。","事業者は、作業主任者を選任したときは、当該作業主任者の氏名及びその者に行わせる事項を関係労働者に周知させなければならない。","事業者は、研削といしの取替え又は取替え時の試運転の業務に労働者をつかせるときは、当該業務に関する特別の教育を行わなければならない。","事業者は、作業床の高さが10m以上の高所作業車の運転（道路上を走行させる運転を除く。）の業務については、作業主任者に当該業務に従事する労働者の指揮を行わせなければならない。"],"a":[4],"m":"exact","n":"","e":"作業床10m以上の高所作業車の運転は技能講習修了者が行う業務で、作業主任者の選任対象ではない。","f":[],"o":["img/R2B19_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R2B20","y":"R2","p":"B","no":20,"s":"次の記述のうち、「労働基準法」上、誤っているものはどれか。","c":["常時10人以上の労働者を使用する使用者は、就業規則を作成して所轄労働基準監督署長に届け出なければならない。","使用者は、満18歳に満たない者を、最大積載荷重1t以上の人荷共用のエレベーターの運転業務に就かせてはならない。","使用者は、各事業場ごとに労働者名簿を、各労働者（日々雇い入れられる者を除く。）について調整し、労働者の氏名、生年月日、履歴等を記入しなければならない。","使用者の責に帰すべき事由による休業の場合においては、使用者は、休業期間中当該労働者に、その平均賃金の100分の60以上の休業手当を支払わなければならない。"],"a":[2],"m":"exact","n":"","e":"年少者の就業が禁止されるのは、最大積載荷重2t以上の人荷共用・荷物用エレベーターの運転。1t以上ではない。","f":[],"o":["img/R2B20_o0.png"],"g":67,"cat":"B法規","neg":true},{"id":"R2B21","y":"R2","p":"B","no":21,"s":"次の記述のうち、「建築基準法」上、誤っているものはどれか。","c":["居室の天井の高さは、2.1m以上とし、一室で天井の高さの異なる部分がある場合においては、その平均の高さによるものとする。","建築主とは、建築物に関する工事の請負契約の注文者又は請負契約によらないで自らその工事をする者をいう。","住宅の居室には、採光のための窓その他の開口部を設け、その採光に有効な部分の面積は、原則として、その居室の床面積に対して1/7以上とする。","地階とは、床が地盤面下にある階で、床面から地盤面までの高さがその階の天井の高さの2/3以上のものをいう。"],"a":[4],"m":"exact","n":"","e":"地階は、床面から地盤面までの高さがその階の天井高さの1/3以上のもの。2/3ではない。","f":[],"o":["img/R2B21_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R2B22","y":"R2","p":"B","no":22,"s":"建築設備に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["地階を除く階数が2以上である建築物に設ける冷房設備等のダクトは、屋外に面する部分その他防火上支障がないものとして国土交通大臣が定める部分を除き、不燃材料で造らなければならない。","建築物に設けるボイラーの煙突の地盤面からの高さは、ガスを使用するボイラーにあっては、原則として、9m以上としなければならない。","開口部の少ない建築物等の換気設備において、中央管理方式の空気調和設備とは、空気を浄化し、その温度、湿度及び流量を調節して供給（排出を含む。）をすることができる設備をいう。","通気管は、配管内の空気が屋内に漏れることを防止する装置が設けられている場合、必ずしも直接外気に衛生上有効に開放しなくてもよい。"],"a":[1],"m":"exact","n":"","e":"ダクトを不燃材料とする対象は、地階を除く階数が3以上の建築物や地階に居室を有する建築物など。階数2以上ではない。","f":[],"o":["img/R2B22_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R2B23","y":"R2","p":"B","no":23,"s":"建設業の種類のうち、「建設業法」上、指定建設業に該当しないものはどれか。","c":["管工事業","建築工事業","電気工事業","水道施設工事業"],"a":[4],"m":"exact","n":"","e":"指定建設業は土木・建築・電気・管・鋼構造物・舗装・造園の7業種。水道施設工事業は該当しない。","f":[],"o":["img/R2B23_o0.png"],"g":68,"cat":"B法規","neg":true},{"id":"R2B24","y":"R2","p":"B","no":24,"s":"次のうち、「建設業法」上、請負契約書に記載しなければならない事項として、定められていないものはどれか。","c":["現場代理人の権限に関する事項","価格等の変動若しくは変更に基づく請負代金の額又は工事内容の変更","工事の施工により第三者が損害を受けた場合における賠償金の負担に関する定め","各当事者の履行の遅滞その他債務の不履行の場合における遅延利息、違約金その他の損害金"],"a":[1],"m":"exact","n":"","e":"現場代理人の権限に関する事項は、請負契約書の法定記載事項ではない（注文者への書面通知事項）。","f":[],"o":["img/R2B24_o0.png"],"g":27,"cat":"B法規","neg":true},{"id":"R2B25","y":"R2","p":"B","no":25,"s":"屋内消火栓設備の加圧送水装置に用いるポンプに関する記述のうち、「消防法」上、誤っているものはどれか。","c":["ポンプには、その吐出側に圧力計、吸込側に連成計を設けるものとする。","ポンプは、直接操作による停止又は消火栓箱の直近に設けられた操作部からの遠隔操作による停止ができるものとする。","ポンプには、水源水位がポンプより低い場合、専用の呼水槽を設けるものとする。","ポンプの始動を明示する表示灯を設ける場合、当該表示灯は赤色とし、消火栓箱の内部又はその直近に設けるものとする。"],"a":[2],"m":"exact","n":"","e":"屋内消火栓のポンプは直接操作によってのみ停止できるものとし、遠隔操作による停止はできない。","f":[],"o":["img/R2B25_o0.png"],"g":17,"cat":"B法規","neg":true},{"id":"R2B26","y":"R2","p":"B","no":26,"s":"次のうち、「消防法」上、消防の用に供する設備に該当しないものはどれか。","c":["粉末消火設備","泡消火設備","連結送水管","スプリンクラー設備"],"a":[3],"m":"exact","n":"","e":"連結送水管は「消火活動上必要な施設」。消防の用に供する設備（消火・警報・避難設備）ではない。","f":[],"o":["img/R2B26_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R2B27","y":"R2","p":"B","no":27,"s":"指定地域内における特定建設作業に関する記述のうち、「騒音規制法」上、誤っているものはどれか。\nただし、災害その他非常の事態の発生により当該特定建設作業を緊急に行う必要がある場合を除く。","c":["特定建設作業とは、建設工事として行われる作業のうち、著しい騒音を発生する作業であって、びょう打機を使用する作業等をいう。","建設作業として行われる作業のうち、著しい騒音を発生する作業は、当該作業がその作業を開始した日に終わるものであっても、特定建設作業に該当する場合がある。","特定建設作業の実施の届け出は、当該特定建設作業の開始の日の7日前までに行わなければならない。","特定建設作業を伴う建設工事を施工しようとする者は、特定建設作業の場所及び実施の期間等の事項を市町村長に届け出なければならない。"],"a":[2],"m":"exact","n":"","e":"作業を開始した日に終わるものは、特定建設作業に該当しない。","f":[],"o":["img/R2B27_o0.png"],"g":36,"cat":"B法規","neg":true},{"id":"R2B28","y":"R2","p":"B","no":28,"s":"建築物の用途、及び、その用途に供される部分の延べ面積の組合せのうち、「建築物における衛生的環境の確保に関する法律」上、特定建築物に該当しないものはどれか。\n(用途) (延べ面積（m²）)","c":["事務所 3,000","百貨店 3,000","中学校 8,000","共同住宅 8,000"],"a":[4],"m":"exact","n":"","e":"共同住宅は建築物衛生法の特定用途に含まれず、延べ面積にかかわらず特定建築物に該当しない。","f":[],"o":["img/R2B28_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R2B29","y":"R2","p":"B","no":29,"s":"産業廃棄物の処理に関する記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","c":["産業廃棄物管理票（マニフェスト）を交付された処分受託者は、当該処分を終了した日から10日以内に、管理票交付者に当該管理票の写しを送付しなければならない。","排出事業者が自ら産業廃棄物を運搬する場合、その運搬車両には産業廃棄物収集運搬車である旨と、排出事業者名を表示しなければならない。","排出事業者は、専ら再生利用の目的となる産業廃棄物のみの運搬又は処分を業として行う者に、再生利用する産業廃棄物のみの運搬又は処分を委託する場合、産業廃棄物管理票（マニフェスト）の交付を要しない。","建築物の改築に伴って生じた廃石こうボード、木くず、繊維くずは、安定型最終処分場で処分することができる。"],"a":[4],"m":"exact","n":"","e":"廃石こうボード・木くず・繊維くずは安定型品目ではなく、安定型最終処分場では処分できない（管理型処分場で処分）。","f":[],"o":["img/R2B29_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R3A01","y":"R3","p":"A","no":1,"s":"日射に関する記述のうち、適当でないものはどれか。","c":["大気の透過率は、主に大気中に含まれる二酸化炭素の量に影響される。","日射のエネルギーは、紫外線部よりも赤外線部及び可視線部に多く含まれている。","天空日射とは、大気成分により散乱、反射して天空の全方向から届く太陽放射をいう。","日射の影響を温度に換算し、外気温度に加えて等価な温度にしたものを相当外気温度という。"],"a":[1],"m":"exact","n":"","e":"大気の透過率は主に大気中の水蒸気量や塵埃の量に影響される。二酸化炭素量ではない。","f":[],"o":["img/R3A01_o0.png"],"g":18,"cat":"A基礎・電気・建築","neg":true},{"id":"R3A02","y":"R3","p":"A","no":2,"s":"温熱環境に関する記述のうち、適当でないものはどれか。","c":["予想平均申告（PMV）とは、人体の熱的中立に近い状態の温冷感を予測する指標である。","met（メット）とは、人体の代謝量を示す指標であり、椅座安静状態の代謝量1metは、単位体表面積当たり100Wである。","clo（クロ）は、衣服の断熱性を示す単位で、1cloは約0.155m²・℃/Wである。","人体は周囲空間との間で対流と放射による熱交換を行っており、これと同じ量の熱を交換する均一温度の閉鎖空間の温度を作用温度（OT）という。"],"a":[2],"m":"exact","n":"","e":"1metは椅座安静時の代謝量で、単位体表面積当たり約58.2W/m²。100Wではない。","f":[],"o":["img/R3A02_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R3A03","y":"R3","p":"A","no":3,"s":"室内の空気環境に関する記述のうち、適当でないものはどれか。","c":["空気中の二酸化炭素濃度が20％程度以上になると、人体に致命的な影響を与える。","空気中の一酸化炭素濃度が2％になると、20分程度で人体に頭痛、目まいが生じる。","燃焼において、酸素濃度が19％に低下すると、不完全燃焼により急速に一酸化炭素が発生する。","人体からの二酸化炭素発生量は、その人の作業状態によって変化し、代謝量が多くなると増加する。"],"a":[2],"m":"exact","n":"","e":"一酸化炭素は極めて有毒で、0.02％程度でも2〜3時間で頭痛を生じ、1％を超えると短時間で死亡の危険がある。2％で20分程度の頭痛という記述は過小評価で誤り。","f":[],"o":["img/R3A03_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R3A04","y":"R3","p":"A","no":4,"s":"流体に関する記述のうち、適当でないものはどれか。","c":["ニュートン流体では、摩擦応力は境界面と垂直方向の速度勾配に動粘性係数を乗じたものとなる。","空気の粘性係数は、一定の圧力のもとでは、温度の上昇とともに大きくなる。","レイノルズ数は、流体に作用する慣性力と粘性力の比で表される無次元数で、流体の平均流速に比例する。","任意の点の速度、圧力等のすべての状態が時間的に変化しない流れを定常流という。"],"a":[1],"m":"exact","n":"","e":"ニュートン流体の摩擦応力は、速度勾配に「粘性係数（粘度）」を乗じたもの。動粘性係数（＝粘性係数÷密度）ではない。","f":[],"o":["img/R3A04_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R3A05","y":"R3","p":"A","no":5,"s":"流体が直管路を流れている場合、流速が1/2倍となったときの摩擦による圧力損失の変化の割合として、適当なものはどれか。\nただし、圧力損失は、ダルシー・ワイスバッハの式によるものとし、管摩擦係数は一定とする。","c":["1/4倍","1/2倍","2倍","4倍"],"a":[1],"m":"exact","n":"","e":"ダルシー・ワイスバッハの式では圧力損失は流速の2乗に比例する。(1/2)²＝1/4倍。","f":[],"o":["img/R3A05_o0.png"],"g":91,"cat":"A基礎・電気・建築","neg":false},{"id":"R3A06","y":"R3","p":"A","no":6,"s":"下図に示す断面積の大きい開放水槽において、流出孔における流速を求めるときに適用できる「定理の名称」と「流速値」の組合せとして、適当なものはどれか。\nただし、gは重力加速度、ρは流体の密度、Hは流出孔から水面までの高さとする。\n（定理の名称） （流速値）","c":["パスカルの定理　√(2gH)","トリチェリの定理　√(2gH)","パスカルの定理　√(2ρgH)","トリチェリの定理　√(2ρgH)"],"a":[2],"m":"exact","n":"","e":"開放水槽の流出孔の流速はトリチェリの定理により v＝√(2gH)。密度ρは含まない。","f":["img/R3A06_f0.png","img/R3A06_f1.png"],"o":["img/R3A06_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R3A07","y":"R3","p":"A","no":7,"s":"下図に示す、熱機関のカルノーサイクルに関する記述のうち、適当でないものはどれか。","c":["カルノーサイクルは、等温膨張、断熱膨張、等温圧縮、断熱圧縮の四つの可逆過程から構成される。","カルノーサイクルは、高温熱源と低温熱源の温度差が大きいほど効率が高くなる。","等温膨張では、外部から熱量を受け取り、等温圧縮では、熱量を外部に放出する。","断熱膨張では、気体の温度が上昇し、断熱圧縮では気体の温度が低下する。"],"a":[4],"m":"exact","n":"","e":"断熱膨張では気体の温度は低下し、断熱圧縮では上昇する。記述は逆。","f":["img/R3A07_f0.png"],"o":["img/R3A07_o0.png"],"g":69,"cat":"A基礎・電気・建築","neg":true},{"id":"R3A08","y":"R3","p":"A","no":8,"s":"伝熱に関する記述のうち、適当でないものはどれか。","c":["強制対流熱伝達とは、外的駆動力による強制対流時の流体と壁面の間の熱移動現象をいう。","固体内の熱移動には、高温部と低温部の温度差による熱伝導と放射による熱伝達がある。","固体壁両側の気体間の熱通過による熱移動量は、気体の温度差と固体壁の面積に比例する。","熱放射は、電磁波によって熱エネルギーが移動するため、熱を伝える物質は不要である。"],"a":[2],"m":"exact","n":"","e":"固体内の熱移動は熱伝導による。放射による熱伝達は固体内では生じない。","f":[],"o":["img/R3A08_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R3A09","y":"R3","p":"A","no":9,"s":"燃焼に関する記述のうち、適当でないものはどれか。","c":["気体燃料、液体燃料、固体燃料のうち、燃焼に最も多く空気を必要とするのは固体燃料である。","高発熱量とは、燃焼ガスに含まれる水蒸気が凝縮したときに得られる潜熱を含めた発熱量をいい、低発熱量とは、潜熱を含まない発熱量をいう。","燃焼ガス中の窒素酸化物の量は、高温燃焼時より低温燃焼時のほうが多い。","空気過剰率が大きすぎると廃ガスの持ち去る熱による損失が多くなる。"],"a":[3],"m":"exact","n":"","e":"窒素酸化物（サーマルNOx）は高温燃焼ほど多く発生する。低温燃焼の方が少ない。","f":[],"o":["img/R3A09_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R3A10","y":"R3","p":"A","no":10,"s":"腐食に関する記述のうち、適当でないものはどれか。","c":["選択腐食は、合金成分中のある種の成分のみが溶解する現象であり、黄銅製バルブ弁棒で生じる場合がある。","かい食は、比較的速い流れの箇所で局部的に起こる現象で、銅管の曲がり部で生じる場合がある。","異種金属接触腐食は、貴な金属と卑な金属を組み合わせた場合に生じる電極電位差により、卑な金属が局部的に腐食する現象である。","マクロセル腐食は、アノードとカソードが分離して生じる電位差により、陰極部分が腐食する現象である。"],"a":[4],"m":"exact","n":"","e":"マクロセル腐食で腐食するのはアノード（陽極）部分。カソード（陰極）側は腐食しない。","f":[],"o":["img/R3A10_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R3A11","y":"R3","p":"A","no":11,"s":"電気設備工事に関する記述のうち、適当でないものはどれか。","c":["使用電圧100V回路の金属製ボックスには、D種接地工事を施す。","使用電圧100Vの屋外機器への分岐回路には、漏電遮断器を使用する。","高低差のあるケーブルラックに敷設するケーブルは、ケーブルラックの子げたに固定する。","低圧電路の電線相互間の熱絶縁抵抗は、使用電圧が高いほど低い値とする。"],"a":[4],"m":"exact","n":"","e":"低圧電路の絶縁抵抗値は、使用電圧が高いほど「高い」値が求められる（例：300V以下・対地150V以下0.1MΩ、300V超0.4MΩ）。","f":[],"o":["img/R3A11_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R3A12","y":"R3","p":"A","no":12,"s":"三相誘導電動機の電気設備工事に関する記述のうち、適当でないものはどれか。","c":["制御盤から電動機までの配線は、CVケーブル又はEM-CEケーブルで接続する。","制御盤からスターデルタ始動方式の電動機までの配線は、4本の電線で接続する。","電動機の保護回路には、過負荷及び欠相を保護できる継電器を使用する。","インバータ装置は、商用周波数から任意の周波数に変換して、電動機を可変速運転する。"],"a":[2],"m":"exact","n":"","e":"スターデルタ始動では電動機の6端子を引き出すため、制御盤から電動機まで6本の電線で接続する。","f":[],"o":["img/R3A12_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R3A13","y":"R3","p":"A","no":13,"s":"コンクリートの性状に関する記述のうち、適当でないものはどれか。","c":["コンクリートの中性化とは、一般的に、コンクリート表面で接する空気中の酸素の作用により、アルカリ性を失っていく現象をいう。","水セメント比が小さく密実なコンクリートほど中性化の進行は遅くなる。","コンクリート打込み時に生じるコールドジョイントは、構造上の欠陥となりやすい。","スランプ値は、コンクリートのワーカビリティーを評価する指標の1つである。"],"a":[1],"m":"exact","n":"","e":"中性化は、空気中の「二酸化炭素」がコンクリート中の水酸化カルシウムと反応してアルカリ性を失う現象。酸素ではない。","f":[],"o":["img/R3A13_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R3A14","y":"R3","p":"A","no":14,"s":"下図のように単純梁に集中荷重P₁及びP₂が作用したとき、支点Aの鉛直方向の反力の値として、適当なものはどれか。","c":["3kN","4kN","5kN","6kN"],"a":[4],"m":"exact","n":"","e":"支点Bまわりのモーメントのつり合い：R_A×6m＝6kN×5m＋3kN×2m＝36 → R_A＝6kN。","f":["img/R3A14_f0.png"],"o":["img/R3A14_o0.png"],"g":90,"cat":"A基礎・電気・建築","neg":false},{"id":"R3A15","y":"R3","p":"A","no":15,"s":"建築計画に関する記述のうち、省エネルギーの観点から、適当でないものはどれか。","c":["建物の出入口には、風除室を設ける。","東西面の窓面積を極力減らす建築計画とする。","窓には、ダブルスキン、エアフローウィンドウ等を用いる。","非空調室は、建物の外周部より、なるべく内側に配置する。"],"a":[4],"m":"exact","n":"","e":"非空調室（倉庫・階段・便所等）は外周部に配置して、空調室への外部熱負荷の緩衝帯とするのが省エネルギー上有効。","f":[],"o":["img/R3A15_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R3A16","y":"R3","p":"A","no":16,"s":"空気調和方式に関する記述のうち、適当でないものはどれか。","c":["変風量単一ダクト方式は、定風量単一ダクト方式に比べ、送風機動力を節減できる。","変風量単一ダクト方式では、必要外気量の確保等のため、最小風量の設定を行う。","ダクト併用ファンコイルユニット方式は、全空気方式に比べ、外気冷房を行いやすい。","ダクト併用ファンコイルユニット方式は、全空気方式に比べ、一般的に、搬送動力が小さい。"],"a":[3],"m":"exact","n":"","e":"ダクト併用ファンコイルユニット方式は、全空気方式に比べ送風量（外気導入量）が少ないため外気冷房を行いにくい。","f":[],"o":["img/R3A16_o0.png"],"g":6,"cat":"A空調","neg":true},{"id":"R3A17","y":"R3","p":"A","no":17,"s":"下図に示す冷房時における定風量単一ダクト方式の湿り空気線図に関する記述のうち、適当でないものはどれか。","c":["コイル出口空気状態点④から⑤は送風機の発熱等による温度上昇であり、⑤から②は室内での状態変化でSHFの状態線上を移動する。「外気量 ②と③を結ぶ線分の長さ","混合空気状態点③は、外気量と送風量の比から、 = と送風量 ①と②を結ぶ線分の長さ」して求める。","混合空気状態点③とコイル出口空気状態点④の比エンタルピー差から求めたコイル冷却負荷のうち、外気負荷は室内状態点②と混合空気状態点③の比エンタルピー差の部分となる。","冷房吹出温度差は、混合空気状態点③とコイル出口空気状態点④の乾球温度差から求める。"],"a":[4],"m":"exact","n":"","e":"冷房吹出温度差は、室内空気の状態点と吹出空気（コイル出口）状態点の乾球温度差から求める。混合空気状態点ではない。","f":["img/R3A17_f0.png"],"o":["img/R3A17_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R3A18","y":"R3","p":"A","no":18,"s":"熱負荷に関する記述のうち、適当でないものはどれか。","c":["実効温度差は、外壁面全日射量、外壁日射吸収率、外壁表面熱伝達率等の要因により変わる。","壁体の構造が同じであっても、壁体表面の熱伝達率が大きくなるほど、熱通過率は大きくなる。","暖房負荷計算では、暖房室が外気に面したドアを有する場合、隙間風負荷を考慮する。","暖房負荷計算では、外壁の負荷は、一般的に、実効温度差を用いて計算する。"],"a":[4],"m":"exact","n":"","e":"暖房負荷計算では日射や構造体の蓄熱による時間遅れを考慮しないため、外壁は室内外の温度差で計算する。実効温度差は冷房負荷計算で用いる。","f":[],"o":["img/R3A18_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R3A19","y":"R3","p":"A","no":19,"s":"空気調和設備における自動制御に関する記述のうち、適当でないものはどれか。","c":["加湿器は、冷温水ポンプとのインターロックを設定する。","冷却塔のファンは、冷却塔の冷却水出口温度による二位置制御とする。","外気取入れダンパーは、空気調和機の運転開始時に一定時間、閉とする。","加湿器は、代表室内の湿度調節器による二位置制御とする。"],"a":[1],"m":"exact","n":"","e":"加湿器は送風機（空調機ファン）とインターロックし、送風停止時に加湿しないようにする。冷温水ポンプではない。","f":[],"o":["img/R3A19_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R3A20","y":"R3","p":"A","no":20,"s":"地域冷暖房に関する記述のうち、適当でないものはどれか。","c":["地域冷暖房には、熱源の集約化により、人件費の節約が図れること、火災や騒音のおそれが小さくなること等の利点がある。","地域冷暖房の社会的な利点には、大気汚染防止、二酸化炭素排出量削減等の総合的な環境保全効果がある。","建物ごとに熱源機器を設置する必要がないため、熱需要者側の建物は床面積の利用率が高くなる。","地下鉄の排熱、ゴミ焼却熱等の未利用排熱は、地域冷暖房には利用することができない。"],"a":[4],"m":"exact","n":"","e":"地下鉄排熱やごみ焼却熱などの未利用エネルギーは、地域冷暖房の熱源として積極的に利用される。","f":[],"o":["img/R3A20_o0.png"],"g":51,"cat":"A空調","neg":true},{"id":"R3A21","y":"R3","p":"A","no":21,"s":"空気熱源ヒートポンプに関する記述のうち、適当でないものはどれか。","c":["空冷ユニットを複数台連結するモジュール型は、部分負荷に対応して運転台数を変えることができる。","空冷ユニットを複数台連結するモジュール型は、法定冷凍トンの算定をする場合、連結する全モジュールを合算する必要がある。","ヒートポンプでは、外気温度が低くなると暖房能力が低下する。","ヒートポンプの成績係数は、圧縮仕事の駆動エネルギーが暖房能力に追加されるため、冷凍機の成績係数より高くなる。"],"a":[2],"m":"exact","n":"","e":"冷媒設備が独立したモジュールを連結したモジュール型は、法定冷凍トンをモジュールごとに算定し、合算する必要はない。","f":[],"o":["img/R3A21_o0.png"],"g":52,"cat":"A空調","neg":true},{"id":"R3A22","y":"R3","p":"A","no":22,"s":"換気に関する記述のうち、適当でないものはどれか。","c":["自然換気設備の排気口は、給気口より高い位置に設け、常時解放された構造とし、かつ、排気筒の立ち上がり部分に直結する必要がある。","開放式燃焼器具の排気フードにⅡ型フードを用いる場合、火源からフード下端までの高さは1m以内としなければならない。","床面積の1/30以上の面積の窓その他、換気に有効な開口部を有する事務所の居室には、換気設備は不要である。","住宅等の居室のシックハウス対策としての必要有効換気量を算定する場合の換気回数は、一般的に、0.5〔回/h〕以上とする。"],"a":[3],"m":"exact","n":"","e":"居室の床面積の1/20以上の換気上有効な開口部があれば換気設備は不要。1/30では足りない。","f":[],"o":["img/R3A22_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R3A23","y":"R3","p":"A","no":23,"s":"機械換気設備により電気室において発生した熱を排除するときに必要な最小換気量として、適当なものはどれか。\nただし、発生熱量は4kW、許容室温は40℃、外気温度は35℃、空気の比熱は1.0kJ/(kg・K)、空気の密度は1.2kg/m³とする。","c":["1,200m³/h","1,600m³/h","2,400m³/h","2,800m³/h"],"a":[3],"m":"exact","n":"","e":"Q＝発熱量÷(密度×比熱×温度差)＝(4kW×3,600)÷(1.2×1.0×(40－35))＝14,400÷6＝2,400m³/h。","f":[],"o":["img/R3A23_o0.png"],"g":7,"cat":"A換気・排煙","neg":false},{"id":"R3A24","y":"R3","p":"A","no":24,"s":"下図に示す2階建て建築物の機械排煙設備において、各部が受け持つ必要最小風量として、適当でないものはどれか。\nただし、本設備は、「建築基準法」上、区画、階及び全館避難安全検証法によらないものとする。また、上下階の排煙口は同時開放しないものとし、隣接する2防煙区画は同時開放の可能性があるものとする。","c":["ダクトＡ部：42,000m³/h","ダクトＢ部：57,000m³/h","ダクトＣ部：57,000m³/h","排煙機 ：57,000m³/h"],"a":[4],"m":"exact","n":"","e":"排煙機は最大防煙区画の床面積1m²につき2m³/min以上：500×2＝1,000m³/min＝60,000m³/h必要。57,000m³/hでは不足。ダクトA（1階で隣接2区画同時開放：300＋400＝700m³/min＝42,000m³/h）、B（2階：450＋500＝950→57,000m³/h）、CはA・Bの大きい方で57,000m³/h。","f":["img/R3A24_f0.png"],"o":["img/R3A24_o0.png"],"g":29,"cat":"A換気・排煙","neg":true},{"id":"R3A25","y":"R3","p":"A","no":25,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は、「建築基準法」上、区画、階、全館避難安全検証法、及び、特殊な構造によらないものとする。","c":["自然排煙設備の排煙口は、防煙区画の床面積の1/50以上の排煙上有効な開口面積を有する必要がある。","機械排煙設備の排煙口は、防煙区画の各部分から水平距離で30m以下となるように設ける。","機械排煙設備において、特別避難階段の付室を兼用する非常用エレベーターの乗降ロビーの排煙風量は、6〔m³/s〕以上とする。","機械排煙設備において、排煙口は吸込み風速を20〔m/s〕以下、排煙ダクトはダクト内風速を10〔m/s〕以下となるようにする。"],"a":[4],"m":"exact","n":"","e":"排煙口の吸込み風速は10m/s以下、排煙ダクト内風速は20m/s以下とする。記述は数値が逆。","f":[],"o":["img/R3A25_o0.png"],"g":15,"cat":"A換気・排煙","neg":true},{"id":"R3A26","y":"R3","p":"A","no":26,"s":"上水道に関する記述のうち、適当でないものはどれか。","c":["凝集池は、凝集剤と原水を混和させる混和池と、混和池で生成した微小フロックを大きく成長させるフロック形成池から構成される。","取水施設は、取水された原水を浄水施設まで導く施設であり、その方式には自然流下式、ポンプ加圧式及び併用式がある。","配水施設は、浄化した水を給水区域の需要家にその必要とする水圧で所要量を供給するための施設で、配水池、ポンプ、配水管等で構成される。","送水施設の計画送水量は、計画1日最大給水量（1年を通じて、1日の給水量のうち最も多い量）を基準として定める。"],"a":[2],"m":"exact","n":"","e":"取水施設は河川・地下水等から原水を取り入れる施設。原水を浄水施設まで導くのは「導水施設」。","f":[],"o":["img/R3A26_o0.png"],"g":28,"cat":"A衛生","neg":true},{"id":"R3A27","y":"R3","p":"A","no":27,"s":"下水道に関する記述のうち、適当でないものはどれか。","c":["管きょ底部に沈殿物が堆積しないように、原則として、汚水管きょの最小流速は、0.6〔m/s〕以上とする。","流域下水道は、二以上の市町村の区域からの下水を排除又は処理する下水道で、終末処理場を持っているものをいう。","管きょは、固形物の停滞を防ぐために、流量が大きくなる下流ほど勾配が急になるようにする。","分流式の下水管きょにおける最小口径は、一般的に、汚水管きょでは200mm、雨水管きょでは250mmである。"],"a":[3],"m":"exact","n":"","e":"管きょの勾配は、下流ほど流量が増えるため「緩やか」にし、流速は下流ほど漸増させる。","f":[],"o":["img/R3A27_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R3A28","y":"R3","p":"A","no":28,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["直結増圧方式は、高置タンク方式に比べて、給水引込み管の管径が大きくなる。","揚水ポンプの吸込揚程の最大値は、常温の水では10m程度である。","大便器洗浄弁及び小便器洗浄弁の必要給水圧力は、一般的に、70kPa程度である。","受水タンクの底部には、吸込みピットを設け、ピットに向かって1/100程度の勾配をとる。"],"a":[2],"m":"exact","n":"","e":"吸込揚程は理論上約10m（大気圧相当）だが、管路損失や飽和蒸気圧の影響で、常温水の実用上の限度は6m程度。","f":[],"o":["img/R3A28_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R3A29","y":"R3","p":"A","no":29,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["ウォーターハンマー防止等のため、給水管内の流速は2.0m/sを超えないものとする。","クロスコネクション防止対策として、上水管と雑用水管とで、異なる配管材質を選定する。","受水タンクの容量は、一般的に、時間最大予想給水量の1/2程度の値とする。","受水タンクにおいて、地震時に水面が波動を起こし、水の自由表面が水槽の天井面や側面に衝突する現象をスロッシングという。"],"a":[3],"m":"exact","n":"","e":"受水タンクの容量は、一般的に1日予想給水量の1/2程度（4/10〜6/10）。時間最大予想給水量ではない。","f":[],"o":["img/R3A29_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R3A30","y":"R3","p":"A","no":30,"s":"給湯設備に関する記述のうち、適当でないものはどれか。","c":["給湯単位に対する給湯同時使用流量は、一般的に、病院、レストラン、共同住宅、事務所の順に、大きくなる。","瞬間湯沸器の出湯能力は、一般的に、水温より25℃高い湯を1L/min出湯する能力を1号としている。","循環式浴槽設備では、レジオネラ症防止対策のため、循環している浴槽水をシャワーや打たせ湯には使用しない。","中央式給湯設備の貯湯タンクに接続する配管は、一般的に、還り管は低い位置で接続し、往き管は高い位置で接続する。"],"a":[1],"m":"exact","n":"","e":"給湯単位から求める同時使用流量は建物用途により異なり、記述の大小順は誤り。用途別の曲線（給湯単位法）で確認する。","f":[],"o":["img/R3A30_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R3A31","y":"R3","p":"A","no":31,"s":"排水設備に関する記述のうち、適当でないものはどれか。","c":["管径100mmの排水管の掃除口の設置間隔は、30m以内とする。","排水管の管径決定において、ポンプからの排水管を排水横主管に接続する場合は、器具排水負荷単位に換算して管径を決定する。","排水立て管に対して45°以下のオフセットの管径は、垂直な排水立て管とみなして決定してよい。","オイル阻集器は、洗車の時に流出する土砂及びワックス類も阻集できる構造とする。"],"a":[1],"m":"exact","n":"","e":"排水管の掃除口の設置間隔は、管径100mm以下では15m以内、100mmを超える場合は30m以内。","f":[],"o":["img/R3A31_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R3A32","y":"R3","p":"A","no":32,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["器具排水負荷単位法による通気管の管径算定において、所定の表を使用する場合、通気管長さは通気管の実長とし、局部損失相当長を加算しなくてよい。","通気弁は、大気に開放された伸頂通気管と同様に正圧緩和の効果が期待できる。","建物の階層が多い場合の1階の排水横枝管は、排水立て管に接続せず、単独で屋外の排水桝に接続する。","伸頂通気方式において、誘導サイホン作用の防止には、排水用特殊継手を用いて管内圧力の緩和を図る方法がある。"],"a":[2],"m":"exact","n":"","e":"通気弁は負圧時に空気を吸い込むだけの弁で、正圧緩和の効果はない。","f":[],"o":["img/R3A32_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R3A33","y":"R3","p":"A","no":33,"s":"通気設備に関する記述のうち、適当でないものはどれか。","c":["ループ通気管の管径は、排水横枝管と通気立て管とのうち、いずれか小さいほうの管径の1/2より小さくしてはならない。","排水立て管のオフセットの逃がし通気管の管径は、通気立て管と排水立て管とのうち、いずれか小さい方の管径の1/2より小さくしてはならない。","排水横枝管の逃がし通気管の管径は、それを接続する排水横枝管の管径の1/2より小さくしてはならない。","各個通気管の管径は、それが接続される排水管の管径の1/2より小さくしてはならない。"],"a":[2],"m":"exact","n":"","e":"オフセットの逃がし通気管の管径は、通気立て管と排水立て管のいずれか小さい方の管径「以上」とする。1/2ではない。","f":[],"o":["img/R3A33_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R3A34","y":"R3","p":"A","no":34,"s":"不活性ガス消火設備に関する記述のうち、適当でないものはどれか。","c":["不活性ガス消火設備に用いる消火剤の種類には、二酸化炭素、窒素、IG-55、IG-541がある。","貯蔵容器は、防護区画以外の温度40℃以下で温度変化が少なく、直射日光及び雨水のかかるおそれの少ない場所に設ける。","全域放出方式又は局所放出方式の不活性ガス消火設備の非常電源は、当該設備を有効に30分間作動できる容量以上とする。","不活性ガス消火設備を設置した場所には、その放出された消火剤及び燃焼ガスを安全な場所に排出する措置が必要である。"],"a":[3],"m":"exact","n":"","e":"不活性ガス消火設備の非常電源は、1時間以上有効に作動できる容量とする。","f":[],"o":["img/R3A34_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R3A35","y":"R3","p":"A","no":35,"s":"ガス設備に関する記述のうち、適当でないものはどれか。","c":["液化石油ガス（LPG）は、圧力調整器によりガス容器（ボンベ）の中の高い圧力を1.0kPaに減圧して燃焼機器に供給される。","都市ガスのガス漏れ警報器を天井部分に設置する場合は、警報器の下端は天井面の下方30cm以内に設置する。","都市ガスの種類Ａ・Ｂ・Ｃでは、燃焼速度はＡ・Ｂ・Ｃの順で速くなる。","液化石油ガス（LPG）設備で用いられる配管は、0.8MPa以上で行う耐圧試験に合格したものとする。"],"a":[1],"m":"exact","n":"","e":"LPGは調整器でおおむね2.8kPa（2.3〜3.3kPa）に減圧して燃焼機器に供給する。","f":[],"o":["img/R3A35_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R3A36","y":"R3","p":"A","no":36,"s":"JISに規定する「建築物の用途別による屎尿浄化槽の処理対象人員算定基準」に定められている「建築用途」と「算定単位」の組合せのうち、適当でないものはどれか。\n（建築用途） （算定単位）","c":["ホテル・旅館 延べ面積〔m²〕","病院・療養所・伝染病院 ベッド数〔床〕","共同住宅 居室数〔室〕","事務所 延べ面積〔m²〕"],"a":[3],"m":"exact","n":"","e":"共同住宅の処理対象人員の算定単位は延べ面積〔m²〕（n＝0.05A）。居室数ではない。","f":[],"o":["img/R3A36_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R3A37","y":"R3","p":"A","no":37,"s":"浄化槽に関する記述のうち、適当でないものはどれか。","c":["浄化槽は、水洗便所のし尿、工業廃水等の汚水を処理する設備又は施設である。","浄化槽は、生物化学的処理において生物膜法と活性汚泥法に大別される。","浄化槽は、積雪寒冷地を除き、車庫、物置等の建築物内への設置は避ける。","消毒には、一般的に、次亜塩素酸カルシウム錠、塩素化イソシアヌール酸錠等の固形塩素剤が使用される。"],"a":[1],"m":"exact","n":"","e":"浄化槽はし尿と雑排水（生活排水）を処理するもので、工場廃水等は対象外。","f":[],"o":["img/R3A37_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R3A38","y":"R3","p":"A","no":38,"s":"冷凍機に関する記述のうち、適当でないものはどれか。","c":["遠心冷凍機は低圧冷媒又は高圧冷媒を使用する機器があり、低圧冷媒を使用する機器は一般的な空調条件では高圧ガス保安法の適用を受けない。","二重効用吸収冷凍機は、高圧蒸気により低温再生器を加熱し、低温再生器で発生した冷媒蒸気をさらに高温再生器の加熱に用いる構造である。","空気熱源ヒートポンプのデフロスト運転には、運転を冷房サイクルに切り替えて空気熱交換器に高温高圧のガスを流し付着した霜を溶かす方法がある。","スクリュー冷凍機は、高圧縮比でも体積効率がよいため、一般的に、高い圧縮比を必要とするヒートポンプ用として用いられる。"],"a":[2],"m":"exact","n":"","e":"二重効用吸収冷凍機は、高圧蒸気等で「高温再生器」を加熱し、そこで発生した冷媒蒸気で「低温再生器」を加熱する。記述は逆。","f":[],"o":["img/R3A38_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R3A39","y":"R3","p":"A","no":39,"s":"遠心ポンプに関する記述のうち、適当でないものはどれか。","c":["締切り動力が低く、水量の増大に伴い軸動力は減少する特性がある。","吐出し量は、ポンプの羽根車の直径が変わった場合、羽根車の出口幅が一定であれば、直径の変化の2乗に比例して変化する。","渦巻ポンプの渦巻ケーシングは、スロート部から吐出し口にかけて流速を緩やかに減速して速度エネルギーを圧力エネルギーに変換している。","ポンプや送水系に外力が働かないのに、吐出し量と圧力が周期的に変動する現象をサージングという。"],"a":[1],"m":"exact","n":"","e":"遠心ポンプは締切り（吐出量0）時の動力が最小で、水量の増加に伴い軸動力は増加する。","f":[],"o":["img/R3A39_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R3A40","y":"R3","p":"A","no":40,"s":"空気調和機に関する記述のうち、適当でないものはどれか。","c":["大温度差送風方式は、送風量を減らして、送風搬送動力を削減するため、一般的に、冷房吹出温度差を10℃と大きくとる。","マルチパッケージ形空気調和機の冷房暖房同時型は、冷房運転時に発生する排熱を暖房運転中の屋内機に利用することで高い省エネルギー効果が得られる。","ユニット形空気調和機の冷却コイルは、コイル面通過風速を2.0〜3.0m/sで選定し、コイル面の凝縮した水滴の飛散が多くならないようにする。","デシカント空気調和機は、デシカントローターで高温の排気と給気とを熱交換する際に供給空気の湿度を除去し、乾燥した空気を給気する。"],"a":[1],"m":"exact","n":"","e":"大温度差送風方式は、冷房吹出温度差を通常（10℃程度）より大きく、15℃以上程度にとって送風量を減らす方式。","f":[],"o":["img/R3A40_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R3A41","y":"R3","p":"A","no":41,"s":"配管材料及び配管附属品に関する記述のうち、適当でないものはどれか。","c":["圧力配管用炭素鋼鋼管は、蒸気、高温水等の圧力の高い配管に使用され、スケジュール番号により管の厚さが区分されている。","架橋ポリエチレン管は、中密度・高密度ポリエチレンを架橋反応させることで、耐熱性、耐クリープ性を向上させた管である。","空気調和機ドレン配管の排水トラップの封水は、送風機の全静圧を超えないようにする。","蒸気トラップには、メカニカル式、サーモスタチック式、サーモダイナミック式がある。"],"a":[3],"m":"exact","n":"","e":"空調機ドレン配管のトラップ封水深は、送風機の全静圧（機内負圧）「以上」とし、封水が吸い出されないようにする。","f":[],"o":["img/R3A41_o0.png"],"g":4,"cat":"A機材・設計図書・約款","neg":true},{"id":"R3A42","y":"R3","p":"A","no":42,"s":"ダクト及びダクト附属品に関する記述のうち、適当でないものはどれか。","c":["グラスウール等の多孔質吸音材を内張りしたダクトでは、中高周波数域の音の減衰が大きい。","同一材料、同一断面積のダクトの場合、同じ風量では長方形ダクトの方が円形ダクトより単位長さ当たりの圧力損失が大きい。","シーリングディフューザー形吹出口は、中コーンを上げると拡散半径が大きくなる。","ピストンダンパーは、消火ガス放出時にガスシリンダーの作動で閉鎖する機構を有する。"],"a":[3],"m":"exact","n":"","e":"シーリングディフューザーは中コーンを下げると水平吹出しとなり拡散半径が大きく、上げると下向き吹出しとなり拡散半径が小さくなる。","f":[],"o":["img/R3A42_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R3A43","y":"R3","p":"A","no":43,"s":"「公共工事標準請負契約約款」に関する記述のうち、適当でないものはどれか。","c":["発注者は、完成通知を受けたときは、通知を受けた日から14日以内に完成検査を完了し、検査結果を受注者に通知しなければならない。","受注者は、工事目的物及び工事材料等を設計図書に定めるところにより、火災保険、建設工事保険等に付さなければならない。","発注者は、受注者が工期内に工事を完成させることができないとき、これによって生じた損害の賠償を受注者に対して請求することができる。","発注者の完成検査で、必要と認められる理由を受注者に通知した上で、工事目的物を最小限度破壊する場合、その検査又は復旧に直接要する費用は発注者の負担となる。"],"a":[4],"m":"exact","n":"","e":"完成検査で必要により最小限度破壊する場合、検査・復旧に直接要する費用は「受注者」の負担となる。","f":[],"o":["img/R3A43_o0.png"],"g":43,"cat":"A機材・設計図書・約款","neg":true},{"id":"R3A44","y":"R3","p":"A","no":44,"s":"設計図書に記載する「機器名」と「機器仕様」の組合せのうち、適当でないものはどれか。\nただし、電動機に関する事項は除く。\n（機器名） （機器仕様）","c":["全熱交換器 形式、種別、風量、全熱交換効率、面風速、初期抵抗（給気・排気）","空調用ポンプ 形式、吸込口径、水量、揚程、押込圧力","冷却塔 形式、冷却能力、冷却水量、冷却水出入口温度、外気乾球温度、騒音値","チリングユニット 冷凍能力、冷水量、冷水出入口温度、冷却水量、冷却水出入口温度、冷水・冷却水損失水頭"],"a":[3],"m":"exact","n":"","e":"冷却塔の仕様に記載するのは外気「湿球」温度。冷却塔の性能は湿球温度で決まる。","f":[],"o":["img/R3A44_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R3B01","y":"R3","p":"B","no":1,"s":"工事の「届出書等」、「提出時期」及び「提出先」の組合せとして、適当でないものはどれか。\n（届出書等） （提出時期） （提出先）","c":["ばい煙発生施設設置届出書 工事完了日から4日以内 都道府県知事","消防用設備等設置届出書 工事完了日から4日以内 消防長又は消防署長","特定施設設置届出書（騒音） 工事開始日の30日前まで 市町村長","ボイラー設置届 工事開始日の30日前まで 労働基準監督署長"],"a":[1],"m":"exact","n":"","e":"ばい煙発生施設の設置届は、工事着手の60日前までに都道府県知事（政令市長）へ提出する。工事完了後ではない。","f":[],"o":["img/R3B01_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R3B02","y":"R3","p":"B","no":2,"s":"下図のネットワーク工程表に関する記述のうち、適当でないものはどれか。\nただし、図中のイベント間のＡ〜Ｉは作業内容、日数は作業日数を表す。","c":["クリティカルパスの所要日数は33日で、ルートは2本ある。","イベント⑤の最早開始時刻と最遅完了時
