了時刻は、18日である。","作業Ｄの作業日数が1日短縮されても、全体工期は1日短縮されない。","作業Ｂの作業日数が2日遅延すれば、全体工期は1日遅延する。"],"a":[1],"m":"exact","n":"","e":"最早時刻は②5、③5、④5、⑦16、⑧16、⑨16、⑩24日。クリティカルパスはC→E→G→I と C→D→I の2本で24日。「1本」は誤り。","f":["img/R8B02_f0.png"],"o":["img/R8B02_o0.png"],"g":0,"cat":"B施工管理","neg":true},{"id":"R8B03","y":"R8","p":"B","no":3,"s":"品質管理に関する記述のうち、適当でないものはどれか。","c":["品質管理を具現化するためのQC工程図は、一連の工程の流れに沿い、管理項目、管理水準、管理方法等を設定し、管理値を外れた場合の処置方法等を定めておくものである。","バスタブ曲線は、時間の経過と故障率の発生パターンの関係を示したものである。","管工事の品質管理方法には、搬入材料の検査、配管の水圧試験、風量調整の確認等がある。","特性要因図は、大きな不良項目、不良項目の順位、各不良項目が全体に占める割合等を読み取ることができる。"],"a":[4],"m":"exact","n":"","e":"記述はパレート図。特性要因図は、特性と要因の関係を魚の骨状に体系的に整理した図。","f":[],"o":["img/R8B03_o0.png"],"g":83,"cat":"B施工管理","neg":true},{"id":"R8B04","y":"R8","p":"B","no":4,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["ハインリッヒの法則では、1件の重大災害の背後には29件の軽度の事故、さらに300件のヒヤリ・ハットがあるといわれている。","工事現場で行う安全管理活動は、その現場の特性に応じた様々な内容の管理を行う必要があり、マンネリ化せず作業者の主体性を引き出すよう工夫することが大切である。","災害の規模及び程度を示す強度率とは、延べ実労働時間1,000時間当たりの労働災害による労働損失日数である。","ヒューマンエラーとは、手間や労力、時間やコストを省くことを優先し、労働者本人又は関係者の安全を阻害する可能性のある行動を意図的に行う行為をいう。"],"a":[4],"m":"exact","n":"","e":"記述は不安全行動（意図的な手抜き等）。ヒューマンエラーは、錯覚・失念・判断ミスなど意図せずに起こる誤り。","f":[],"o":["img/R8B04_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R8B05","y":"R8","p":"B","no":5,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["機器をコンクリート基礎に据え付ける場合、基礎のコンクリートを打設後、適切な養生を行い、10日が経過してから据え付ける。","屋外又は湿潤な場所に設置する機器据付用のアンカーボルトやナット類は、ステンレス製又は溶融亜鉛メッキを施したものを使用する。","ポンプの据付けにあと施工アンカーボルトを使用する場合、接着系アンカーに比べて、金属拡張アンカーの方が許容引抜き力が大きい。","機器に対する地震力の計算において、局部震度法による設計用鉛直地震力を考慮する必要がある場合、設計用鉛直震度を設計用水平震度の1/2として計算する。"],"a":[3],"m":"exact","n":"","e":"一般に接着系アンカーの方が金属拡張アンカーより許容引抜き力が大きい。","f":[],"o":["img/R8B05_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R8B06","y":"R8","p":"B","no":6,"s":"配管及び配管附属品の施工に関する記述のうち、適当でないものはどれか。","c":["蒸気管の横走り管を下方より支持する場合には、ローラ金物等を使用する。","冷温水配管の主管から枝管を分岐する場合、エルボを3個使用して、管の伸縮を吸収できるようにする。","冷媒用銅管をろう付けする場合、配管内に不活性ガスを流し、酸化物の生成を抑えながら行う。","配管の固定支持は、躯体に緊結された固定台等に、Ｕボルトを使用して堅固に締め付ける。"],"a":[4],"m":"exact","n":"","e":"Uボルトでは配管が軸方向に動くため固定支持には適さない。固定支持は固定金具や溶接等で堅固に固定する。","f":[],"o":["img/R8B06_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R8B07","y":"R8","p":"B","no":7,"s":"ダクト及びダクト附属品の施工に関する記述のうち、適当でないものはどれか。","c":["共板フランジ工法ダクトのフランジは、ダクト本体を成形加工してフランジにする。","シーリングディフューザーは、最小拡散半径が重なるように配置する。","共板フランジ工法ダクトの押さえ金具の取り付け位置は、ダクト端部から押さえ金具までの距離を150mm以内、押さえ金具間の距離を200mm以内とする。","消音エルボを使用した給気ダクトに風量調整ダンパーを取り付ける場合、消音エルボの上流側とする。"],"a":[2],"m":"exact","n":"","e":"シーリングディフューザーは、最小拡散半径が互いに重ならないように配置する（重なると気流がぶつかりドラフトの原因）。","f":[],"o":["img/R8B07_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R8B08","y":"R8","p":"B","no":8,"s":"保温、保冷に関する記述のうち、適当でないものはどれか。","c":["機械室内の露出の冷温水管にグラスウール保温材で保温する場合、保温筒、ポリエチレンフィルム、原紙、鉄線、アルミガラスクロスの順に施工する。","ステンレス鋼板製貯湯タンク（SUS444製を除く。）は、エポキシ系塗装により保温材と絶縁する。","絶縁継手回り（絶縁フランジを含む。）は、金属製のラッキングを行ってはならない。","蒸気管が壁、床等を貫通する場合は、貫通部分及びその面から25mm程度は保温被覆は行わない。"],"a":[1],"m":"exact","n":"","e":"機械室露出の冷温水管の保温は、保温筒→鉄線→ポリエチレンフィルム→アルミガラスクロスの順。鉄線がフィルムより後になっている点が誤り。","f":[],"o":["img/R8B08_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R8B09","y":"R8","p":"B","no":9,"s":"機器類の防振に関する記述のうち、適当でないものはどれか。","c":["気泡浴槽では、ジェット水流による乱流や気泡によるキャビテーション等により、大きな振動が発生することがあるので、防振施工が必要である。","共通架台に複数個の回転機器を設置する場合の防振は、一番高い回転数に合わせて設計する必要がある。","遠心冷凍機は、高回転数で加振力が比較的小さいため、地下の機械室等では、一般的に、防振ゴムパッドが用いられる。","配管・ダクトの吊り金物は、振動による二次騒音の原因となるおそれがあるので、必要により防振を考慮する。"],"a":[2],"m":"exact","n":"","e":"複数の回転機器を共通架台に載せる場合の防振は、最も低い回転数に合わせて設計する。","f":[],"o":["img/R8B09_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R8B10","y":"R8","p":"B","no":10,"s":"建設工事における安全管理体制に関する記述のうち「労働安全衛生法」上、誤っているものはどれか。","c":["統括安全衛生責任者が統括管理しなければならない事項には、作業間の連絡及び調整がある。","特定元方事業者は、選任した元方安全衛生管理者に、統括安全衛生責任者が統括管理すべき事項のうち技術的事項を管理させなければならない。","特定元方事業者は、下請けも含めた作業場の労働者が、50人以上となる場合は、総括安全衛生管理者を選任しなければならない。","総括安全衛生管理者の選任は、総括安全衛生管理者を選任すべき事由が発生した日から14日以内に行わなければならない。"],"a":[3],"m":"exact","n":"","e":"特定元方事業者が選任するのは統括安全衛生責任者。総括安全衛生管理者は事業場単位で選任するもの。","f":[],"o":["img/R8B10_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R8B11","y":"R8","p":"B","no":11,"s":"建設工事における安全衛生管理に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["事業者は、機械間又はこれと他の設備との間に設ける通路については、幅80cm以上のものとしなければならない。","事業者は、架設通路の勾配は、40度以下としなければならない。ただし、階段を設けたもの又は高さが2m未満で丈夫な手掛を設けたものはこの限りではない。","事業者は、3m以上の高所から物体を投下するときは、適当な投下設備を設け、監視人を置く等労働者の危険を防止するための措置を講じなければならない。","事業者は、架設通路に使用する高さ8m以上の登り桟橋には、7m以内ごとに踊場を設けなければならない。"],"a":[2],"m":"exact","n":"","e":"架設通路の勾配は30度以下とする（階段を設けたもの又は高さ2m未満で丈夫な手掛を設けたものを除く）。","f":[],"o":["img/R8B11_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R8B12","y":"R8","p":"B","no":12,"s":"次の業務のうち、満18歳に満たない者を就かせてはならない業務として、「労働基準法」上、定められていないものはどれか。","c":["最大積載荷重が1tの人荷共用のエレベーターの運転の業務","クレーンの運転の業務","動力により駆動される土木建築用機械の運転の業務","深さが5m以上の地穴における業務"],"a":[1],"m":"exact","n":"","e":"年少者の就業が禁止されるのは最大積載荷重2t以上の人荷共用・荷物用エレベーターの運転。1tは定められていない。","f":[],"o":["img/R8B12_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R8B13","y":"R8","p":"B","no":13,"s":"建築物に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["耐火性能とは、通常の火災が終了するまでの間、当該火災による建築物の倒壊及び延焼を防止するために当該建築物の部分に必要とされる性能をいう。","居室の天井の高さは2.1m以上とし、一室で天井の高さの異なる部分がある場合においては、その平均の高さは2.1m以上とする。","屋上部分に設けた昇降機塔等で、水平投影面積の合計が建築物の建築面積の1/8以下のものは、建築物の階数に算入しない。","防火性能とは、建築物の周囲において発生する通常の火災による延焼を抑制するために、当該躯体又は屋根に必要とされる性能をいう。"],"a":[4],"m":"exact","n":"","e":"防火性能は建築物の「外壁又は軒裏」に必要とされる性能。躯体又は屋根ではない。","f":[],"o":["img/R8B13_o0.png"],"g":87,"cat":"B法規","neg":true},{"id":"R8B14","y":"R8","p":"B","no":14,"s":"建築設備に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["換気設備を設けるべき調理室等の排気口は、当該室の天井又は天井から下方120cm以内の高さの位置に設けなければならない。","建築物（換気設備を設けるべき調理室等を除く）に設ける自然換気設備の排気口は、給気口より高い位置に設け、常時開放された構造とし、かつ、排気筒の立上り部分に直結しなければならない。","中央管理方式の空気調和設備の風道は、火を使用する設備又は器具を設けた室の換気設備の風道その他これに類するものに連結してはならない。","延べ面積が3,000m²を超える建築物の屋内に設ける換気設備の風道は、屋外に面する部分その他防火上支障がないものとして国土交通大臣が定める部分を除き、不燃材料で造らなければならない。"],"a":[1],"m":"exact","n":"","e":"調理室等の排気口は、天井又は天井から下方80cm以内の高さに設ける。","f":[],"o":["img/R8B14_o0.png"],"g":88,"cat":"B法規","neg":true},{"id":"R8B15","y":"R8","p":"B","no":15,"s":"施工体系図の作成を要する建設工事を請け負った建設業者が施工体系図に表示しなければならない、「作成建設業者が請け負った建設工事に関する事項」として、「建設業法」上、定められていないものはどれか。","c":["建設工事の名称","建設工事の工期","建設工事の請負代金の額","発注者の商号、名称又は氏名"],"a":[3],"m":"exact","n":"","e":"施工体系図に請負代金の額は表示しない（施工体制台帳の記載事項）。工事名称・工期・発注者名などを表示する。","f":[],"o":["img/R8B15_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R8B16","y":"R8","p":"B","no":16,"s":"元請負人の義務に関する記述のうち、「建設業法」上、誤っているものはどれか。","c":["元請負人は、前払金の支払を受けたときは、下請負人に対して、資材の購入、労働者の募集その他建設工事の着手に必要な費用を前払金として支払うよう適切な配慮をしなければならない。","元請負人は、その請け負った建設工事を施工するために必要な工程の細目、作業方法その他元請負人において定めるべき事項を定めようとするときは、あらかじめ、下請負人の意見をきかなければならない。","元請負人は、下請負人からその請け負った建設工事が完成した旨の通知を受けたときは、当該通知を受けた日から20日以内で、かつ、できる限り短い期間内に、その完成を確認するための検査を完了しなければならない。","元請負人は、下請負人の請け負った建設工事について、検査によって建設工事の完成を確認した後、下請負人が申し出たときは、申し出の日から10日以内に、当該建設工事の目的物の引渡しを受けなければならない。"],"a":[4],"m":"exact","n":"","e":"完成確認後に下請負人が引渡しを申し出たときは、元請負人は「直ちに」引渡しを受けなければならない（特約がある場合を除く）。","f":[],"o":["img/R8B16_o0.png"],"g":5,"cat":"B法規","neg":true},{"id":"R8B17","y":"R8","p":"B","no":17,"s":"スプリンクラー設備に関する記述のうち、「消防法」上、誤っているものはどれか。\nただし、特定施設水道連結型スプリンクラー設備は除く。","c":["予作動式は、スプリンクラーヘッドが開放した場合に1分以内に当該スプリンクラーヘッドから放水できるものとする。","加圧送水装置には、スプリンクラーヘッドにおける放水圧力が1.0MPaを超えないための措置を講じる。","スプリンクラーヘッドが開放型の場合、配管の末端には末端試験弁を設ける。","消防ポンプ自動車が容易に接近することのできる位置に、双口形の送水口を設ける。"],"a":[3],"m":"exact","n":"","e":"末端試験弁は閉鎖型ヘッドの場合に設ける。開放型ヘッドでは一斉開放弁の作動試験で確認する。","f":[],"o":["img/R8B17_o0.png"],"g":47,"cat":"B法規","neg":true},{"id":"R8B18","y":"R8","p":"B","no":18,"s":"スプリンクラー設備に関する記述のうち、「消防法」上、誤っているものはどれか。\nただし、特定施設水道連結型スプリンクラー設備は除く。","c":["補助散水栓を設ける場合、原則として、防火対象物の階ごとに、その階の未警戒となる各部分からホース接続口までの水平距離が15m以下となるように設けなければならない。","送水口の結合金具は、簡易着脱式のものとする。","非常電源を附置する。","補助散水栓を設ける場合、消火栓のホースは保形ホースとする。"],"a":[2],"m":"exact","n":"","e":"送水口の結合金具は、差込式又はねじ式のものとする。簡易着脱式ではない。","f":[],"o":["img/R8B18_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R8B19","y":"R8","p":"B","no":19,"s":"建築物の地上の階数、建築物の床面積の合計及び請負代金の額が次のものである建築物に係る設備改修工事のうち、「建設工事に係る資材の再資源化等に関する法律」上、特定建設資材廃棄物をその種類ごとに分別しつつ施工しなければならない工事に該当するものはどれか。\nただし、都道府県が定める条例は無いものとする。\n［建築物の地上の階数］ ［建築物の床面積の合計（m²）］ ［請負代金の額］","c":["2 3,000 1億円","3 5,000 6千万円","4 3,000 8千万円","5 1,000 8千万円"],"a":[1],"m":"exact","n":"","e":"建築物の修繕・模様替等（設備改修工事）が分別解体等の対象となるのは請負代金1億円以上。階数・床面積は要件ではない。⑴のみ該当。","f":[],"o":["img/R8B19_o0.png"],"g":null,"cat":"B法規","neg":false},{"id":"R8B20","y":"R8","p":"B","no":20,"s":"「フロン類の使用の合理化及び管理の適正化に関する法律」上、第一種フロン類充塡回収 業者が行う第一種特定製品へのフロン類の充塡に関する記述として、誤っているものはどれか。","c":["充塡を行う前に、当該製品について、当該製品の管理者が保存する点検及び整備に係る記録簿を確認しなければならない。","充塡を行う前に、当該製品に冷媒として充塡されているフロン類の漏えいの有無並びに漏えいを確認した場合にあっては、当該漏えいに係る点検及び当該漏えいを防止するために必要な措置の実施の有無を確認しなければならない。","現に充塡されている冷媒とは異なるものを当該製品に冷媒として充塡する場合は、充塡後に、当該製品の管理者に、異なるものを充塡したことを報告しなければならない。","必要以上に充塡を行うことその他の不適切な充塡により、当該製品の使用に際して、フロン類が大気中に放出されるおそれがないよう必要な措置を講じなければならない。"],"a":[3],"m":"exact","n":"","e":"現に充塡されている冷媒と異なるものを充塡する場合は、あらかじめ管理者の承諾を得なければならない。充塡後の報告ではない。","f":[],"o":["img/R8B20_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R8B21","y":"R8","p":"B","no":21,"s":"産業廃棄物に関する記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","c":["建設工事に伴い生ずる産業廃棄物の処理責任を負う排出事業者は、実際の工事の施工は下請業者が行っている場合であっても、発注者から直接建設工事を請け負った元請業者である。","事業活動で使用された灯油を廃棄物として処理するときは、特別管理産業廃棄物として処理しなければならない。","専ら再生利用の目的となる産業廃棄物のみの収集若しくは運搬又は処分を業として行う者に当該産業廃棄物のみの運搬又は処分を委託する場合は、産業廃棄物管理票の交付を要しない。","事業者が自らその産業廃棄物を産業廃棄物処理施設へ運搬する場合においても、産業廃棄物運搬の業の許可を受けなければならない。"],"a":[4],"m":"exact","n":"","e":"事業者が自ら産業廃棄物を運搬する場合は、運搬業の許可は不要。","f":[],"o":["img/R8B21_o0.png"],"g":13,"cat":"B法規","neg":true},{"id":"R8B22","y":"R8","p":"B","no":22,"s":"公共工事における施工計画等に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["仮設、施工方法等その他工事目的物を完成するために必要な一切の手段は、特別の定めがない場合、受注者がその責任において定める。","工事原価とは、純工事費と現場管理費を合わせた費用のことであり、現場従業員の給与等の現場経費は含まない。","総合試運転調整では、各機器単体の試運転を行うとともに、配管系、ダクト系に異常がないことを確認した後、システム全体の調整を行う。","工種別施工計画書は、受注者の責において作成されるものであるため、監督員に提出する必要はない。"],"a":[2,4],"m":"exact","n":"","e":"⑵工事原価＝純工事費＋現場管理費で、現場従業員の給与等は現場管理費に含まれる。⑷工種別施工計画書は監督員に提出する。","f":[],"o":["img/R8B22_o0.png"],"g":89,"cat":"C応用能力","neg":true},{"id":"R8B23","y":"R8","p":"B","no":23,"s":"工程管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["ネットワーク工程表において、クリティカルパスは、最早開始時刻と最遅完了時刻の等しいイベントを通る。","ネットワーク工程表において、後続する作業の最早開始時刻に影響を及ぼすことなく使用できる余裕時間をフリーフロートという。","ネットワーク工程表で全体工期の短縮を検討する場合、当初のクリティカルパス上の作業についてのみを検討すればよい。","施工速度を速めると、直接費（労務費、材料費、仮設費等）と間接費（管理費、共通仮設費等）は、ともに増加する。"],"a":[3,4],"m":"exact","n":"","e":"⑶工期短縮では、短縮により新たにクリティカルパスとなる経路も検討する必要がある。⑷施工速度を速めると直接費は増加するが、間接費は減少する。","f":[],"o":["img/R8B23_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R8B24","y":"R8","p":"B","no":24,"s":"品質管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["管工事の品質に影響を与える要因としては、現場加工材料の良否、機器の据付け状況等がある。","配管やダクトの防火区画貫通部の穴埋めは、抜取検査で確認する。","ISO9000ファミリー規格は、製品やサービスを作り出すプロセスに関する規格である。","計数抜取検査は、ロットの特性値がほぼ正規分布とみなせる場合に適用する。"],"a":[2,4],"m":"exact","n":"","e":"⑵防火区画貫通部の穴埋めは重要部分のため全数検査で確認する。⑷正規分布を前提とするのは計量抜取検査。計数抜取検査は不良個数等で判定する。","f":[],"o":["img/R8B24_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R8B25","y":"R8","p":"B","no":25,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["枠組足場以外の高さ2mの作業床には、墜落のおそれがある箇所には、高さ85cm以上の手すりを設ければ、中桟を設ける必要はない。","はしご道は、はしごの転倒防止のための措置を行い、はしごの上端を床から60cm以上突出させなければならない。","事業者は、高さが1m以上の箇所で作業を行う場合において、強風、大雨、大雪等の悪天候のため危険が予想されるときは、当該作業を行わせてはならない。","事業者は、高さが2m以上の箇所で作業を行うときは、当該作業を安全に行うために必要な照度を保持しなければならない。"],"a":[1],"m":"contains","n":"正答訂正：当初⑴⑶（または⑴⑵）と発表、後に⑴を選択していれば正解として採点","e":"⑴高さ2m以上の作業床の墜落のおそれのある箇所には、高さ85cm以上の手すりに加え中桟等を設ける。（正答訂正により⑴を選択していれば正解）","f":[],"o":["img/R8B25_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R8B26","y":"R8","p":"B","no":26,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["真空又は窒素加圧の状態で据え付けられた冷凍機は、機内を大気に開放した後、配管を接続する。","ボイラー等のバーナーを備えた機器は、機器本体に地震感知器を取り付け、地震時に運転を停止させる。","天井スラブの下面において、あと施工アンカーを上向き設置する場合は、金属拡張アンカーを使用する。","インサートは、工種別に色を分けることで、識別しやすくなり、施工取合いの間違いを避けることができる。"],"a":[1],"m":"contains","n":"正答訂正：当初⑴⑶（または⑴⑵）と発表、後に⑴を選択していれば正解として採点","e":"⑴真空・窒素加圧で据え付けた冷凍機は、湿気・異物が入らないよう大気に開放せずに配管を接続する。（正答訂正により⑴を選択していれば正解）","f":[],"o":["img/R8B26_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R8B27","y":"R8","p":"B","no":27,"s":"配管及び配管附属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["排水横走り管からの通気管の取出しは、排水横走り管の直上部ないし直上部から45°以内とする。","通気管の末端は、外気取入れ口や窓等の開口部から水平距離で1m以上離す。","蒸気横引き配管（先下がり勾配）の径違い管を偏心径違い継手で接続する場合、管内の上面に段差ができないように接続する。","配管用炭素鋼鋼管を溶接接合する場合、管外面の余盛は3mm以下とし、それを超えた余盛はグラインダー等で除去する。"],"a":[2,3],"m":"exact","n":"","e":"⑵通気管の末端は、開口部の上端から600mm以上立ち上げるか、水平距離で3m以上離す。⑶蒸気横引き管（先下がり）の径違いは、偏心継手で管内の「下面」をそろえ、凝縮水が滞留しないようにする。","f":[],"o":["img/R8B27_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R8B28","y":"R8","p":"B","no":28,"s":"ダクト及びダクト附属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["コーナーボルト工法ダクトに使用するフランジ用ガスケットの継目は、フランジ中央部を避け、コーナー部分においてオーバーラップさせる。","シーリングディフューザーをダクトにボックス接続する場合は、ボックス本体を吊り金物で支持する。","長方形ダクトの直角エルボに設ける案内羽根の板厚は、ダクトの板厚よりも薄くする。","長方形ダクトの主ダクトを割込み分岐する場合、割込みの比率は、風量比で決める。"],"a":[1,3],"m":"exact","n":"","e":"⑴フランジ用ガスケットの継目はコーナー部を避け、フランジ中央部（直線部）で重ね合わせる。⑶直角エルボの案内羽根の板厚は、ダクトの板厚と同等以上とする。","f":[],"o":["img/R8B28_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R8B29","y":"R8","p":"B","no":29,"s":"腐食・防食に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["電気防食法における外部電源方式では、直流電源装置のマイナス端子に被防食体を接続する。","自然電位が大きく相違する配管を接続する場合は、絶縁物を介して接続し、ガルバニック腐食を防止する。","金属溶射は、金属を高温で溶融させた槽内に被処理材を浸漬したのち引き上げ、被処理材の表面に金属被覆を形成させる防食法である。","配管用炭素鋼鋼管（白）は、水のpH値が低くなるほど腐食は進行せず、pH値が高くなるほど腐食が進行する。"],"a":[3,4],"m":"exact","n":"","e":"⑶記述は溶融めっきの説明。金属溶射は、溶融した金属を被処理材の表面に吹き付けて被膜を形成する方法。⑷亜鉛めっき鋼管はpHが低い（酸性）ほど腐食が進行する。","f":[],"o":["img/R8B29_o0.png"],"g":null,"cat":"C応用能力","neg":true}],"g":[{"n":"ネットワーク工程表","q":["H29B04","H30B04","R1B04","R2B04","R3B02","R4B02","R5B02","R6B02","R7B02","R8B02"],"r":[{"t":"イベント⑥の最早開始時刻、最遅完了時刻は、ともに9日である。","o":[["H29B04",3,1],["H30B04",2,0],["R1B04",4,1],["R2B04",3,1],["R3B02",2,0],["R5B02",3,1],["R7B02",3,1]]},{"t":"作業内容Ｅのトータルフロートは、1日である。","o":[["H29B04",4,1],["H30B04",3,1],["R1B04",2,1],["R3B02",3,1],["R4B02",2,1],["R6B02",4,1],["R7B02",2,1]]},{"t":"クリティカルパスは1本で所要日数は24日である。","o":[["H29B04",1,1],["R3B02",1,1],["R4B02",1,1],["R6B02",1,1],["R7B02",1,1],["R8B02",1,0]]},{"t":"イベント⑨の最遅完了時刻は、18日である。","o":[["R2B04",4,1],["R6B02",2,1],["R8B02",2,1]]},{"t":"クリティカルパスは、①→④→⑤→⑦→⑧で所要日数は15日である。","o":[["H30B04",1,1],["R1B04",1,1]]}]},{"n":"変風量単一ダクト方式の自動制御において、「制御する機器」と「検出要素」","q":["H30A19","R2A [["R1A16",4,0],["R5A16",2,0],["R8A16",4,0]]},{"t":"変風量単一ダクト方式は、定風量単一ダクト方式に比べ、送風機動力を節減できる。","o":[["R1A16",2,1],["R3A16",1,1]]},{"t":"ダクト併用ファンコイルユニット方式は、全空気方式に比べ、一般的に、搬送動力が小さい。","o":[["R1A16",3,1],["R3A16",4,1]]},{"t":"ファンコイルユニット・ダクト併用方式は、全空気方式に比べ、外気冷房の効果が得にくい。","o":[["R3A16",3,0],["R5A16",4,1]]},{"t":"定風量単一ダクト方式は、各空調対象室間で時刻別負荷変動パターンが異なる場合、各室内温度のアンバランスが生じやすい。","o":[["R5A16",3,1],["R8A16",1,1]]}]},{"n":"発熱を除去する換気量の計算","q":["H30A23","R3A23","R5A23","R7A23"],"r":[]},{"n":"管路内の流体","q":["H29A05","R1A05","R7A04"],"r":[]},{"n":"「公共工事標準請負契約約款」","q":["H29A43","R5A43","R8A43"],"r":[{"t":"発注者は、完成通知を受けたときは、通知を受けた日から14日以内に完成検査を完了し、検査結果を受注者に通知しなければならない。","o":[["H29A43",4,1],["R5A43",2,1],["R8A43",1,1]]},{"t":"現場代理人、主任技術者は、これを兼ねることができるが、専門技術者は、主任技術者を兼ねることはできない。","o":[["H29A43",2,0],["R5A43",4,0]]},{"t":"発注者は、完成検査合格後、受注者から請負代金の支払い請求があったときは、請求を受けた日から60日以内に請負代金を支払わなければならない。","o":[["R5A43",3,1],["R8A43",4,0]]}]},{"n":"配管材料とその記号（規格）","q":["H29A44","R5A44","R7A44"],"r":[{"t":"水道用硬質塩化ビニルライニング鋼管（黒） SGP-VA（JWWA）","o":[["H29A44",3,1],["H29A44",4,0],["R5A44",1,1],["R5A44",2,0],["R7A44",1,0],["R7A44",4,1]]},{"t":"リサイクル硬質ポリ塩化ビニル三層管 RS-VU（JIS）","o":[["H29A44",1,1],["R5A44",3,1],["R7A44",2,1]]}]},{"n":"工事の申請・届出書類と関係法に基づく提出先","q":["H29B02","R1B02","R7B01"],"r":[{"t":"消防法の工事整備対象設備等着工届出書 ―― 消防長又は消防署長","o":[["H29B02",3,1],["R1B02",4,1],["R7B01",2,1]]},{"t":"振動規制法の特定建設作業実施届出書 ―― 市町村長","o":[["H29B02",4,1],["R1B02",1,1],["R7B01",3,1]]}]},{"n":"分別解体等","q":["H29B27","R1B28","R3B20"],"r":[{"t":"対象建設工事の受注者は、工事着手の時期及び工程の概要、分別解体等の計画等の事項を、工事に着手する日の7日前までに、都道府県知事に届け出なければならない。","o":[["H29B27",1,0],["R1B28",1,0],["R3B20",2,0]]},{"t":"）「建設業法」上の管工事業のみの許可を受けた者が解体工事業を営もうとする場合は、当該業を行おうとする区域を管轄する都道府県知事の登録を受けなければならない。","o":[["H29B27",3,1],["R1B28",3,1]]},{"t":"分別解体等に伴って生じた特定建設資材廃棄物である木材については、工事現場から50km以内に再資源化をするための施設がない場合、再資源化に代えて縮減をすれば足りる。","o":[["R1B28",2,1],["R3B20",3,1]]}]},{"n":"産業廃棄物の処理","q":["H29B29","R4B22","R8B21"],"r":[{"t":"専ら再生利用の目的となる産業廃棄物のみの収集若しくは運搬又は処分を業として行う者に当該産業廃棄物のみの運搬又は処分を委託する場合は、産業廃棄物管理票の交付を要しない。","o":[["H29B29",3,1],["R4B22",1,1],["R8B21",3,1]]},{"t":"建設工事に伴い生ずる産業廃棄物の処理責任を負う排出事業者は、実際の工事の施工は下請業者が行っている場合であっても、発注者から直接建設工事を請け負った元請業者である。","o":[["H29B29",1,1],["R8B21",1,1]]},{"t":"産業廃棄物の処分を業として行おうとする者は、都道府県知事から産業廃棄物処分業者の許可を受けることにより、産業廃棄物の運搬及び処分を一括して受託することができる。","o":[["H29B29",2,0],["R4B22",3,0]]},{"t":"産業廃棄物管理票を交付した事業者は、当該管理票に関する報告書を作成し、都道府県知事に提出しなければならないが、電子情報処理組織を使用して、情報処理センターに登録した場合は事業者から都道府県知事への報告は不要である。","o":[["H29B29",4,1],["R4B22",2,1]]}]},{"n":"音","q":["H30A10","R2A10","R4A10"],"r":[{"t":"NC曲線で示される音圧レベルの許容値は、周波数が低いほど大きい。","o":[["H30A10",4,1],["R2A10",3,0],["R4A10",2,1]]},{"t":"音速は、一定の圧力のもとでは、空気の温度が高いほど遅くなる。","o":[["H30A10",2,1],["R4A10",4,0]]},{"t":"点音源から放射された音が球面状に一様に広がる場合、音源からの距離が2倍になると音圧レベルは約6dB低下する。","o":[["R2A10",4,1],["R4A10",1,1]]}]},{"n":"排煙設備","q":["H30A25","R3A25","R6A24"],"r":[{"t":"機械排煙設備の排煙口は、防煙区画の各部分から水平距離で30m以下となるように設ける。","o":[["H30A25",2,1],["R3A25",2,1],["R6A24",2,1]]},{"t":"天井高さが3m未満の室の壁面に排煙口を設ける場合は、床面からの高さが天井高の1/2以上の部分、かつ防煙垂れ壁の下端より上の部分とする。","o":[["H30A25",1,1],["R6A24",4,0]]},{"t":"自然排煙設備の排煙口は、防煙区画の床面積の1/50以上の排煙上有効な開口面積を有する必要がある。","o":[["R3A25",1,1],["R6A24",3,1]]}]},{"n":"消火設備の消火原理","q":["H30A34","R2A34","R7A34"],"r":[{"t":"泡消火設備は、燃焼物を泡の層で覆い、窒息効果と冷却効果により消火するものである。","o":[["H30A34",1,1],["R2A34",4,1],["R7A34",4,1]]},{"t":"粉末消火設備は、粉末状の消火剤を放射し、消火剤の熱分解で発生した二酸化炭素や水蒸気による窒息効果、冷却効果等により消火するものである。","o":[["H30A34",2,1],["R2A34",2,1]]},{"t":"不活性ガス消火設備は、不活性ガスを放射し、ガス成分の化学反応による負触媒効果により消火するものである。","o":[["H30A34",3,0],["R2A34",3,0]]},{"t":"水噴霧消火設備は、水を霧状に噴霧し、噴霧水による冷却効果と噴霧水が火炎に触れて発生する水蒸気による窒息効果により消火するものである。","o":[["H30A34",4,1],["R7A34",3,1]]}]},{"n":"1号屋内消火栓設備のポンプを用いる加圧送水装置","q":["H30B26","R2B25","R4B18"],"r":[{"t":"ポンプの始動を明示する表示灯を設ける場合、当該表示灯は赤色とし、消火栓箱の内部又はその直近に設けるものとする。","o":[["H30B26",4,1],["R2B25",4,1],["R4B18",4,1]]},{"t":"ポンプは、直接操作による停止又は消火栓箱の直近に設けられた操作部からの遠隔操作による停止ができるものとする。","o":[["H30B26",1,0],["R2B25",2,0]]},{"t":"ポンプには、水源水位がポンプより低い場合、専用の呼水槽を設けるものとする。","o":[["H30B26",3,1],["R2B25",3,1]]},{"t":"ポンプには、その吐出側に圧力計、吸込側に連成計を設けるものとする。","o":[["R2B25",1,1],["   <p class="note">問題文と選択肢がほぼ同じ問題（数値だけ違う計算問題を含む）を組にして、出題回数の多い順に並べています。「繰り返し出た記述」は、ほぼ同じ文章で別の年度にも出た選択肢です（<span class="mk-x">✕</span>＝誤った記述として出題、<span class="mk-o">○</span>＝正しい記述として出題）。応用能力問題は別枠にしています。</p>
  <input class="search" id="gq" placeholder="絞り込み（例：排水、排煙、建設業法、計算）"><div id="glist" class="list" style="gap:12px"></div>`;
  const card=(g,rk)=>{const st=stats(g.q);const ys=new Set(g.q.map(i=>QI[i].y));
    return `<div class="gcard"><div class="ghead"><div class="rank ${rk<=10?'top':''}">${rk}</div><h3>${esc(g.n)}</h3><div class="cnt"><b>${g.q.length}</b><small>回出題</small></div></div>
    <div class="ydots">${YASC.map(y=>`<span class="${ys.has(y)?'on':''}">${y}</span>`).join('')}</div>${bar(st)}
    <div class="btns"><button class="chip primary" data-g="${g.i}">まとめて解く <span class="n">${g.q.length}</span></button><button class="chip" data-g="${g.i}" data-w="1">間違い・未解答のみ</button></div>
    <details class="more"><summary>問題一覧${g.r.length?'と繰り返し出た記述（'+g.r.length+'件）':''}</summary>
    <div class="list" style="margin-top:8px">${g.q.map(id=>{const q=QI[id];const r=S.r[id];return `<button class="li" data-one="${id}" data-g2="${g.i}"><span class="mk ${r?(r[0]?'o':'x'):''}">${r?(r[0]?'○':'✕'):'・'}</span><span class="tx"><small>${label(q)}</small><span>${esc(q.s.split('\n')[0])}</span></span></button>`}).join('')}</div>
    ${g.r.length?`<p class="sub">繰り返し出た記述</p><div class="reps">${g.r.map(r=>`<div class="rep">${esc(r.t)}<div class="occ">${r.o.map(([id,n,ok])=>`<button data-one="${id}" data-g2="${g.i}"><span class="${ok?'mk-o':'mk-x'}">${ok?'○':'✕'}</span> ${short(QI[id])}${NUM[n-1]}</button>`).join('')}</div></div>`).join('')}</div>`:''}
    </details></div>`};
  const draw=()=>{const k=$('#gq').value.trim();
   const f=gs=>gs.filter(g=>!k||g.n.includes(k)||g.q.some(id=>QI[id].s.includes(k)));
   const a=f(norm), b=f(app);
   $('#glist').innerHTML=(a.map((g,i)=>card(g,i+1)).join('')||'<div class="empty">該当なし</div>')+(b.length?`<div class="sechead" style="margin-top:14px"><span class="tag">応用</span><h3>施工管理法（応用能力）の類似問題（${b.length}組）</h3></div>`+b.map((g,i)=>card(g,i+1)).join(''):'');
   document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=G[+b.dataset.g];let qs=g.q.map(i=>QI[i]); if(b.dataset.w) qs=qs.filter(q=>!S.r[q.id]||!S.r[q.id][0]); start(qs,'類似：'+g.n);});
   document.querySelectorAll('[data-one]').forEach(b=>b.onclick=()=>{const g=G[+b.dataset.g2];const qs=g.q.map(i=>QI[i]);start(qs,'類似：'+g.n,qs.findIndex(q=>q.id===b.dataset.one));});
  };
  $('#gq').oninput=draw; draw();
}
function pRand(){
  $('#panel').innerHTML=`<div class="ycard"><div class="yhead"><h3>ランダム出題</h3></div>
  <div class="opt">範囲 <select id="rs"><option value="all">問題A・B すべて</option><option value="A">問題Aのみ</option><option value="B">問題B（応用以外）のみ</option><option value="B2">応用能力（二つ選ぶ問題）のみ</option><option value="T">類似問題のみ</option><option value="R">令和3年度以降のみ</option><option value="H">令和2年度以前のみ</option></select></div>
  <div class="btns">${[10,20,40].map(n=>`<button class="chip primary" data-n="${n}">${n}問</button>`).join('')}</div></div>`;
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const v=$('#rs').value;let qs=Q;
   if(v==='A') qs=Q.filter(q=>q.p==='A'); if(v==='B') qs=Q.filter(q=>q.p==='B'&&!isApp(q)); if(v==='B2') qs=Q.filter(isApp); if(v==='R') qs=Q.filter(q=>YASC.indexOf(q.y)>=4); if(v==='H') qs=Q.filter(q=>YASC.indexOf(q.y)<4); if(v==='T'){const s=new Set(GS.flatMap(g=>g.q));qs=Q.filter(q=>s.has(q.id));}
   start(shuffle(qs).slice(0,+b.dataset.n),'ランダム '+b.dataset.n+'問');});
}
function pRev(){
  const wrong=Q.filter(q=>S.r[q.id]&&!S.r[q.id][0]); const star=Q.filter(q=>S.star[q.id]);
  const li=qs=>qs.length?`<div class="list">${qs.map(q=>`<button class="li" data-rv="${q.id}"><span class="mk ${S.r[q.id]?(S.r[q.id][0]?'o':'x'):''}">${S.r[q.id]?(S.r[q.id][0]?'○':'✕'):'・'}</span><span class="tx"><small>${label(q)}</small><span>${esc(q.s.split('\n')[0])}</span></span></button>`).join('')}</div>`:'<div class="empty">まだありません</div>';
  $('#panel').innerHTML=`<div class="sechead"><h3>直近で間違えた問題（${wrong.length}）</h3></div>${wrong.length?`<div class="btns"><button class="chip primary" id="rw">まとめて解き直す</button></div>`:''}${li(wrong)}
  <div class="sechead"><h3>★をつけた問題（${star.length}）</h3></div>${star.length?`<div class="btns"><button class="chip primary" id="rs2">まとめて解く</button></div>`:''}${li(star)}
  <div class="btns" style="margin-top:12px"><button class="chip" id="reset">解答記録をリセット</button></div>`;
  const w=$('#rw'); if(w) w.onclick=()=>start(wrong,'間違えた問題');
  const s=$('#rs2'); if(s) s.onclick=()=>start(star,'★の問題');
  document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>start([QI[b.dataset.rv]],label(QI[b.dataset.rv])));
  $('#reset').onclick=function(){ if(this.dataset.c){S.r={};save();home();} else {this.dataset.c=1;this.textContent='もう一度押すとリセットします';} };
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(qs,title,idx=0){ if(!qs.length) return; run={qs,title,i:idx,ans:{},sel:[]}; quiz(); }
function quiz(){
  topbar(); window.scrollTo(0,0);
  const q=run.qs[run.i], done=run.ans[q.id], m=multi(q);
  const g=q.g!=null?G[q.g]:null, sim=g&&g.q.length>=2?g:null;
  const answered=Object.keys(run.ans).length;
  const ex=q.e.replace(/([⑴⑵⑶⑷])/g,'\n$1').replace(/^\n/,'');
  $('#app').innerHTML=`<div class="qprog"><span>${esc(run.title)}</span><span class="sp"></span><span>${run.i+1} / ${run.qs.length}</span></div>
  <div class="qprog" style="padding-top:6px">${bar({n:run.qs.length,a:answered,c:Object.values(run.ans).filter(x=>x.ok).length})}</div>
  <article class="qcard"><div class="qmeta"><span class="no">${label(q)}</span><span class="pill">${CATN[q.cat]}</span>${m?'<span class="pill two">二つ選ぶ</span>':''}
  <button class="star" id="star" aria-pressed="${!!S.star[q.id]}">${S.star[q.id]?'★':'☆'} 保存</button></div>
  <div class="qbody"><p class="stem">${esc(q.s)}</p>${q.f.length?`<div class="fig">${q.f.map(s=>`<img data-src="${s}" alt="問題の図">`).join('')}</div>`:''}
  <ol class="choices">${q.c.map((c,i)=>{const n=i+1;let cls='';
    if(done){ if(q.a.includes(n)) cls='is-ans'; else if(done.sel.includes(n)) cls='is-ng'; else cls='dim'; } else if(run.sel.includes(n)) cls='sel';
    return `<li><button class="cbtn ${cls}" data-n="${n}" ${done?'disabled':''}><span class="cnum ${!done&&run.sel.includes(n)?'sel':''}">${n}</span><span class="ctx">${q.ci?`<img data-src="${q.ci[i]}" alt="選択肢${n}の図" style="max-width:100%;display:block">`:esc(c)}</span></button></li>`}).join('')}</ol>
  ${!done&&m?`<div class="btns" style="margin-top:12px"><button class="chip primary" id="judge" ${run.sel.length===2?'':'disabled'}>判定する（${run.sel.length}/2）</button></div>`:''}
  ${done?`<div class="verdict ${done.ok?'ok':'ng'}"><span class="mark">${done.ok?'○':'✕'}</span><span class="msg">${done.ok?'正解':'不正解'}<small>正答：${q.a.map(n=>NUM[n-1]).join(q.m==='any'?' または ':'・')}</small></span></div>
   ${q.n?`<p class="note2">${esc(q.n)}</p>`:''}
   <div class="expl"><h4>解説</h4><div class="tx">${esc(ex)}</div></div>
   ${sim?`<div class="simrow">ほぼ同じ問題が${sim.q.length}回出題（${sim.q.map(i=>short(QI[i])).join('・')}） <button id="gosim">まとめて解く</button></div>`:''}`:''}
  <button class="chip origbtn" id="orig">原本の問題を表示</button><div class="orig" id="origbox" hidden></div>
  </div>
  <div class="qnav"><button class="chip" id="prev" ${run.i?'':'disabled'}>← 前へ</button><span class="sp"></span>
  ${run.i<run.qs.length-1?`<button class="chip primary" id="next">次へ →</button>`:`<button class="chip primary" id="fin">結果を見る</button>`}</div></article>
  <p class="kbd">キーボード：1〜4で選択／Enterで次へ</p>`;
  fillImgs(document.getElementById('app'));
  document.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  const j=$('#judge'); if(j) j.onclick=()=>answer(run.sel.slice());
  $('#star').onclick=()=>{S.star[q.id]=!S.star[q.id];save();quiz();};
  $('#orig').onclick=()=>{const bx=$('#origbox');if(bx.hidden){bx.innerHTML=q.o.map(s=>`<img data-src="${s}" alt="原本の問題">`).join('');bx.hidden=false;fillImgs(bx);$('#orig').textContent='原本を閉じる';}else{bx.hidden=true;$('#orig').textContent='原本の問題を表示';}};
  $('#prev').onclick=()=>{run.i--;run.sel=[];quiz();};
  const nx=$('#next'); if(nx) nx.onclick=()=>{run.i++;run.sel=[];quiz();};
  const fi=$('#fin'); if(fi) fi.onclick=result;
  const gs=$('#gosim'); if(gs) gs.onclick=()=>start(sim.q.map(i=>QI[i]),'類似：'+sim.n);
}
function pick(n){const q=run.qs[run.i]; if(run.ans[q.id]) return;
  if(!multi(q)){answer([n]);return;}
  const s=run.sel; const k=s.indexOf(n); if(k>=0) s.splice(k,1); else if(s.length<2) s.push(n); quiz(); }
function answer(sel){const q=run.qs[run.i]; const ok=judge(q,sel); run.ans[q.id]={sel,ok};
  const r=S.r[q.id]||[0,0,0]; S.r[q.id]=[ok?1:0,r[1]+1,r[2]+(ok?1:0)]; save(); quiz();
  const v=document.querySelector('.verdict'); if(v) v.scrollIntoView({block:'nearest',behavior:'smooth'}); }
function result(){
  topbar(); window.scrollTo(0,0);
  const qs=run.qs, an=qs.filter(q=>run.ans[q.id]), ok=an.filter(q=>run.ans[q.id].ok);
  const app=qs.filter(isApp), appOk=app.filter(q=>run.ans[q.id]&&run.ans[q.id].ok);
  const rate=an.length?ok.length/an.length:0;
  $('#app').innerHTML=`<section class="res"><div class="big"><strong>${ok.length}</strong><span>/ ${an.length}問 正解（出題 ${qs.length}問）</span><span class="judge ${rate>=.6?'ok':'ng'}">正答率 ${Math.round(rate*100)}%</span></div>
  <p class="note">本試験の合格基準は、解答する問題の60%以上、かつ施工管理法（応用能力）の60%以上の正解です。年度別の全問演習は選択問題も含むため、実際の解答数とは異なります。</p>
  <div class="rsec"><div>問題A<b>${ok.filter(q=>q.p==='A').length} / ${an.filter(q=>q.p==='A').length}</b></div><div>問題B<b>${ok.filter(q=>q.p==='B').length} / ${an.filter(q=>q.p==='B').length}</b></div><div>うち応用能力<b>${appOk.length} / ${app.length}</b></div></div>
  <div class="btns">${qs.filter(q=>run.ans[q.id]&&!run.ans[q.id].ok).length?`<button class="chip primary" id="again">間違えた問題だけ解き直す</button>`:''}<button class="chip" id="back">ホームへ戻る</button></div>
  <div class="list">${qs.map((q,i)=>{const a=run.ans[q.id];return `<button class="li" data-i="${i}"><span class="mk ${a?(a.ok?'o':'x'):''}">${a?(a.ok?'○':'✕'):'－'}</span><span class="tx"><small>${label(q)}</small><span>${esc(q.s.split('\n')[0])}</span></span></button>`}).join('')}</div></section>`;
  const ag=$('#again'); if(ag) ag.onclick=()=>start(qs.filter(q=>run.ans[q.id]&&!run.ans[q.id].ok),run.title+'（解き直し）');
  $('#back').onclick=()=>{run=null;home();};
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{run.i=+b.dataset.i;run.sel=[];quiz();});
}
document.addEventListener('keydown',e=>{ if(!run||e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(/^[1-4]$/.test(e.key)) pick(+e.key);
  else if(e.key==='Enter'){const q=run.qs[run.i]; if(!run.ans[q.id]&&multi(q)&&run.sel.length===2) answer(run.sel.slice()); else if(run.ans[q.id]){const n=$('#next')||$('#fin'); n&&n.click();}}
  else if(e.key==='ArrowRight'){const n=$('#next'); n&&n.click();} else if(e.key==='ArrowLeft'){const p=$('#prev'); p&&!p.disabled&&p.click();}
});
home();

</script><script>
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  const hadController=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController&&!reloaded){reloaded=true;location.reload();} });
}
</script>
</body></html>
