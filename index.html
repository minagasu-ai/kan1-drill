刻は同じで、15日である。","作業内容Ｅのトータルフロートは、5日である。","作業内容Ｃの作業日数を2日短縮しても、工期は2日短縮されない。"],"a":[2],"m":"exact","n":"","e":"各イベントの最早開始時刻は②7、③10、④18、⑤18、⑥24、⑦24、⑧33日。イベント⑤の最早開始時刻・最遅完了時刻はともに18日で、15日ではない。クリティカルパスは33日でB→D→F→H系の2本。","f":["img/R3B02_f0.png"],"o":["img/R3B02_o0.png"],"g":0,"cat":"B施工管理","neg":true},{"id":"R3B03","y":"R3","p":"B","no":3,"s":"品質管理に関する記述のうち、適当でないものはどれか。","c":["計量抜取検査は、ロットの特性値が正規分布とみなせる場合に実施する。","計数抜取検査には、不良個数による検査と欠点数による検査がある。","ISO9000ファミリー規格は、製品やサービスを作り出すプロセスに関する規格である。","ISO14000ファミリー規格は、公害対策として企業が遵守すべき基準値を定めた規格である。"],"a":[4],"m":"exact","n":"","e":"ISO14000ファミリーは環境マネジメントシステムの規格であり、遵守すべき基準値を定めたものではない。","f":[],"o":["img/R3B03_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R3B04","y":"R3","p":"B","no":4,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["危険有害な化学品を取り扱う作業では、安全データシートを常備し、当該化学品の情報を作業場内に表示する。","ハインリッヒの法則によれば、1つの重大災害発生の過程には数十件の軽度の事故と数百件のヒヤリ・ハットの発生がある。","リスクアセスメントとは、労働災害が発生した場合に、当該災害発生の責任の所在を評価して、被災者への補償額を算定する手法である。","送り出し教育とは、工事現場に労働者を送り出そうとする関係請負人が当該労働者に対し事前に実施する教育で、新規入場者教育の効率化に有効である。"],"a":[3],"m":"exact","n":"","e":"リスクアセスメントは、危険性・有害性を特定してリスクを見積もり、低減措置を決める手法。災害後の責任や補償額の評価ではない。","f":[],"o":["img/R3B04_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R3B05","y":"R3","p":"B","no":5,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["屋内設置の飲料用受水タンクの据付けにおいて、はり形コンクリート基礎上の鋼製架台の高さを100mmとする場合、当該コンクリート基礎の高さは500mmとしてよい。","雑排水用水中モーターポンプ2台を排水槽内に設置する場合、ポンプケーシングの中心間距離は、ポンプケーシングの直径の3倍としてよい。","貯湯タンクの据付けにおいては、周囲に450mm以上の保守、点検スペースを確保するほか、加熱コイルの引抜きスペース及び内部点検用マンホール部分の点検作業用スペースを確保する。","ゲージ圧が0.2MPaを超える温水ボイラーを設置する場合、安全弁その他の附属品の検査及び取扱いに支障がない場合を除き、ボイラーの最上部からボイラーの上部にある構造物までの距離は、0.8m以上とする。"],"a":[4],"m":"exact","n":"","e":"ボイラー最上部から上部構造物までの距離は1.2m以上とする（安全弁等の検査・取扱いに支障がない場合を除く）。","f":[],"o":["img/R3B05_o0.png"],"g":56,"cat":"B施工","neg":true},{"id":"R3B06","y":"R3","p":"B","no":6,"s":"配管の施工に関する記述のうち、適当でないものはどれか。","c":["蒸気配管に圧力配管用炭素鋼鋼管を使用する場合、蒸気還水管は、蒸気給気管に共吊りする。","鋼管のねじ接合に転造ねじを使用する場合、転造ねじのねじ部の強度は、鋼管本体の強度とほぼ同程度となる。","Uボルトは、配管軸方向の滑りに対する拘束力が小さいため、配管の固定支持には使用しない。","冷媒配管の接続完了後は、窒素ガス、炭酸ガス、乾燥空気等を用いて気密試験を行う。"],"a":[1],"m":"exact","n":"","e":"蒸気給気管は温度変化による伸縮が大きいため、蒸気還水管を共吊りしてはならない。","f":[],"o":["img/R3B06_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R3B07","y":"R3","p":"B","no":7,"s":"ダクトの施工に関する記述のうち、適当でないものはどれか。","c":["アングルフランジ工法では、低圧ダクトか高圧ダクトかにかかわらず、ダクトの吊り間隔は同じとしてよい。","共板フランジ工法ダクトに使用するガスケットは、アングルフランジ工法ダクトに使用するガスケットより厚いものを使用する。","スパイラルダクトの差込接合では、鋼製ビスで固定し、ダクト用テープを二重巻きすれば、シール材の塗布は不要である。","亜鉛鉄板製長方形ダクトの板厚は、ダクト両端の寸法が異なる場合、その最大寸法による板厚とする。"],"a":[3],"m":"exact","n":"","e":"スパイラルダクトの差込接合では、シール材を塗布して差し込み、ビス止め後にダクト用テープを二重巻きする。シール材は省略できない。","f":[],"o":["img/R3B07_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R3B08","y":"R3","p":"B","no":8,"s":"配管の保温に関する記述のうち、適当でないものはどれか。","c":["機械室内の露出の給水管にグラスウール保温材で保温する場合、一般的に、保温筒、ポリエチレンフィルム、鉄線、アルミガラスクロスの順に施工する。","冷温水管の保温の施工において、ポリエチレンフィルムは、防湿のための補助材として使用される。","蒸気管が壁又は床を貫通する場合、伸縮を考慮して、貫通部及びその前後約25mm程度は保温被覆を行わない。","保温の施工において、保温筒を二層以上重ねて所要の厚さにする場合は、保温筒の各層をそれぞれ鉄線で巻き締める。"],"a":[1],"m":"exact","n":"","e":"屋内露出の給水管の保温は、保温筒→鉄線→ポリエチレンフィルム→アルミガラスクロスの順。鉄線とフィルムの順序が逆。","f":[],"o":["img/R3B08_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R3B09","y":"R3","p":"B","no":9,"s":"冷凍機の試運転調整に関する記述のうち、適当でないものはどれか。","c":["冷却水ポンプ、冷水ポンプ及び冷却塔を起動し、冷水量及び冷却水量が規定流量であることを確認する。","停止サーモスタットの設定値が冷水温度の規定値より高いことを確認する。","冷水ポンプ、冷却水ポンプ及び冷却塔とのインターロックを確認してから冷凍機の起動スイッチを入れる。","冷水量が過度に減少した場合、断水リレーの作動により冷凍機が停止することを確認する。"],"a":[2],"m":"exact","n":"","e":"冷凍機の停止サーモスタットの設定値は、冷水温度の規定値より「低い」ことを確認する（凍結防止）。","f":[],"o":["img/R3B09_o0.png"],"g":70,"cat":"B施工","neg":true},{"id":"R3B10","y":"R3","p":"B","no":10,"s":"土中埋設配管における防食処置に関する記述のうち、適当でないものはどれか。","c":["ペトロラタム系防食テープによる防食処置では、ペトロラタム系防食テープを1/2重ね1回巻きし、その上にプラスチックテープを1/2重ね1回巻きする。","ブチルゴム系絶縁テープによる防食処置では、ブチルゴム系絶縁テープを1/2重ね2回巻きする。","熱収縮材による防食処置では、熱収縮テープを1/2重ね1回巻きし、バーナーで加熱収縮させる。","防食テープ巻きを施した鋼管は、施工時に被覆が損傷しても、鉄部が露出する陽極部面積が小さい場合、腐食によって短期間に穴があく可能性は小さい。"],"a":[4],"m":"exact","n":"","e":"被覆の損傷部（陽極部）の面積が小さいと腐食電流が集中し、短期間で穴があく危険が大きい。","f":[],"o":["img/R3B10_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R3B11","y":"R3","p":"B","no":11,"s":"建設工事現場の安全衛生管理に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["統括安全衛生責任者が統括管理しなければならない事項には、協議組織の設置及び運営がある。","統括安全衛生責任者が統括管理しなければならない事項には、作業間の連絡及び調整がある。","特定元方事業者は、毎作業日に少なくとも1回、作業場所の巡視を行わなければならない。","特定元方事業者は、安全衛生責任者を選任し、その者に統括安全衛生責任者との連絡等を行わせなければならない。"],"a":[4],"m":"exact","n":"","e":"安全衛生責任者を選任するのは関係請負人（下請）。特定元方事業者が選任するのは統括安全衛生責任者。","f":[],"o":["img/R3B11_o0.png"],"g":21,"cat":"B法規","neg":true},{"id":"R3B12","y":"R3","p":"B","no":12,"s":"建設工事現場の安全衛生管理に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["事業者は、高さが2m以上の箇所での作業において、強風、大雨等の悪天候により危険が予想されるときは、当該作業に労働者を従事させてはならない。","事業者は、ガス溶接等の業務に使用する溶解アセチレンの容器は、横に倒した状態で保管しなければならない。","事業者は、3m以上の高所から物体を投下するときは、適当な投下設備を設け、監視人を置く等労働者の危険を防止するための措置を講じなければならない。","事業者は、高さが5m以上の構造の足場の組立て作業をするときは、作業主任者を選任しなければならない。"],"a":[2],"m":"exact","n":"","e":"溶解アセチレンの容器は「立てて」置く。横倒しは不可。","f":[],"o":["img/R3B12_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R3B13","y":"R3","p":"B","no":13,"s":"建設業における就業に関する記述のうち、「労働基準法」上、誤っているものはどれか。","c":["使用者は、労働者に、原則として、休憩時間を除き一週間について40時間を超えて労働させてはならない。","使用者は、満18歳に満たない者をクレーンの玉掛けの業務（二人以上の者によって行う玉掛けの業務における補助作業の業務を除く。）に就かせてはならない。","使用者は、その雇入れの日から起算して6箇月間継続勤務し、全労働日の7割以上出勤した労働者に対して、原則として、10労働日の有給休暇を与えなければならない。","使用者は、労働者を解雇しようとする場合においては、原則として、少なくとも30日前にその予告をしなければならない。"],"a":[3],"m":"exact","n":"","e":"年次有給休暇（10労働日）の要件は、6箇月間継続勤務し全労働日の「8割」以上出勤したこと。","f":[],"o":["img/R3B13_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R3B14","y":"R3","p":"B","no":14,"s":"建築物の用語に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["共同住宅は特殊建築物であるが、一戸建住宅は特殊建築物ではない。","建築物の壁や屋根は主要構造部であるが、建築物の階段は主要構造部ではない。","建築物の2階以上の部分で、隣地境界線より5m以下の距離にある部分は、法に定める部分を除き、延焼のおそれのある部分である。","防火性能とは、建築物の周囲において発生する通常の火災による延焼を抑制するために、外壁又は軒裏に必要とされる性能をいう。"],"a":[2],"m":"exact","n":"","e":"主要構造部は壁・柱・床・はり・屋根・階段。階段も主要構造部である。","f":[],"o":["img/R3B14_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R3B15","y":"R3","p":"B","no":15,"s":"建築設備に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["排水トラップの封水深は、阻集器を兼ねる排水トラップの場合を除き、5cm以上15cm以下としなければならない。","天井内等の隠ぺい部に防火ダンパーを設ける場合は、一辺の長さが45cm以上の保守点検が容易に行える点検口を、天井、壁等に設けなければならない。","換気設備を設けるべき調理室等の給気口は、原則として、当該室の天井高さの1/2以下の位置に設けなければならない。","換気設備を設けるべき調理室等の排気口は、原則として、当該室の天井または天井から下方80cm以内の高さの位置に設けなければならない。"],"a":[1],"m":"exact","n":"","e":"排水トラップの封水深は5cm以上10cm以下（阻集器兼用を除く）。","f":[],"o":["img/R3B15_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R3B16","y":"R3","p":"B","no":16,"s":"建設業の許可に関する記述のうち、「建設業法」上、誤っているものはどれか。","c":["管工事業を営もうとする者は、二以上の都道府県の区域内に営業所を設けて営業をしようとする場合、原則として、国土交通大臣の許可を受けなければならない。","発注者から直接請け負う1件の管工事につき、下請代金の総額が4000万円以上となる工事を施工しようとする者は、特定建設業の許可を受けなければならない。","建設業者は、許可を受けた建設業の建設工事を請け負う場合においては、その建設工事に附帯する他の建設業の建設工事を請け負うことができる。","国、地方公共団体又はこれらに準ずる者として、国土交通省令で定める法人が発注者である管工事を施工しようとする者は、請負代金の額にかかわらず特定建設業の許可を受けなければならない。"],"a":[4],"m":"exact","n":"","e":"特定建設業の許可は、発注者から直接請け負った工事で一定額以上を下請に出す場合に必要。発注者が国・地方公共団体であることで決まるものではない。","f":[],"o":["img/R3B16_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R3B17","y":"R3","p":"B","no":17,"s":"建設工事における施工体制に関する記述のうち、「建設業法」上、誤っているものはどれか。","c":["主任技術者及び監理技術者は、当該建設工事の請負代金の管理、及び、施工に従事する者の技術上の指導監督の職務を誠実に行わなければならない。","建設業者は、発注者から直接請け負った建設工事を下請契約を行わずに自ら施工する場合、主任技術者を置かなければならない。","主任技術者の専任が必要な建設工事で、密接な関係のある二つの建設工事を同一の場所で施工する場合は、同一の専任の主任技術者とすることができる。","国が注文者である施設に関する管工事で、工事1件の請負代金の額が3500万円以上の工事を施工する場合、工事に置く主任技術者又は監理技術者（特例監理技術者は除く。）は、工事現場ごとに専任の者でなければならない。"],"a":[1],"m":"exact","n":"","e":"主任技術者・監理技術者の職務は施工計画の作成、工程管理、品質管理その他の技術上の管理と技術上の指導監督。請負代金の管理は含まれない。","f":[],"o":["img/R3B17_o0.png"],"g":24,"cat":"B法規","neg":true},{"id":"R3B18","y":"R3","p":"B","no":18,"s":"スプリンクラー設備に関する記述のうち、「消防法」上、誤っているものはどれか。\nただし、特定施設水道連結型スプリンクラー設備は除く。","c":["補助散水栓は、防火対象物の階ごとに、その階の未警戒となる各部分からホース接続口までの水平距離が15m以下となるように設けなければならない。","劇場の舞台部に設けるスプリンクラーヘッドは、閉鎖型スプリンクラーヘッドとしなければならない。","閉鎖型スプリンクラーヘッドのうち標準型ヘッドは、給排気用ダクト等でその幅又は奥行が1.2mを超えるものがある場合には、当該ダクト等の下面にも設けなければならない。","予作動式の流水検知装置が設けられているスプリンクラー設備にあっては、スプリンクラーヘッドが開放されてから放水までの時間を1分以内としなければならない。"],"a":[2],"m":"exact","n":"","e":"劇場の舞台部には開放型スプリンクラーヘッドを設ける。","f":[],"o":["img/R3B18_o0.png"],"g":57,"cat":"B法規","neg":true},{"id":"R3B19","y":"R3","p":"B","no":19,"s":"1号消火栓を用いた屋内消火栓設備の設置に関する記述のうち、「消防法」上、誤っているものはどれか。","c":["主配管のうち、立上り管は、管の呼びで50mm以上のものとしなければならない。","屋内消火栓の開閉弁は、床面からの高さが1.5m以下の位置又は天井に設けることとし、当該開閉弁を天井に設ける場合にあっては、当該開閉弁は自動式のものとしなければならない。","水源の水量は、屋内消火栓の設置個数が最も多い階における当該設置個数（当該設置個数が2を超えるときは、2とする。）に2.6m³を乗じて得た量以上の量としなければならない。","加圧送水装置は、屋内消火栓設備のノズルの先端における放水圧力が0.7MPaを超えるように設けなければならない。"],"a":[4],"m":"exact","n":"","e":"1号消火栓の放水圧力は0.17MPa以上0.7MPa以下。0.7MPaを超えないように措置する。","f":[],"o":["img/R3B19_o0.png"],"g":25,"cat":"B法規","neg":true},{"id":"R3B20","y":"R3","p":"B","no":20,"s":"分別解体等に関する記述のうち、「建設工事に係る資材の再資源化等に関する法律」上、誤っているものはどれか。","c":["特定建設資材を使用する床面積の合計が500m²以上の建築物の新築工事の受注者は、原則として、当該工事に伴い副次的に生ずる建設資材廃棄物をその種類ごとに分別しつつ当該工事を施工しなければならない。","対象建設工事の受注者は、工事着手の時期及び工程の概要、分別解体等の計画等の事項を、工事に着手する日の7日前までに、都道府県知事に届け出なければならない。","分別解体等に伴って生じた特定建設資材廃棄物である木材については、工事現場から50km以内に再資源化をするための施設がない場合、再資源化に代えて縮減をすれば足りる。","対象建設工事の元請業者は、当該工事に係る特定建設資材廃棄物の再資源化等が完了したときは、再資源化等に要した費用等について、発注者に書面により報告しなければならない。"],"a":[2],"m":"exact","n":"","e":"対象建設工事の届出は、工事着手の7日前までに「発注者」（自主施工者）が都道府県知事に行う。受注者ではない。","f":[],"o":["img/R3B20_o0.png"],"g":12,"cat":"B法規","neg":true},{"id":"R3B21","y":"R3","p":"B","no":21,"s":"特定建設作業に関する記述のうち、「騒音規制法」上、誤っているものはどれか。\nただし、災害その他非常の事態の発生により当該特定建設作業を緊急に行う必要がある場合及び人の生命又は身体に対する危険を防止するため特に当該特定建設作業を行う必要がある場合を除く。","c":["特定建設作業とは、建設工事として行われる作業のうち、びょう打機を使用する作業等の著しい騒音を発生する作業であって、2日以上にわたるものをいう。","特定建設作業に伴って発生する騒音についての規制は、都道府県知事が定める指定地域内においてのみ行われる。","指定地域内において、特定建設作業の騒音は、当該特定建設作業の場所において連続して5日を超えて行われる特定建設作業に伴って発生するものであってはならない。","指定地域内において、特定建設作業の騒音は、特定建設作業の場所の敷地の境界線において、85デシベルを超えてはならない。"],"a":[3],"m":"exact","n":"","e":"特定建設作業は、同一場所で連続6日を超えて行ってはならない（5日ではない）。","f":[],"o":["img/R3B21_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R3B22","y":"R3","p":"B","no":22,"s":"産業廃棄物の処理に関する記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","c":["事業者は、産業廃棄物の運搬又は処分を委託する場合には、契約は書面で行い、委託契約書及び書面を契約の終了の日から5年間保存しなければならない。","事業者は、電子情報処理組織を使用して産業廃棄物の運搬又は処分を委託する場合、委託者に産業廃棄物を引き渡した後、3日以内に情報処理センターに登録する必要がある。","事業者は、排出した産業廃棄物の運搬又は処分を委託する場合、電子情報処理組織を使用して産業廃棄物の種類、数量、受託者の氏名等を情報処理センターに登録したときは、産業廃棄物管理票を交付しなければならない。","事業者は、特別管理産業廃棄物の運搬又は処分を委託する場合、あらかじめ、当該委託しようとする特別管理産業廃棄物の種類、数量、性状等を、委託しようとする者に文書で通知しなければならない。"],"a":[3],"m":"exact","n":"","e":"電子マニフェスト（情報処理センターへの登録）を利用した場合は、紙の産業廃棄物管理票の交付は不要。","f":[],"o":["img/R3B22_o0.png"],"g":71,"cat":"B法規","neg":true},{"id":"R3B23","y":"R3","p":"B","no":23,"s":"公共工事における施工計画等に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["仮設、施工方法等は、工事の受注者がその責任において定めるものであり、発注者が設計図書において特別に定めることはできない。","工事材料の品質は設計図書で定められたものとするが、設計図書にその品質が明示されていない場合は、均衡を得た中等の品質を有するものとする。","工事原価は共通仮設費と直接工事費を合わせた費用であり、現場従業員の給料、諸手当等の現場管理費は直接工事費に含まれる。","総合試運転調整では、各機器単体の試運転を行うとともに、配管系、ダクト系に異常がないことを確認した後、システム全体の調整が行われる。"],"a":[1,3],"m":"exact","n":"","e":"⑴仮設・施工方法等は原則受注者の責任で定めるが、発注者が設計図書で特別に定める（指定仮設）こともできる。⑶工事原価＝直接工事費＋共通仮設費（＝純工事費）＋現場管理費。現場管理費は直接工事費に含まれない。","f":[],"o":["img/R3B23_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R3B24","y":"R3","p":"B","no":24,"s":"工程管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["ネットワーク工程表において、作業の出発結合点の最早開始時刻から到着結合点の最遅完了時刻までの時間から、当該作業の所要時間を引いた余裕時間をトータルフロートという。","バーチャート工程表は、各作業の着手日と終了日の間を横線で結ぶもので、各作業の所要日数と施工日程が分かりやすい。","ネットワーク工程表において、後続作業の最早開始時刻に影響を及ぼすことなく使用できる余裕時間をインターフェアリングフロートという。","総工事費が最少となる最も経済的な工期を最適工期といい、このときの施工速度を採算速度という。"],"a":[3,4],"m":"exact","n":"","e":"⑶後続作業の最早開始時刻に影響しない余裕はフリーフロート。⑷総工事費が最少となる工期は最適工期で、そのときの施工速度は経済速度。採算速度は損益分岐点を超える施工速度。","f":[],"o":["img/R3B24_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R3B25","y":"R3","p":"B","no":25,"s":"品質管理で用いられる統計的手法に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["散布図では、対応する2つのデータの関係の有無が分かる。","管理図では、問題としている特性とその要因の関係が体系的に分かる。","パレート図では、各不良項目の発生件数の順位が分かる。","ヒストグラムでは、データの時間的変化が分かる。"],"a":[2,4],"m":"exact","n":"","e":"⑵特性と要因の関係を体系的に表すのは特性要因図。管理図は工程の安定状態を見る。⑷ヒストグラムではデータの分布は分かるが時間的変化は分からない。","f":[],"o":["img/R3B25_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R3B26","y":"R3","p":"B","no":26,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["建設工事に伴う公衆災害とは、工事関係者及び第三者の生命、身体及び財産に関する危害並びに迷惑をいう。","年千人率は、重大災害発生の頻度を示すもので、労働者1,000人当たりの1年間に発生した死者数である。","建設業労働安全衛生マネジメントシステム（COHSMS）は、組織的かつ継続的に安全衛生管理を実施するための仕組みである。","災害の発生頻度を示す度数率は、延べ実労働時間100万時間当たりの労働災害による死傷者数である。"],"a":[1,2],"m":"exact","n":"","e":"⑴公衆災害は工事関係者「以外」の第三者に対する危害・迷惑。⑵年千人率は労働者1,000人当たりの1年間の「死傷者数」で、死者数ではない。","f":[],"o":["img/R3B26_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R3B27","y":"R3","p":"B","no":27,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["防振基礎に設ける耐震ストッパーは、地震時における機器の横移動の自由度を確保するため、機器本体との間の隙間を極力大きくとって取り付ける。","天井スラブの下面において、あと施工アンカーを上向きで施工する場合、接着系アンカーは使用しない。","軸封部がメカニカルシール方式の冷却水ポンプをコンクリート基礎上に設置する場合、コンクリート基礎上面に排水目皿及び当該目皿からの排水管を設けないこととしてよい。","機器を吊り上げる場合、ワイヤーロープの吊り角度を大きくすると、ワイヤーロープに掛かる張力は小さくなる。"],"a":[1,4],"m":"exact","n":"","e":"⑴耐震ストッパーは機器との隙間をできるだけ小さくして取り付ける。⑷吊り角度を大きくするとワイヤーロープの張力は大きくなる。","f":[],"o":["img/R3B27_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R3B28","y":"R3","p":"B","no":28,"s":"配管及び配管附属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["複式伸縮管継手を使用する場合は、当該伸縮管継手が伸縮を吸収する配管の両端を固定し、伸縮管継手本体は固定しない。","水道用硬質塩化ビニルライニング鋼管の切断には、パイプカッターや、高速砥石切断機は使用しない。","空気調和機への冷温水量を調整する混合型電動三方弁は、一般的に、空調機コイルへの往き管に設ける。","開放系の冷温水配管において、鋼管とステンレス鋼管を接合する場合は、絶縁継手を介して接合する。"],"a":[1,3],"m":"exact","n":"","e":"⑴複式伸縮管継手は本体を固定し、両側の配管にガイドを設ける。⑶混合型電動三方弁は一般に空調機コイルの「還り管」に設ける。","f":[],"o":["img/R3B28_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R3B29","y":"R3","p":"B","no":29,"s":"ダクト及びダクト附属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["送風機吐出し口とダクトを接続する場合、吐出し口断面からダクト断面への変形における拡大角は15°以下とする。","排煙ダクトを亜鉛鉄板製長方形ダクトとする場合、かどの継目にピッツバーグはぜを用いてはならない。","横走りする主ダクトには、振れを防止するため、形鋼振れ止め支持を15m以下の間隔で設ける。","給気ダクトに消音エルボを使用する場合、風量調整ダンパーの取付け位置は、消音エルボの上流側とする。"],"a":[2,3],"m":"exact","n":"","e":"⑵長方形ダクトのかどの継目にはピッツバーグはぜを用い、排煙ダクトもピッツバーグはぜとする（ボタンパンチスナップはぜは不可）。⑶横走り主ダクトの形鋼振れ止め支持は12m以下の間隔。","f":[],"o":["img/R3B29_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R4A01","y":"R4","p":"A","no":1,"s":"地球環境に関する記述のうち、適当でないものはどれか。","c":["我が国の温室効果ガスの総排出量は、2013年頃より減少に転じており、主な温室効果ガスのうち二酸化炭素、ハイドロフルオロカーボン類ともに減少している。","SDGsとは、国連サミットで採択された持続可能でより良い世界を目指すための国際目標であり、17のゴールから構成されている。","酸性雨は、大気中の硫黄酸化物や窒素酸化物が溶け込んで、一般的に、pH値が5.6以下の酸性となった雨等のことで、湖沼や森林の生態系に悪影響を与える。","オゾン層を保護するため、フロン類の製造から廃棄までに携わる全ての主体に法令の順守を求める「フロン類の使用の合理化及び管理の適正化に関する法律」が平成27年に施行されている。"],"a":[1],"m":"exact","n":"","e":"我が国の温室効果ガス総排出量は減少傾向で二酸化炭素も減少しているが、ハイドロフルオロカーボン類（冷媒用代替フロン）は増加している。","f":[],"o":["img/R4A01_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A02","y":"R4","p":"A","no":2,"s":"冬季における外壁の結露に関する記述のうち、適当でないものはどれか。","c":["室内空気の流動が少なくなると、壁面の表面温度が低下し、結露を生じやすい。","外壁に断熱材を用いると、熱通過率が小さくなり結露を生じにくい。","多層壁の構造体の内部における各点の水蒸気分圧を、その点における飽和水蒸気圧より低くすることにより、結露を防止することができる。","暖房をしている室内では、一般的に、天井付近に比べて床付近の方が結露を生じにくい。"],"a":[4],"m":"exact","n":"","e":"暖房時の室内では床付近の方が温度が低く、結露を生じ「やすい」。","f":[],"o":["img/R4A02_o0.png"],"g":30,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A03","y":"R4","p":"A","no":3,"s":"室内の空気環境に関する記述のうち、適当でないものはどれか。","c":["浮遊粉じんのうち、直径が10μm以下のものは、人体への影響があるとされている。","一酸化炭素は無色無臭で、二酸化炭素より比重が大きいガスである。","空気中の二酸化炭素濃度が20％程度以上になると、人体に致命的な影響を与える。","ホルムアルデヒド、トルエン、キシレン等の揮発性有機化合物（VOCs）は、シックビル症候群の主要因とされている。"],"a":[2],"m":"exact","n":"","e":"一酸化炭素の比重は約0.97で空気よりわずかに軽く、二酸化炭素（約1.53）より小さい。","f":[],"o":["img/R4A03_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A04","y":"R4","p":"A","no":4,"s":"流体に関する記述のうち、適当でないものはどれか。","c":["管種以外の条件が同じ場合、硬質塩化ビニル管は鋼管よりウォーターハンマーが発生しやすい。","キャビテーションとは、流体の静圧が局部的に飽和蒸気圧より低下し、気泡が発生する現象をいう。","流体の粘性による摩擦応力の影響は、一般的に、壁面近くで顕著に現れる。","液体の自由な表面で、その液面を縮小しようとする性質により表面に働く力を、表面張力という。"],"a":[1],"m":"exact","n":"","e":"硬質塩化ビニル管は鋼管より弾性係数が小さく圧力波の伝ぱ速度が遅いため、ウォーターハンマーによる圧力上昇は鋼管より小さい。","f":[],"o":["img/R4A04_o0.png"],"g":60,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A05","y":"R4","p":"A","no":5,"s":"下図に示す水平な管路内を空気が流れる場合において、A点とB点の間の圧力損失ΔPの値として適当なものはどれか。\nただし、A点の流速は10m/s、A点の静圧は30Pa、B点の全圧は70Pa、空気の密度は1.2kg/m³とする。","c":["10Pa","15Pa","20Pa","25Pa"],"a":[3],"m":"exact","n":"","e":"A点の全圧＝静圧30Pa＋動圧(1/2×1.2×10²＝60Pa)＝90Pa。圧力損失＝90－70＝20Pa。","f":["img/R4A05_f0.png"],"o":["img/R4A05_o0.png"],"g":61,"cat":"A基礎・電気・建築","neg":false},{"id":"R4A06","y":"R4","p":"A","no":6,"s":"下図は流速を計測する器具の原理を説明したものである。その「器具の名称」と「流速（v）と高さ（h）の関係」の組合せとして、適当なものはどれか。\n(器具の名称) (vとhの関係)","c":["ピトー管 vはhに比例","ピトー管 vは√hに比例","ベンチュリー管 vはhに比例","ベンチュリー管 vは√hに比例"],"a":[2],"m":"exact","n":"","e":"ピトー管で、v＝√(2gh)よりvは√hに比例する。","f":["img/R4A06_f0.png"],"o":["img/R4A06_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R4A07","y":"R4","p":"A","no":7,"s":"熱に関する記述のうち、適当でないものはどれか。","c":["気体の定容比熱と定圧比熱を比べると、常に定容比熱の方が大きい。","熱放射とは、物体が電磁波の形で熱エネルギーを放出・吸収する現象をいう。","膨張係数とは、物質の温度が1℃上昇したときに物質が膨張する割合である。","圧縮式冷凍サイクルでは、凝縮温度が一定の場合、蒸発温度を低くすれば、成績係数は小さくなる。"],"a":[1],"m":"exact","n":"","e":"気体の比熱は、常に定圧比熱の方が定容比熱より大きい（比熱比κ＝cp/cv＞1）。","f":[],"o":["img/R4A07_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A08","y":"R4","p":"A","no":8,"s":"燃焼に関する記述のうち、適当でないものはどれか。","c":["燃料を完全燃焼させるために理論的に必要な空気量を理論空気量という。","燃料が理論空気量で完全燃焼した際に生じる燃焼ガス量を理論燃焼ガス量（理論廃ガス量）という。","空気過剰率が大きすぎると、廃ガスによる熱損失が増大する。","固体燃料は、空気と接する燃料の表面が大きいため、理論空気量に近い空気量で完全燃焼する。"],"a":[4],"m":"exact","n":"","e":"固体燃料は空気と接する表面積が小さく混合しにくいため、理論空気量よりかなり多い過剰空気を必要とする。","f":[],"o":["img/R4A08_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A09","y":"R4","p":"A","no":9,"s":"湿り空気に関する記述のうち、適当でないものはどれか。","c":["飽和湿り空気の温度を上げても、絶対湿度は変わらない。","湿り空気をその露点温度より高い温度の冷却コイルで冷却すると、絶対湿度は上がる。","湿り空気を水スプレーで加湿しても、湿球温度はほとんど変わらない。","湿り空気を蒸気スプレーで加湿すると、絶対湿度と相対湿度は上がる。"],"a":[2],"m":"exact","n":"","e":"露点温度より高い温度のコイルで冷却しても結露は生じず、絶対湿度は変わらない（顕熱のみの冷却）。","f":[],"o":["img/R4A09_o0.png"],"g":49,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A10","y":"R4","p":"A","no":10,"s":"音に関する記述のうち、適当でないものはどれか。","c":["点音源から放射された音が球面状に一様に広がる場合、音源からの距離が2倍になると音圧レベルは約6dB低下する。","NC曲線で示される音圧レベルの許容値は、周波数が低いほど大きい。","マスキング効果は、マスクする音の周波数がマスクされる音の周波数に近いほど大きい。","音速は、一定の圧力のもとでは、空気の温度が高いほど遅くなる。"],"a":[4],"m":"exact","n":"","e":"空気中の音速は温度が高いほど速くなる（約331.5＋0.6t m/s）。","f":[],"o":["img/R4A10_o0.png"],"g":14,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A11","y":"R4","p":"A","no":11,"s":"電気設備において、「用語」とその「用語の説明」の組合せのうち、適当でないものはどれか。\n（用語） （用語の説明）","c":["低圧（電圧の区分） 交流では600V以下、直流では750V以下","単相3線式 3本の電線で標準電圧100Vと200Vを使用できる電気方式","D種接地工事 300Vを超える電路に施設する接地抵抗値10Ω以下の接地工事","スターデルタ始動方式 始動時の電流及び電動機トルクが全電圧始動に対して1/3になる始動方式"],"a":[3],"m":"exact","n":"","e":"D種接地工事は300V以下の低圧用で接地抵抗100Ω以下。300Vを超える低圧用で10Ω以下はC種接地工事。","f":[],"o":["img/R4A11_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A12","y":"R4","p":"A","no":12,"s":"低圧屋内配線工事に関する記述のうち、適当でないものはどれか。","c":["同一電線管に多数の電線を収納すると許容電流は増加する。","同一ボックス内に低圧の電線と弱電流電線を収納する場合は、直接接触しないように隔壁を設ける。","電動機端子箱への電源接続部には、金属製可とう電線管を使用する。","回路の遮断によって公共の安全に支障が生じる回路には、漏電遮断器に代えて漏電警報器を設けることができる。"],"a":[1],"m":"exact","n":"","e":"同一電線管に多数の電線を収納すると放熱が悪くなり、許容電流は減少する（電流減少係数を乗じる）。","f":[],"o":["img/R4A12_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A13","y":"R4","p":"A","no":13,"s":"鉄筋に対するコンクリートのかぶり厚さに関する記述のうち、適当でないものはどれか。","c":["スペーサーは、鉄筋のかぶり厚さを保つためのものである。","基礎の鉄筋のかぶり厚さは、捨てコンクリート部分を含めた厚さとする。","かぶり厚さの確保には、火災時に鉄筋の強度低下を抑える効果がある。","床スラブの最小かぶり厚さは、土に接する部分より土に接しない部分の方が小さい。"],"a":[2],"m":"exact","n":"","e":"基礎の鉄筋のかぶり厚さには、捨てコンクリート部分の厚さを含めない。","f":[],"o":["img/R4A13_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A14","y":"R4","p":"A","no":14,"s":"建築材料に関する記述のうち、適当でないものはどれか。","c":["強化ガラスは、割れても破片が細かい粒状になるため安全性が高い。","複層ガラスは、ガラスとガラスの間に特殊フィルムをはさみ、加熱圧着したガラスである。","石こうボードは、火災時に石こうに含まれる結晶水が失われるまでの間、温度上昇を抑制するため、耐火性に優れている。","ロックウールやグラスウール等の多孔質材料は、一般的に、周波数が高い音域に対する吸音効果に優れている。"],"a":[2],"m":"exact","n":"","e":"記述は合わせガラス。複層ガラスは2枚以上の板ガラスの間に乾燥空気層を設けて断熱性を高めたもの。","f":[],"o":["img/R4A14_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R4A15","y":"R4","p":"A","no":15,"s":"省エネルギーに効果がある空調計画に関する記述のうち、適当でないものはどれか。","c":["熱源の台数制御は、熱源を適切な容量、台数に分割することで、低負荷時に熱源機器の運転効率を良くする。","蓄熱方式による空調システムは、省エネルギーが図れるが、熱源容量は非蓄熱方式より大きくなる。","変流量方式における流量制御には、インバーターによるポンプの回転数制御とポンプの台数制御がある。","全熱交換器は、建物からの排気と導入外気を熱交換させるもので、導入外気の温湿度を室内空気の温湿度に近づけることができる。"],"a":[2],"m":"exact","n":"","e":"蓄熱方式は熱源の運転を平準化できるため、熱源容量は非蓄熱方式より「小さく」できる。","f":[],"o":["img/R4A15_o0.png"],"g":72,"cat":"A空調","neg":true},{"id":"R4A16","y":"R4","p":"A","no":16,"s":"空気調和方式に関する記述のうち、適当でないものはどれか。","c":["床吹出し方式は、吹出口の移動や増設によりレイアウト変更に対応しやすい。","大温度差送風（低温送風）方式は、送風量の低減によりダクトサイズを小さくすることができる。","エアフローウィンドウ方式は、窓面で熱負荷を除去することにより、日射や外気温度による室内への熱の影響を小さくすることができる。","天井放射冷房方式は、効率的に潜熱負荷を処理できるため快適性が高い。"],"a":[4],"m":"exact","n":"","e":"天井放射冷房方式は潜熱（除湿）を処理できないため、外調機等による除湿と併用する必要がある。","f":[],"o":["img/R4A16_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R4A17","y":"R4","p":"A","no":17,"s":"下図に示す暖房時の湿り空気線図において、空気調和機の有効加湿量として、適当なものはどれか。ただし、風量は10,000m³/h、空気密度は1.2kg/m³とする。","c":["19.2kg/h","30.4kg/h","43.2kg/h","62.4kg/h"],"a":[1],"m":"exact","n":"","e":"加湿量＝風量×密度×絶対湿度差＝10,000×1.2×(0.0066－0.0050)＝19.2kg/h。","f":["img/R4A17_f0.png"],"o":["img/R4A17_o0.png"],"g":31,"cat":"A空調","neg":false},{"id":"R4A18","y":"R4","p":"A","no":18,"s":"冷房負荷計算に関する記述のうち、適当でないものはどれか。","c":["窓ガラスからの負荷は、室内外の温度差による通過熱と、透過する太陽日射熱とに区分して計算する。","人体からの発生熱量は、室温が下がるほど顕熱が小さくなり、潜熱が大きくなる。","土間床、地中壁からの通過熱負荷は、一般的に、年間を通じて熱損失側であるため無視する。","北側のガラス窓からの熱負荷は、日射の影響も考慮する。"],"a":[2],"m":"exact","n":"","e":"室温が下がると人体からの顕熱は大きく、潜熱は小さくなる。記述は逆。","f":[],"o":["img/R4A18_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R4A19","y":"R4","p":"A","no":19,"s":"変風量単一ダクト方式の自動制御において、「制御する機器」と「検出要素」の組合せのうち、適当でないものはどれか。\n（制御する機器） （検出要素）","c":["加湿器 還気ダクト内の湿度","空気調和機の冷温水コイルの制御弁 空気調和機出口空気の温度","空気調和機のファン 還気ダクト内の静圧","外気及び排気用電動ダンパー 還気ダクト内の二酸化炭素濃度"],"a":[3],"m":"exact","n":"","e":"変風量方式の送風機の回転数制御は、給気ダクト内の静圧を検出して行う。還気ダクトではない。","f":[],"o":["img/R4A19_o0.png"],"g":1,"cat":"A空調","neg":true},{"id":"R4A20","y":"R4","p":"A","no":20,"s":"コージェネレーションシステムに関する記述のうち、適当でないものはどれか。","c":["マイクロガスタービン発電機を用いるシステムでは、ボイラー・タービン主任技術者の選任は不要である。","コージェネレーションシステムは、BCP（事業継続計画）の主要な構成要素の1つである。","ガスタービン方式は、排ガスボイラーにより蒸気を取り出すことで熱回収が可能である。","コージェネレーションシステムの総合的な効率は、年間を通じた熱需要には影響されない。"],"a":[4],"m":"exact","n":"","e":"コージェネレーションの総合効率は排熱をどれだけ利用できるかで決まり、年間を通じた熱需要に大きく影響される。","f":[],"o":["img/R4A20_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R4A21","y":"R4","p":"A","no":21,"s":"蓄熱方式に関する記述のうち、適当でないものはどれか。","c":["二次側配管系を開放回路とした場合、密閉回路に比べてポンプ揚程が増大する。","氷蓄熱方式は、融解潜熱を利用するため、水蓄熱方式に比べて蓄熱槽の容量が大きくなる。","蓄熱槽には、建物の二重スラブ内等に水槽を設置する完全混合型、水深の深い水槽を用いる温度成層型等がある。","熱源機器は、空調負荷の変動に直接追従する必要がなく、効率のよい運転ができる。"],"a":[2],"m":"exact","n":"","e":"氷蓄熱方式は融解潜熱を利用でき単位容積当たりの蓄熱量が大きいため、水蓄熱方式より蓄熱槽容量が「小さく」なる。","f":[],"o":["img/R4A21_o0.png"],"g":26,"cat":"A空調","neg":true},{"id":"R4A22","y":"R4","p":"A","no":22,"s":"換気に関する記述のうち、適当でないものはどれか。","c":["密閉式燃焼器具のみを設けた室には、火気を使用する室としての換気設備を設けなくてもよい。","一定量の汚染質が発生している室の必要換気量は、その室の容積に比例する。","第二種機械換気方式は、室内への汚染した空気の侵入を防ぐことができる。","喫煙室は受動喫煙を防止するため室内を負圧にし、出入口等から室内に流入する空気の気流を0.2m/s以上とする。"],"a":[2],"m":"exact","n":"","e":"必要換気量＝汚染質発生量÷(許容濃度－外気濃度)で求まり、室の容積には比例しない。","f":[],"o":["img/R4A22_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R4A23","y":"R4","p":"A","no":23,"s":"在室人員30人の居室の二酸化炭素濃度を0.0008m³/m³以下に保つために必要な最小の換気量として、適当なものはどれか。\nただし、人体からの二酸化炭素発生量は0.02m³/(h・人)、外気中の二酸化炭素濃度は0.0004m³/m³とする。","c":["1,000m³/h","1,200m³/h","1,500m³/h","1,800m³/h"],"a":[3],"m":"exact","n":"","e":"Q＝CO₂発生量÷(許容濃度－外気濃度)＝(30×0.02)÷(0.0008－0.0004)＝0.6÷0.0004＝1,500m³/h。","f":[],"o":["img/R4A23_o0.png"],"g":2,"cat":"A換気・排煙","neg":false},{"id":"R4A24","y":"R4","p":"A","no":24,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」による、区画・階及び全館避難安全検証法並びに特殊な構造によらないものとする。","c":["天井高さが3m未満の室の壁面に排煙口を設ける場合は、天井から80cm以内、かつ防煙垂れ壁の下端より上の部分とする。","排煙機の設置位置は、最上階の排煙口よりも下の位置にならないようにする。","排煙口の手動開放装置のうち手で操作する部分の高さは、天井から吊り下げる場合、床面から概ね1.3mの高さとする。","排煙立てダクト（メインダクト）の風量は、最遠の階から順次比較し、各階ごとの排煙風量のうち大きい方の風量とする。"],"a":[3],"m":"exact","n":"","e":"天井から吊り下げる手動開放装置の操作部分は、床面からおおむね1.8mの高さとする（壁に設ける場合は0.8〜1.5m）。","f":[],"o":["img/R4A24_o0.png"],"g":40,"cat":"A換気・排煙","neg":true},{"id":"R4A25","y":"R4","p":"A","no":25,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」による、区画・階及び全館避難安全検証法並びに特殊な構造によらないものとする。","c":["電源を必要とする排煙設備の予備電源は、30分間継続して排煙設備を作動させることができる容量以上のものとし、かつ、常用の電源が断たれた場合に自動的に切り替えられるものとする。","排煙立てダクト（メインダクト）には、原則として、防火ダンパーを設けない。","排煙機の耐熱性能には、吸込温度が280℃に達する間に運転に異常がなく、かつ、吸込温度280℃の状態において30分間以上異常なく運転できること等が求められる。","2以上の防煙区画を対象とする場合の排煙風量は、120m³/min以上で、かつ最大防煙区画の床面積1m²につき1m³/min以上とする。"],"a":[4],"m":"exact","n":"","e":"2以上の防煙区画を受け持つ排煙機は、120m³/min以上かつ最大防煙区画の床面積1m²につき「2m³/min」以上。","f":[],"o":["img/R4A25_o0.png"],"g":53,"cat":"A換気・排煙","neg":true},{"id":"R4A26","y":"R4","p":"A","no":26,"s":"上水道の配水管に関する記述のうち、適当でないものはどれか。1 1","c":["軟弱層が深い地盤に配水管を敷設する場合の配管の基礎は、管径の1/3〜1/1程度3 1（最低50cm）を砂又は良質土に置き換える。","公道に埋設する配水管の土被りは、1.2mを標準とする。","配水管から給水管を分岐する箇所での配水管内の最大静水圧は、0.98MPaを超えないようにする。","異形管の防護を図るため、管内水圧は最大静水圧に水撃圧を加えたものとする。"],"a":[3],"m":"exact","n":"","e":"配水管から給水管を分岐する箇所の最大静水圧は0.74MPaを超えないようにする（最小動水圧は0.15MPa以上）。","f":[],"o":["img/R4A26_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R4A27","y":"R4","p":"A","no":27,"s":"下水道に関する記述のうち、適当でないものはどれか。","c":["伏越し管きょ内の流速は、上流管きょ内の流速より遅くする。","管きょの管径が変化する場合の接合方法は、原則として水面接合又は管頂接合とする。","雨水管きょ及び合流管きょの最小管径は、250mmを標準とする。","取付管は、本管の中心線から上方に取り付ける。"],"a":[1],"m":"exact","n":"","e":"伏越し管きょ内の流速は、土砂の堆積を防ぐため上流管きょ内の流速より20〜30％程度「速く」する。","f":[],"o":["img/R4A27_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R4A28","y":"R4","p":"A","no":28,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["給水配管の最低水圧は、衛生器具の最低必要圧力を考慮する必要がある。","器具給水負荷単位は、公衆用で使う場合よりも私室用で使う場合の方が大きい値となる。","給水配管の最高水圧は、ウォーターハンマー防止の観点などから、0.5MPaを超えないように計画する。","水道直結増圧方式では、配水管への汚染を防止するために水道事業者認定の逆流防止器を取り付ける。"],"a":[2],"m":"exact","n":"","e":"器具給水負荷単位は、使用頻度の高い公衆用の方が私室用より大きい値となる。","f":[],"o":["img/R4A28_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R4A29","y":"R4","p":"A","no":29,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["高置タンク方式における揚水ポンプの揚水量は、一般的に、時間最大予想給水量に基づき決定する。","吐水口空間とは、給水栓又は給水管の吐水口端とあふれ縁との垂直距離をいい、この空間を十分に確保することにより逆流汚染を防止する。","玉形弁（グローブ弁）は流量の調整に適しており、圧力損失は仕切弁（ゲート弁）に比べて小さい。","水道直結増圧方式の立て管には、断水時に配管内が負圧にならないように、最上部に吸排気弁を設置する。"],"a":[3],"m":"exact","n":"","e":"玉形弁は流量調整に適するが、流れが弁内で曲がるため圧力損失は仕切弁より「大きい」。","f":[],"o":["img/R4A29_o0.png"],"g":73,"cat":"A衛生","neg":true},{"id":"R4A30","y":"R4","p":"A","no":30,"s":"給湯設備に関する記述のうち、適当でないものはどれか。","c":["中央式給湯設備における貯湯タンク内の湯温は、レジオネラ属菌の繁殖防止のため、60℃以上とする。","中央式給湯設備の循環経路に気水分離器を取り付ける場合は、配管経路の高い位置に設置する。","給湯管に銅管を用いる場合、かい食を防止するため、管内流速が1.5m/s以下となるように管径を選定する。","真空式温水発生機及び無圧式温水発生機は、「労働安全衛生法」によるボイラーに該当することから、取扱いにボイラー技士を必要とする。"],"a":[4],"m":"exact","n":"","e":"真空式・無圧式温水発生機は大気圧以下等で運転するため労働安全衛生法上のボイラーに該当せず、ボイラー技士は不要。","f":[],"o":["img/R4A30_o0.png"],"g":74,"cat":"A衛生","neg":true},{"id":"R4A31","y":"R4","p":"A","no":31,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["排水トラップの封水強度を高めるためには、トラップの封水の深さを大きくすることと、トラップの脚断面積比を大きくすることが有効である。","器具排水負荷単位法により通気管径を算定する場合の通気管長さは、通気管の実長に局部損失相当長を加算する。","排水立て管の45度を超えるオフセットの上下600mm以内には、排水横枝管を接続してはならない。1 1","排水槽の底面には1/15以上、1/10以下の勾配を設け、最下部には排水ピットを設ける。15 10"],"a":[2],"m":"exact","n":"","e":"器具排水負荷単位法で通気管径を求める際の通気管長さは実長を用い、局部損失相当長は加算しない。","f":[],"o":["img/R4A31_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R4A32","y":"R4","p":"A","no":32,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["各個通気の通気管接続箇所は、大便器その他これと類似の器具を除き、トラップウエアより低い位置に設けてはならない。","グリース阻集器の容量算定において、阻集グリース及び堆積残さの質量算定には掃除周期が関係する。","間接排水管は、衛生面を考慮して、機器・装置の種類又は排水の水質を同じくするものごとに系統を分ける。","伸頂通気方式における排水横管の許容流量は、各個及びループ通気方式の場合の許容流量と同じである。"],"a":[4],"m":"exact","n":"","e":"伸頂通気方式の排水横主管の許容流量は、各個・ループ通気方式より小さく（管径を大きく）する必要がある。","f":[],"o":["img/R4A32_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R4A33","y":"R4","p":"A","no":33,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["ブランチ間隔とは、汚水又は雑排水立て管に接続する排水横枝管の垂直距離の間隔のことであり、2.5mを超える場合を1ブランチ間隔という。","汚物ポンプは、固形物を多く含んだ水を排水するため、それに適したノンクロッグ形ポンプ、ボルテックス形ポンプ等を用いる。","結合通気管は、その階からの排水横枝管が排水立て管に接続する部分の下方からとり、45度Y継手等を用いて排水立て管から分岐して立ち上げ、その床面の下方で通気立て管に接続する。","伸頂通気方式の排水立て管には、原則としてオフセットを設けてはならない。"],"a":[3],"m":"exact","n":"","e":"結合通気管は、排水横枝管の接続部より下方で排水立て管から分岐し、その階の床面から1m以上上方で通気立て管に接続する。床面の下方ではない。","f":[],"o":["img/R4A33_o0.png"],"g":75,"cat":"A衛生","neg":true},{"id":"R4A34","y":"R4","p":"A","no":34,"s":"スプリンクラー設備の種類と概要に関する記述のうち、適当でないものはどれか。","c":["閉鎖型スプリンクラーヘッドを用いた湿式スプリンクラー設備は、火災報知器の感知又は手動によりポンプが作動し消火するものである。","閉鎖型スプリンクラーヘッドを用いた乾式スプリンクラー設備は、スプリンクラーヘッドが熱により開栓し、管内空気の圧力低下を感知することでポンプが作動し消火するものである。","閉鎖型スプリンクラーヘッドを用いた予作動式スプリンクラー設備は、火災報知器の感知により予作動弁が開放し、管内空気の圧力低下の感知によりポンプが作動するとともに、スプリンクラーヘッドが熱により開栓し消火するものである。","開放型スプリンクラーヘッドを用いたスプリンクラー設備は、火災報知器の感知によりポンプが作動するか、手動により一斉開放弁を開いて消火するものである。"],"a":[1],"m":"exact","n":"","e":"閉鎖型湿式スプリンクラーは、火災の熱でヘッドが開放して放水し、配管内の圧力低下を検知してポンプが起動する。火災報知器の感知で作動するのは予作動式等。","f":[],"o":["img/R4A34_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R4A35","y":"R4","p":"A","no":35,"s":"ガス設備に関する記述のうち、適当でないものはどれか。","c":["一般消費者等に供給される液化石油ガスは、「い号」「ろ号」「は号」に区分されており、実際に流通しているものは「い号」が多い。","都市ガスの中圧導管には、中圧A（0.3MPa以上1.0MPa未満）導管と中圧B（0.1MPa以上0.3MPa未満）導管がある。","都市ガス設備の工事は、ガス事業者又はガス事業者が認めた施工者が施工し、液化石油ガス設備の工事は、液化石油ガス設備士が作業に従事する。","標準状態（0℃、1気圧）のガス1m³（N）が完全燃焼したときに発生する熱量をウオッベ指数という。"],"a":[4],"m":"exact","n":"","e":"記述は（総）発熱量の定義。ウォッベ指数は総発熱量を比重の平方根で除した値で、燃焼性の指標。","f":[],"o":["img/R4A35_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R4A36","y":"R4","p":"A","no":36,"s":"浄化槽に関する記述のうち、適当でないものはどれか。","c":["構造基準において小規模合併処理浄化槽は、分離接触ばっ気方式及び脱窒ろ床接触ばっ気方式の2種類の処理方式がある。","二次処理は、一次処理で除去できなかった非沈殿性の浮遊物質や、水中に溶存している有機物等を微生物の代謝作用を利用して除去する処理工程である。","除去率とは、汚水中の浮遊物質やBOD等が、処理過程を経て除去された割合を百分率で表したものである。","BOD負荷量とは、BOD濃度に汚水量を乗じたもので、g/日で表される。"],"a":[1],"m":"exact","n":"","e":"構造基準の小規模合併処理浄化槽には、分離接触ばっ気方式、嫌気ろ床接触ばっ気方式、脱窒ろ床接触ばっ気方式の3方式がある。","f":[],"o":["img/R4A36_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R4A37","y":"R4","p":"A","no":37,"s":"FRP製浄化槽の設置に関する記述のうち、適当でないものはどれか。","c":["本体の設置は、本体の損傷防止や水平の調整のため、砂利事業の後に山砂を適度な厚さに敷き均し据え付ける。","埋戻しは、本体を安定させ、据付け位置からずれたり、水平が損なわれることを防止するため、水を張った状態で行う。","上部スラブコンクリートは、雨水が槽内に浸入することを防ぐため、マンホールや点検口を頂点として水勾配を付ける。","浄化槽工事を行う際には、浄化槽設備士が自ら浄化槽工事を行う場合を除き、浄化槽設備士に実地に監督させて行わなければならない。"],"a":[1],"m":"exact","n":"","e":"FRP製浄化槽は、砂利地業の後に捨てコンクリートを打設し、水平を確認して据え付ける。山砂を敷き均して据え付けるのではない。","f":[],"o":["img/R4A37_o0.png"],"g":76,"cat":"A衛生","neg":true},{"id":"R4A38","y":"R4","p":"A","no":38,"s":"送風機に関する記述のうち、適当でないものはどれか。","c":["斜流送風機は、小型の割には取り扱う風量が大きく比較的高い静圧も出すことができ、効率、騒音面でも優れている。","軸流送風機のベーン型は、羽根車の前又は後ろに案内羽根が設けてあり、チューブラ型に比べ効率も良く高い圧力に対応できる。","横流送風機（クロスフローファン）は、ルームエアコン、ファンコイルユニット、エアカーテン等の送風用に用いられる。","多翼送風機（シロッコファン）の羽根車は、構造上高速回転に適しており、高い圧力を出すことができる。"],"a":[4],"m":"exact","n":"","e":"多翼送風機（シロッコファン）は低速回転・低圧で大風量を得るのに適し、高速回転・高圧には向かない。","f":[],"o":["img/R4A38_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R4A39","y":"R4","p":"A","no":39,"s":"吸収冷凍機及び吸収冷温水機に関する記述のうち、適当でないものはどれか。","c":["ガス吸収冷温水機の容量制御は、ガスバーナの燃焼量を調節して制御する。","吸収冷温水機で暖房用の温水を取り出す方法には、蒸発器から温水を得るものがある。","二重効用吸収冷凍機は、一般的には、高圧蒸気により高温再生器と低温再生器を同時に加熱するものである。","二重効用吸収冷凍機の高温再生器は、一重効用吸収冷凍機の再生器に比べて高温の加熱媒体を必要とする。"],"a":[3],"m":"exact","n":"","e":"二重効用吸収冷凍機は高圧蒸気等で高温再生器を加熱し、そこで発生した冷媒蒸気で低温再生器を加熱する。同時に加熱するのではない。","f":[],"o":["img/R4A39_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R4A40","y":"R4","p":"A","no":40,"s":"ボイラー等に関する記述のうち、適当でないものはどれか。","c":["小型貫流ボイラーは、単管又は多管によって構成されており、保有水量が少ないため予熱時間は短いが、高度な水処理を必要とする。","鋳鉄製ボイラーは、材料の制約上、高温・高圧・大容量ものは製作できず、法令により温水ボイラーの圧力は0.5MPa、温水温度は120℃までに制限されている。","炉筒煙管ボイラーは、負荷変動に対して安定性があり、水処理は比較的容易であるが、保有水量が多いため予熱時間は長くなる。","真空式温水発生機は、胴内を加圧状態に保持しながら水を沸騰させ、胴内に内蔵した熱交換器等に伝熱する構造である。"],"a":[4],"m":"exact","n":"","e":"真空式温水発生機は、胴内を大気圧より低い減圧状態に保ち、熱媒水を沸騰させて内蔵の熱交換器に伝熱する。加圧状態ではない。","f":[],"o":["img/R4A40_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R4A41","y":"R4","p":"A","no":41,"s":"配管材料に関する記述のうち、適当でないものはどれか。","c":["水道用硬質塩化ビニルライニング鋼管の継手を含めた配管系の流体の温度は、40℃以下が適当である。","配管用炭素鋼鋼管の最高使用圧力は、1.0MPa程度である。","排水用硬質塩化ビニルライニング鋼管を圧力変動が大きい系統に使用する場合、その接合にはねじ込み式排水管継手を使用する。","排水用リサイクル硬質ポリ塩化ビニル管（REP−VU）は、屋外排水用の塩化ビニル管であり、重車両の荷重が加わらない場所での無圧排水用である。"],"a":[3],"m":"exact","n":"","e":"排水用硬質塩化ビニルライニング鋼管（DVLP）は管厚が薄くねじ加工できないため、排水鋼管用可とう継手（MD継手）で接合する。ねじ込み式排水管継手は使用しない。","f":[],"o":["img/R4A41_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R4A42","y":"R4","p":"A","no":42,"s":"ダクト及びダクト附属品に関する記述のうち、適当でないものはどれか。","c":["低圧ダクトは、常用圧力において、正圧、負圧ともに800Pa以内で使用する。","排煙ダクトに設ける防火ダンパーの温度ヒューズの作動温度は280℃とする。","風量調節ダンパーの風量調節性能は、平行翼形ダンパーよりも対向翼形ダンパーの方が優れている。","誘引作用の大きい吹出口は、吹出し温度差を大きくとることができる。"],"a":[1],"m":"exact","n":"","e":"低圧ダクトの常用圧力は正圧・負圧とも500Pa以内。800Pa以内ではない。","f":[],"o":["img/R4A42_o0.png"],"g":77,"cat":"A機材・設計図書・約款","neg":true},{"id":"R4A43","y":"R4","p":"A","no":43,"s":"「公共工事標準請負契約約款」に関する記述のうち、適当でないものはどれか。","c":["受注者は、約款（契約書を含む。）及び設計図書に特別の定めがない仮設、施工方法等を定める場合は、監督員の指示によらなければならない。","発注者が設計図書を変更し、請負代金額が2/3以上減少した場合、受注者は契約を解除することができる。","発注者は、引渡し前においても、工事目的物の全部又は一部を受注者の承諾を得て使用することができる。","受注者は、工事現場内に搬入した工事材料を監督員の承諾を受けないで工事現場外に搬出してはならない。"],"a":[1],"m":"exact","n":"","e":"約款に特別の定めがない仮設・施工方法等は、受注者が自らの責任で定める。監督員の指示によるのではない。","f":[],"o":["img/R4A43_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R4A44","y":"R4","p":"A","no":44,"s":"JISに規定している、「配管材料」と「記号」の組合せのうち、適当でないものはどれか。\n（配管材料） （記号）","c":["配管用炭素鋼鋼管 SGP","圧力配管用炭素鋼鋼管 STPG","架橋ポリエチレン管（二層管） XM","水道用硬質ポリ塩化ビニル管 VP"],"a":[3],"m":"exact","n":"","e":"JISの架橋ポリエチレン管は単層管（M種）と二層管（E種）に区分される。二層管の記号がXMという組合せは誤り。","f":[],"o":["img/R4A44_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R4B01","y":"R4","p":"B","no":1,"s":"工事の申請・届出書類と提出先に関する記述のうち、適当でないものはどれか。","c":["屋内消火栓設備の設置に係る工事の場合、工事整備対象設備等着工届出書を消防長又は消防署長に届け出なければならない。","搬入のための工事用車両を道路上に停めて一時的に作業を行う場合、警察署長に道路占用許可申請書を提出しなければならない。","高圧ガス保安法で定められている高圧ガス製造届書は、都道府県知事あるいは指定都市の長に届け出なければならない。","原動機の定格出力が7.5kW以上の送風機を設置する場合、騒音規制法の特定施設設置届出書（騒音）を市町村長に提出しなければならない。"],"a":[2],"m":"exact","n":"","e":"道路上に車両を停めて一時的に作業する場合は「道路使用許可」を警察署長に申請する。道路占用許可は道路管理者に申請するもの。","f":[],"o":["img/R4B01_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R4B02","y":"R4","p":"B","no":2,"s":"下図のネットワーク工程表に関する記述のうち、適当でないものはどれか。\nただし、図中のイベント間のＡ〜Ｉは作業内容、日数は作業日数を表す。","c":["クリティカルパスは1本で、所要日数は30日である。","作業内容Ｂのトータルフロートは、3日である。","作業内容Ｉのフリーフロートは、1日である。","作業内容Ｉの作業日数が3日遅延すれば、クリティカルパスが変更となり所要日数は1日遅延する。"],"a":[3],"m":"exact","n":"","e":"各イベントの最早時刻は②7、③7、④15、⑤15、⑥21、⑦21、⑧30日。作業Iは⑥（21日）から7日で28日、⑧の最早時刻30日との差でフリーフロートは2日。","f":["img/R4B02_f0.png"],"o":["img/R4B02_o0.png"],"g":0,"cat":"B施工管理","neg":true},{"id":"R4B03","y":"R4","p":"B","no":3,"s":"品質管理で用いられる手法に関する記述のうち、適当でないものはどれか。","c":["パレート図は、データをプロットして結んだ折れ線と管理限界線により、データの時間的変化や異常なばらつきがわかる。","特性要因図とは、問題としている特性とそれに影響を与えると想定される要因との関係を魚の骨のような図に体系的に整理したものである。","散布図とは、グラフに点をプロットしたもので、点の分布状態より2つのデータの相関関係がわかる。","層別とは、データの特性を適当な範囲別にいくつかのグループに分けることをいい、データ全体の傾向や管理対象範囲の把握が容易になる等の効果がある。"],"a":[1],"m":"exact","n":"","e":"記述は管理図の説明。パレート図は不良項目等を件数の多い順に並べた棒グラフと累積比率の折れ線で、重点項目を把握するもの。","f":[],"o":["img/R4B03_o0.png"],"g":78,"cat":"B施工管理","neg":true},{"id":"R4B04","y":"R4","p":"B","no":4,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["事業者は、建設工事において重大災害が発生した場合は、労働基準監督署に速やかに報告しなければならない。","事業者は、既設汚水ピット内で作業を行う場合は、その日の作業を開始する前に当該作業場における空気中の酸素及び硫化水素の濃度を測定しなければならない。","ハインリッヒの法則では、1件の重大事故の背後には29件の軽度の事故、さらに300件のヒヤリ・ハットがあるといわれている。","送配電線の近くでクレーン作業を行う場合、特別高圧電線からは1.2m以上の離隔距離を確保しなければならない。"],"a":[4],"m":"exact","n":"","e":"クレーン作業での送電線からの離隔距離の目安は、低圧1m、高圧1.2m、特別高圧2m以上（電圧により加算）。特別高圧で1.2mは不足。","f":[],"o":["img/R4B04_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R4B05","y":"R4","p":"B","no":5,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["排水用水中モーターポンプの据付け位置は、排水槽への排水流入口から離れた場所とする。","防振基礎の場合は、大きな揺れに対応するために耐震ストッパーは設けない。","横形ポンプを2台以上並べて設置する場合、各ポンプ基礎の間隔は、一般的に、500mm以上とする。","ポンプ本体とモータの軸の水平は、カップリング面、ポンプの吐出し及び吸込みフランジ面の水平及び垂直を水準器で確認する。"],"a":[2],"m":"exact","n":"","e":"防振基礎の機器には、地震時の移動・転倒を防ぐ耐震ストッパーを設ける。","f":[],"o":["img/R4B05_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R4B06","y":"R4","p":"B","no":6,"s":"配管の施工に関する記述のうち、適当でないものはどれか。","c":["冷温水横走り配管（上り勾配の往き管）の径違い管を偏心レジューサーで接続する場合、管内の下面に段差ができないように接続する。","建物のエキスパンションジョイント部を跨ぐ配管においては、変位を吸収するためフレキシブルジョイントを設置する。","冷温水配管の主管から枝管を分岐する場合、エルボを3個以上用いて、管の伸縮を吸収できるようにする。","飲料用高置タンクからの給水配管の完了後、管内の洗浄において末端部で遊離残留塩素が0.2mg/L以上検出されるまで消毒する。"],"a":[1],"m":"exact","n":"","e":"上り勾配の往き管の径違いは、偏心レジューサーで管の上面（天端）をそろえ、空気だまりができないようにする。","f":[],"o":["img/R4B06_o0.png"],"g":64,"cat":"B施工","neg":true},{"id":"R4B07","y":"R4","p":"B","no":7,"s":"ダクト及びダクト附属品の施工に関する記述のうち、適当でないものはどれか。","c":["コイルの上流側のダクトが30度を超える急拡大となる場合は、整流板を設けて風量の分布を平均化する。","排煙ダクトと排煙機との接続は、フランジ接合とする。","亜鉛鉄板製スパイラルダクトは、亜鉛鉄板をらせん状に甲はぜ機械掛けしたもので、高圧ダクトには使用できない。","パネル形の排煙口は、排煙ダクト内の気流方向とパネルの回転軸が平行となる向きに取り付ける。"],"a":[3],"m":"exact","n":"","e":"スパイラルダクトははぜが補強の役目をし強度が高いため、高圧ダクトにも使用できる。","f":[],"o":["img/R4B07_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R4B08","y":"R4","p":"B","no":8,"s":"保温、保冷の施工に関する記述のうち、適当でないものはどれか。","c":["ホルムアルデヒド放散量は、「Ｆ☆☆☆☆」のように表示され、☆の数が多いほどホルムアルデヒド放散量が少ないことを示す。","ポリスチレンフォーム保温材は、優れた独立気泡体を有し、吸水、吸湿がほとんどないため、水分による断熱性能の低下が小さい。","グラスウール保温板の24K、32K、40K等の表示は、保温材の耐熱温度を表すもので、数値が大きいほど耐熱温度が高い。","ステンレス鋼板製（SUS444製を除く。）貯湯タンクを保温する際は、タンク本体にエポキシ系塗装等を施すことにより、タンク本体と保温材とを絶縁する。"],"a":[3],"m":"exact","n":"","e":"グラスウール保温板の24K、32K、40Kは密度（kg/m³）を表す。耐熱温度ではない。","f":[],"o":["img/R4B08_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R4B09","y":"R4","p":"B","no":9,"s":"機器の試運転調整に関する記述のうち、適当でないものはどれか。","c":["ボイラーの試運転では、地震感知装置による燃料停止を確認する。","軸封装置がメカニカルシールのポンプの試運転では、しゅう動部からほとんど漏水がないことを確認する。","冷凍機の試運転では、温度調節器による自動発停の作動を確認する。","揚水ポンプの試運転では、高置タンクの満水警報の発報により、揚水ポンプが停止することを確認する。"],"a":[4],"m":"exact","n":"","e":"揚水ポンプは高置タンクの水位制御（電極の停止水位）で停止することを確認する。満水警報は異常時の警報であり、通常停止の信号ではない。","f":[],"o":["img/R4B09_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R4B10","y":"R4","p":"B","no":10,"s":"腐食・防食に関する記述のうち、適当でないものはどれか。","c":["蒸気配管系統に配管用炭素鋼鋼管（黒）を使用する場合、蒸気管（往き管）は、還水管よりも腐食が発生しやすい。","電気防食法における外部電源方式では、直流電源装置のマイナス端子に被防食体を接続する。","溶融めっきは、金属を高温で溶融させた槽中に被処理材を浸漬したのち引き上げ、被処理材の表面に金属被覆を形成させる防食方法である。","密閉系冷温水配管では、ほとんど酸素が供給されないので配管の腐食速度は遅い。"],"a":[1],"m":"exact","n":"","e":"蒸気配管系では、凝縮水に溶け込んだ酸素や二酸化炭素により還水管の方が腐食しやすい。","f":[],"o":["img/R4B10_o0.png"],"g":20,"cat":"B施工","neg":true},{"id":"R4B11","y":"R4","p":"B","no":11,"s":"建設工事の作業所において、関係請負人の労働者を含めて常時50人以上となる混在作業所の安全衛生管理体制として、「労働安全衛生法」上、誤っているものはどれか。","c":["特定元方事業者は、統括安全衛生責任者を選任し、その者に作業場所の巡視等、労働災害を防止するために必要な事項を統括管理させなければならない。","統括安全衛生責任者を選任した特定元方事業者は、一定の資格を有する者のうちから安全衛生推進者を選任しなければならない。","特定元方事業者は、選任した元方安全衛生管理者に、統括安全衛生責任者が統括管理すべき事項のうち技術的事項を管理させなければならない。","統括安全衛生責任者を選任すべき事業者以外の請負人は、安全衛生責任者を選任し、その者に統括安全衛生責任者との連絡等を行わせなければならない。"],"a":[2],"m":"exact","n":"","e":"特定元方事業者が選任するのは元方安全衛生管理者。安全衛生推進者は常時10〜49人の事業場で選任するもの。","f":[],"o":["img/R4B11_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R4B12","y":"R4","p":"B","no":12,"s":"建設工事現場における安全管理に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["事業者は、酸素欠乏危険場所の作業場における空気中の酸素の濃度を測定した記録は、1年間保存しなければならない。","つり上げ荷重が1トン以上の移動式クレーンの玉掛けの業務を行う者は、当該業務に係る技能講習を修了した者でなければならない。","事業者は、建築物の解体等の作業を行うときは、解体等対象建築物等の全ての材料について石綿障害予防規則に定められた方法で事前調査をしなければならない。","事業者は、酸素欠乏危険作業に労働者を従事させる場合、当該作業を行う場所の空気中の酸素濃度を保つための換気に、純酸素を使用してはならない。"],"a":[1],"m":"exact","n":"","e":"酸素濃度の測定記録は3年間保存しなければならない。","f":[],"o":["img/R4B12_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R4B13","y":"R4","p":"B","no":13,"s":"労働条件に関する記述のうち、「労働基準法」上、誤っているものはどれか。","c":["使用者は、労働契約の締結に際し、労働者に対して賃金、労働時間その他の労働条件を明示しなければならない。","労働基準法で定める基準に達しない労働条件を定める労働契約は、その労働契約のすべてにおいて無効とする。","使用者は、労働契約の不履行について違約金を定め、又は損害賠償額を予定する契約をしてはならない。","使用者は、労働契約に附随して貯蓄の契約をさせ、又は貯蓄金を管理する契約をしてはならない。"],"a":[2],"m":"exact","n":"","e":"労働基準法の基準に達しない労働条件を定めた労働契約は、その部分のみ無効となり、無効部分は法の基準による。","f":[],"o":["img/R4B13_o0.png"],"g":22,"cat":"B法規","neg":true},{"id":"R4B14","y":"R4","p":"B","no":14,"s":"建築物に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["居室の天井の高さは2.1m以上とし、一室で天井の高さの異なる部分がある場合においては、その平均の高さによるものとする。","「建築」とは、建築物を新築、増築、改築、又は移転することをいう。","避難階とは、直接地上へ通ずる出入口のある階をいう。","小規模な事務室のみを設けた地階は、階数に算入しない。"],"a":[4],"m":"exact","n":"","e":"地階の倉庫・機械室等で水平投影面積が建築面積の1/8以下のものは階数に算入しないが、事務室は対象外。","f":[],"o":["img/R4B14_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R4B15","y":"R4","p":"B","no":15,"s":"建築設備に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["地上11階以上の建築物の屋上に2台の冷却塔を設置する場合、冷却塔から他の冷却塔までの距離を2m以上とする。","通気管は、直接外気に衛生上有効に開放しなければならない。ただし、配管内の空気が屋内に漏れることを防止する装置が設けられている場合にあっては、この限りでない。","排水槽を設ける場合は通気のための装置を設け、かつ、当該装置は、直接外気に衛生上有効に開放しなければならない。","地階に居室を有する建築物の屋内に設ける換気設備の風道は、防火上支障がないものとして国土交通大臣が定める部分を除き、難燃材料で造らなければならない。"],"a":[4],"m":"exact","n":"","e":"地階に居室を有する建築物の換気設備の風道は「不燃材料」で造る。難燃材料ではない。","f":[],"o":["img/R4B15_o0.png"],"g":46,"cat":"B法規","neg":true},{"id":"R4B16","y":"R4","p":"B","no":16,"s":"請負契約書に記載しなければならない事項に関する記述のうち、「建設業法」上、規定されていないものはどれか。","c":["各当事者の履行の遅滞その他債務の不履行の場合における遅延利息、違約金その他の損害金","価格等の変動若しくは変更に基づく請負代金の額又は工事内容の変更","現場代理人の権限に関する事項及び現場代理人の行為についての注文者の請負人に対する意見の提出方法","天災その他不可抗力による工期の変更又は損害の負担及びその額の算定方法に関する定め"],"a":[3],"m":"exact","n":"","e":"現場代理人の権限等は請負契約書の法定記載事項（建設業法19条）ではなく、注文者への書面通知事項（19条の2）。","f":[],"o":["img/R4B16_o0.png"],"g":27,"cat":"B法規","neg":true},{"id":"R4B17","y":"R4","p":"B","no":17,"s":"元請負人の義務に関する記述のうち、「建設業法」上、誤っているものはどれか。","c":["元請負人は、下請負人からその請け負った建設工事が完成した旨の通知を受けたときは、当該通知を受けた日から20日以内で、かつ、できる限り短い期間内に、その完成を確認するための検査を完了しなければならない。","元請負人は、請負代金の出来形部分に対する支払又は工事完成後における支払を受けたときは、当該支払の対象となった建設工事を施工した下請負人に対して、相応する下請代金を、当該支払を受けた日から1か月以内で、かつ、できる限り短い期間内に支払わなければならない。","元請負人が請負代金の出来形部分に対する支払又は工事完成後における支払を受けたときに、下請負人に対して相応する下請代金を支払う場合、元請負人は、下請代金のうち労務費に相当する部分については、現金で支払うよう適切な配慮をしなければならない。","元請負人は、その請け負った建設工事を施工するために必要な工程の細目、作業方法その他元請負人において定めるべき事項を定めようとするときは、あらかじめ、発注者の意見を聞かなければならない。"],"a":[4],"m":"exact","n":"","e":"元請負人が工程の細目・作業方法等を定めるときは、あらかじめ「下請負人」の意見を聞かなければならない。","f":[],"o":["img/R4B17_o0.png"],"g":5,"cat":"B法規","neg":true},{"id":"R4B18","y":"R4","p":"B","no":18,"s":"1号屋内消火栓設備のポンプを用いる加圧送水装置に関する記述のうち、「消防法」上、誤っているものはどれか。","c":["ポンプの吐出量は、屋内消火栓の設置個数が最も多い階における設置個数（設置個数が2を超える場合は2とする。）に120L/minを乗じて得た量以上とする。","ポンプには、その吐出側に圧力計、吸込側に連成計を設けるものとする。","ポンプの吐出量が定格吐出量の150％である場合における全揚程は、定格全揚程の65％以上のものとする。","ポンプの始動を明示する表示灯を設ける場合、当該表示灯は赤色とし、消火栓箱の内部又はその直近に設けるものとする。"],"a":[1],"m":"exact","n":"","e":"1号屋内消火栓のポンプ吐出量は、設置個数（最大2）に150L/minを乗じた量以上。120L/minではない（120L/minは2号消火栓等の放水量の基準）。","f":[],"o":["img/R4B18_o0.png"],"g":17,"cat":"B法規","neg":true},{"id":"R4B19","y":"R4","p":"B","no":19,"s":"不活性ガス消火設備に関する記述のうち、「消防法」上、誤っているものはどれか。","c":["局所放出方式の不活性ガス消火設備に使用する消火剤は、二酸化炭素とする。","駐車の用に供される部分及び通信機器室であって常時人がいない部分は、局所放出方式としなければならない。","防護区画が2以上あり、貯蔵容器を共用する場合は、防護区画ごとに選択弁を設けなければならない。","防護区画の換気装置は、消火剤の放射前に停止できる構造としなければならない。"],"a":[2],"m":"exact","n":"","e":"常時人がいない駐車場や通信機器室では、全域放出方式とする。","f":[],"o":["img/R4B19_o0.png"],"g":79,"cat":"B法規","neg":true},{"id":"R4B20","y":"R4","p":"B","no":20,"s":"分別解体等に関する記述のうち、「建設工事に係る資材の再資源化等に関する法律」上、誤っているものはどれか。","c":["対象建設工事の請負契約の当事者は、分別解体等の方法、解体工事に要する費用その他の事項について書面に記載し、相互に交付しなければならない。","建築設備を単独で受注した請負金額が1億円以上の設備改修工事は、修繕・模様替等工事とみなされ対象建設工事となる。","対象建設工事受注者は、その請け負った建設工事の全部又は一部を他の建設業を営む者に請け負わせようとするときは、当該他の建設業を営む者に対し、当該対象建設工事について届け出られた分別解体等の計画等の事項を告げなければならない。","「建設業法」上の管工事業の許可を受けた者が解体工事業を営もうとする場合は、当該業を行おうとする区域を管轄する都道府県知事の登録は不要である。"],"a":[4],"m":"exact","n":"","e":"解体工事業を営むには、建設業法の解体工事業（又は土木・建築一式）の許可がない限り、都道府県知事の登録が必要。管工事業の許可では代替できない。","f":[],"o":["img/R4B20_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R4B21","y":"R4","p":"B","no":21,"s":"業務用冷凍空調機器の整備及び撤去等に関する記述のうち、「フロン類の使用の合理化及び管理の適正化に関する法律」上、誤っているものはどれか。","c":["第一種特定製品整備者は、第一種特定製品にフロン類を充塡するときは、第一種フロン類充塡回収業者に委託しなければならない。","第一種フロン類充塡回収業を行おうとする者は、環境大臣の登録を受けなければならない。","第一種フロン類充塡回収業者が委託を受けてフロン類の回収を行ったときは、整備を発注した第一種特定製品の管理者に回収証明書を交付しなければならない。","フロン類破壊業者がフロン類を破壊したときは、当該フロン類を引き取った第一種フロン類充塡回収業者に破壊証明書を送付しなければならない。"],"a":[2],"m":"exact","n":"","e":"第一種フロン類充塡回収業者は、都道府県知事の登録を受ける。環境大臣ではない。","f":[],"o":["img/R4B21_o0.png"],"g":80,"cat":"B法規","neg":true},{"id":"R4B22","y":"R4","p":"B","no":22,"s":"産業廃棄物の処理に関する記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","c":["専ら再生利用の目的となる産業廃棄物のみの収集若しくは運搬又は処分を業として行う者に当該産業廃棄物のみの運搬又は処分を委託する場合は、産業廃棄物管理票の交付を要しない。","産業廃棄物管理票を交付した事業者は、当該管理票に関する報告書を作成し、都道府県知事に提出しなければならないが、電子情報処理組織を使用して、情報処理センターに登録した場合は事業者から都道府県知事への報告は不要である。","産業廃棄物の処分を業として行おうとする者は、都道府県知事から産業廃棄物処分業者の許可を受けることにより、産業廃棄物の運搬及び処分を一括して受託することができる。","事業者は、建設工事に伴い発生した産業廃棄物を事業場の外の300m²以上の保管場所に保管する場合、非常災害のために必要な応急措置として行う場合を除き、事前にその旨を都道府県知事に届け出なければならない。"],"a":[3],"m":"exact","n":"","e":"処分業の許可だけでは収集運搬はできない。運搬を受託するには収集運搬業の許可も必要。","f":[],"o":["img/R4B22_o0.png"],"g":13,"cat":"B法規","neg":true},{"id":"R4B23","y":"R4","p":"B","no":23,"s":"公共工事の施工計画等に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["工事の受注者は、設計図書に基づく請負代金内訳書及び実行予算書を、発注者に提出しなければならない。","総合施工計画書は受注者の責任において作成されるが、設計図書に特記された事項については監督員の承諾を受ける。","工事に使用する材料は、設計図書にその品質が明示されていない場合にあっては、最低限の品質を有するものとする。","総合工程表は、現場の仮設工事から、完成時における試運転調整、後片付け、清掃までの全工程の予定を表すものである。"],"a":[1,3],"m":"exact","n":"","e":"⑴実行予算書は受注者の内部管理資料で、発注者への提出義務はない。⑶設計図書に品質の明示がない材料は「中等の品質」のものとする。","f":[],"o":["img/R4B23_o0.png"],"g":81,"cat":"C応用能力","neg":true},{"id":"R4B24","y":"R4","p":"B","no":24,"s":"工程管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["工程表作成時に注意すべき項目は、作業の順序と作業時間、休日や夜間の作業制限、諸官庁への申請・届出、試運転調整、検査時期、季節の天候等がある。","ネットワーク工程表には、前作業が遅れた場合の後続作業への影響度が把握しにくいという短所がある。","ネットワーク工程表で全体工程の短縮を検討する場合は、当初のクリティカルパス上の作業についてのみ日程短縮を検討すればよい。","工期の途中で工程計画をチェックし、現実の推移を入れて調整することをフォローアップという。"],"a":[2,3],"m":"exact","n":"","e":"⑵ネットワーク工程表は前作業の遅れが後続作業に及ぼす影響を把握しやすいのが長所。⑶工期短縮では、短縮により新たにクリティカルパスとなる経路も検討する必要がある。","f":[],"o":["img/R4B24_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R4B25","y":"R4","p":"B","no":25,"s":"品質管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["品質管理は、設計図書で要求された品質を実現するため、品質計画に基づき施工を実施し品質保証を確立することにある。","品質管理として行う行為には、搬入材料の検査、配管の水圧試験、風量調整の確認等がある。","品質管理のメリットは品質の向上や均一化であり、デメリットは工事費の増加である。","PDCAサイクルは、計画→改善→チェック→実施→計画のサイクルを繰り返すことであり、品質の改善に有効である。"],"a":[3,4],"m":"exact","n":"","e":"⑶品質管理は手直しの減少などにより工事費の低減にもつながり、工事費の増加はデメリットではない。⑷PDCAサイクルは計画→実施→チェック→処置（改善）の順。","f":[],"o":["img/R4B25_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R4B26","y":"R4","p":"B","no":26,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["特定元方事業者は、労働災害を防止するために、作業場所を週に少なくとも1回巡視しなければならない。","安全施工サイクルとは、安全朝礼から始まり、安全ミーティング、安全巡回、安全工程打合せ、後片付け、終業時確認までの作業日ごとの安全活動サイクルのことである。","災害の発生によって、事業者は、刑事責任、民事責任、行政責任及び社会的責任を負う。","重大災害とは、一時に3人以上の労働者が業務上死亡した災害をいい、労働者が負傷又はり病した災害は含まない。"],"a":[1,4],"m":"exact","n":"","e":"⑴特定元方事業者の作業場所の巡視は「毎作業日に少なくとも1回」。⑷重大災害は一時に3人以上の労働者が死傷又はり病した災害で、負傷やり病も含む。","f":[],"o":["img/R4B26_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R4B27","y":"R4","p":"B","no":27,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["あと施工のメカニカルアンカーボルトは、めねじ形よりおねじ形の方が許容引抜き力が大きい。","屋上設置の飲料用タンクのコンクリート基礎は、鋼製架台も含めた高さを400mmとする。","冷却塔のボールタップを作動させるため、補給水口の高さは、高置タンクの低水位より1mの落差が確保できる位置とする。","冷却塔は、排出された空気が再び冷却塔に吸い込まれないよう外壁等とのスペースを十分にとるとともに風通しのよい場所に据え付ける。"],"a":[2,3],"m":"exact","n":"","e":"⑵飲料用タンクは底部に60cm以上の保守点検空間が必要で、架台を含めて400mmでは不足。⑶冷却塔のボールタップを作動させるには、補給水口は高置タンクの低水位から3m以上の落差を確保する。","f":[],"o":["img/R4B27_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R4B28","y":"R4","p":"B","no":28,"s":"配管及び配管附属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["冷温水配管に自動空気抜き弁を設ける場合は、管内が負圧になる箇所に設ける。","冷温水配管からの膨張管を開放形膨張タンクに接続する際は、接続口の直近にメンテナンス用バルブを設ける。","ステンレス鋼管の溶接接合は、管内にアルゴンガス又は窒素ガスを充満させてから、TIG溶接により行う。","揚水管の試験圧力は、揚水ポンプの全揚程の2倍とするが、0.75MPaに満たない場合は0.75MPaとする。"],"a":[1,2],"m":"exact","n":"","e":"⑴自動空気抜き弁は管内が正圧となる箇所に設ける（負圧だと空気を吸い込む）。⑵膨張管には弁を設けてはならない。","f":[],"o":["img/R4B28_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R4B29","y":"R4","p":"B","no":29,"s":"ダクト及びダクト附属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["送風機の吐出し口直後に曲り部を設ける場合は、吐出し口から曲り部までの距離を送風機の羽根径と同じ寸法とする。","長辺が450mmを超える亜鉛鉄板製ダクトは、保温を施さない部分に補強リブによる補強を行う。","送風機とダクトを接続するたわみ継手は、たわみ部が負圧となる場合、補強用のピアノ線が挿入されたものを使用する。","横走り主ダクトに設ける耐震支持は、25m以内に1箇所、形鋼振止め支持とする。"],"a":[1,4],"m":"exact","n":"","e":"⑴送風機の吐出し口から曲り部までは、羽根径の1.5倍以上の直管部を設ける。⑷横走り主ダクトの耐震支持（形鋼振止め支持）は12m以内に1箇所。","f":[],"o":["img/R4B29_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R5A01","y":"R5","p":"A","no":1,"s":"地球環境問題に関する記述のうち、適当でないものはどれか。","c":["温室効果ガスとは、二酸化炭素、メタン等で、「地球温暖化対策の推進に関する法律」には、対象とするガスが定義されている。","ハイドロクロロフルオロカーボン（HCFC）は、機器等での使用は禁止されていないが、国内生産は全廃されている。","アンモニアは、オゾン層破壊係数が0の自然冷媒であるが、毒性や可燃性があり地球温暖化係数も大きい。","温室効果とは、日射エネルギーにより加熱された地表面からの熱放射の一部を、大気中の水蒸気、二酸化炭素等が吸収することで、大気が一定の温度に保たれることをいう。"],"a":[3],"m":"exact","n":"","e":"アンモニアはオゾン層破壊係数0の自然冷媒で、毒性・可燃性はあるが、地球温暖化係数はほぼ0と小さい。","f":[],"o":["img/R5A01_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A02","y":"R5","p":"A","no":2,"s":"温熱環境に関する記述のうち、適当でないものはどれか。","c":["クロ（clo）とは、衣服の断熱性を示す単位で、事務室の執務状態では、夏が6clo、冬が10clo程度である。","メット（met）とは、人体の代謝量を示す単位で、椅座安静状態が1.0metである。","予想平均申告（PMV）とは、人体の熱的中立に近い状態の温冷感を予測する指標である。","暑さ指数（WBGT）とは、暑熱環境下の熱ストレスを評価する指数で、熱中症の予防の判断に使われ単位は℃である。"],"a":[1],"m":"exact","n":"","e":"事務室執務時の着衣量の目安は夏が約0.6clo、冬が約1.0clo。","f":[],"o":["img/R5A02_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A03","y":"R5","p":"A","no":3,"s":"空気環境に関する記述のうち、適当でないものはどれか。","c":["燃焼において、空気中の酸素濃度が18.5％を下回ると、不完全燃焼による一酸化炭素の発生量が多くなる。","一酸化炭素は、無色無臭であるが、人体に有害なガスである。","窒素酸化物の発生の仕組みには、主なものとして、燃焼空気中の窒素からのサーマルNOxと、燃料中の窒素化合物からのフューエルNOxがある。","人体からの二酸化炭素発生量は、作業状態によって変化し、エネルギー代謝量に反比例する。"],"a":[4],"m":"exact","n":"","e":"人体からのCO₂発生量はエネルギー代謝量に比例して増加する。反比例ではない。","f":[],"o":["img/R5A03_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A04","y":"R5","p":"A","no":4,"s":"流体に関する記述のうち、適当でないものはどれか。","c":["動粘性係数は、粘性係数を流体の速度で除した値であり、粘性の流体運動に及ぼす影響を示す。","ベルヌーイの定理は、流体の持っている運動エネルギー、重力による位置エネルギー及び圧力によるエネルギーの和が流線に沿って一定であることを示している。","水の粘性係数は、圧力が一定の場合、水温の低下とともに大きくなる。","空気の粘性係数は、圧力が一定の場合、温度の低下とともに小さくなる。"],"a":[1],"m":"exact","n":"","e":"動粘性係数は粘性係数を流体の「密度」で除した値。速度ではない。","f":[],"o":["img/R5A04_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A05","y":"R5","p":"A","no":5,"s":"流体が直管路を流れている場合、流速が3倍となったとき、摩擦による圧力損失の変化後の倍率として、適当なものはどれか。\nただし、圧力損失は、ダルシー・ワイスバッハの式によるものとし、流速以外は同じとする。","c":["1/9倍","1/3倍","3倍","9倍"],"a":[4],"m":"exact","n":"","e":"圧力損失は流速の2乗に比例：3²＝9倍。","f":[],"o":["img/R5A05_o0.png"],"g":91,"cat":"A基礎・電気・建築","neg":false},{"id":"R5A06","y":"R5","p":"A","no":6,"s":"ウォーターハンマーに関する記述のうち、適当でないものはどれか。","c":["流体の流速と圧力上昇は反比例する。","ジュコフスキーの式により圧力上昇は求められる。","鋼管より硬質塩化ビニル管の方が発生しにくい。","流体の密度が大きいほど、圧力上昇は大きくなる。"],"a":[1],"m":"exact","n":"","e":"ウォーターハンマーの圧力上昇は流速（流速変化）に比例する（Δp＝ρ・a・Δv）。反比例ではない。","f":[],"o":["img/R5A06_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A07","y":"R5","p":"A","no":7,"s":"熱に関する記述のうち、適当でないものはどれか。","c":["比熱比とは、定圧比熱を定容比熱で除した値で、気体では常に1より大きい。","エンタルピーは、物質の持つエネルギーの状態量で、その物質の内部エネルギーに、外部への体積膨張仕事量を加えたもので表される。","エントロピーは、不可逆変化が生じると必ず減少する。","カルノーサイクルは、等温膨張、断熱膨張、等温圧縮、断熱圧縮の4つの過程からなる。"],"a":[3],"m":"exact","n":"","e":"不可逆変化ではエントロピーは必ず増加する（熱力学第二法則）。","f":[],"o":["img/R5A07_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A08","y":"R5","p":"A","no":8,"s":"伝熱に関する記述のうち、適当でないものはどれか。","c":["熱放射は、電磁波で熱エネルギーが移動する現象であり、その伝達には媒体の存在を必要とせず真空中でも生じる。","流体内において、温度の不均一に基づく密度差で浮力が生じ、流動が起こる場合の熱移動を強制対流熱伝達という。","均質な固体内部において熱伝導により移動する熱量は、その固体内の温度勾配に比例する。","伝熱現象には、熱伝導、対流及び熱放射がある。"],"a":[2],"m":"exact","n":"","e":"温度差による密度差（浮力）で生じる流動での熱移動は自然対流熱伝達。強制対流は送風機・ポンプ等の外力による。","f":[],"o":["img/R5A08_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A09","y":"R5","p":"A","no":9,"s":"冷却に関する記述のうち、適当でないものはどれか。","c":["冷媒を使用した冷却は、冷媒が蒸発する際に必要な熱を冷却する物体から奪うことによりおこる。","冷媒に使用される主なものには、アンモニア、フロン類、水等がある。","蒸発した冷媒を液化するためには、圧縮機を用いて機械的に圧縮する方法や吸収剤等により吸収する方法がある。","単段圧縮冷凍サイクルでは、蒸発温度を高く、凝縮温度を低くすると成績係数は小さくなる。"],"a":[4],"m":"exact","n":"","e":"蒸発温度を高く、凝縮温度を低くするほど圧縮仕事が減り、成績係数（COP）は大きくなる。","f":[],"o":["img/R5A09_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A10","y":"R5","p":"A","no":10,"s":"金属材料の腐食に関する記述のうち、適当でないものはどれか。","c":["異種金属接触腐食とは、貴な金属と卑な金属が水中等で接触することにより、卑な金属が腐食することをいう。","開放系配管における炭素鋼の腐食速度は、水温の上昇とともに増加し80℃あたりを境に減少する。","炭素鋼は、管内流速が速くなると腐食速度は減少するが、金属表面の不動態化が促進される流速域だけは腐食速度が増加する。","すきま腐食とは、配管のフランジ接合部等のわずかなすきま部において酸素濃淡電池を構成し腐食を起こすことをいう。"],"a":[3],"m":"exact","n":"","e":"炭素鋼は一般に流速が速くなると酸素の供給が増えて腐食速度が増加するが、不動態化が促進される流速域では減少する。記述は逆。","f":[],"o":["img/R5A10_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A11","y":"R5","p":"A","no":11,"s":"電気設備工事に関する記述のうち、適当でないものはどれか。","c":["金属管工事における三相3線式回路の電線は、1回路の電線全部を同一の金属管内に収める。","CD管（合成樹脂製可とう電線管）は、一般的に、直接コンクリートに埋め込んで施設する。","電線の接続は、管内で行わず、プルボックス等の内部で行う。","PF管（合成樹脂製可とう電線管）相互の接続は、直接接続とする。"],"a":[4],"m":"exact","n":"","e":"PF管相互の接続はカップリング等の附属品を用いて行う。直接接続はできない。","f":[],"o":["img/R5A11_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A12","y":"R5","p":"A","no":12,"s":"三相誘導電動機に関する記述のうち、適当でないものはどれか。","c":["インバータ制御は高調波が発生するため、フィルタ等の高調波対策が必要である。","直入れ始動方式では、一般的に、始動電流は定格電流の2倍程度となる。","出力が0.2kW以下の場合は、過負荷保護装置を設けなくてもよい。","三相の電線のうちいずれかの2線を入れ替えると、回転方向が逆向きになる。"],"a":[2],"m":"exact","n":"","e":"直入れ始動の始動電流は定格電流の5〜7倍程度と大きい。","f":[],"o":["img/R5A12_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A13","y":"R5","p":"A","no":13,"s":"鉄筋コンクリート造の建築物に関する記述のうち、適当でないものはどれか。","c":["柱の鉄筋のかぶり厚さは、主筋の外側からコンクリートの表面までの最短距離をいう。","耐震壁は、地震に対して有効であり、バランスよく配置しなければならない。","コンクリート壁の特定の箇所に、ひび割れを集中させるために設ける目地を、ひび割れ誘発目地という。","鉄筋とコンクリートは、常温では線膨張係数がほぼ等しい。"],"a":[1],"m":"exact","n":"","e":"柱のかぶり厚さは、最も外側にある帯筋の外側からコンクリート表面までの最短距離。主筋からではない。","f":[],"o":["img/R5A13_o0.png"],"g":82,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A14","y":"R5","p":"A","no":14,"s":"鉄筋コンクリート造の梁に関する記述のうち、適当でないものはどれか。","c":["同じ大きさの二つの梁貫通孔の中心間隔は、梁貫通孔の径の3倍以上とする。","梁貫通孔の径の大きさは、梁せいの1/2以下とする。","梁の側面のせき板は、コンクリートの圧縮強度が5N/mm²以上で取り外すことができる。","梁の幅止め筋は、コンクリート打設時にあばら筋（スターラップ）のはらみを防止する。"],"a":[2],"m":"exact","n":"","e":"梁貫通孔の径は、梁せいの1/3以下とする。","f":[],"o":["img/R5A14_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R5A15","y":"R5","p":"A","no":15,"s":"建築計画に関する記述のうち、夏期の省エネルギーの観点から、適当でないものはどれか。","c":["建物の平面形状が長方形の場合、長辺が東西面となるように計画する。","外壁面積に対する窓面積の比率を小さくする。","外壁の色は、日射吸収率の小さい白色系とする。","外壁の塗装には、太陽光の赤外線を反射し、建物の温度上昇の抑制に効果のある塗料を使用する。"],"a":[1],"m":"exact","n":"","e":"長方形の建物は長辺を南北面に向けて東西面の面積を小さくする。東西面は夏期の日射負荷が大きい。","f":[],"o":["img/R5A15_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R5A16","y":"R5","p":"A","no":16,"s":"空気調和方式に関する記述のうち、適当でないものはどれか。","c":["ぺリメーター空気処理方式は、コールドドラフトの防止に有効である。","床吹出し方式は、暖房運転時の居住域における垂直方向の温度差が大きい。","定風量単一ダクト方式は、各室で時刻別負荷変動パターンが異なる場合、各室間で温度のアンバランスが生じやすい。","ファンコイルユニット・ダクト併用方式は、全空気方式に比べ、外気冷房の効果が得にくい。"],"a":[2],"m":"exact","n":"","e":"床吹出し方式は暖房時に足元から温風を供給するため、居住域の上下温度差は小さい。","f":[],"o":["img/R5A16_o0.png"],"g":6,"cat":"A空調","neg":true},{"id":"R5A17","y":"R5","p":"A","no":17,"s":"空気調和計画において、「空気調和系統の区分」と「ゾーニング」の組合せとして、適当でないものはどれか。\n［空気調和系統の区分］ ［ゾーニング］","c":["ぺリメーターゾーン系統とインテリアゾーン系統 空気清浄度別","一般事務室系統と会議室系統 使用時間別","一般事務室系統とサーバー室系統 温湿度条件別","一般事務室系統と食堂系統 負荷傾向別"],"a":[1],"m":"exact","n":"","e":"ペリメーター系統とインテリア系統の区分は、外部負荷の影響度（方位・負荷特性）によるゾーニング。空気清浄度別ではない。","f":[],"o":["img/R5A17_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R5A18","y":"R5","p":"A","no":18,"s":"熱負荷に関する記述のうち、適当でないものはどれか。","c":["実効温度差は、地域、方位、時刻だけではなく壁体の断面構成によっても異なる。","サッシからの隙間風負荷は、室内を正圧に保つことができる場合は見込まなくてよい。","熱伝導率は、物質に固有な物性値であり、その単位はW/(m・K)である。","熱通過率は、壁体の構造が同じであれば、その表面における気流の速度には影響されない。"],"a":[4],"m":"exact","n":"","e":"熱通過率には表面熱伝達率が含まれるため、壁体表面の気流速度の影響を受ける。","f":[],"o":["img/R5A18_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R5A19","y":"R5","p":"A","no":19,"s":"空気調和設備における自動制御に関する記述のうち、適当でないものはどれか。","c":["外気取入れダンパーは、空気調和機の運転開始時に一定時間を閉とする。","CO₂濃度制御は、CO₂濃度センサーと外気ダンパーにより外気導入量を制御し、室内のCO₂濃度を設定した値にする。","冷却塔の送風機は、外気温度により二位置制御とする。","冷凍機の台数制御は、運転時間や運転回数が均等となるようにローテーションを行う。"],"a":[3],"m":"exact","n":"","e":"冷却塔の送風機は冷却水温度（出口水温）により発停・台数制御する。外気温度ではない。","f":[],"o":["img/R5A19_o0.png"],"g":19,"cat":"A空調","neg":true},{"id":"R5A20","y":"R5","p":"A","no":20,"s":"コージェネレーションシステムに関する記述のうち、適当でないものはどれか。","c":["コージェネレーションシステムの発電システムは、所定の条件を満たせば消防法における非常電源として兼用が可能である。","コージェネレーションシステムは、排熱を高温から低温に向けて順次多段階に活用するカスケード利用を行うように配慮する。","受電並列運転（系統連系）は、コージェネレーションシステムによる電力と商用電力を接続し、一体的に供給する方式である。","燃料電池を用いるコージェネレーションシステムは、原動機を用いるコージェネレーションシステムと比べて発電効率が低い。"],"a":[4],"m":"exact","n":"","e":"燃料電池式コージェネレーションは、原動機式に比べて発電効率が高い。","f":[],"o":["img/R5A20_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R5A21","y":"R5","p":"A","no":21,"s":"ヒートポンプに関する記述のうち、適当でないものはどれか。","c":["電気式の場合、除霜運転は、一般的に、四方弁を冷房サイクルに切り替えて行う。","暖房では、圧縮された冷媒が凝縮器で放熱する熱エネルギーを使用する。","空気熱源では、外気温度が高くなると暖房能力が低下する。","地下水等の熱を利用する場合の適応条件としては、容易に得られること、量が豊富でその時間的変化が少ないこと等があげられる。"],"a":[3],"m":"exact","n":"","e":"空気熱源ヒートポンプは外気温度が「低く」なると暖房能力が低下する。","f":[],"o":["img/R5A21_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R5A22","y":"R5","p":"A","no":22,"s":"下図に示すように、空気清浄装置を介した外気で室の換気を行う場合、定常状態における換気量（V）の計算式として、適当なものはどれか。ここに、V：換気量=外気量〔m³/h〕 M：室内の汚染物質発生量〔mg/h〕C：室内の汚染物質濃度〔mg/m³〕 Cₒ：外気の汚染物質濃度〔mg/m³〕η：空気清浄装置の汚染物質の捕集率M","c":["V＝M÷{C－(1＋η)Cₒ}","V＝M÷{Cₒ＋(1＋η)C}","V＝M÷{C－(1－η)Cₒ}","V＝M÷{Cₒ＋(1－η)C}"],"a":[3],"m":"exact","n":"","e":"物質収支：外気から入る量(1－η)CₒV＋発生量M＝排出量CV。よってV＝M÷{C－(1－η)Cₒ}。","f":["img/R5A22_f0.png"],"o":["img/R5A22_o0.png"],"g":null,"cat":"A換気・排煙","neg":false},{"id":"R5A23","y":"R5","p":"A","no":23,"s":"エレベーター機械室において発生した熱を、換気設備によって排除するのに必要な最小換気量として、適当なものはどれか。\nただし、エレベーター機器の発熱量は6kW、エレベーター機械室の許容温度は40℃、外気温度は35℃、空気の定圧比熱は1.0kJ/(kg・K)、空気の密度は1.2kg/m³とする。","c":["1,800m³/h","2,400m³/h","3,600m³/h","4,000m³/h"],"a":[3],"m":"exact","n":"","e":"Q＝(6kW×3,600)÷(1.2×1.0×(40－35))＝21,600÷6＝3,600m³/h。","f":[],"o":["img/R5A23_o0.png"],"g":7,"cat":"A換気・排煙","neg":false},{"id":"R5A24","y":"R5","p":"A","no":24,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」による、避難安全検証法（区画、階、全館）及び特殊な構造によらないものとする。","c":["排煙ダクトは、可燃物から100mm以上離すか、又は厚さ50mm以上の金属以外の不燃材料で覆うものとする。","排煙ダクトに設ける防火ダンパーは、作動温度280℃のものを使用する。","排煙口の吸込み風速は10m/s以下、ダクト内風速は20m/s以下となるようにする。","排煙口の同時開放条件を設定する場合、通常は隣接する2防煙区画が同時開放するものとする。"],"a":[1],"m":"exact","n":"","e":"排煙ダクトは可燃物から15cm（150mm）以上離すか、厚さ10cm（100mm）以上の金属以外の不燃材料で覆う。","f":[],"o":["img/R5A24_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R5A25","y":"R5","p":"A","no":25,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」による、避難安全検証法（区画、階、全館）及び特殊な構造によらないものとする。","c":["機械排煙設備において、特別避難階段の付室を兼用する非常用エレベーターの乗降ロビーの排煙機風量は、6m³/s以上とする。","防煙垂れ壁は、原則として、天井面より50cm以上下方に突出した不燃材料で造られたものとする。","自然排煙の防煙区画と機械排煙の防煙区画との間は、間仕切区画に代えて垂れ壁による区画としてもよい。","同一防煙区画内に可動間仕切りがある場合、間仕切られるそれぞれの室に排煙口を設け連動させる。"],"a":[3],"m":"exact","n":"","e":"自然排煙の防煙区画と機械排煙の防煙区画の間は、間仕切壁で区画する。垂れ壁による区画は不可。","f":[],"o":["img/R5A25_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R5A26","y":"R5","p":"A","no":26,"s":"上水道施設に関する記述のうち、適当でないものはどれか。","c":["浄水施設には消毒設備を設け、需要家の給水栓における水の残留塩素濃度は、遊離残留塩素の場合0.1mg/L以上保持できるようにする。","取水施設は、取水された原水を浄水施設まで導く施設であり、その方式には自然流下式、ポンプ加圧式及び併用式がある。","凝集池には、原水中に浮遊している砂等の粒子を短時間に沈殿除去させるために水道用硫酸アルミニウム等を注入する。","配水施設は、配水池、ポンプ等で構成され、浄化した水を給水区域の需要家にその必要とする水圧で所要量を配水するための施設である。"],"a":[2],"m":"exact","n":"","e":"取水施設は原水を取り入れる施設。原水を浄水施設まで導くのは導水施設。","f":[],"o":["img/R5A26_o0.png"],"g":28,"cat":"A衛生","neg":true},{"id":"R5A27","y":"R5","p":"A","no":27,"s":"下水道に関する記述のうち、適当でないものはどれか。","c":["分流式の汚水管きょは、合流式に比べ小口径のため、管きょの勾配が急になり埋設が深くなる場合がある。","流域下水道とは、2以上の市町村の区域における下水又は雨水を排除するものをいう。","管きょ内で必要とする最小流速は、雨水管きょに比べて、汚水管きょの方が小さい。","分流式の下水道では、降雨の規模によっては、処理施設を経ない汚水が公共用水域に放流されることがある。"],"a":[4],"m":"exact","n":"","e":"処理施設を経ない汚水が雨天時に放流されるのは合流式下水道の問題。分流式では汚水と雨水を別管で流すため生じない。","f":[],"o":["img/R5A27_o0.png"],"g":32,"cat":"A衛生","neg":true},{"id":"R5A28","y":"R5","p":"A","no":28,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["水道直結増圧ポンプの給水量は、瞬時最大予想給水量以上とする。","受水タンクの有効容量は、一般的に、1日使用水量の半分程度とする。","高置タンク方式における揚水ポンプの揚水量は、時間平均給水量とする。","水道直結増圧ポンプの揚程には、配水管内の最低動水圧も関係する。"],"a":[3],"m":"exact","n":"","e":"揚水ポンプの揚水量は時間最大予想給水量とする。時間平均ではない。","f":[],"o":["img/R5A28_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R5A29","y":"R5","p":"A","no":29,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["クロスコネクション防止対策として、飲料用給水管と飲料用以外の給水管は、異なる配管材を用いる。","器具給水負荷単位法で瞬時最大給水流量を算定する場合、器具給水負荷単位数に器具の個数による同時使用率を乗じて求める。","住戸数から瞬時最大給水流量を算定する場合、住戸数により段階的に算定式が異なる。","水使用時間率と器具給水単位による方法で配管サイズを決定する際は、任意利用形態か集中利用形態かを確認する必要がある。"],"a":[2],"m":"exact","n":"","e":"器具給水負荷単位法では、負荷単位の累計から同時使用流量線図で瞬時最大流量を求める。同時使用率を乗じるのは器具数による方法。","f":[],"o":["img/R5A29_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R5A30","y":"R5","p":"A","no":30,"s":"給湯設備に関する記述のうち、適当でないものはどれか。","c":["架橋ポリエチレン管の線膨張係数は、ステンレス鋼管の数値よりも小さい。","真空式温水発生機と無圧式温水発生機は、熱交換方式の違いはあるが、特徴が類似しており、水温が100℃を超えることはない。","中央式給湯設備の返湯管径は、循環流量と管内流速により求める。","循環配管をリバースリターン方式とすると、最遠端の管路に湯が最もよく循環することになるため採用しない。"],"a":[1],"m":"exact","n":"","e":"架橋ポリエチレン管など樹脂管の線膨張係数は、ステンレス鋼管など金属管よりはるかに大きい。","f":[],"o":["img/R5A30_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R5A31","y":"R5","p":"A","no":31,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["建物・敷地内では、汚水と雑排水を同一排水系統とすることを合流式というが、公共下水道では、汚水及び雑排水と雨水を同一排水系統とすることを合流式という。","器具排水負荷単位は、洗面器の最大排水流量28.5L/minを基準単位1としている。","排水時に排水管内に圧力変動が生じ、主に負圧変動によって、トラップの封水が排水管側に吸い込まれてしまう現象を自己サイホン作用という。","排水・通気用耐火二層管は、硬質ポリ塩化ビニル管に繊維モルタルで被覆したものである。"],"a":[3],"m":"exact","n":"","e":"記述は誘導サイホン（吸出し）作用。自己サイホン作用は、器具自身の排水でトラップ内が満流となり封水が引き出される現象。","f":[],"o":["img/R5A31_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R5A32","y":"R5","p":"A","no":32,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["通気管どうしを接続する場合は、その階における最高位の器具のあふれ縁より150mm以上立ち上げて接続する。","ループ通気管の管径は、その排水横枝管と通気立て管の管径のうち、いずれか小さい方の1/2以上とする。","通気管末端の開口部は、戸や窓その他開口部の上端より400mm以上立ち上げていれば、水平方向の離隔制限はない。","器具排水口からトラップウェアまでの垂直距離は600mm以下とする。"],"a":[3],"m":"exact","n":"","e":"通気管末端は、窓・戸などの開口部上端から600mm以上立ち上げるか、水平に3m以上離す。","f":[],"o":["img/R5A32_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R5A33","y":"R5","p":"A","no":33,"s":"排水設備に関する記述のうち、適当でないものはどれか。","c":["排水槽に設置する排水用水中モーターポンプは、一般的に、排水槽の有効貯水量を10〜20分で排出する能力とする。","排水用水中モーターポンプは、汚水用、雑排水用及び汚物用に区分され、汚水用は固形物をほとんど含まない水を排水するポンプである。","排水ポンプは、一般的に、水中モーターポンプとし、2台一組で設置する。","汚水排水ますの底部には、インバートを設けて、上流側管底と下流側管底の段差がないようにフラットに仕上げる。"],"a":[4],"m":"exact","n":"","e":"汚水ますのインバートは、上流管底と下流管底の間に2cm程度の落差を設けて汚物の滞留を防ぐ。段差なしのフラットではない。","f":[],"o":["img/R5A33_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R5A34","y":"R5","p":"A","no":34,"s":"消火設備に関する記述のうち、適当でないものはどれか。","c":["屋内消火栓設備は、現場に到着した公設消防隊が使用するために設置されるもので、加圧した水をノズルから消火対象物に噴射させて、冷却効果を利用して消火するものである。","スプリンクラー消火設備は、火災を初期段階で自動的に消火する設備であり、水を消火剤とし、冷却効果を利用して消火するものである。","泡消火設備は、水と泡原液を混合させて作る泡水溶液を放出し、燃焼物を厚い泡で覆うことで空気を遮断し、窒息と冷却の効果を利用して消火するものである。","不活性ガス消火設備には、イナートガス消火設備と二酸化炭素消火設備があり、不活性ガスを空気中に放出して酸素の容積比を低下させ窒息効果を利用して消火するものである。"],"a":[1],"m":"exact","n":"","e":"屋内消火栓設備は建物の関係者・自衛消防隊が初期消火に使用するもの。公設消防隊が使用するのは連結送水管など。","f":[],"o":["img/R5A34_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R5A35","y":"R5","p":"A","no":35,"s":"ガス設備に関する記述のうち、適当でないものはどれか。","c":["供給ガスの発熱量は、一般的に、総発熱量（高発熱量）から排ガス中の水蒸気が持つ蒸発熱を差し引いた低発熱量で表される。","都市ガスの種類は、数字とアルファベットの組合せで表し、Ａ、Ｂ、Ｃは燃焼速度を示しＡが最も遅く、Ｂ、Ｃの順で速くなる。","都市ガス配管の試験は、最高使用圧力以上の圧力で気密試験を行い、漏洩がないことを確認する。","液化石油ガス（LPG）設備に用いる配管は、0.8MPa以上の圧力で行う耐圧試験に合格したものとする。"],"a":[1],"m":"exact","n":"","e":"都市ガスの供給ガスの発熱量は、一般に総発熱量（高発熱量）で表示される。","f":[],"o":["img/R5A35_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R5A36","y":"R5","p":"A","no":36,"s":"浄化槽に関する記述のうち、適当でないものはどれか。","c":["浄化槽は、し尿、雑排水、工場排水、雨水等を処理する設備又は施設である。","浄化槽の生物学的処理には、生物膜法や活性汚泥法がある。","生物膜法は、接触材に付着した生物膜で浄化する方式であり、回転板接触方式、接触ばっ気方式等がある。","活性汚泥法は、水中に浮遊する微生物を利用し浄化する方式であり、長時間ばっ気方式、標準活性汚泥方式等がある。"],"a":[1],"m":"exact","n":"","e":"浄化槽はし尿と雑排水を処理する施設で、工場排水や雨水は対象外。","f":[],"o":["img/R5A36_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R5A37","y":"R5","p":"A","no":37,"s":"浄化槽の処理対象人員の算定に関する記述のうち、適当でないものはどれか。","c":["体育館は、延べ面積に定数を乗じて算定する。","公衆便所は、利用人員に定数を乗じて算定する。","事務所は、業務用厨房設備の有無により、異なる定数を延べ面積に乗じて算定する。","ホテル・旅館は、結婚式場又は宴会場の有無により、異なる定数を延べ面積に乗じて算定する。"],"a":[2],"m":"exact","n":"","e":"公衆便所の処理対象人員は総便器数に定数（16）を乗じて算定する。利用人員ではない。","f":[],"o":["img/R5A37_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R5A38","y":"R5","p":"A","no":38,"s":"冷凍機に関する記述のうち、適当でないものはどれか。","c":["遠心冷凍機の容量制御には、圧縮機に設けた吸込みベーンの開度を変えることで冷媒ガス流入量を制御する吸込みベーン制御がある。","蒸気を加熱源とする吸収冷凍機の容量制御には、再生器に入る蒸気量を制御する方法がある。","遠心冷凍機は、往復動冷凍機に比べて、負荷変動に対する追従性がよく、容量制御も容易である。","吸収冷凍機は、運転中も機内が大気圧以下のため、加熱源に蒸気を使用する場合でも、圧力容器の規則は適用されない。"],"a":[4],"m":"exact","n":"","e":"吸収冷凍機は機内が大気圧以下で高圧ガス保安法の適用はないが、蒸気で加熱する再生器等はボイラー及び圧力容器安全規則（圧力容器）の適用を受ける場合がある。","f":[],"o":["img/R5A38_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R5A39","y":"R5","p":"A","no":39,"s":"冷却塔に関する記述のうち、適当でないものはどれか。","c":["開放式冷却塔は、冷却水の一部を蒸発させて、その蒸発潜熱により冷却水温度を下げる装置である。","開放式冷却塔には、充てん材を通過して滴下する水滴の塔外飛散防止として塔本体の外部側面にエリミネーターを設けている。","密閉式冷却塔は、開放式冷却塔に比べて熱交換器等の空気抵抗が大きくなるため、送風機の動力が大きくなる。","外気温度が低い冬季や湿度の高い梅雨期に運転する場合には、周囲の空気より高温で飽和状態に近い冷却塔の吐出し空気が、外気と混合して白煙を発生する場合がある。"],"a":[2],"m":"exact","n":"","e":"エリミネーターは水滴の飛散を防ぐため、充てん材を通過した空気の出口側（塔の内部）に設ける。","f":[],"o":["img/R5A39_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R5A40","y":"R5","p":"A","no":40,"s":"全熱交換器に関する記述のうち、適当でないものはどれか。","c":["全熱交換器は、建物からの排気と導入外気を熱交換させ、顕熱と潜熱を同時に熱回収できる装置で省エネルギーが図れる。","回転形全熱交換器は、給気側と排気側をセパレートしたケーシング内にハニカムロータを設置し回転させる構造で、給気と排気は直交方向に流れる。","静止形全熱交換器は、給排気を隔てる仕切板と間隔板で構成され、給気と排気は混り合うことはほとんどない。","回転形全熱交換器は、一般的に、顕熱交換効率と潜熱交換効率は、ほぼ同じ値である。"],"a":[2],"m":"exact","n":"","e":"回転形全熱交換器では給気と排気は平行（対向）に流れる。直交方向に流れるのは静止形。","f":[],"o":["img/R5A40_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R5A41","y":"R5","p":"A","no":41,"s":"配管材料及び配管附属品に関する記述のうち、適当でないものはどれか。","c":["圧力配管用炭素鋼鋼管は、蒸気、高温水等の圧力の高い部分に使用され、スケジュール番号により管の厚さが区分されている。","配管用炭素鋼鋼管（白）は、水配管用亜鉛めっき鋼管よりも亜鉛付着量が多いため、耐食性に優れている。","外ねじ式仕切弁は、ハンドルを回転させることにより弁棒が昇降することから、外部から弁の開度を確認することができる。","架橋ポリエチレン管は、中密度・高密度ポリエチレンを架橋反応させることで、耐熱性、耐クリープ性を向上させた管である。"],"a":[2],"m":"exact","n":"","e":"水配管用亜鉛めっき鋼管（SGPW）の方が配管用炭素鋼鋼管（白）より亜鉛付着量が多く、耐食性に優れる。","f":[],"o":["img/R5A41_o0.png"],"g":4,"cat":"A機材・設計図書・約款","neg":true},{"id":"R5A42","y":"R5","p":"A","no":42,"s":"ダクト及びダクト附属品に関する記述のうち、適当でないものはどれか。","c":["ピストンダンパーは、消火ガス放出時にピストンレリーザーにより自動的に閉鎖する機構を有する。","グラスウール製ダクトは、ダクト内温度が75℃以下の範囲で使用する。","スパイラルダクトは、亜鉛鉄板をスパイラル状に甲はぜ機械がけしたもので、甲はぜが補強の役目を果たすため強度は高い。","断面積が等しい円形ダクトと長方形ダクトでは、風量と材質が同じ場合、単位長さ当たりの圧力損失は長方形ダクトのほうが小さい。"],"a":[4],"m":"exact","n":"","e":"断面積・風量・材質が同じなら、円形ダクトの方が長方形ダクトより圧力損失は小さい。","f":[],"o":["img/R5A42_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R5A43","y":"R5","p":"A","no":43,"s":"「公共工事標準請負契約約款」に関する記述のうち、適当でないものはどれか。","c":["発注者が監督員を置いたときは、約款に定める請求、通知、報告、申出、承諾及び解除については、設計図書に定めるものを除き、監督員を経由して行う。","発注者は、完成通知を受けたときは、通知を受けた日から14日以内に完成検査を完了し、検査結果を受注者に通知しなければならない。","発注者は完成検査合格後、受注者から請負代金の支払い請求があったときは、請求を受けた日から40日以内に請負代金を支払わなければならない。","現場代理人、主任技術者は、これを兼ねることができるが、専門技術者は、主任技術者を兼ねることはできない。"],"a":[4],"m":"exact","n":"","e":"約款では、現場代理人・主任技術者（監理技術者）・専門技術者はこれを兼ねることができる。","f":[],"o":["img/R5A43_o0.png"],"g":9,"cat":"A機材・設計図書・約款","neg":true},{"id":"R5A44","y":"R5","p":"A","no":44,"s":"設計図書に記載する「配管材料」とその「記号（規格）」の組合せのうち、適当でないものはどれか。\n［配管材料］ ［記号（規格）］","c":["水道用硬質塩化ビニルライニング鋼管（黒） SGP-VA（JWWA）","排水用硬質塩化ビニルライニング鋼管 SGP-VD（JWWA）","リサイクル硬質ポリ塩化ビニル三層管 RS-VU（JIS）","水道用ポリエチレン粉体ライニング鋼管（白） SGP-PB（JWWA）"],"a":[2],"m":"exact","n":"","e":"排水用硬質塩化ビニルライニング鋼管の記号はDVLP（WSP042）。SGP-VDは水道用硬質塩化ビニルライニング鋼管（JWWA K116）のD種。","f":[],"o":["img/R5A44_o0.png"],"g":10,"cat":"A機材・設計図書・約款","neg":true},{"id":"R5B01","y":"R5","p":"B","no":1,"s":"工事の着工に伴う「届出書等」と「提出先」の組合せとして、適当でないものはどれか。\n［届出書等］ ［提出先］","c":["高圧ガス製造許可申請書 労働基準監督署長","特定施設設置届出書（騒音） 市町村長","特定建設作業実施届出書（振動） 市町村長","小型ボイラー設置報告書 労働基準監督署長"],"a":[1],"m":"exact","n":"","e":"高圧ガス製造許可申請書の提出先は都道府県知事。労働基準監督署長ではない。","f":[],"o":["img/R5B01_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R5B02","y":"R5","p":"B","no":2,"s":"下図に示すネットワーク工程表に関する記述のうち、適当でないものはどれか。\nただし、図中のイベント間のＡ〜Ｊは作業内容、日数は作業日数を表す。","c":["クリティカルパスは①→②→⑤→⑦→⑧→⑨である。","作業Ｄの作業日数を1日短縮しても、全体工期は1日短縮とはならない。","イベント⑧の最早開始時刻、最遅完了時刻はともに18日である。","作業Ｂのインターフェアリングフロートは3日である。"],"a":[1],"m":"exact","n":"","e":"クリティカルパスは①→②→③→⑥→⑦→⑧→⑨（A→C→F→ダミー→I→J）で22日。①→②→⑤→⑦→⑧→⑨は20日でクリティカルパスではない。","f":["img/R5B02_f0.png"],"o":["img/R5B02_o0.png"],"g":0,"cat":"B施工管理","neg":true},{"id":"R5B03","y":"R5","p":"B","no":3,"s":"品質管理に関する記述のうち、適当でないものはどれか。","c":["デミングサークルの目的は、作業において、計画（P）→実施（D）→点検（C）→改善（A）の4つの段階を繰り返し、品質を向上させ改善を図ることである。","品質計画を具現化するためのQC工程図は、一連の工程の流れに沿い、管理項目、管理水準、管理方法等を設定し、管理値を外れた場合の処置方法等を定めておくものである。","特性要因図は、大きな不良項目、不良項目の順位、各不良項目が全体に占める割合等を読み取ることができる。","品質管理を行うことによる効果には、品質の向上以外にも、手直しの減少、工事原価の低減等がある。"],"a":[3],"m":"exact","n":"","e":"記述はパレート図。特性要因図は、特性（結果）と要因の関係を魚の骨状に体系的に整理した図。","f":[],"o":["img/R5B03_o0.png"],"g":83,"cat":"B施工管理","neg":true},{"id":"R5B04","y":"R5","p":"B","no":4,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["リスクアセスメントとは、事業場に潜在する危険性又は有害性を見つけ出し、それによるリスクを見積り、リスクレベルから優先度を定めリスクを除去、低減する手法である。","金属アーク溶接作業時は特定化学物質作業主任者を選任して、呼吸用保護具の使用状況を監視させる。","事業者は、解体作業前に対象建築物内で使用されているすべての材料について、石綿等の使用の有無の調査を行わなければならない。","安全データシート（SDS）は、化学物質等を使用する際の安全性を確保するため、取り扱う側から供給者側に危険性・有害性に関する情報を報告するためのものである。"],"a":[4],"m":"exact","n":"","e":"SDSは化学物質を譲渡・提供する供給者側から、取り扱う事業者側へ危険性・有害性情報を提供するもの。向きが逆。","f":[],"o":["img/R5B04_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R5B05","y":"R5","p":"B","no":5,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["床置形ファンコイルユニットは、壁面より60mm程度離して据え付ける。","吸収冷温水機は、基礎コンクリート打込み後適切な養生を行い、5日経過した後に据え付ける。","冷凍機は、凝縮器のチューブ引出し用として有効な空間を確保するとともに、周囲に保守点検スペースを確保して据え付ける。","機器の据付けにおいて、耐震計算をする場合、地震力は機器の重心に作用するものとして計算を行う。"],"a":[2],"m":"exact","n":"","e":"機器は基礎コンクリート打設後、10日以上養生してから据え付ける。","f":[],"o":["img/R5B05_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R5B06","y":"R5","p":"B","no":6,"s":"配管及び配管附属品の施工に関する記述のうち、適当でないものはどれか。","c":["蒸気管の横走り管を、形鋼振れ止め支持により下方より支持する場合には、ローラ金物等を使用する。","硬質塩化ビニルライニング鋼管の切断は、チップソーカッターを使用する。","周囲の気温が0℃以下の場合は、原則として溶接作業を行わない。","空気調和機への冷温水量を調整する混合型電動三方弁は、一般的に、冷温水管の還り管に設ける。"],"a":[2],"m":"exact","n":"","e":"ライニング鋼管の切断は、ライニングの剥離・溶融を防ぐため帯のこ盤や自動金のこ盤を用いる。チップソーカッターや高速砥石は使用しない。","f":[],"o":["img/R5B06_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R5B07","y":"R5","p":"B","no":7,"s":"ダクトの施工に関する記述のうち、適当でないものはどれか。","c":["コーナーボルト工法ダクトのフランジ押さえ金具は再使用しない。","低圧ダクトは、常用圧力（運転時におけるダクト内圧）が±700Pa以下の部分に使用する。","アングルフランジ工法ダクトは、フランジ接合部分の鉄板の折返しを5mm以上とする。","共板フランジ工法ダクトは、フランジ用ガスケットの厚さが5mm以上のものを使用する。"],"a":[2],"m":"exact","n":"","e":"低圧ダクトの常用圧力は±500Pa以下。","f":[],"o":["img/R5B07_o0.png"],"g":84,"cat":"B施工","neg":true},{"id":"R5B08","y":"R5","p":"B","no":8,"s":"保温、保冷に関する記述のうち、適当でないものはどれか。","c":["横走り配管に取り付ける保温筒の抱合せ目地は、管の横側に位置するように取り付ける。","蒸気管が壁又は床を貫通する場合、伸縮を考慮し貫通部及びその前後25mm程度は保温を行わない。","保温材の熱伝導率は、温度の上昇に伴い大きくなる。","グラスウール保温材は、密度が大きい方が熱伝導率は大きい。"],"a":[4],"m":"exact","n":"","e":"グラスウール保温材は、通常の範囲では密度が大きいほど熱伝導率は小さく（断熱性は高く）なる。","f":[],"o":["img/R5B08_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R5B09","y":"R5","p":"B","no":9,"s":"機器の試運転調整に関する記述のうち、適当でないものはどれか。","c":["冷凍機は、冷水ポンプ、冷却水ポンプ、冷却塔とのインターロックを確認する。","冷却塔は、冷却水の運転水位や散水状態、ボールタップの作動状況等を確認する。","ポンプの軸受け部の温度は、周囲の空気温度より40℃以上高くなっていないことを確認する。","排水用水中モーターポンプは、排水槽の満水警報の発報により、自動交互運転することを確認する。"],"a":[4],"m":"exact","n":"","e":"排水用水中ポンプは、満水警報（異常高水位）で2台同時運転となることを確認する。交互運転は通常水位での運転。","f":[],"o":["img/R5B09_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R5B10","y":"R5","p":"B","no":10,"s":"腐食、防食に関する記述のうち、適当でないものはどれか。","c":["冷温水管に用いる配管用炭素鋼鋼管（白）は、溝状腐食が発生しにくい鍛接鋼管や耐溝状腐食電縫鋼管を使用する。","電気防食法における流電陽極方式は、マグネシウム合金等を犠牲陽極として使用する。","配管用炭素鋼鋼管（白）は、pH値が低くなるほど腐食は進行せず、pH値が高くなるほど腐食が進行する。","自然電位が大きく相違する配管を接続する場合は、絶縁物を介して接続し、ガルバニック腐食を防止する。"],"a":[3],"m":"exact","n":"","e":"亜鉛めっき鋼管はpHが低い（酸性）ほど腐食が進行する。記述は逆。","f":[],"o":["img/R5B10_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R5B11","y":"R5","p":"B","no":11,"s":"建設工事現場における安全管理体制に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["特定元方事業者は、各週ごとに、作業場所の巡視を行わなければならない。","事業者は、総括安全衛生管理者を選任したときは、遅滞なく、報告書を労働基準監督署長に提出しなければならない。","事業者は、選任した産業医に、労働者の健康管理等を行わせなければならない。","特定元方事業者による元方安全衛生管理者の選任は、その事業場に専属の者としなければならない。"],"a":[1],"m":"exact","n":"","e":"特定元方事業者の作業場所の巡視は、毎作業日に少なくとも1回行う。","f":[],"o":["img/R5B11_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R5B12","y":"R5","p":"B","no":12,"s":"建設工事現場における安全管理に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["事業者は、3m以上の高所から物体を投下するときは、適当な投下設備を設け、監視人を置く等労働者の危険を防止するための措置を講じなければならない。","事業者は、高さが2m以上の箇所で作業を行うときは、当該作業を安全に行うために必要な照度を保持しなければならない。","事業者は、手掘りにより砂からなる地山の掘削の作業を行うときは、掘削面のこう配を35度以下とし、又は掘削面の高さを5m未満としなければならない。","事業者は、作業床の高さが10m以上の高所作業車の運転（道路上を走行させる運転を除く。）の業務については、作業主任者に当該業務の指揮を行わせなければならない。"],"a":[4],"m":"exact","n":"","e":"作業床10m以上の高所作業車の運転は技能講習修了者が行う就業制限業務で、作業主任者の選任対象ではない。","f":[],"o":["img/R5B12_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R5B13","y":"R5","p":"B","no":13,"s":"労働条件に関する記述のうち、「労働基準法」上、誤っているものはどれか。","c":["使用者は、満18才に満たない者について、その年齢を証明する戸籍証明書を事業場に備え付けなければならない。","常時10人以上の労働者を使用する使用者は、就業規則を作成し、労働基準監督署長に届け出なければならない。","使用者は、満18才に満たない者を、最大積載荷重が1tの人荷共用のエレベーターの運転の業務に就かせてはならない。","使用者は、各事業場ごとに労働者名簿を、各労働者（日々雇い入れられる者を除く。）について調製し、労働者の氏名、生年月日、履歴等を記入しなければならない。"],"a":[3],"m":"exact","n":"","e":"年少者の就業が禁止されるのは最大積載荷重2t以上の人荷共用・荷物用エレベーターの運転。1tは禁止されない。","f":[],"o":["img/R5B13_o0.png"],"g":35,"cat":"B法規","neg":true},{"id":"R5B14","y":"R5","p":"B","no":14,"s":"建築物に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["建築物の2階以上の部分で、隣地境界線から8m以下の距離にある部分は、延焼のおそれのある部分である。","建築物の配管全体を更新する工事は、大規模の修繕に該当しない。","屋上部分に設けた昇降機塔等で、水平投影面積の合計が建築物の建築面積の1/8以下のものは、階数に算入しない。","延べ面積は、原則として、建築物の各階の床面積の合計である。"],"a":[1],"m":"exact","n":"","e":"延焼のおそれのある部分は、隣地境界線等から1階は3m以下、2階以上は5m以下の部分。","f":[],"o":["img/R5B14_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R5B15","y":"R5","p":"B","no":15,"s":"建築設備に関する記述のうち「建築基準法」上、誤っているものはどれか。1 1","c":["排水槽の底の勾配は、吸い込みピットに向かって1/15以上1/10以下とする。15 10","ボイラーの煙突の地盤面からの高さは、ガスを使用するボイラーにあっては、原則として、9m以上とする。","空気調和設備の風道を、火を使用する設備又は器具を設けた室の換気設備の風道その他これらに類するものに連結する場合、接続部に防煙ダンパーを設ける。","風道が準耐火構造の防火区画を貫通する部分に近接する部分に防火ダンパーを設ける場合、防火ダンパーと防火区画との間の風道は、厚さ1.5mm以上の鉄板とする。"],"a":[3],"m":"exact","n":"","e":"火を使用する室の換気設備の風道は、他の換気設備（空気調和設備）の風道と連結してはならない。防煙ダンパーを設けても不可。","f":[],"o":["img/R5B15_o0.png"],"g":23,"cat":"B法規","neg":true},{"id":"R5B16","y":"R5","p":"B","no":16,"s":"建設業の種類のうち、「建設業法」上、指定建設業に該当しないものはどれか。","c":["建築工事業","機械器具設置工事業","管工事業","土木工事業"],"a":[2],"m":"exact","n":"","e":"指定建設業は土木・建築・電気・管・鋼構造物・舗装・造園の7業種。機械器具設置工事業は該当しない。","f":[],"o":["img/R5B16_o0.png"],"g":68,"cat":"B法規","neg":true},{"id":"R5B17","y":"R5","p":"B","no":17,"s":"建設工事における施工体制に関する記述のうち、「建設業法」上、誤っているものはどれか。","c":["建設業者は、発注者から直接請け負った建設工事を下請契約を行わずに自ら施工する場合は、主任技術者を置かなくてもよい。","主任技術者の専任が必要な建設工事で、密接な関係のある二つの建設工事を同一の場所で施工する場合は、同一の専任の主任技術者とすることができる。","施工体制台帳の作成を要する建設工事を請け負った建設業者は、その下請負人に関する事項として、健康保険等の加入状況を施工体制台帳に記載しなければならない。","施工体制台帳の作成を要する建設工事を請け負った建設業者は、建設工事の目的物の引渡しをするまで、施工体系図を工事現場の見やすい場所に掲示しなければならない。"],"a":[1],"m":"exact","n":"","e":"下請契約をせず自ら施工する場合でも、建設業者は請け負った工事現場に主任技術者を置かなければならない。","f":[],"o":["img/R5B17_o0.png"],"g":24,"cat":"B法規","neg":true},{"id":"R5B18","y":"R5","p":"B","no":18,"s":"消防用設備等に関する記述のうち、「消防法」上、誤っているものはどれか。","c":["消防用設備等は、消防の用に供する設備、消防用水及び消火活動上必要な施設とする。","消防の用に供する設備は、消火設備、警報設備及び避難設備とする。","消火活動上必要な施設には、排煙設備は含まれない。","消火設備には、水バケツは含まれる。"],"a":[3],"m":"exact","n":"","e":"消火活動上必要な施設には排煙設備が含まれる（ほか連結散水設備、連結送水管、非常コンセント設備、無線通信補助設備）。","f":[],"o":["img/R5B18_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R5B19","y":"R5","p":"B","no":19,"s":"不活性ガス消火設備に関する記述のうち、「消防法」上、誤っているものはどれか。","c":["手動式の起動装置は、2以下の防護区画又は防護対象物ごとに設ける。","非常電源は、自家発電設備、蓄電池設備又は燃料電池設備によるものとし、当該設備を有効に1時間作動できる容量以上とする。","貯蔵容器は、防護区画以外の場所に設ける。","配管は、専用とし落差は50m以下とする。"],"a":[1],"m":"exact","n":"","e":"不活性ガス消火設備の手動起動装置は、防護区画ごと（防護対象物ごと）に設ける。2以下ごとではない。","f":[],"o":["img/R5B19_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R5B20","y":"R5","p":"B","no":20,"s":"「建築物における衛生的環境の確保に関する法律」の特定建築物の維持管理に関して、空気調和設備を設けている場合の空気環境における「管理項目」とおおむね適合すべきとされる「管理基準」の組合せとして、誤っているものはどれか。\n［管理項目］ ［管理基準］","c":["一酸化炭素の含有率 100万分の6以下","ホルムアルデヒドの量 1.0mg/m³以下","浮遊粉じんの量 0.15mg/m³以下","相対湿度 40％以上70％以下"],"a":[2],"m":"exact","n":"","e":"ホルムアルデヒドの基準は0.1mg/m³以下。1.0mg/m³ではない。","f":[],"o":["img/R5B20_o0.png"],"g":58,"cat":"B法規","neg":true},{"id":"R5B21","y":"R5","p":"B","no":21,"s":"フロンに関する記述のうち、「フロン類の使用の合理化及び管理の適正化に関する法律」上、誤っているものはどれか。","c":["第一種特定製品とは、エアコンディショナー並びに冷蔵機器及び冷凍機器のうち、業務用の機器であって、冷媒としてフロン類が充塡されているもの（第二種特定製品を除く。）をいう。","第二種特定製品とは、自動車（「使用済自動車の再資源化等に関する法律」の対象のものに限る。）に搭載されているエアコンディショナー（車両のうち乗車のために設備された場所の冷房の用に供するものに限る。）であって、冷媒としてフロン類が充塡されているものをいう。","第一種フロン類充塡回収業者とは、第一種特定製品に、冷媒としてフロン類を充塡することや回収することを業とし行う者として、都道府県知事の登録を受けた者をいう。","フロン類破壊業者とは、特定製品に冷媒として充塡されているフロン類の破壊を業とし行う者として、都道府県知事の許可を受けた者をいう。"],"a":[4],"m":"exact","n":"","e":"フロン類破壊業者は主務大臣（経済産業大臣・環境大臣）の許可を受けた者。都道府県知事ではない。","f":[],"o":["img/R5B21_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R5B22","y":"R5","p":"B","no":22,"s":"産業廃棄物の処理に関する記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","c":["建設工事に伴い生ずる産業廃棄物の処理責任を負う排出事業者は、実際の工事の施工は下請業者が行っている場合であっても、発注者から直接建設工事を請け負った元請業者である。","事業者は、産業廃棄物の運搬又は処分を委託する場合には、委託契約は書面により行い、委託契約書及び書面をその契約の終了の日から5年間保存する。","事業者は、自らその産業廃棄物を収集又は運搬する場合、運搬車の車体の外側に産業廃棄物の収集運搬車である旨と、事業者名を表示しなければならない。","産業廃棄物の運搬又は処分を委託する場合、電子情報処理組織を使用して、産業廃棄物の種類及び数量、受託した者の氏名等を情報処理センターに登録したときも、産業廃棄物管理票は必要である。"],"a":[4],"m":"exact","n":"","e":"電子マニフェスト（情報処理センターへの登録）を利用した場合、紙の管理票の交付は不要。","f":[],"o":["img/R5B22_o0.png"],"g":71,"cat":"B法規","neg":true},{"id":"R5B23","y":"R5","p":"B","no":23,"s":"公共工事における施工計画等に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["現場代理人は、工事現場に常駐し、その運営、取締りを行うほか、請負代金額の変更、請負代金の請求及び受領に関する権限もある。","仮設、施工方法等その他工事目的物を完成するために必要な一切の手段は、特に定めがない場合、受注者がその責任において定める。","道路を使用した機器搬入の計画があるときは、道路使用許可申請書を、工事着工前に警察署長に提出する。","ボイラー等の設置工事で、ばい煙発生施設設置届が必要な場合は、工事着工60日前までに消防署長に提出する。"],"a":[1,4],"m":"exact","n":"","e":"⑴現場代理人の権限からは、請負代金額の変更、請負代金の請求・受領等は除かれる。⑷ばい煙発生施設設置届の提出先は都道府県知事（政令市長）。消防署長ではない。","f":[],"o":["img/R5B23_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R5B24","y":"R5","p":"B","no":24,"s":"工程管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["ネットワーク工程表のクリティカルパス以外の作業は、フロートを消化してもクリティカルパスになることはない。","ネットワーク工程表で、点線の矢印で示したものをダミーというが、この経路はクリティカルパスになることはない。","配員計画とは、経済的かつ合理的となるよう各作業の作業人数を調整し、人員の平準化を図ることで、マンパワースケジューリングともいう。","労務費、材料費、仮設費等の直接費と間接費を合わせた総工事費が最小となる経済的な施工速度を経済速度といい、このときの工期を最適工期という。"],"a":[1,2],"m":"exact","n":"","e":"⑴クリティカルパス以外の作業でも、フロートを使い切ればクリティカルパスになり得る。⑵ダミーを含む経路もクリティカルパスになり得る。","f":[],"o":["img/R5B24_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R5B25","y":"R5","p":"B","no":25,"s":"検査に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["検査とは、品質を確認し適否を判定するもので、全数検査と抜取検査がある。","品物を破壊しなければ検査の目的を達しないもの、あるいは、試験を行ったら商品価値がなくなるものは、全数検査を適用する。","多数の製品や材料等の中から確実に良品のみを選別する場合、抜取検査を適用する。","取外し困難な機器の試験、配管の水圧試験等には、全数検査を適用する。"],"a":[2,3],"m":"exact","n":"","e":"⑵破壊しないと検査できないものは抜取検査を適用する。⑶確実に良品のみを選別する場合は全数検査を適用する。","f":[],"o":["img/R5B25_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R5B26","y":"R5","p":"B","no":26,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["労働災害により休業した場合の休業日数の数え方は、休業事由が発生した翌日から数え、休業期間内に休日等が含まれる場合は、これを除いた暦日数が休業日数となる。","5S活動とは、安全で健康な職場づくりと生産性の向上を目指す活動のことで、「整理、整頓、清掃、清潔、しつけ」の5つをいう。","要求性能墜落制止用器具は、定期点検を1年に1回行う必要があり、点検で異常がない場合でも材質の劣化を考慮してハーネス（ベルト）は定期的に交換することが推奨されている。","一つ目の就業場所での勤務が終了した後に、二つ目の就業場所へ向かう途中で負傷した場合は通勤災害である。"],"a":[1,3],"m":"exact","n":"","e":"⑴休業日数は休業事由発生の翌日から数え、休日等を含めた暦日数とする。⑶墜落制止用器具は使用前点検に加え、定期点検を6か月以内ごとに行う。","f":[],"o":["img/R5B26_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R5B27","y":"R5","p":"B","no":27,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["真空又は窒素加圧の状態で搬入された冷凍機は、据付け時に気密保持されていることを確認する。","天井スラブの下面において、あと施工アンカーを上向きで施工する場合、接着系アンカーを使用する。","Vベルト駆動の送風機は、Vベルトが上側引張りとなるように設置する。","チリングユニットは、電動機の回転による振動が発生するため、基礎と本体の間には防振材を設置する。"],"a":[2,3],"m":"exact","n":"","e":"⑵上向き施工では接着剤が垂れるため、接着系アンカーは不適で、金属拡張アンカーを用いる。⑶Vベルトは下側引張りとなるように設置する。","f":[],"o":["img/R5B27_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R5B28","y":"R5","p":"B","no":28,"s":"配管及び配管附属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["Uボルトは、配管軸方向の滑りに対する拘束力が小さいため、配管の固定支持には使用しない。","ポンプ回りの逆止め弁で、全揚程が30mを超える場合は、衝撃吸収式とする。","空気調和機に接続する冷温水配管は、コイル上部から流入し、コイル下部に流出するよう接続する。","単式伸縮管継手を設ける場合は、継手本体を固定して、継手両側の近傍に配管ガイドを設ける。"],"a":[3,4],"m":"exact","n":"","e":"⑶空調機コイルの冷温水は、コイル下部から流入し上部から流出させる。⑷単式伸縮管継手は継手本体を固定せず、伸縮する配管側にガイドを設け、反対側を固定する。","f":[],"o":["img/R5B28_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R5B29","y":"R5","p":"B","no":29,"s":"ダクト及びダクト附属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["スパイラルダクトの横走りダクトの吊り間隔は、4,000mm以下とする。","共板フランジ工法のフランジ押さえ金具は、ダクト寸法にかかわらずフランジ辺の中央に1箇所取り付ける。","排煙ダクトに使用する亜鉛鉄板製の長方形ダクトは、高圧ダクトの板厚とする。","変風量（VAV）ユニットは、ユニット入口側ダクト長辺の寸法と同じ長さの直管を上流側に設け取り付ける。"],"a":[2,4],"m":"exact","n":"","e":"⑵共板フランジの押え金具は、ダクト寸法に応じた所定の間隔で取り付ける。中央1箇所ではない。⑷VAVユニットの上流側には、正確な風量検出のためダクト長辺寸法の数倍程度の直管部を設ける。","f":[],"o":["img/R5B29_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R6A01","y":"R6","p":"A","no":1,"s":"水に次亜塩素酸ナトリウムを注入し、濃度が均一になった後の、残留塩素濃度と経過時間の関係を表すグラフとして、適当なものはどれか。","c":["①","②","③","④"],"a":[4],"m":"exact","n":"","e":"次亜塩素酸ナトリウムの残留塩素は、水中の有機物等との反応や揮散により、時間の経過とともに減少していく（④のように初めは速く、次第に緩やかに減少）。","f":["img/R6A01_f0.png"],"o":["img/R6A01_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R6A02","y":"R6","p":"A","no":2,"s":"下図に示す水槽において、流出孔から水面までの高さHが3倍の3Hになったとき、側壁の流出孔からの噴出速度の変化の倍率として、適当なものはどれか。\nただし、流出孔に比べて水槽は十分大きく、速度係数は水位の変化に関係なく一定とする。","c":["√3倍","3倍","6倍","9倍"],"a":[1],"m":"exact","n":"","e":"流出速度v＝Cv√(2gH)。Hが3倍になるとvは√3倍。","f":["img/R6A02_f0.png"],"o":["img/R6A02_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R6A03","y":"R6","p":"A","no":3,"s":"下図に示す水平な管路内を空気が流れる場合において、Ｂ点の空気の速度として、適当なものはどれか。\nただし、Ａ点の全圧は80Pa、Ｂ点の静圧は10Pa、空気の密度は1.2kg/m³とする。","c":["3m/s","5m/s","10m/s","15m/s"],"a":[3],"m":"exact","n":"","e":"B点の全圧＝80－10（損失）＝70Pa。動圧＝70－10（静圧）＝60Pa＝1/2×1.2×v² → v＝10m/s。","f":["img/R6A03_f0.png"],"o":["img/R6A03_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R6A04","y":"R6","p":"A","no":4,"s":"流体に関する用語の組合せのうち、関係のないものはどれか。","c":["オリフィス 流量測定","ジュコフスキーの式 毛管現象","レイノルズ数 粘性力","ベルヌーイの定理 エネルギー保存の法則"],"a":[2],"m":"exact","n":"","e":"ジュコフスキーの式はウォーターハンマーによる圧力上昇を求める式で、毛管現象（表面張力）とは関係がない。","f":[],"o":["img/R6A04_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R6A05","y":"R6","p":"A","no":5,"s":"蒸気圧縮式冷凍機の冷凍サイクルをモリエ線図上に示すと下図のようになる。この図に関する記述のうち、適当なものはどれか。","c":["過程①→②は、蒸発器における変化である。","過程②→③は、膨張弁における変化である。","過程③→④は、圧縮機における変化である。","過程④→①は、凝縮器における変化である。"],"a":[1],"m":"exact","n":"","e":"モリエ線図上の冷凍サイクルは、①→②蒸発器（等圧で比エンタルピー増加）、②→③圧縮機、③→④凝縮器、④→①膨張弁。","f":["img/R6A05_f0.png"],"o":["img/R6A05_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R6A06","y":"R6","p":"A","no":6,"s":"下図に示すカルノーサイクルに関する記述のうち、適当でないものはどれか。","c":["カルノーサイクルは、高温熱源と低温熱源の温度差が大きいほど効率が高くなる。","等温膨張では、外部に熱量を放出し、等温圧縮では、外部から熱量を受け取る。","断熱膨張では、気体の温度が低下し、断熱圧縮では、気体の温
