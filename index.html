度が上昇する。","カルノーサイクルの効率は、全ての熱機関の中で最大である。"],"a":[2],"m":"exact","n":"","e":"カルノーサイクルでは、等温膨張で外部から熱量を受け取り、等温圧縮で外部に熱量を放出する。記述は逆。","f":["img/R6A06_f0.png"],"o":["img/R6A06_o0.png"],"g":69,"cat":"A基礎・電気・建築","neg":true},{"id":"R6A07","y":"R6","p":"A","no":7,"s":"下図に示す壁の両側の流体間の熱伝達における熱通過率K［W/(m²・K)］として、適当なものはどれか。\nただし、壁の熱伝導率λ［W/(m・K)］、厚さL［m］、表面熱伝達率α1［W/(m²・K)］、α2［W/(m²・K)］とする。","c":["K＝α₁＋λ/L＋α₂","K＝1/α₁＋L/λ＋1/α₂","K＝1÷(α₁＋λ/L＋α₂)","K＝1÷(1/α₁＋L/λ＋1/α₂)"],"a":[4],"m":"exact","n":"","e":"熱通過抵抗は各抵抗の和：1/K＝1/α₁＋L/λ＋1/α₂。よってK＝1÷(1/α₁＋L/λ＋1/α₂)。","f":["img/R6A07_f0.png"],"o":["img/R6A07_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R6A08","y":"R6","p":"A","no":8,"s":"日射に関する記述のうち、適当でないものはどれか。","c":["直達日射とは、太陽表面から直接地上に到達する太陽放射をいう。","日射のエネルギーは、紫外線部よりも赤外線部及び可視線部に多く含まれている。","日射の大気透過率は、主に大気中に含まれる窒素の量に影響される。","日射により加熱された地表から放射される赤外線の一部は、大気中の水蒸気、二酸化炭素等の温室効果ガスに吸収される。"],"a":[3],"m":"exact","n":"","e":"日射の大気透過率は、主に大気中の水蒸気量や塵埃の量に影響される。窒素ではない。","f":[],"o":["img/R6A08_o0.png"],"g":18,"cat":"A基礎・電気・建築","neg":true},{"id":"R6A09","y":"R6","p":"A","no":9,"s":"下図に示す湿り空気線図における状態変化に関する記述のうち、適当でないものはどれか。","c":["除湿のない冷却は、状態点から湿り空気線図上の左へ、①の移動で示される。","加湿のない加熱は、状態点から湿り空気線図上の右へ、②の移動で示される。","蒸気スプレーによる加湿は、状態点から湿り空気線図上の左上へ、③の移動で示される。","液体吸収剤による除湿は、状態点から湿り空気線図上の右下へ、④の移動で示される。"],"a":[3],"m":"exact","n":"","e":"蒸気スプレー加湿はほぼ真上（絶対湿度が増え、乾球温度はわずかに上昇）に移動する。左上（③）への移動は水スプレーによる断熱加湿。","f":["img/R6A09_f0.png"],"o":["img/R6A09_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R6A10","y":"R6","p":"A","no":10,"s":"音に関する記述のうち、適当でないものはどれか。","c":["コインシデンス効果は、音波が壁に斜めに入射した場合に発生し、遮音性能が低下する現象のことである。","ロックウールやグラスウールは、一般的に、低周波数域よりも中・高周波数域の音をよく吸収する。","音圧レベル50dBの音を2つ合成すると、約53dBになる。","NC曲線で示される音圧レベルの許容値は、周波数が高いほど大きい。"],"a":[4],"m":"exact","n":"","e":"人の耳は高い周波数の音に敏感なため、NC曲線の許容音圧レベルは周波数が高いほど「小さく」なる。","f":[],"o":["img/R6A10_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R6A11","y":"R6","p":"A","no":11,"s":"三相誘導電動機に関する記述のうち、適当でないものはどれか。","c":["インバーターにリアクトルを設けることで、高調波を抑制することができる。","スターデルタ始動方式は、スター結線からデルタ結線に切り替わる際に、定格電流より大きな電流が流れることがある。","トップランナーモータは、標準モータに比べて始動電流が小さい。","3Eリレーとは、過負荷・欠相・反相を保護する継電器である。"],"a":[3],"m":"exact","n":"","e":"トップランナーモータは高効率化のため、標準モータより始動電流が大きくなる傾向がある。","f":[],"o":["img/R6A11_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R6A12","y":"R6","p":"A","no":12,"s":"電線に関する記述のうち、適当でないものはどれか。","c":["同一電線管に多数の電線を収納すると、1本あたりの許容電流は増加する。","電線の断面積を小さくすると、許容電流は減少する。","電線のこう長が長くなると、電圧降下が大きくなる。","電線の断面積を小さくすると、電圧降下が大きくなる。"],"a":[1],"m":"exact","n":"","e":"同一電線管に多数の電線を収納すると放熱が悪くなり、1本当たりの許容電流は減少する。","f":[],"o":["img/R6A12_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R6A13","y":"R6","p":"A","no":13,"s":"鉄筋コンクリート造の建築物の梁貫通孔に関する記述のうち、適当でないものはどれか。","c":["梁貫通孔を設ける場合は、梁の上下の主筋の量を増やさなければならない。","梁貫通孔の上下方向の位置は梁せいの中心付近とし、その径は梁せいの1/3以下とする。","大きさの異なる梁貫通孔が並列する場合の中心間隔は、梁貫通孔の径の平均値の3倍以上とする。","梁貫通孔は、可能な限り小さくし、せん断力の小さい部分に設ける。"],"a":[1],"m":"exact","n":"","e":"梁貫通孔を設ける場合は、孔の周囲を補強筋（開口補強）で補強する。上下の主筋量を増やす必要はない。","f":[],"o":["img/R6A13_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R6A14","y":"R6","p":"A","no":14,"s":"鉄筋コンクリート造の建築物に関する記述のうち、適当でないものはどれか。","c":["コンクリート中の単位水量が多いほど、乾燥収縮によるひび割れが発生しやすい。","水セメント比を小さくすると、コンクリートの耐久性は低くなる。","基礎の鉄筋のかぶり厚さは、捨コンクリート部分を除いた厚さとする。","鉄筋コンクリート造の建築物は、一般的に、柱や梁を剛接合するラーメン構造が多い。"],"a":[2],"m":"exact","n":"","e":"水セメント比を小さくするとコンクリートは密実になり、耐久性は「高く」なる。","f":[],"o":["img/R6A14_o0.png"],"g":50,"cat":"A基礎・電気・建築","neg":true},{"id":"R6A15","y":"R6","p":"A","no":15,"s":"省エネルギーに効果がある空調計画に関する記述のうち、適当でないものはどれか。","c":["変流量方式における流量制御には、ポンプのインバーターによる回転数制御やポンプの台数制御がある。","冷温水の大温度差空調システムは、往き・還りの温度差を大きくとることで流量が少なくなり、ポンプの搬送動力を削減できる。","蓄熱方式による空調システムは、電力負荷の平準化が図れるが、熱源容量は非蓄熱方式より大きくなる。","熱源を適切な容量、台数に分割し台数制御を行うことにより、低負荷時の熱源機器の運転効率がよくなる。"],"a":[3],"m":"exact","n":"","e":"蓄熱方式は熱源の運転を平準化できるため、熱源容量は非蓄熱方式より「小さく」できる。","f":[],"o":["img/R6A15_o0.png"],"g":72,"cat":"A空調","neg":true},{"id":"R6A16","y":"R6","p":"A","no":16,"s":"空気調和方式に関する記述のうち、適当でないものはどれか。","c":["床吹出し方式は、吹出口の移動や増設に対応しやすい。","変風量単一ダクト方式は、室の負荷変動に対応しやすい。","全空気方式は、ファンコイルユニット・ダクト併用方式に比べ、中間期の外気冷房を行いやすい。","ファンコイルユニット・ダクト併用方式は、全空気方式に比べて空気の搬送動力が大きい。"],"a":[4],"m":"exact","n":"","e":"ファンコイルユニット・ダクト併用方式は熱の一部を水で搬送するため、全空気方式より空気の搬送動力は「小さい」。","f":[],"o":["img/R6A16_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R6A17","y":"R6","p":"A","no":17,"s":"下図に示す冷房時の湿り空気線図における空気調和機のコイルの冷却負荷の値として、適当なものはどれか。\nただし、送風量は6,000m³/h、空気の密度は1.2kg/m³とする。","c":["18kW","26kW","44kW","84kW"],"a":[3],"m":"exact","n":"","e":"冷却負荷＝送風量×密度×比エンタルピー差＝(6,000×1.2÷3,600)×(67－45)＝2×22＝44kW。","f":["img/R6A17_f0.png"],"o":["img/R6A17_o0.png"],"g":3,"cat":"A空調","neg":false},{"id":"R6A18","y":"R6","p":"A","no":18,"s":"熱負荷計算に関する記述のうち、適当でないものはどれか。","c":["冷房負荷計算では、北側の外壁には、実効温度差を用いない。","冷房負荷計算では、一般的に、土間床、地中壁からの負荷は見込まない。","空調方式により室内を正圧に保つことができる場合は、一般的に、すきま風による負荷を考慮しない。","暖房負荷計算の構造体負荷は、一般的に、温度差を定常状態として計算する。"],"a":[1],"m":"exact","n":"","e":"冷房負荷計算では、北側の外壁も天空日射や外気温度変化の影響を受けるため実効温度差を用いる。","f":[],"o":["img/R6A18_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R6A19","y":"R6","p":"A","no":19,"s":"変風量単一ダクト方式の自動制御において、「制御する機器」と「検出要素」の組合せのうち、適当でないものはどれか。\n［制御する機器］ ［検出要素］","c":["空気調和機の冷温水コイルの制御弁 空気調和機出口空気の温度","空気調和機のファン 還気ダクト内の静圧","加湿器 還気ダクト内の湿度","VAVユニット 空調室内の温度"],"a":[2],"m":"exact","n":"","e":"変風量方式の送風機制御は、給気ダクト内の静圧を検出して行う。還気ダクトではない。","f":[],"o":["img/R6A19_o0.png"],"g":1,"cat":"A空調","neg":true},{"id":"R6A20","y":"R6","p":"A","no":20,"s":"地域冷暖房に関する記述のうち、適当でないものはどれか。","c":["地域冷暖房とは、1箇所又は数箇所の熱源プラントから、蒸気、温水あるいは冷水等の熱媒を、配管を通じて供給するものである。","地域冷暖房を計画する際は、冷暖房の使用時間帯が同じような需要者を広く求める必要がある。","地域冷暖房の熱需用者側の建物は、床面積の利用率がよくなる。","工場排熱、ごみ焼却排熱、変電所排熱等の未利用排熱を有効に利用することが可能である。"],"a":[2],"m":"exact","n":"","e":"地域冷暖房は、使用時間帯の異なる需要者を組み合わせることで負荷が平準化し、熱源の効率が上がる。","f":[],"o":["img/R6A20_o0.png"],"g":85,"cat":"A空調","neg":true},{"id":"R6A21","y":"R6","p":"A","no":21,"s":"蓄熱方式に関する記述のうち、適当でないものはどれか。","c":["氷蓄熱方式の氷生成装置は、スタティック方式とダイナミック方式がある。","熱源の運転時間を選択する自由度があり、高効率な運転が可能である。","氷蓄熱方式は、氷の融解潜熱を利用するため、水蓄熱方式に比べて蓄熱槽容量を小さくできる。","二次側配管系を開放回路とした場合、密閉回路に比べてポンプ揚程が小さくなる。"],"a":[4],"m":"exact","n":"","e":"開放回路では蓄熱槽水面から最高部までの実揚程が加わるため、密閉回路よりポンプ揚程は「大きく」なる。","f":[],"o":["img/R6A21_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R6A22","y":"R6","p":"A","no":22,"s":"室内の二酸化炭素濃度を1.0×10⁻³m³/m³以下に保つために必要な最小換気量として、適当なものはどれか。\nただし、外気中の二酸化炭素濃度は0.4×10⁻³m³/m³、室内における二酸化炭素発生量は0.3m³/hとする。","c":["300m³/h","500m³/h","700m³/h","1,000m³/h"],"a":[2],"m":"exact","n":"","e":"Q＝0.3÷(1.0×10⁻³－0.4×10⁻³)＝0.3÷0.0006＝500m³/h。","f":[],"o":["img/R6A22_o0.png"],"g":2,"cat":"A換気・排煙","neg":false},{"id":"R6A23","y":"R6","p":"A","no":23,"s":"換気設備に関する記述のうち、適当でないものはどれか。","c":["ボイラー室の換気量は、室内発熱を除去するための換気量のほか、燃焼用空気量を考慮したものとする。","火気使用室の換気を自然換気方式で行う場合、排気筒の有効断面積は、燃料の燃焼に伴う理論廃ガス量、排気筒の高さ等から算出する。","開放式燃焼器具を使用する室は、燃焼用空気を必要とするので、第二種機械換気方式とし、周囲の室より正圧とする。","室内で、有害ガス、粉じん等の室内汚染の発生源が限定される場合には、局所換気を行う。"],"a":[3],"m":"exact","n":"","e":"開放式燃焼器具を使用する室は、燃焼排ガスが他室へ漏れないよう第一種又は第三種機械換気とする。第二種で正圧にすると排ガスが周囲へ拡散する。","f":[],"o":["img/R6A23_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R6A24","y":"R6","p":"A","no":24,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」の避難安全検証法（区画、階、全館）及び特殊な構造によらないものとする。","c":["排煙口の手動開放装置のうち、手で操作する部分の高さは、天井から吊り下げる場合、床面からおおむね1.8mの高さとする。","機械排煙設備の排煙口は、防煙区画の各部分から水平距離で30m以下となるように設ける。","自然排煙設備の排煙口は、防煙区画の床面積の1/50以上の排煙上有効な開口面積を有する必要がある。","天井高さが3m未満の室の壁面に排煙口を設ける場合は、床面からの高さが天井高の1/2以上の部分、かつ防煙垂れ壁の下端より上の部分とする。"],"a":[4],"m":"exact","n":"","e":"天井高さ3m未満の室では、排煙口は天井から80cm以内（かつ防煙垂れ壁の下端より上）に設ける。天井高の1/2以上とできるのは天井高さ3m以上の室。","f":[],"o":["img/R6A24_o0.png"],"g":15,"cat":"A換気・排煙","neg":true},{"id":"R6A25","y":"R6","p":"A","no":25,"s":"下図に示す2階建ての建築物の機械排煙設備において、各部が受け持つ必要最小風量として、適当でないものはどれか。\nただし、本設備は「建築基準法」の避難安全検証法（区画、階、全館）及び特殊な構造によらないものとする。また、上下階の排煙口は同時開放しないものとし、隣接する2防煙区画は同時開放の可能性があるものとする。","c":["ダクトＡ部：60,000m³/h","ダクトＢ部：60,000m³/h","ダクトＣ部：60,000m³/h","排煙機 ：60,000m³/h"],"a":[1],"m":"exact","n":"","e":"ダクトA部（1階）は隣接2区画の同時開放：300＋400＝700m³/min＝42,000m³/hでよく、60,000m³/hは必要最小風量として誤り。B部・C部・排煙機は500m²×2＝1,000m³/min＝60,000m³/h。","f":["img/R6A25_f0.png"],"o":["img/R6A25_o0.png"],"g":29,"cat":"A換気・排煙","neg":true},{"id":"R6A26","y":"R6","p":"A","no":26,"s":"上水道に関する記述のうち、適当でないものはどれか。","c":["配水管から給水管を分岐する箇所での配水管内の最大静水圧は、0.98MPaを超えないようにする。1 1","配水管を軟弱層が浅い地盤に敷設する場合には、管底以下、管径の1/5〜1/2程度（最低5 215cm）を砂又は良質土に置き換える。","水の供給を受ける者の給水装置は、耐圧性能試験により1.75MPaの静水圧を1分間加えたときに、水漏れ、変形・破損その他の異常を生じないものとする。","2階建て建物への直結の給水を確保するためには、配水管の最小動水圧は、0.15〜0.2MPaを標準とする。"],"a":[1],"m":"exact","n":"","e":"配水管から給水管を分岐する箇所の最大静水圧は0.74MPaを超えないようにする。","f":[],"o":["img/R6A26_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R6A27","y":"R6","p":"A","no":27,"s":"下水道に関する記述のうち、適当でないものはどれか。","c":["管きょの管径が変化する場合の接続方法は、原則として水面接合又は管頂接合とする。","分流式の下水管きょにおける最小管径は、一般的に、汚水管きょでは150mm、雨水管きょでは200mmとする。","管きょの流速は、計画下水量に対し、原則として汚水管きょでは0.6〜3.0m/s、雨水管きょでは0.8〜3.0m/sとする。","地表勾配が急な場合の管きょの接続は、段差接合又は階段接合とする。"],"a":[2],"m":"exact","n":"","e":"分流式の最小管径は、汚水管きょ200mm、雨水管きょ250mm。","f":[],"o":["img/R6A27_o0.png"],"g":54,"cat":"A衛生","neg":true},{"id":"R6A28","y":"R6","p":"A","no":28,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["水道直結増圧方式は、ポンプ直送方式に比べて、給水引込み管の管径が小さくなる。","受水タンク本体又は出口配管には、地震時の配管破損等への対応として緊急遮断弁を設ける。","器具給水負荷単位は、公衆用で使う場合よりも私室用で使う場合の方が、小さい値になる傾向がある。","受水タンクの保守点検スペースは、上部は1m以上とし、周囲及び下部は0.6m以上とする。"],"a":[1],"m":"exact","n":"","e":"水道直結増圧方式は瞬時最大流量を直接引き込むため、受水槽を設けるポンプ直送方式より引込み管の管径は「大きく」なる。","f":[],"o":["img/R6A28_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R6A29","y":"R6","p":"A","no":29,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["吐水口空間とは、給水栓又は給水管の吐水口端とあふれ縁との垂直距離をいい、この空間を十分確保することで逆流汚染を防止する。","水道用直結加圧形ポンプユニットには、配水管への逆流を防止するため、吸込み側に逆流防止装置を設ける。","水道直結増圧方式の立て管には、断水時に配管内が負圧にならないように、最上部にエア抜弁を設ける。","高層建築物では、高層部、低層部等の給水系統のゾーニング等により、給水圧力が400〜500kPaを超えないようにする。"],"a":[3],"m":"exact","n":"","e":"水道直結増圧方式の立て管最上部には、断水時の負圧防止のため「吸排気弁」を設ける。エア抜弁ではない。","f":[],"o":["img/R6A29_o0.png"],"g":73,"cat":"A衛生","neg":true},{"id":"R6A30","y":"R6","p":"A","no":30,"s":"給湯設備に関する記述のうち、適当でないものはどれか。","c":["中央式給湯設備の貯湯タンク内の湯温は、レジオネラ属菌対策のため、60℃以上とする。","瞬間湯沸器の1号は、流量1L/minの水の温度を25℃上昇させる能力を表しており、加熱能力は約1.74kWである。","中央式給湯設備の返湯管が複数ある場合、湯が均等に循環するよう各系統に定流量弁を設ける。","中央式給湯設備の循環経路に気水分離器を取り付ける場合は、配管経路の圧力の高い位置に設置する。"],"a":[4],"m":"exact","n":"","e":"気水分離器は気泡が分離しやすい、配管経路の圧力の低い位置（高所）に設ける。","f":[],"o":["img/R6A30_o0.png"],"g":74,"cat":"A衛生","neg":true},{"id":"R6A31","y":"R6","p":"A","no":31,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["器具排水負荷単位法により通気管径を算定する場合、通気管の長さは実長とし、局部損失相当長を加算しない。","トラップの誘導サイホン作用の対策のうち、管内圧力を緩和させるための方法としては、一般的に、ループ通気方式より伸頂通気方式のほうが有効である。","伸頂通気方式において、排水横主管の水平曲がりは、原則として排水立て管底部より3m以内に設けてはならない。","ブランチ間隔とは、排水立て管に接続する排水横枝管の垂直距離の間隔のことであり、2.5mを超える場合を1ブランチ間隔という。"],"a":[2],"m":"exact","n":"","e":"誘導サイホン作用の対策（管内圧力の緩和）としては、伸頂通気方式より各個通気・ループ通気方式の方が有効。","f":[],"o":["img/R6A31_o0.png"],"g":33,"cat":"A衛生","neg":true},{"id":"R6A32","y":"R6","p":"A","no":32,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["間接排水管は、衛生面を考慮して、機器・装置の種類又は排水の水質を同じくするものごとに系統を分ける。","通気弁は、大気に開放された伸頂通気管と同様に、正圧緩和の効果が期待できる。","グリース阻集器の能力は、一般的に、厨房を含む食堂面積に基づき選定する。","排水横枝管に分岐がある場合は、それぞれの排水横枝管に通気管を設ける。"],"a":[2],"m":"exact","n":"","e":"通気弁は負圧時に空気を吸い込むだけで、正圧緩和の効果はない。","f":[],"o":["img/R6A32_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R6A33","y":"R6","p":"A","no":33,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["伸頂通気方式の排水立て管には、原則としてオフセットを設けてはならない。","通気管の末端は、戸、窓、換気口等の開口部の頂部より600mm以上立ち上げるか、水平距離で3m以上離す。","結合通気管は、その階からの排水横枝管が排水立て管に接続する部分の下方から、45度Ｙ継手等を用いて分岐して立ち上げ、その床面の下方で通気立て管に接続する。","排水槽の容量は、一般的に、流入排水の負荷変動、ポンプの最短運転時間、槽内貯留時間等を考慮して決定する。"],"a":[3],"m":"exact","n":"","e":"結合通気管は排水立て管から分岐し、その階の床面から1m以上上方で通気立て管に接続する。床面の下方ではない。","f":[],"o":["img/R6A33_o0.png"],"g":75,"cat":"A衛生","neg":true},{"id":"R6A34","y":"R6","p":"A","no":34,"s":"不活性ガス消火設備に関する記述のうち、適当でないものはどれか。","c":["常時人がいない部分以外の部分は、全域放出方式又は局所放出方式としてはならない。","ボイラー室等の多量の火気を使用する室に、不活性ガス消火設備を設置する場合の消火剤は、二酸化炭素とする。","貯蔵容器は、防護区画以外の温度が40℃以下で温度変化が少なく、直射日光及び雨水のかかるおそれの少ない場所に設ける。","全域放出方式の不活性ガス消火設備（窒素、IG−55又はIG−541を放射するものに限る。）を設置した防護区画は、当該防護区画内の圧力上昇を防止するための措置は必要ない。"],"a":[4],"m":"exact","n":"","e":"窒素・IG-55・IG-541を放射する全域放出方式では、放射による防護区画の圧力上昇を防止する措置（避圧口等）が必要。","f":[],"o":["img/R6A34_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R6A35","y":"R6","p":"A","no":35,"s":"ガス設備に関する記述のうち、適当でないものはどれか。","c":["「ガス事業法」では、ガス供給圧力が0.1MPa未満を低圧、0.1MPa以上1MPa未満を中圧、1MPa以上を高圧と区分している。","一般消費者等に供給される液化石油ガス（LPG）は、「い号」、「ろ号」、「は号」に区分されており、「い号」が最もプロパン及びプロピレンの合計量の含有率が低い。","比重が空気より小さい都市ガスのガス漏れ警報器は、ガス燃焼器から水平距離8m以内に設置しなければならない。","内容積が20L以上の液化石油ガス（LPG）の容器を設置する場合は、容器の設置位置から2m以内にある火気を遮る措置を行う。"],"a":[2],"m":"exact","n":"","e":"LPGの規格は「い号」がプロパン・プロピレンの含有率が最も高く（80％以上）、「は号」が最も低い。","f":[],"o":["img/R6A35_o0.png"],"g":62,"cat":"A衛生","neg":true},{"id":"R6A36","y":"R6","p":"A","no":36,"s":"浄化槽に関する記述のうち、適当でないものはどれか。","c":["合併処理浄化槽の処理工程は、一般的に、前処理・一次処理・二次処理・消毒からなる。","合併処理浄化槽の二次処理工程では、微生物を利用した生物学的処理方式が採用され、活性汚泥法と生物膜法に大別される。","BOD負荷量とは、流入水のBOD濃度に流入水量を乗じたもので、g/日で表される。","好気性処理法は、最終的には、有機物質のかなりの部分がメタンガス等のガス体に分解される。"],"a":[4],"m":"exact","n":"","e":"有機物がメタンガス等に分解されるのは嫌気性処理。好気性処理では主に二酸化炭素と水に分解される。","f":[],"o":["img/R6A36_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R6A37","y":"R6","p":"A","no":37,"s":"JISに規定する「建築物の用途別による屎尿浄化槽の処理対象人員算定基準」に示されている処理人員の算定式に関する記述のうち、適当でないものはどれか。","c":["建築用途の異なる2棟の建築物で共用する浄化槽を設ける場合の処理対象人員は、延べ面積の大きい方の建築用途の算定基準により算定する。","工場の処理対象人員は、業務用厨房設備の有無により、算定式が異なる。","病院の処理対象人員は、業務用厨房設備等の有無とベッド数により算定する。","中学校の処理対象人員と高等学校の処理対象人員は、算定式が異なる。"],"a":[1],"m":"exact","n":"","e":"用途の異なる2棟で浄化槽を共用する場合は、それぞれの用途の算定基準で算定した人員を合算する。","f":[],"o":["img/R6A37_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R6A38","y":"R6","p":"A","no":38,"s":"保温及び保冷に関する記述のうち、適当でないものはどれか。","c":["人造鉱物繊維保温材には、ロックウール保温材とグラスウール保温材があり、グラスウール保温材の方が使用温度の上限が高い。","ポリスチレンフォーム保温材は、独立気泡体を有していることから、水分による断熱性能の低下が小さい。","保温材の目的は、熱の拡散あるいは侵入を小さくする、表面温度の保持、管内温度の保持、結露防止等である。","ロックウール保温材のブランケットは、密度により1号と2号に区分される。"],"a":[1],"m":"exact","n":"","e":"ロックウール保温材の方がグラスウール保温材より使用温度の上限が高い（ロックウール約600℃、グラスウール約350℃）。","f":[],"o":["img/R6A38_o0.png"],"g":86,"cat":"A機材・設計図書・約款","neg":true},{"id":"R6A39","y":"R6","p":"A","no":39,"s":"ボイラー等に関する記述のうち、適当でないものはどれか。","c":["鋳鉄製ボイラーは、分割搬入が可能で、鋼板製に比べて耐食性が優れている。","真空式温水発生機は、運転中の内部圧力が大気圧より低いため、「労働安全衛生法」におけるボイラーとしての適用を受けず、取扱い資格が不要である。","小型貫流ボイラーは、保有水量が少ないため、水質管理を行う必要がない。","炉筒煙管ボイラーは、胴内部に炉筒（燃焼室）と多数の煙管を配置したものである。"],"a":[3],"m":"exact","n":"","e":"小型貫流ボイラーは保有水量が少なくスケールの影響を受けやすいため、給水の水質管理が重要。","f":[],"o":["img/R6A39_o0.png"],"g":42,"cat":"A機材・設計図書・約款","neg":true},{"id":"R6A40","y":"R6","p":"A","no":40,"s":"空気調和機に関する記述のうち、適当でないものはどれか。","c":["デシカント空気調和機は、導入外気の湿度を室内湿度に近づけて供給するデシカントローターを備えたものである。","ユニット形空気調和機の冷却コイルは、供給冷水温度は、5〜7℃、コイル面通過風速は、5.0m/s前後で選定する。","ユニット形空気調和機で大温度差送風方式とする場合、低負荷時の換気量不足に留意する必要がある。","潜熱・顕熱分離形空気調和機は、外気負荷を処理する潜熱コイルと室内負荷を処理する顕熱コイルを備えたものである。"],"a":[2],"m":"exact","n":"","e":"冷却コイルのコイル面通過風速は2.5m/s前後（2〜3m/s程度）で選定する。5.0m/sでは水滴が飛散する。","f":[],"o":["img/R6A40_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R6A41","y":"R6","p":"A","no":41,"s":"配管材料及び配管附属品に関する記述のうち、適当でないものはどれか。","c":["排水用硬質塩化ビニルライニング鋼管の接合は、ねじ込み式鋼管製管継手を使用する。","配管用炭素鋼鋼管の最高使用圧力は、1.0MPa程度である。","水道用硬質塩化ビニルライニング鋼管の接合にねじ接合を用いる場合は、管端防食管継手を使用する。","バタフライ弁に用いられる弁体は円板状であり、構造が簡単で取付けスペースが小さい。"],"a":[1],"m":"exact","n":"","e":"排水用硬質塩化ビニルライニング鋼管（DVLP）は管厚が薄くねじ加工できないため、MD継手（排水鋼管用可とう継手）で接合する。","f":[],"o":["img/R6A41_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R6A42","y":"R6","p":"A","no":42,"s":"ダクト及びダクト附属品に関する記述のうち、適当でないものはどれか。","c":["ダクトフランジ用ガスケットの厚さは、一般的に、アングルフランジ用は3mm以上、コーナーボルト工法フランジ用はガスケットの弾力性が要求されるため5mm以上のものを使用する。","排煙ダクトに設ける防火ダンパーの温度ヒューズの作動温度は280℃とする。","防火ダンパーの温度ヒューズの作動温度は、一般系統は72℃、厨房排気系統は120℃とする。","低圧ダクトの通常運転時における内圧は、正圧、負圧ともに1000Paまでの範囲とする。"],"a":[4],"m":"exact","n":"","e":"低圧ダクトの常用圧力は正圧・負圧とも500Pa以内。1,000Paまでではない。","f":[],"o":["img/R6A42_o0.png"],"g":34,"cat":"A機材・設計図書・約款","neg":true},{"id":"R6A43","y":"R6","p":"A","no":43,"s":"「公共工事標準請負契約約款」に関する記述のうち、適当でないものはどれか。","c":["受注者は、請負代金内訳書に健康保険、厚生年金保険及び雇用保険に係る法定福利費を明示するものとする。","発注者の完成検査で、必要と認められる理由を受注者に通知した上で、工事目的物を最小限度破壊する場合、その検査又は復旧に直接要する費用は受注者の負担となる。","受注者は、約款（契約書含む。）及び設計図書に特別の定めがない仮設、施工方法等を定める場合は、監督員の指示によらなければならない。","設計図書の表示が明確でない場合は、監督員に通知して、発注者による確認を請求しなければならない。"],"a":[3],"m":"exact","n":"","e":"約款に特別の定めがない仮設・施工方法等は、受注者が自らの責任で定める。監督員の指示によるのではない。","f":[],"o":["img/R6A43_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R6A44","y":"R6","p":"A","no":44,"s":"設計図書に記載する「配管材料」に関する記述のうち、適当でないものはどれか。","c":["配管用ステンレス鋼鋼管は、一般配管用ステンレス鋼鋼管の適用範囲を超える使用圧力や、ねじ切り加工が必要な場合に使用される。","硬質ポリ塩化ビニル管のVP、VM、VUの3種類のうち、設計圧力の上限が最も低いものはVUである。","水配管用亜鉛めっき鋼管は、配管用炭素鋼鋼管（白）に比べて、亜鉛の付着量が多い。","水道用硬質ポリ塩化ビニル管のHIVPは、VPより耐熱性が優れ、給湯管として使用される。"],"a":[4],"m":"exact","n":"","e":"HIVPは耐衝撃性硬質ポリ塩化ビニル管で耐熱性はない。給湯管に使用するのは耐熱性硬質ポリ塩化ビニル管（HTVP）。","f":[],"o":["img/R6A44_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R6B01","y":"R6","p":"B","no":1,"s":"工事の「申請・届出書類」と「提出先」の組合せとして、適当でないものはどれか。\n［申請・届出書類］ ［提出先］","c":["労働安全衛生法の第一種圧力容器設置届 労働基準監督署長","消防法の危険物貯蔵所設置許可申請書 市町村長又は都道府県知事","消防法の消防用設備等設置届出書 消防長又は消防署長","大気汚染防止法のばい煙発生施設設置届出書 市町村長"],"a":[4],"m":"exact","n":"","e":"大気汚染防止法のばい煙発生施設設置届の提出先は都道府県知事（政令市長）。市町村長ではない。","f":[],"o":["img/R6B01_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R6B02","y":"R6","p":"B","no":2,"s":"下図に示すネットワーク工程表に関する記述のうち、適当でないものはどれか。\nただし、図中のイベント間のＡ〜Ｉは作業内容、日数は作業日数を表す。","c":["クリティカルパスは1本で所要日数は17日である。","イベント⑦の最遅完了時刻は、13日である。","作業Ｆの作業日数を1日短縮すれば、全体工期は1日短縮される。","作業Ｇのトータルフロートは2日である。"],"a":[3],"m":"exact","n":"","e":"最早時刻は②4、③9、④9、⑤9、⑥13、⑦13、⑧17日。クリティカルパスはA→B→E→ダミー→Iの17日。作業Fは非クリティカル（トータルフロート1日）で、短縮しても工期は短縮されない。","f":["img/R6B02_f0.png"],"o":["img/R6B02_o0.png"],"g":0,"cat":"B施工管理","neg":true},{"id":"R6B03","y":"R6","p":"B","no":3,"s":"品質管理に関する記述のうち、適当でないものはどれか。","c":["特性要因図とは、結果に影響を与える各種要因を体系的に表した図で、結果の特性とその原因となる要因の関連が示される。","ヒストグラムは、横軸にデータの値を一定の範囲ごとに区分してとり、縦軸にそれぞれの度数をとることで、データ全体の分布が分かり、ばらつきの状況等が把握できる。","チェックシートとは、データの確認や判断をしやすくしたシートで、品質の状況を集計、整理するものである。","建設工事は、現場ごとの一品生産であるため、統計的手法による品質管理は有効とならない。"],"a":[4],"m":"exact","n":"","e":"一品生産の建設工事でも、ヒストグラムや管理図などの統計的手法による品質管理は有効。","f":[],"o":["img/R6B03_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R6B04","y":"R6","p":"B","no":4,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["火気を使用する作業を行う場合は、消火器等の設置、付近の可燃物の除去、防炎シート等による養生、火花の飛散防止措置を行うとともに、作業終了後の残火確認も確実に行う。","不安全行動とは、手間や労力、時間やコストを省くことを優先し、労働者本人又は関係者の安全を阻害する可能性のある行動を行うことをいい、ヒューマンエラーとは区別される。","作業床の高さが10m以上の高所作業車の運転（道路上を走行させる運転を除く。）の業務は、高所作業車運転業務の特別教育を修了した者に行わせる。","一つの荷物で重量が100kg以上のものを貨物自動車に積む作業を行うときは、当該作業を指揮する者を定める。"],"a":[3],"m":"exact","n":"","e":"作業床の高さが10m以上の高所作業車の運転は技能講習修了者が行う。特別教育で足りるのは10m未満。","f":[],"o":["img/R6B04_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R6B05","y":"R6","p":"B","no":5,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["貯湯タンクの据付けにおいては、周囲に450mm以上の保守、点検スペースを確保するほか、加熱コイルの引抜きスペース及び内部点検用マンホール部分の点検作業用スペースを確保する。","機器をコンクリート基礎に据え付ける場合、基礎のコンクリートを打設後、10日が経過してから据え付ける。","地下オイルタンク室を構築しオイルタンクを据え付ける場合、タンクとタンク室側壁との間隔は100mm以上とする。","機器を吊り上げる場合、ワイヤーロープの吊り角度を大きくすると、ワイヤーロープに掛かる張力は小さくなる。"],"a":[4],"m":"exact","n":"","e":"吊り角度を大きくすると、ワイヤーロープに掛かる張力は「大きく」なる。","f":[],"o":["img/R6B05_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R6B06","y":"R6","p":"B","no":6,"s":"配管の施工に関する記述のうち、適当でないものはどれか。","c":["遠心ポンプの吸込み管は、できるだけ短く、空気だまりができないように配管する。","ステンレス鋼管のフランジ接合でボルトを締付ける際は、隣のボルトを順番に締付け、片締めにならないようにする。","水圧試験は、配管途中もしくは隠ぺい前や埋戻し前、又は配管完了後の被覆施工前に、各区画ごとに行う。","冷媒配管の差込接合は、硬ろうを使用し、管内に不活性ガスを流して酸化物の生成を抑えながら接合する。"],"a":[2],"m":"exact","n":"","e":"フランジのボルトは、片締めにならないよう対角線上の順に締め付ける。隣を順番に締めるのではない。","f":[],"o":["img/R6B06_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R6B07","y":"R6","p":"B","no":7,"s":"ダクト及びダクト附属品の施工に関する記述のうち、適当でないものはどれか。","c":["アングルフランジ工法ダクトと共板フランジ工法ダクトの横走りダクトの最大吊り間隔は、ともに3,000mmである。","長辺が450mmを超える亜鉛鉄板製ダクトは、保温を施さない部分に補強リブによる補強を行う。","ダクトの曲がり部の内側曲り半径は、長方形ダクトの場合、半径方向のダクト幅の1/2以上とする。","長方形の防火ダンパーの吊りは、4本（長辺が300mm以下の場合は2本）吊りとする。"],"a":[1],"m":"exact","n":"","e":"横走りダクトの吊り間隔は、アングルフランジ工法3,640mm以下、共板フランジ工法3,000mm以下で、同じではない。","f":[],"o":["img/R6B07_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R6B08","y":"R6","p":"B","no":8,"s":"保温、保冷の施工に関する記述のうち、適当でないものはどれか。","c":["ポリスチレンフォーム保温筒を冷水管の保温に使用する場合、保温筒1本につき2か所以上粘着テープ巻きを行うことにより、合わせ目の粘着テープ止めは省略できる。","テープ巻き仕上げの重ね幅は15mm以上とし、立て配管の場合は、下方から上方へ巻く。","保温の施工において、保温筒を2層以上重ねて所要の保温厚さにする場合は、それぞれの保温筒を鉄線で巻き締める。","スパイラルダクトの保温に帯状保温材を用いる場合は、原則として、鉄線を150mm以下のピッチでらせん状に巻き締める。"],"a":[1],"m":"exact","n":"","e":"冷水管のポリスチレンフォーム保温筒は防湿のため合わせ目をすべて粘着テープで止め、さらに1本につき2か所以上テープを巻く。合わせ目のテープ止めは省略できない。","f":[],"o":["img/R6B08_o0.png"],"g":65,"cat":"B施工","neg":true},{"id":"R6B09","y":"R6","p":"B","no":9,"s":"冷凍機の試運転調整に関する記述のうち、適当でないものはどれか。","c":["冷水ポンプ、冷却水ポンプ、冷却塔のインターロックを確認してから、冷凍機の起動スイッチを入れ、運転を確認する。","温度調節器による容量制御及び自動発停の作動を確認する。","停止サーモスタットの設定値が冷水温度の規定値より高いことを確認する。","冷水量が過度に減少した場合、断水リレーの作動により冷凍機が停止することを確認する。"],"a":[3],"m":"exact","n":"","e":"冷凍機の停止サーモスタットの設定値は、冷水温度の規定値より「低い」ことを確認する（凍結防止）。","f":[],"o":["img/R6B09_o0.png"],"g":70,"cat":"B施工","neg":true},{"id":"R6B10","y":"R6","p":"B","no":10,"s":"建設工事における安全管理体制に関する記述のうち「労働安全衛生法」上、誤っているものはどれか。","c":["事業場に安全委員会を設置した場合、当該安全委員会は2月に1回以上開催するようにしなければならない。","統括安全衛生責任者が統括管理しなければならない事項には、作業間の連絡及び調整がある。","特定元方事業者は、毎作業日に少なくとも1回、作業場所の巡視を行わなければならない。","安全管理者の行うべき職務には、安全に関する資料の作成、収集及び重要事項の記録がある。"],"a":[1],"m":"exact","n":"","e":"安全委員会は毎月1回以上開催しなければならない。","f":[],"o":["img/R6B10_o0.png"],"g":21,"cat":"B法規","neg":true},{"id":"R6B11","y":"R6","p":"B","no":11,"s":"建設工事における安全衛生管理に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["事業者は、高さが2m以上の足場で作業床を設けるとき、作業床の端等で墜落により労働者に危険を及ぼすおそれのある箇所には、原則として囲い等を設けなければならない。","事業者は、機械間又はこれと他の設備との間に設ける通路については、幅80cm以上のものとしなければならない。","事業者は、作業床を設ける必要がある枠組み足場では、幅を30cm以上としなければならない。","事業者は、高さ又は深さが1.5mをこえる箇所で作業を行うときは、原則として労働者が安全に昇降するための設備等を設けなければならない。"],"a":[3],"m":"exact","n":"","e":"足場の作業床の幅は40cm以上とする。","f":[],"o":["img/R6B11_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R6B12","y":"R6","p":"B","no":12,"s":"労働条件に関する記述のうち、「労働基準法」上、誤っているものはどれか。","c":["常時10人以上の労働者を使用する使用者は、就業規則を作成し、行政官庁に届け出なければならない。","使用者は、労働契約の不履行について違約金を定め、又は損害賠償額を予定する契約をしてはならない。","使用者は、労働者が出産、疾病、災害その他非常の場合の費用に充てるために請求する場合においては、支払期日前であっても、既往の労働に対する賃金を支払わなければならない。","使用者の責に帰すべき事由による休業の場合においては、使用者は、休業期間中当該労働者に、その平均賃金の100分の80以上の手当を支払わなければならない。"],"a":[4],"m":"exact","n":"","e":"使用者の責に帰すべき休業の休業手当は、平均賃金の100分の60以上。","f":[],"o":["img/R6B12_o0.png"],"g":67,"cat":"B法規","neg":true},{"id":"R6B13","y":"R6","p":"B","no":13,"s":"建築物に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["建築物の敷地が斜面又は段地である場合その他建築物の部分によって階数を異にする場合においては、これらの階数のうち最小なものを当該建築物の階数とする。","耐火性能とは、通常の火災が終了するまでの間当該火災による建築物の倒壊及び延焼を防止するために当該建築物の部分に必要とされる性能をいう。","防火性能とは、建築物の周囲において発生する通常の火災による延焼を抑制するために当該外壁又は軒裏に必要とされる性能をいう。","住宅の居室には、採光のための窓その他の開口部を設け、その採光に有効な部分の面積は、原則として、その居室の床面積に対して1/7の割合以上とする。"],"a":[1],"m":"exact","n":"","e":"階数が部分により異なる場合は、これらのうち「最大」のものを階数とする。","f":[],"o":["img/R6B13_o0.png"],"g":87,"cat":"B法規","neg":true},{"id":"R6B14","y":"R6","p":"B","no":14,"s":"建築設備に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["延べ面積が3,000m²を超える建築物の屋内に設ける換気設備のダクトは、屋外に面する部分その他防火上支障がないものとして国土交通大臣が定める部分を除き、不燃材料で造らなければならない。","非常用エレベーターの乗降ロビーは、屋内消火栓、連結送水管の放水口、非常コンセント設備等の消火設備を設置できる構造としなければならない。","給水管が準耐火構造の防火区画を貫通する場合、当該管と防火区画との隙間をモルタルその他の不燃材料で埋めなければならない。","換気設備を設けるべき調理室等の排気口は、当該室の天井又は天井から下方1.5m以内の高さの位置に設けなければならない。"],"a":[4],"m":"exact","n":"","e":"調理室等の排気口は、天井又は天井から下方80cm以内の高さに設ける。","f":[],"o":["img/R6B14_o0.png"],"g":88,"cat":"B法規","neg":true},{"id":"R6B15","y":"R6","p":"B","no":15,"s":"請負契約書に記載しなければならない事項に関する記述のうち、「建設業法」上、規定されていないものはどれか。","c":["工事着手の時期及び工事完成の時期","主任技術者又は監理技術者の氏名","価格等の変動若しくは変更に基づく請負代金の額又は工事内容の変更","各当事者の履行の遅滞その他債務の不履行の場合における遅延利息、違約金その他の損害金"],"a":[2],"m":"exact","n":"","e":"主任技術者・監理技術者の氏名は、請負契約書の法定記載事項ではない（現場への掲示や施工体制台帳で明示）。","f":[],"o":["img/R6B15_o0.png"],"g":27,"cat":"B法規","neg":true},{"id":"R6B16","y":"R6","p":"B","no":16,"s":"元請負人の義務に関する記述のうち、「建設業法」上、誤っているものはどれか。","c":["元請負人は、その請け負った建設工事を施工するために必要な工程の細目、作業方法その他元請負人において定めるべき事項を定めようとするときは、あらかじめ、下請負人の意見をきかなければならない。","元請負人は、工事完成後における支払を受けたときは、建設工事を施工した下請負人に対して、相応する下請代金を、当該支払を受けた日から2月以内に支払わなければならない。","元請負人は、下請負人に対して支払う下請代金のうち労務費に相当する部分については、現金で支払うよう適切な配慮をしなければならない。","元請負人は、下請負人からその請け負った建設工事が完成した旨の通知を受けたときは、当該通知を受けた日から20日以内で、かつ、できる限り短い期間内に、その完成を確認するための検査を完了しなければならない。"],"a":[2],"m":"exact","n":"","e":"元請負人は、支払を受けた日から「1月以内」（かつできる限り短い期間内）に下請代金を支払わなければならない。","f":[],"o":["img/R6B16_o0.png"],"g":5,"cat":"B法規","neg":true},{"id":"R6B17","y":"R6","p":"B","no":17,"s":"不活性ガス消火設備に関する記述のうち、「消防法」上、誤っているものはどれか。","c":["窒素、IG−55又はIG−541を放射するものにあっては、防護区画に必要な消火剤の90％の量以上を1分以内に放射できるものとする。","貯蔵容器に貯蔵する消火剤の量は、同一の防火対象物又はその部分に防護区画又は防護対象物が2以上有る場合、それぞれの防護区画又は防護対象物について計算した量のうち最大の量以上とする。","駐車の用に供される部分及び通信機器室であって常時人がいない部分は、局所放出方式とする。","防護区画の換気装置は、消火剤の放射前に停止できる構造とする。"],"a":[3],"m":"exact","n":"","e":"常時人がいない駐車場・通信機器室は全域放出方式とする。","f":[],"o":["img/R6B17_o0.png"],"g":79,"cat":"B法規","neg":true},{"id":"R6B18","y":"R6","p":"B","no":18,"s":"スプリンクラー設備に関する記述のうち、「消防法」上、誤っているものはどれか。\nただし、特定施設水道連結型スプリンクラー設備は除く。","c":["非常電源を附置する。","消防ポンプ自動車が容易に接近することができる位置に、専用の単口形の送水口を附置する。","開放型スプリンクラーヘッドを用いる一斉開放弁又は手動式開放弁は、放水区域ごとに設ける。","送水口の結合金具は、差込式又はねじ式のものとする。"],"a":[2],"m":"exact","n":"","e":"スプリンクラー設備の送水口は「双口形」とする。","f":[],"o":["img/R6B18_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R6B19","y":"R6","p":"B","no":19,"s":"分別解体等に関する記述のうち、「建設工事に係る資材の再資源化等に関する法律」上、誤っているものはどれか。","c":["対象建設工事の受注者は、工事着手の時期及び工程の概要、分別解体等の計画その他の事項を、工事に着手する日の7日前までに、都道府県知事に届け出なければならない。","分別解体等に伴って生じた特定建設資材廃棄物である木材については、工事現場から50km以内に再資源化をするための施設がない場合、再資源化に代えて縮減をすれば足りる。","対象建設工事の請負契約の当事者は、分別解体等の方法、解体工事に要する費用その他の事項を書面に記載し、相互に交付しなければならない。","対象建設工事の元請業者は、当該工事に係る特定建設資材廃棄物の再資源化等が完了したときは、再資源化等に要した費用等を、発注者に書面で報告しなければならない。"],"a":[1],"m":"exact","n":"","e":"対象建設工事の届出は、工事着手の7日前までに「発注者」（自主施工者）が都道府県知事に行う。","f":[],"o":["img/R6B19_o0.png"],"g":48,"cat":"B法規","neg":true},{"id":"R6B20","y":"R6","p":"B","no":20,"s":"業務用冷凍空調機器の整備及び撤去等に関する記述のうち、「フロン類の使用の合理化及び管理の適正化に関する法律」上、誤っているものはどれか。","c":["第一種フロン類充塡回収業を行おうとする者は、その業務を行おうとする区域を管轄する都道府県知事の登録を受けなければならない。","第一種特定製品に冷媒としてフロン類を充塡するときは、第一種フロン類充塡回収業者が充塡を行わなければならない。","第一種フロン類充塡回収業者が委託を受けてフロン類の充塡を行ったときは、整備を発注した第一種特定製品の管理者に充塡証明書を交付しなければならない。","フロン類破壊業者がフロン類を破壊したときは、当該フロン類を引き取った第一種フロン類充塡回収業者に破壊証明書を送付しなくてよい。"],"a":[4],"m":"exact","n":"","e":"フロン類破壊業者は、破壊したときはフロン類を引き取った充塡回収業者に破壊証明書を送付しなければならない。","f":[],"o":["img/R6B20_o0.png"],"g":80,"cat":"B法規","neg":true},{"id":"R6B21","y":"R6","p":"B","no":21,"s":"産業廃棄物の処理に関する記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","c":["電子情報処理組織を使用する事業者は、産業廃棄物の運搬又は処分を他人に委託する場合、委託者に産業廃棄物を引き渡した後、3日以内に情報処理センターに登録する必要がある。","事業者は、建設工事に伴い発生した産業廃棄物を事業場の外の300m²以上の保管場所に保管する場合、非常災害のために必要な応急措置として行う場合を除き、あらかじめその旨を保健所長に届け出なければならない。","産業廃棄物の処分受託者は、処分を終了した日から10日以内に、産業廃棄物管理票の写しを管理票交付者に送付しなければならない。","産業廃棄物の運搬受託者は、運搬を終了した日から10日以内に、産業廃棄物管理票の写しを管理票交付者に送付しなければならない。"],"a":[2],"m":"exact","n":"","e":"事業場外の300m²以上の保管場所に保管する場合は、あらかじめ「都道府県知事」に届け出る。保健所長ではない。","f":[],"o":["img/R6B21_o0.png"],"g":59,"cat":"B法規","neg":true},{"id":"R6B22","y":"R6","p":"B","no":22,"s":"公共工事における施工計画等に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["予測できなかった大規模埋設物の撤去に要する費用は、設計図書等に特別な定めがない限り、受注者の負担ではない。","仮設計画は、一般的に、設計図に示されていないが、施工中に必要となる諸設備を整えることで受注者がその責任において計画するものである。","工事原価とは、純工事費と現場管理費を合わせた費用のことであり、現場従業員の給与等の現場経費は含まない。","工種別施工計画書は受注者の責任において作成されるものであるため、監督員に提出する必要はない。"],"a":[3,4],"m":"exact","n":"","e":"⑶工事原価＝純工事費＋現場管理費で、現場従業員の給与等は現場管理費に含まれる。⑷工種別施工計画書は監督員に提出する。","f":[],"o":["img/R6B22_o0.png"],"g":89,"cat":"C応用能力","neg":true},{"id":"R6B23","y":"R6","p":"B","no":23,"s":"工程管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["バーチャート工程表は、建設工事で広く利用されるものであり、縦軸に作業名、横軸に達成度をとり、作業間の関係が分かりやすい。","施工速度を速めると、直接費（労務費、材料費、仮設費等）と間接費（管理費、共通仮設費等）は、ともに増加する。","ネットワーク工程表は、進捗の障害となる作業が明確になり、工事手順の検討が可能である。","計画された工程に対して、工事途中で進捗を考慮し調整することをフォローアップという。"],"a":[1,2],"m":"exact","n":"","e":"⑴バーチャートは横軸に暦日（工期）をとるもので、作業間の関係は分かりにくい（横軸が達成度のものはガントチャート）。⑵施工速度を速めると直接費は増加するが、間接費は減少する。","f":[],"o":["img/R6B23_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R6B24","y":"R6","p":"B","no":24,"s":"品質管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["品質基準が明確であり、再現性が確保されている製品には、抜取検査を適用する。","建設工事における品質管理には、水圧試験等の施工検査、試運転調整等が含まれない。","ISO9000ファミリー規格はあらゆる組織に適用可能であり、この規格の要求事項のすべての事項を必ず守るものとして規定されている。","計量抜取検査を適用するには、ロットの特性値がほぼ正規分布とみなせることが前提条件である。"],"a":[2,3],"m":"exact","n":"","e":"⑵水圧試験等の施工検査や試運転調整も品質管理に含まれる。⑶ISO9000ファミリーは組織に応じて適用できない要求事項を適用除外にできる。","f":[],"o":["img/R6B24_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R6B25","y":"R6","p":"B","no":25,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["災害発生の頻度を示すものを強度率、災害の規模程度を示すものを度数率という。","災害及び事故が発生した場合は、人命の安全確保を最優先するとともに、作業を中止して、工事現場の安全確保に努め、二次災害を防止する。","ハインリッヒの法則では、1件の重大事故の背後には29件の軽度の事故、さらに300件のヒヤリ・ハットがあるといわれている。","建設工事に伴う労働災害とは、工事関係者及び工事関係者以外の第三者の生命、身体及び財産に関する危害並びに迷惑をいう。"],"a":[1,4],"m":"exact","n":"","e":"⑴災害発生の頻度を示すのが度数率、災害の重さ（規模程度）を示すのが強度率。記述は逆。⑷記述は公衆災害に近い定義。労働災害は労働者が業務に起因して負傷・疾病・死亡すること。","f":[],"o":["img/R6B25_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R6B26","y":"R6","p":"B","no":26,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["飲料用タンクの基礎は、コンクリート基礎と鋼製架台で、高さを600mm以上とする。","防振基礎に設置された振動機器は、地震力が作用したときに過大に移動しないよう基礎に耐震ストッパーをボルト等で堅固に取り付ける。","ゲージ圧が0.2MPaを超える温水ボイラーを設置する場合、安全弁その他の附属品の検査及び取扱いに支障がない場合を除き、ボイラーの最上部から上部にある構造物までの距離は、0.8m以上とする。","真空又は窒素加圧の状態で据え付けられた冷凍機は、機内を大気に開放した後、配管を接続する。"],"a":[3,4],"m":"exact","n":"","e":"⑶ボイラー最上部から上部構造物までは1.2m以上。⑷真空・窒素加圧で据え付けた冷凍機は、湿気や異物が入らないよう大気に開放せずに配管を接続する。","f":[],"o":["img/R6B26_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R6B27","y":"R6","p":"B","no":27,"s":"配管及び配管付属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["イオン化傾向が大きく異なる異種金属管を接合する場合は、フレキシブルジョイントを介して接合する。","管径が100mmの屋内排水管の直管部には、15m以内の間隔で掃除口を設ける。","通気横走り管を通気立て管に接続する場合は、通気立て管に向かって下がり勾配とする。","冷温水配管に自動エア抜弁を設ける場合は、管内が正圧になる箇所に設ける。"],"a":[1,3],"m":"exact","n":"","e":"⑴イオン化傾向が大きく異なる異種金属管は、絶縁継手（絶縁フランジ）を介して接合する。⑶通気横走り管は通気立て管に向かって「上り」勾配とする。","f":[],"o":["img/R6B27_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R6B28","y":"R6","p":"B","no":28,"s":"ダクト及びダクト附属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["横走りダクトの振れ止め支持は、12m以下の間隔で行い、立てダクトは各階1か所以上に振れ止め支持を行う。","コーナーボルト工法ダクトのコーナー部のシール（Nシール）は、コーナー金物とフランジ押さえ金具にシールを行う。","長方形ダクトの角部の継目は、ピッツバーグはぜ又はボタンパンチスナップはぜ等とし、原則として継目箇所は2か所以上とする。","コーナーボルト工法ダクトに使用するフランジ用ガスケットの継目は、コーナー部においてオーバーラップさせる。"],"a":[2,4],"m":"exact","n":"","e":"⑵コーナーボルト工法のコーナー部のシールは、コーナー金物とダクト本体（フランジ）とのすき間に行う。⑷フランジ用ガスケットの継目はコーナー部を避け、直線部で重ね合わせる。","f":[],"o":["img/R6B28_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R6B29","y":"R6","p":"B","no":29,"s":"設備配管の腐食・防食に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["ステンレス鋼管に接続する青銅製仕切弁は、弁棒を黄銅製として脱亜鉛腐食を防止する。","防食テープ巻きを施した鋼管は、施工時に被覆が損傷しても、鉄部が露出する陽極部面積が小さい場合、腐食によって短期間に穴があく可能性は小さい。","給湯管に銅管を用いる場合、曲がり部直近で、かい食が発生しないように管内流速に留意する必要がある。","鋼管が土中から鉄筋コンクリートの外壁を貫通する場合、鋼管が鉄筋に触れていなくてもマクロセルを形成し腐食する。"],"a":[1,2],"m":"exact","n":"","e":"⑴青銅製弁の弁棒を黄銅製にすると脱亜鉛腐食が起こりやすい。弁棒は耐脱亜鉛黄銅や青銅・ステンレス製とする。⑵被覆損傷部（陽極部）の面積が小さいほど腐食電流が集中し、短期間で穴があく可能性が大きい。","f":[],"o":["img/R6B29_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R7A01","y":"R7","p":"A","no":1,"s":"下図に示すグラフにおいて、暑さ指数（WBGT）と熱中症患者発生率の関係を表したものとして、適当なものはどれか。","c":["①","②","③","④"],"a":[2],"m":"exact","n":"","e":"熱中症患者発生率は暑さ指数（WBGT）がおおむね28度を超えると急増する（②）。","f":["img/R7A01_f0.png"],"o":["img/R7A01_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R7A02","y":"R7","p":"A","no":2,"s":"水平な円管の直管部を水が乱流（レイノルズ数15,000）で流れている。次のうち、流れが層流になる条件として、適当なものはどれか。\nただし、レイノルズ数が2,000未満で層流となるものとする。","c":["管内径が1/3倍で、平均流速は同じ場合。","管内径が3倍で、平均流速は同じ場合。","平均流速が1/9倍で、管内径は同じ場合。","平均流速が9倍で、管内径は同じ場合。"],"a":[3],"m":"exact","n":"","e":"Re＝vd/νで、Reを15,000から2,000未満にするには1/7.5以下が必要。平均流速1/9倍ならRe≒1,670で層流。管径1/3倍では5,000で乱流のまま。","f":[],"o":["img/R7A02_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R7A03","y":"R7","p":"A","no":3,"s":"下図に示す水平な円管内を空気が流れている場合、点Ａの静圧として、適当なものはどれか。\nただし、点Ａの風速は5m/s、点Ｂの風速は10m/s、点Ｂの静圧は5Pa、点Ａと点Ｂの間の圧力損失は5Pa、空気の密度は1.2kg/m³とする。","c":["16Pa","32Pa","45Pa","55Pa"],"a":[4],"m":"exact","n":"","e":"B点の全圧＝5＋1/2×1.2×10²＝65Pa。A点の全圧＝65＋5（損失）＝70Pa。A点の静圧＝70－1/2×1.2×5²＝70－15＝55Pa。","f":["img/R7A03_f0.png"],"o":["img/R7A03_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R7A04","y":"R7","p":"A","no":4,"s":"流体に関する文中、 内に当てはまる用語の組合せとして、適当なものはどれか。水平な円管の直管部に水が流れている場合、 Ａ のために流体摩擦が働いて、圧力損失を生じる。ダルシー・ワイスバッハの式は、この圧力損失が、 Ｂ に比例することを表している。\n［ Ａ ］ ［ Ｂ ］","c":["慣性 管内径","慣性 管長","粘性 管内径","粘性 管長"],"a":[4],"m":"exact","n":"","e":"流体摩擦は流体の粘性によって生じ、ダルシー・ワイスバッハの式では圧力損失は管長に比例する（管内径に反比例、流速の2乗に比例）。","f":[],"o":["img/R7A04_o0.png"],"g":8,"cat":"A基礎・電気・建築","neg":false},{"id":"R7A05","y":"R7","p":"A","no":5,"s":"圧力6×10⁵Pa、絶対温度300K、体積60Lの理想気体を、圧力3×10⁵Pa、絶対温度360Kにしたときの体積の値として、適当なものはどれか。","c":["100L","120L","144L","240L"],"a":[3],"m":"exact","n":"","e":"ボイル・シャルルの法則 P₁V₁/T₁＝P₂V₂/T₂ より、V₂＝60×(6/3)×(360/300)＝144L。","f":[],"o":["img/R7A05_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R7A06","y":"R7","p":"A","no":6,"s":"伝熱に関する記述のうち、適当でないものはどれか。","c":["均質な固体壁内部において熱伝導により移動する熱量は、その固体壁内部の温度勾配に比例する。","黒体の熱放射のエネルギーは、その表面の絶対温度の4乗に比例する。","対流熱伝達において、熱伝達率は、接する流体の流速、伝熱面の形状・寸法等によって変わる。","固体壁両側の流体間の熱通過による熱移動量は、固体壁の厚さの2乗に反比例する。"],"a":[4],"m":"exact","n":"","e":"熱通過による熱移動量は温度差と面積に比例し、壁の熱伝導抵抗（厚さ/熱伝導率）が大きいほど小さくなる。厚さの2乗に反比例するのではない。","f":[],"o":["img/R7A06_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R7A07","y":"R7","p":"A","no":7,"s":"下図に示す湿り空気線図において、湿り空気Aに水スプレーで加湿した場合の状態変化として、適当なものはどれか。","c":["①","②","③","④"],"a":[3],"m":"exact","n":"","e":"水スプレーによる加湿は断熱変化で、比エンタルピー（湿球温度）がほぼ一定のまま左上（③）に移動する。","f":["img/R7A07_f0.png"],"o":["img/R7A07_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R7A08","y":"R7","p":"A","no":8,"s":"温熱環境に関する記述のうち、適当でないものはどれか。","c":["人体の熱的快適感に影響する主要素は、代謝量、着衣量、空気温度、放射温度、気流、湿度である。","予想平均申告（PMV）は、人が感じる温冷感を−3から+3までの数値で表すものである。","clo（クロ）は、衣服の断熱性を表すものであり、1cloは約0.155(m²・℃)/Wである。","met（メット）とは、人体の代謝量を表すものであり、椅座安静状態の代謝量1metは約100W/m²である。"],"a":[4],"m":"exact","n":"","e":"1metは椅座安静時の代謝量で約58.2W/m²。100W/m²ではない。","f":[],"o":["img/R7A08_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R7A09","y":"R7","p":"A","no":9,"s":"室内の空気環境に関する記述のうち、適当でないものはどれか。","c":["直径が10μm以下の浮遊粉じんは、人体に影響は与えない。","炭素を含有する物質の不完全燃焼は、一酸化炭素が発生する原因となる。","ホルムアルデヒド、トルエン、キシレン等の揮発性有機化合物（VOCs）は、シックハウス症候群の主要因である。","空気中の二酸化炭素濃度が1,000ppm（100万分の1,000）では、人体に致命的な影響は与えない。"],"a":[1],"m":"exact","n":"","e":"直径10μm以下の浮遊粉じんは気道の奥まで達し健康に影響するため、建築物衛生法で0.15mg/m³以下と規定されている。","f":[],"o":["img/R7A09_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R7A10","y":"R7","p":"A","no":10,"s":"音に関する記述のうち、適当でないものはどれか。","c":["空気中を伝わる音の速さは、一定の圧力のもとでは、空気の温度が高いほど遅くなる。","マスキング効果は、マスクする音の周波数がマスクされる音の周波数に近いほど大きくなる。","音の大きさは、その音と同じ大きさに聞こえる1,000Hzの純音の音圧レベルの数値で表す。","音の回折現象とは、音の伝搬空間に障害物がある場合に、障害物の背後に音が回り込んで伝搬する現象をいう。"],"a":[1],"m":"exact","n":"","e":"空気中の音速は、温度が高いほど速くなる（約331.5＋0.6t m/s）。","f":[],"o":["img/R7A10_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R7A11","y":"R7","p":"A","no":11,"s":"電気設備に関する記述のうち、適当でないものはどれか。","c":["UPS（無停電電源装置）は、停電が生じても連続して電力を供給する装置である。","Ｄ種接地工事の接地抵抗値は、1,000Ωとする。","Ｄ種接地工事は、300V以下の低圧用電気機械器具の外箱等に施す接地工事である。","SPD（サージ防護デバイス）は、雷から機器を保護する装置である。"],"a":[2],"m":"exact","n":"","e":"D種接地工事の接地抵抗値は100Ω以下（0.5秒以内に自動遮断する装置を設ける場合は500Ω以下）。","f":[],"o":["img/R7A11_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R7A12","y":"R7","p":"A","no":12,"s":"三相誘導電動機に関する記述のうち、適当でないものはどれか。","c":["短絡保護は、保護継電器と電磁接触器の組合せにより行う。","インバータによる運転は、電圧波形にひずみを含むため、インバータを用いない運転よりも電動機の温度が高くなる。","スターデルタ始動方式は、全電圧直入れ始動方式と比較して、始動電流が1/3になる。","出力が0.2kW以下の場合は、過負荷保護装置を設けなくてもよい。"],"a":[1],"m":"exact","n":"","e":"短絡保護は配線用遮断器やヒューズで行う。保護継電器（熱動形等）と電磁接触器の組合せは過負荷保護。","f":[],"o":["img/R7A12_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R7A13","y":"R7","p":"A","no":13,"s":"鉄筋コンクリート造の建築物に関する記述のうち、適当でないものはどれか。","c":["コンクリートの単位セメント量は、乾燥収縮によるひび割れを防止するためには少ない方がよいが、少なすぎるとワーカビリティーが悪くなる。","コンクリートの打込みにおいて、コンクリートの打継ぎは、応力の小さいところで行う。","鉄筋のかぶり厚さの確保には、火災時に鉄筋の強度低下を抑える効果がある。","柱や梁などの部材に生じる応力は、曲げモーメント、せん断力の2種類である。"],"a":[4],"m":"exact","n":"","e":"部材に生じる応力は、曲げモーメント、せん断力、軸方向力の3種類。","f":[],"o":["img/R7A13_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R7A14","y":"R7","p":"A","no":14,"s":"下図のように単純梁に集中荷重P₁及びP₂が作用したとき、支点Ａの鉛直方向の反力の値として、適当なものはどれか。","c":["4kN","7kN","8kN","12kN"],"a":[2],"m":"exact","n":"","e":"支点Bまわりのモーメント：R_A×4m＝4kN×3m＋8kN×2m＝28 → R_A＝7kN。","f":["img/R7A14_f0.png"],"o":["img/R7A14_o0.png"],"g":90,"cat":"A基礎・電気・建築","neg":false},{"id":"R7A15","y":"R7","p":"A","no":15,"s":"空調システムの省エネルギーに効果がある建築的手法の記述のうち、適当でないものはどれか。","c":["建物の平面形状が長方形の場合、短辺に比べ長辺の長さをできるだけ大きくする。","窓ガラスは、日射熱取得に係る遮へい係数の小さいものを使用する。","外壁面積に対する窓面積の比率を小さくする。","外壁に赤外線の反射率が高い塗料を使用する。"],"a":[1],"m":"exact","n":"","e":"長辺を大きくするほど外壁面積が増えて熱負荷が増える。正方形に近い平面形状の方が省エネルギー上有利。","f":[],"o":["img/R7A15_o0.png"],"g":39,"cat":"A空調","neg":true},{"id":"R7A16","y":"R7","p":"A","no":16,"s":"空気調和設備方式に関する記述のうち、適当でないものはどれか。","c":["変風量単一ダクト方式は、定風量単一ダクト方式に比べ、空気の搬送動力を低減できる。","天井放射冷房方式は、効率的に潜熱負荷を処理できる。","変風量単一ダクト方式は、必要外気量の確保のため、負荷変動の大きな室等では、最小風量の設定を行う。","ファンコイルユニット・ダクト併用方式は、全空気方式に比べ、ダクトスペースが小さくなる。"],"a":[2],"m":"exact","n":"","e":"天井放射冷房方式は潜熱（除湿）を処理できないため、外調機等による除湿と併用する。","f":[],"o":["img/R7A16_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R7A17","y":"R7","p":"A","no":17,"s":"下図に示す暖房時の湿り空気線図において、空気調和機のコイルの加熱負荷量として、適当なものはどれか。\nただし、送風量は6,000m³/h、空気の密度は1.2kg/m³とする。","c":["18,800W","25,200W","36,800W","65,200W"],"a":[2],"m":"exact","n":"","e":"加熱負荷＝(6,000×1.2÷3,600)×(41.2－28.6)＝2×12.6＝25.2kW＝25,200W。","f":["img/R7A17_f0.png"],"o":["img/R7A17_o0.png"],"g":3,"cat":"A空調","neg":false},{"id":"R7A18","y":"R7","p":"A","no":18,"s":"空気調和設備における自動制御に関する記述のうち、適当でないものはどれか。","c":["冷凍機の台数制御は、各冷凍機の運転時間や運転回数が均等となるようにローテーションを行う。","加湿器は、空調機ファンとのインターロックを設定する。","冷却塔ファンは、外気温度により二位置制御とする。","ユニット形空気調和機のCO₂濃度制御は、還気ダクト内のCO₂濃度を検出し、外気導入用、排気用及び還気用の電動ダンパーの比例制御を行う。"],"a":[3],"m":"exact","n":"","e":"冷却塔ファンは冷却水温度（冷却塔出口水温）により発停・台数制御する。外気温度ではない。","f":[],"o":["img/R7A18_o0.png"],"g":19,"cat":"A空調","neg":true},{"id":"R7A19","y":"R7","p":"A","no":19,"s":"負荷熱量による熱源の台数制御を行うために必要な検出要素のうち、適当でないものはどれか。","c":["冷温水往きヘッダー内水温","冷温水還りヘッダー内水温","冷温水往きヘッダー内圧力","冷温水負荷流量"],"a":[3],"m":"exact","n":"","e":"負荷熱量による台数制御には、冷温水の往き温度・還り温度と流量が必要。往きヘッダー内圧力は差圧制御等に用いるもので負荷熱量の算出には不要。","f":[],"o":["img/R7A19_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R7A20","y":"R7","p":"A","no":20,"s":"コージェネレーションシステムに関する記述のうち、適当でないものはどれか。","c":["受電並列運転（系統連系）は、コージェネレーションシステムによる電力と商用電力を接続し、一体的に電力を供給する方式である。","マイクロガスタービン発電機を用いるシステムでは、ボイラー・タービン主任技術者の選任は不要である。","燃料電池を用いるシステムは、同容量の原動機式と比べて騒音・振動は小さいが、発電効率は低い。","ガスコージェネレーションシステムは、所定の条件を満たすことで常用防災兼用発電装置とすることが可能である。"],"a":[3],"m":"exact","n":"","e":"燃料電池式は騒音・振動が小さく、発電効率も原動機式より「高い」。","f":[],"o":["img/R7A20_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R7A21","y":"R7","p":"A","no":21,"s":"空気熱源ヒートポンプに関する記述のうち、適当でないものはどれか。","c":["ガスエンジンヒートポンプは、一般的に、エンジンの排気ガスや冷却水からの排熱を回収するための熱交換器を備えている。","電気式の場合、暖房時の除霜運転は、一般的に、冷房サイクルに切り替えて行う。","空冷ユニットを複数台連結するモジュール型は、法定冷凍トンの算定をする場合、連結する全モジュールを合算しなければならない。","冷房サイクルと暖房サイクルの切り替えは、一般的に、配管回路に設置された四方弁により行う。"],"a":[3],"m":"exact","n":"","e":"冷媒設備が独立したモジュール型は、法定冷凍トンをモジュールごとに算定し、合算しなくてよい。","f":[],"o":["img/R7A21_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R7A22","y":"R7","p":"A","no":22,"s":"換気に関する記述のうち、適当でないものはどれか。","c":["電気室の熱を除去するための換気量が確保できない場合には、冷房設備を併設する。","住宅等の居室のシックハウス対策としての必要有効換気量を算定する場合、原則として、換気回数を0.5回/h以上とする。","密閉式燃焼器具のみを設けた室には、火気を使用する室としての換気設備を設ける必要がある。","自然換気設備の給気口と排気口は、常時開放された構造とし、給気口より高い位置に排気筒付きの排気口を設ける必要がある。"],"a":[3],"m":"exact","n":"","e":"密閉式燃焼器具のみを設けた室は、火気使用室としての換気設備を設ける必要はない。","f":[],"o":["img/R7A22_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R7A23","y":"R7","p":"A","no":23,"s":"電気室において発生した熱を換気により除去するときに必要な換気量として、適当なものはどれか。\nただし、発生熱量は10kW、許容室温は40℃、外気温度は35℃、空気の比熱は1.0kJ/(kg・K)、空気の密度は1.2kg/m³とする。","c":["7,200m³/h","6,000m³/h","3,000m³/h","2,000m³/h"],"a":[2],"m":"exact","n":"","e":"Q＝(10kW×3,600)÷(1.2×1.0×(40－35))＝36,000÷6＝6,000m³/h。","f":[],"o":["img/R7A23_o0.png"],"g":7,"cat":"A換気・排煙","neg":false},{"id":"R7A24","y":"R7","p":"A","no":24,"s":"機械排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」の避難安全検証法（区画、階、全館）及び特殊な構造によらないものとする。","c":["常時開放型の排煙口は、2以上の防煙区画を1台の排煙機で受け持つ場合に適したものである。","2以上の防煙区画を受け持つ排煙機の風量は、120m³/min以上で、かつ、最大防煙区画の床面積1m²につき2m³/min以上とする。","特別避難階段の付室を兼用する非常用エレベーターの乗降ロビーの排煙機の風量は、6m³/s以上とする。","排煙設備における天井チャンバー方式は、同一防煙区画内が数室に間仕切りされている場合でも、天井面に均等に配置された吸込口からの均一な排煙が期待できる方式である。"],"a":[1],"m":"exact","n":"","e":"常時開放型の排煙口は、1防煙区画を1台の排煙機で受け持つ場合に用いる。2以上の防煙区画を受け持つ場合は常時閉鎖型（手動開放）とする。","f":[],"o":["img/R7A24_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R7A25","y":"R7","p":"A","no":25,"s":"排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」の避難安全検証法（区画、階、全館）及び特殊な構造によらないものとする。","c":["自然排煙の防煙区画と機械排煙の防煙区画との間は、間仕切区画とし、垂れ壁による区画としてはならない。","複数の階の排煙を行う排煙機の設置位置は、その排煙系統の最上部の排煙口よりも高い位置とする。","排煙ダクトは、可燃材料から10cm以上離すか、又は厚さ5cm以上の金属以外の不燃材料で覆うものとする。","電源を必要とする排煙設備の予備電源は、30分以上継続して排煙設備を作動させることができる容量以上のものとし、かつ、常用の電源が断たれた場合に自動的に切り替えられるものとする。"],"a":[3],"m":"exact","n":"","e":"排煙ダクトは可燃材料から15cm以上離すか、厚さ10cm以上の金属以外の不燃材料で覆う。","f":[],"o":["img/R7A25_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R7A26","y":"R7","p":"A","no":26,"s":"上水道に関する記述のうち、適当でないものはどれか。","c":["取水施設は、河川、湖沼、地下の水源より水を取り入れ、粗いごみや砂を取り除き、導水施設へ送り込む施設である。","導水施設は、水道法に定められた水質基準に適合する飲用水を作るための施設である。","凝集池は、凝集剤と原水を混和させる混和池、混和池で生成した微小フロックを大きく成長させるフロック形成池から構成される。","送水施設の計画送水量は、計画1日最大給水量（1年を通じて、1日の給水量のうち最も多い量）を基準として決定する。"],"a":[2],"m":"exact","n":"","e":"水質基準に適合する水をつくるのは浄水施設。導水施設は取水施設から浄水施設まで原水を導く施設。","f":[],"o":["img/R7A26_o0.png"],"g":28,"cat":"A衛生","neg":true},{"id":"R7A27","y":"R7","p":"A","no":27,"s":"下水道に関する記述のうち、適当でないものはどれか。","c":["合流式の下水道では、降雨の規模によっては、処理施設を経ない下水が公共用水域に放流されることがある。","中継ポンプ場は、下水を次のポンプ場又は処理場まで自然流下できない場合に、自然流下できる高さまで揚水を行う施設である。","取付管は、本管の中心線から上方に取り付ける。","可とう性の管きょを布設する場合の基礎は、管の変形に伴って変形しないものとする。"],"a":[4],"m":"exact","n":"","e":"可とう性の管きょの基礎は、管の変形に追随できる自由支承の砂基礎・砕石基礎等とする。","f":[],"o":["img/R7A27_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R7A28","y":"R7","p":"A","no":28,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["受水タンクの有効水量は、1日予想給水量とする。","受水タンクの底部には吸込みピットを設け、底面の勾配はピットに向かって1/100程度とする。","高置タンク方式における高置タンクの有効水量は、一般的に、時間最大予想給水量に0.5を乗じた量とする。","高置タンク方式における揚水ポンプの揚水量は、一般的に、時間最大予想給水量とする。"],"a":[1],"m":"exact","n":"","e":"受水タンクの有効水量は、一般に1日予想給水量の1/2程度（4/10〜6/10）。","f":[],"o":["img/R7A28_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R7A29","y":"R7","p":"A","no":29,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["雑用水系統がある場合、上水配管と配管材料を変えるなどして識別できるように考慮する。","ウォーターハンマー防止等のため、給水管内の流速は2.0m/sを超えないようにする。","水面より高い位置に設置したポンプのキャビテーションを防止するには、吸込み揚程を小さくする。","衛生器具の同時使用率は、器具数が増えるほど大きくなる。"],"a":[4],"m":"exact","n":"","e":"器具数が増えるほど全器具が同時に使われる確率は下がり、同時使用率は「小さく」なる。","f":[],"o":["img/R7A29_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R7A30","y":"R7","p":"A","no":30,"s":"給湯設備に関する記述のうち、適当でないものはどれか。","c":["中央式給湯設備の熱源に使用する真空式温水発生機の運転には、ボイラー技士等の有資格者が必要である。","中央式給湯設備の循環ポンプの循環量は、循環管路の熱損失と許容温度降下により決定する。","水優先吐水機構をもつシングルレバー式混合水栓は、レバーの中央位置で湯を吐水させないものである。","貯湯タンクは、脚部までを保温し、熱損失を防止する。"],"a":[1],"m":"exact","n":"","e":"真空式温水発生機は労働安全衛生法上のボイラーに該当しないため、ボイラー技士等の有資格者は不要。","f":[],"o":["img/R7A30_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R7A31","y":"R7","p":"A","no":31,"s":"排水設備に関する記述のうち、適当でないものはどれか。","c":["階層が多い建物の最下階の排水横枝管は、排水立て管に接続せず、単独で排水ますに接続する。","管径65mm以上の間接排水管の末端と、間接排水口のあふれ縁との排水口空間は、最小150mmとする。","トラップ桝は、50〜100mmの封水深を確保できるものとする。","排水立て管に対して60度以下のオフセットの管径は、垂直な排水立て管とみなして決定してよい。"],"a":[4],"m":"exact","n":"","e":"垂直とみなして管径を決められるのは、立て管に対して45度以下のオフセット。60度は不可。","f":[],"o":["img/R7A31_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R7A32","y":"R7","p":"A","no":32,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["誘導サイホン作用とは、衛生器具自身の排水によって生じるサイホン作用により、トラップ内の封水を吸引することである。","通気立て管の上部は、管径を縮小せずに延長し、大気に開放する。","通気管どうしを接続する場合は、その階における最高位の器具のあふれ縁より150mm以上立ち上げて接続する。","排水立て管内では、排水に接した空気が誘引されて下降し、立て管底部は正圧、立て管上部は負圧となる。"],"a":[1],"m":"exact","n":"","e":"記述は自己サイホン作用。誘導サイホン作用は他の器具の排水等による管内の圧力変動で封水が吸い出される現象。","f":[],"o":["img/R7A32_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R7A33","y":"R7","p":"A","no":33,"s":"排水槽に関する記述のうち、適当でないものはどれか。","c":["排水槽の清掃や維持管理がしやすいように、排水槽の近くに水栓を設ける。","排水槽の貯留時間が長くなるおそれがある場合は、一定時間を経過するとタイマーでポンプを起動させる制御方法を考慮する。","厨房の排水槽に使用する排水ポンプは、一般的に、汚物用水中モーターポンプとする。","排水槽の通気管は、単独で立ち上げ、最上階で伸頂通気管に接続して大気に開放する。"],"a":[4],"m":"exact","n":"","e":"排水槽の通気管は他の通気管と接続せず、単独で大気に開放する。","f":[],"o":["img/R7A33_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R7A34","y":"R7","p":"A","no":34,"s":"消火設備の消火原理に関する記述のうち、適当でないものはどれか。","c":["粉末消火設備は、粉末状の消火剤を放射し、燃焼中の炎を拡散効果により消火するものである。","不活性ガス消火設備は、不活性ガスを放射し、酸素の容積比を低下させ、窒息効果により消火するものである。","水噴霧消火設備は、水を霧状に噴霧し、噴霧水による冷却効果と噴霧水が火炎に触れて発生する水蒸気による窒息効果により消火するものである。","泡消火設備は、燃焼物を泡の層で覆い、窒息効果と冷却効果により消火するものである。"],"a":[1],"m":"exact","n":"","e":"粉末消火設備は主に負触媒（燃焼抑制）効果と窒息効果で消火する。拡散効果ではない。","f":[],"o":["img/R7A34_o0.png"],"g":16,"cat":"A衛生","neg":true},{"id":"R7A35","y":"R7","p":"A","no":35,"s":"ガス設備に関する記述のうち、適当でないものはどれか。","c":["都市ガス設備の工事は、ガス事業者、又はガス事業者が認めた施工者が施工する。","都市ガス本支管から分岐し、需要家に引き込まれる導管のうち、本支管分岐箇所から敷地境界線までの導管を供給管という。","液化石油ガス配管の気密試験は、空気又は不活性ガスにより圧力をかけ、漏えい検知液や石けん液などを用いて漏えいがないことを確認する。","液化石油ガスのガス漏れ警報器の検知部は、ガス機器から水平距離4m以内で、かつ検知部の上端が床面より0.6m以内に設置する。"],"a":[4],"m":"exact","n":"","e":"LPGは空気より重いため、ガス漏れ警報器の検知部は燃焼器から水平距離4m以内、かつ上端が床面から0.3m以内に設置する。","f":[],"o":["img/R7A35_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R7A36","y":"R7","p":"A","no":36,"s":"FRP製浄化槽の設置に関する記述のうち、適当でないものはどれか。","c":["浄化槽工事を行う際には、浄化槽設備士が自ら浄化槽工事を行う場合を除き、浄化槽設備士に実地で監督させて行わなければならない。","本体の設置は、本体の損傷防止や水平の調整のため、砂利地業の後に山砂を適度な厚さに敷き均し、据え付ける。","埋戻しは良質土で行うものとし、周囲を数回に分けて均等に突き固め、水締めを行う。","雨水の槽内浸入防止や槽の浮上防止のため、上部スラブコンクリートを打つ。"],"a":[2],"m":"exact","n":"","e":"FRP製浄化槽は、砂利地業の後に捨てコンクリートを打設し、水平を確認して据え付ける。山砂を敷き均すのではない。","f":[],"o":["img/R7A36_o0.png"],"g":76,"cat":"A衛生","neg":true},{"id":"R7A37","y":"R7","p":"A","no":37,"s":"合併処理浄化槽において、流入水が下表のとおりでBOD除去率が95％の場合に、放流水のBOD濃度として適当なものはどれか。","c":["10mg/L","20mg/L","40mg/L","80mg/L"],"a":[1],"m":"exact","n":"","e":"流入水の平均BOD＝(2×260＋6×180)÷8＝200mg/L。除去率95％なので放流水は200×0.05＝10mg/L。","f":["img/R7A37_f0.png"],"o":["img/R7A37_o0.png"],"g":92,"cat":"A衛生","neg":false},{"id":"R7A38","y":"R7","p":"A","no":38,"s":"冷凍機に関する記述のうち、適当でないものはどれか。","c":["遠心冷凍機は、低圧冷媒又は高圧冷媒を使用する機種があり、低圧冷媒を使用する機種は、「高圧ガス保安法」の適用を受けない。","二重効用の直だき吸収冷温水機は、高温再生機内の圧力が大気圧より高くなるので、ボイラー関係法規の適用を受ける。","遠心冷凍機の容量制御で吸込みベーン制御を行う場合、より低い冷凍能力まで運転可能にするためにホットガスバイパス制御を設ける。","スクリュー圧縮機は、高い圧縮比に向いており、空気熱源ヒートポンプ用として用いられている。"],"a":[2],"m":"exact","n":"","e":"二重効用の直だき吸収冷温水機は、高温再生器内も大気圧以下で運転されるため、ボイラー関係法規の適用を受けない。","f":[],"o":["img/R7A38_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R7A39","y":"R7","p":"A","no":39,"s":"送風機に関する記述のうち、適当でないものはどれか。","c":["斜流送風機は、小型の割に取り扱う風量が大きく、静圧は、200〜400Pa程度で使用される。","軸流送風機であるプロペラ送風機は、ケーシングと案内羽根をもち、静圧400Pa以上で使用される。","横流送風機は、ルームエアコン、ファンコイルユニット、エアカーテン等の送風用に用いられる。","後向き羽根送風機は、多翼送風機に比べ、高速回転が可能であり、静圧は、2,000〜3,000Pa程度で使用される。"],"a":[2],"m":"exact","n":"","e":"プロペラ送風機はケーシングや案内羽根をもたず、低静圧（おおむね100Pa程度以下）で大風量を扱う換気扇等に用いる。案内羽根をもつのはベーン形の軸流送風機。","f":[],"o":["img/R7A39_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R7A40","y":"R7","p":"A","no":40,"s":"保温及び保冷に関する記述のうち、適当でないものはどれか。","c":["同じ材料の保温材でも、密度によって熱伝導率は変化する。","JISA0202（断熱用語）において、保温とは常温以上、約1000℃以下の物体を被覆し熱放散を少なくすること、又は被覆後の表面温度を低下させることを行うことをいう。","JISA0202（断熱用語）において、保冷とは常温以下の物体を被覆し、侵入熱量を小さくすること。又は、被覆後の表面温度を露点温度以上とし、表面に結露を生じさせないことをいう。","グラスウール保温材には、板状又は筒状に発泡成形したものや、板状又はシート状に発泡した後に筒状に加工したものがある。"],"a":[4],"m":"exact","n":"","e":"記述はポリスチレンフォーム等の発泡プラスチック保温材。グラスウール保温材はガラスを繊維状にしたもの。","f":[],"o":["img/R7A40_o0.png"],"g":63,"cat":"A機材・設計図書・約款","neg":true},{"id":"R7A41","y":"R7","p":"A","no":41,"s":"配管材料及び配管付属品に関する記述のうち、適当でないものはどれか。","c":["架橋ポリエチレン管は、給水管と給湯管のどちらにも使用できる規格のものがある。","圧力配管用炭素鋼鋼管は、「呼び径」と「スケジュール番号」により区分される。","フレキシブルジョイントは、配管の伸縮を吸収することにも適している。","水道用硬質ポリ塩化ビニル管の設計圧力の上限は、1.0MPaである。"],"a":[3],"m":"exact","n":"","e":"フレキシブルジョイントは振動の伝搬防止や変位の吸収に用いるもので、配管の伸縮吸収には伸縮管継手を用いる。","f":[],"o":["img/R7A41_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R7A42","y":"R7","p":"A","no":42,"s":"ダクト及びダクト附属品に関する記述のうち、適当でないものはどれか。","c":["定風量ユニット（CAV）は、上流側の圧力が変動する場合でも、風量を一定に保つ機能を持っている。","グラスウール製ダクトは、ダクト内温度が70℃以下の範囲で使用する。","幅又は高さが450mmを超えるダクトで保温を施さないものには、450mm以下のピッチで補強リブを設ける。","たわみ継手は、一般的に、二重にした繊維系クロスの間に補強用のピアノ線が挿入されたものが使用される。"],"a":[3],"m":"exact","n":"","e":"幅又は高さが450mmを超える保温を施さないダクトには、300mm以下のピッチで補強リブを設ける。","f":[],"o":["img/R7A42_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R7A43","y":"R7","p":"A","no":43,"s":"「公共工事標準請負契約約款」に関する記述のうち、適当でないものはどれか。","c":["受注者は、設計図書において監督員の立会いの上施工するものと指定された工事については、当該立会いを受けて施工しなければならない。","主任技術者は、現場代理人を兼ねることができるが、専門技術者を兼ねることはできない。","受注者は、工事現場内に搬入した工事材料を監督員の承諾を受けないで工事現場外に搬出してはならない。","受注者は、工事目的物及び工事材料等を設計図書に定めるところにより火災保険、建設工事保険その他の保険に付さなければならない。"],"a":[2],"m":"exact","n":"","e":"約款では、現場代理人・主任技術者（監理技術者）・専門技術者はこれを兼ねることができる。","f":[],"o":["img/R7A43_o0.png"],"g":55,"cat":"A機材・設計図書・約款","neg":true},{"id":"R7A44","y":"R7","p":"A","no":44,"s":"設計図書に記載する「配管材料」とその「記号（規格）」の組合せのうち、適当でないものはどれか。\n［配管材料］ ［記号（規格）］","c":["排水用硬質塩化ビニルライニング鋼管 SGP-VD（JWWA）","リサイクル硬質ポリ塩化ビニル三層管 RS-VU（JIS）","水道用硬質ポリ塩化ビニル管 VP、HIVP（JIS）","水道用硬質塩化ビニルライニング鋼管（黒） SGP-VA（JWWA）"],"a":[1],"m":"exact","n":"","e":"排水用硬質塩化ビニルライニング鋼管の記号はDVLP（WSP042）。SGP-VDは水道用硬質塩化ビニルライニング鋼管（JWWA K116）。","f":[],"o":["img/R7A44_o0.png"],"g":10,"cat":"A機材・設計図書・約款","neg":true},{"id":"R7B01","y":"R7","p":"B","no":1,"s":"工事の「申請・届出書類」と「提出先」の組合せとして、適当でないものはどれか。\n（申請・届出書類）―（提出先）","c":["道路交通法の道路使用許可申請書 ―― 道路管理者","消防法の工事整備対象設備等着工届出書 ―― 消防長又は消防署長","振動規制法の特定建設作業実施届出書 ―― 市町村長","高圧ガス保安法の高圧ガス製造事業届書 ―― 都道府県知事等"],"a":[1],"m":"exact","n":"","e":"道路交通法の道路使用許可申請書の提出先は警察署長。道路管理者に提出するのは道路法の道路占用許可申請書。","f":[],"o":["img/R7B01_o0.png"],"g":11,"cat":"B施工管理","neg":true},{"id":"R7B02","y":"R7","p":"B","no":2,"s":"下図に示すネットワーク工程表に関する記述のうち、適当でないものはどれか。\nただし、イベント間のＡ～Ｊは作業内容、日数は作業日数を示す。","c":["クリティカルパスのルートは、2本で所要日数は20日である。","作業内容Ｅのトータルフロートは、1日である。","イベント⑥の最早開始時刻、最遅完了時刻は、ともに9日である。","作業Ｄの作業日数を2日短縮すると、全体工期も2日短縮される。"],"a":[4],"m":"exact","n":"","e":"最早時刻は②4、④9、⑥9、⑦16、⑧17、⑨20日。クリティカルパスはB→D→F→Iと B→D→H→Jの2本で20日。Dを2日短縮しても、A経路（7日）が効いて工期は1日しか短縮されない。","f":["img/R7B02_f0.png"],"o":["img/R7B02_o0.png"],"g":0,"cat":"B施工管理","neg":true},{"id":"R7B03","y":"R7","p":"B","no":3,"s":"品質管理に関する記述のうち、適当でないものはどれか。","c":["ヒストグラムは、計量したデータをいくつかの区間に分けて柱状図で示すことにより、大体の平均値やばらつきの状況を把握することができる。","散布図は、グラフに点をプロットしたもので、関係のある2つのデータの相関関係がわかる。","パレート図は、データをプロットして結んだ折れ線と管理限界線により、データの時間的変化や異常なばらつきがわかる。","層別とは、データの特性を適当な範囲別にいくつかのグループに分けることをいい、データ全体の傾向や管理対象範囲の把握がしやすくなる。"],"a":[3],"m":"exact","n":"","e":"記述は管理図の説明。パレート図は不良項目を件数の多い順に並べた棒グラフと累積比率の折れ線で、重点項目を把握するもの。","f":[],"o":["img/R7B03_o0.png"],"g":78,"cat":"B施工管理","neg":true},{"id":"R7B04","y":"R7","p":"B","no":4,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。","c":["ツールボックスミーティングは、危険予知活動の一環として作業関係者が行う短時間のミーティングで、1週間に1回程度行われる。","作業場の屋内に設ける通路は、用途に応じた幅を有し、通路面は、つまずき、すべり、踏抜き等の危険のない状態に保持する。","5Ｓ活動とは、安全で健康な職場づくりと生産性の向上を目指す活動のことで、「整理、整頓、清掃、清潔、しつけ」の5つをいう。","年千人率とは、労働者1,000人当たり1年間に発生した死傷者数の割合を表したもので、発生頻度を示す。"],"a":[1],"m":"exact","n":"","e":"ツールボックスミーティングは、作業開始前などに毎日行う短時間のミーティング。週1回程度ではない。","f":[],"o":["img/R7B04_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R7B05","y":"R7","p":"B","no":5,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。","c":["あと施工のメカニカルアンカーボルトは、めねじ型よりおねじ型の方が許容引抜き力が大きい。","防振基礎は、地震時における機器の移動や転倒防止のために、ストッパーボルトを堅固に締め付ける。","Ｖベルト駆動の送風機は、Ｖベルトが下側引張りとなるような回転方向とする。","設備機器に対する地震力の計算には、局部震度法や動的解析によるものがあるが、一般的に、局部震度法で行われている。"],"a":[2],"m":"exact","n":"","e":"防振基礎のストッパーボルトは機器との間に隙間を設けて取り付け、平常時の防振効果を損なわないようにする。堅く締め付けると防振にならない。","f":[],"o":["img/R7B05_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R7B06","y":"R7","p":"B","no":6,"s":"配管及び配管附属品の施工に関する記述のうち、適当でないものはどれか。","c":["突合せ溶接の開先にはＶ形開先、面取り、Ｉ形開先等があり、鋼管の管厚さが4mm以上の場合は、一般的に、Ｖ形開先とする。","鋼管の溶接部検査には目視検査のほかに、溶込み不足の確認としては、必要に応じ放射線透過検査を行う。","銅管の差込み接合は、銅管差込部の外面と管継手の受口にフラックスを薄く均一に塗布する。","排水管の満水試験は、系統中の最高開口部から下へ3mの配管を除き、30kPa以上の圧力で行う。"],"a":[3],"m":"exact","n":"","e":"フラックスは管の差込部外面にのみ薄く均一に塗布し、継手の受口内面には塗らない（余分なフラックスは腐食の原因）。","f":[],"o":["img/R7B06_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R7B07","y":"R7","p":"B","no":7,"s":"ダクト及びダクト附属品の施工に関する記述のうち、適当でないものはどれか。","c":["アングルフランジ工法ダクトは、フランジ接合部分の鉄板の折返しを5mm以上とする。","多翼送風機の吐出直後に風量調整ダンパーを取り付ける場合、風量調節ダンパーの軸が送風機の羽根車の軸に対して平行となるようにする。","コーナーボルト工法ダクトのフランジ押さえ金具は、再使用しない。","サプライチャンバーやレタンチャンバーの点検口の扉は、原則として、チャンバー内が負圧の場合は外開き、正圧の場合は内開きとする。"],"a":[2],"m":"exact","n":"","e":"吐出直後の風量調整ダンパーは、軸が送風機の羽根車の軸と「直角」になるように取り付け、偏流の影響を小さくする。","f":[],"o":["img/R7B07_o0.png"],"g":84,"cat":"B施工","neg":true},{"id":"R7B08","y":"R7","p":"B","no":8,"s":"保温、保冷、塗装に関する記述のうち、適当でないものはどれか。","c":["保温材相互の間隙はできる限り少なくし、重ね部の継目は同一線上に合わせて取り付ける。","ホルムアルデヒド放散量は、「Ｆ☆☆☆☆」のように表示され、☆の数が多いほどホルムアルデヒド放散量が少ないことを表す。","塗装場所の気温が5℃以下、湿度が85％以上、換気が十分でなく結露する等、塗料の乾燥に不適当な場合は、原則として、塗装を行ってはならない。","人造鉱物繊維保温材は、ガラス、石灰等から製造され、ロックウール保温材及びグラスウール保温材がある。"],"a":[1],"m":"exact","n":"","e":"保温材の重ね部の継目は同一線上を避け、ずらして取り付ける。","f":[],"o":["img/R7B08_o0.png"],"g":null,"cat":"B施工","neg":true},{"id":"R7B09","y":"R7","p":"B","no":9,"s":"腐食・防食に関する記述のうち、適当でないものはどれか。","c":["溝状腐食は、管の長手方向に溝状に連続して腐食損傷を受けるもので、電縫鋼管の突合せ溶接部に沿ってＶ字状に深く浸食されるものである。","蒸気配管に使用した配管用炭素鋼鋼管（黒）では、還水管より蒸気管（往き管）に腐食が発生しやすい。","蓄熱槽等の空気に開放された水槽が系内にない密閉系冷温水配管では、ほとんど酸素が供給されないので配管の腐食速度は遅い。","溶融めっきは、金属を高温で溶融させた槽内に被処理材を浸漬したのち引き上げ、被処理材の表面に金属被覆を形成させる防食方法である。"],"a":[2],"m":"exact","n":"","e":"蒸気配管では、凝縮水に溶け込んだ酸素や二酸化炭素により、還水管の方が腐食しやすい。","f":[],"o":["img/R7B09_o0.png"],"g":20,"cat":"B施工","neg":true},{"id":"R7B10","y":"R7","p":"B","no":10,"s":"建設工事における安全管理体制に関する記述のうち「労働安全衛生法」上、誤っているものはどれか。","c":["事業者は、選任した産業医に、労働者の健康管理等を行わせなければならない。","特定元方事業者は、選任した統括安全衛生責任者に、元方安全衛生管理者の指揮をさせなければならない。","統括安全衛生責任者を選任すべき事業者以外の請負人で、当該仕事を自ら行うものは、安全衛生管理者を選任しなければならない。","統括安全衛生管理者が統括管理しなければならない業務には、労働災害の原因の調査及び再発防止対策に関することがある。"],"a":[3],"m":"exact","n":"","e":"統括安全衛生責任者を選任すべき事業者以外の請負人で自ら仕事を行うものが選任するのは「安全衛生責任者」。","f":[],"o":["img/R7B10_o0.png"],"g":66,"cat":"B法規","neg":true},{"id":"R7B11","y":"R7","p":"B","no":11,"s":"建設工事における安全衛生管理に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","c":["事業者は、建築物の解体等の作業を行うときは、解体等対象建築物等の全ての材料について石綿等の使用の有無を調査しなければならない。","事業者は、可燃性ガス及び酸素を用いて行う金属の溶接、溶断又は加熱の業務に使用するガス等の容器は、温度を40℃以下に保たなければならない。","勾配が10度を超える架設通路には、踏桟その他の滑止めを設けなければならない。","事業者は、屋内に設ける通路については、通路面から高さ1.8m以内に障害物を置いてはならない。"],"a":[3],"m":"exact","n":"","e":"踏桟等の滑止めが必要なのは勾配が15度を超える架設通路。","f":[],"o":["img/R7B11_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R7B12","y":"R7","p":"B","no":12,"s":"労働に関する記述のうち、「労働基準法」上、誤っているものはどれか。","c":["労働基準法で定める基準に達しない労働条件であっても、その部分を労働契約に含めれば有効となる。","使用者は、労働契約に附随して貯蓄の契約をさせてはならない。","労働者が、退職の場合において、使用期間、業務の種類、その事業における地位、賃金又は退職の事由（退職の事由が解雇の場合にあっては、その理由を含む。）について証明書を請求した場合においては、使用者は、遅滞なくこれを交付しなければならない。","使用者は、満18才に満たない者について、その年齢を証明する戸籍証明書を事業場に備え付けなければならない。"],"a":[1],"m":"exact","n":"","e":"労働基準法の基準に達しない労働条件はその部分が無効となり、法の基準が適用される。契約に含めても有効にはならない。","f":[],"o":["img/R7B12_o0.png"],"g":22,"cat":"B法規","neg":true},{"id":"R7B13","y":"R7","p":"B","no":13,"s":"建築に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["避難階とは、直接地上へ通ずる出入口のある階をいう。","建築物の給水配管全体の更新のみを行う工事の場合は、建築の確認の申請書を提出しなくてよい。","共同住宅の共用の廊下に供する部分は、容積率算定の基礎となる延べ面積に算入しない。","建築物の壁や柱は主要構造部であるが、屋根は主要構造部ではない。"],"a":[4],"m":"exact","n":"","e":"主要構造部は壁・柱・床・はり・屋根・階段。屋根も主要構造部。","f":[],"o":["img/R7B13_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R7B14","y":"R7","p":"B","no":14,"s":"建築設備に関する記述のうち、「建築基準法」上、誤っているものはどれか。","c":["防火区画を貫通する天井又は壁内の隠ぺい部の風道に防火ダンパーを設ける場合は、一辺の長さが45cm以上の保守点検が容易に行える点検口並びに防火ダンパーの開閉及び作動状態を確認できる検査口を設ける。","換気設備の風道が準耐火構造の防火区画を貫通する部分に近接する部分に防火ダンパーを設ける場合、防火ダンパーと防火区画の間の風道は、厚さ1.5mm以上の鉄板とするか、又は鉄網モルタル塗その他の不燃材料で被覆する。","地上11階以上の建築物の屋上に2台の冷却塔（容量2,200kW以下）を設置する場合、冷却塔の間の距離については、間に防火上有効な隔壁が設けられている場合を除いて、2m以上とする。","建築物に設けるボイラーの煙突の地盤面からの高さは、ガスを使用するボイラーにあっては、6m以上とする。"],"a":[4],"m":"exact","n":"","e":"ボイラーの煙突は地盤面から15m以上とする（ガスを使用するボイラー等、告示で定めるものは適用除外）。6m以上という規定ではない。","f":[],"o":["img/R7B14_o0.png"],"g":23,"cat":"B法規","neg":true},{"id":"R7B15","y":"R7","p":"B","no":15,"s":"建設業の種類のうち、「建設業法」上、指定建設業に該当するものの組合せとして、正しいものはどれか。\nＡ：管工事業Ｂ：土木工事業Ｃ：水道施設工事業Ｄ：電気通信工事業","c":["ＡとＢ","ＡとＣ","ＢとＤ","ＣとＤ"],"a":[1],"m":"exact","n":"","e":"指定建設業は土木・建築・電気・管・鋼構造物・舗装・造園の7業種。管工事業と土木工事業が該当し、水道施設工事業・電気通信工事業は該当しない。","f":[],"o":["img/R7B15_o0.png"],"g":null,"cat":"B法規","neg":false},{"id":"R7B16","y":"R7","p":"B","no":16,"s":"建設工事における施工体制に関する記述のうち、「建設業法」上、誤っているものはどれか。","c":["施工体制台帳の作成を要する建設工事を請け負った建設業者は、当該建設工事における各下請負人の施工の分担関係を表示した施工体系図を作成しなければならない。","施工体制台帳の作成を要する建設工事を請け負った建設業者は、下請負人が請け負った建設工事に従事する者に関する事項として、氏名、性別及び住所を施工体制台帳に記載しなければならない。","監理技術者の専任が必要な建設工事で、選任された監理技術者は、発注者から請求があったときは、監理技術者資格者証を提示しなければならない。","主任技術者の専任が必要な建設工事で、密接な関係のある二つの建設工事を同一の建設業者が同一の場所で施工する場合は、同一の専任の主任技術者がこれらの建設工事を管理することができる。"],"a":[2],"m":"exact","n":"","e":"施工体制台帳に記載する従事者の事項は、氏名・生年月日・年齢・職種・社会保険の加入状況・資格等。性別や住所は求められていない。","f":[],"o":["img/R7B16_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R7B17","y":"R7","p":"B","no":17,"s":"易操作性1号消火栓を用いた屋内消火栓設備に関する記述のうち、「消防法」上、誤っているものはどれか。","c":["主配管の立上り管は、呼び径50mm以上のものとする。","消防用ホースのノズルは、容易に開閉できる装置付きとする。","加圧送水装置には、定格負荷運転時のポンプ性能を試験するための配管設備を設ける。","加圧送水装置の放水圧力は、消防用ホースのノズル先端において0.7MPaを超えるようにしなければならない。"],"a":[4],"m":"exact","n":"","e":"易操作性1号消火栓の放水圧力は0.17MPa以上0.7MPa以下。0.7MPaを超えないようにする。","f":[],"o":["img/R7B17_o0.png"],"g":25,"cat":"B法規","neg":true},{"id":"R7B18","y":"R7","p":"B","no":18,"s":"次の消防用設備等のうち、「消防法」上、消火活動上必要な施設に該当しないものはどれか。","c":["連結送水管","排煙設備","屋外消火栓設備","連結散水設備"],"a":[3],"m":"exact","n":"","e":"屋外消火栓設備は「消火設備」。消火活動上必要な施設は排煙設備・連結散水設備・連結送水管・非常コンセント設備・無線通信補助設備。","f":[],"o":["img/R7B18_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R7B19","y":"R7","p":"B","no":19,"s":"騒音の規制に関する記述のうち、「騒音規制法」上、誤っているものはどれか。\nただし、災害その他非常の事態の発生により当該特定建設作業を緊急に行う必要がある場合及び人の生命又は身体に対する危険を防止するため特に当該特定建設作業を行う必要がある場合を除く。","c":["建設工事として行われる作業のうち、2日以上にわたるびょう打機を使用する作業は、特定建設作業である。","指定地域内における特定建設作業が行われる場所において、特定建設作業に伴って騒音を発生させることができるのは、連続して10日までである。","指定地域内における特定建設作業の騒音は、特定建設作業の場所の敷地の境界線において、85dBを超えてはならない。","指定地域内において、特定建設作業を伴う建設工事を施工しようとする者が市町村長に届け出なければならない事項の中には、特定建設作業の場所及び実施の期間が含まれている。"],"a":[2],"m":"exact","n":"","e":"特定建設作業は、同一場所で連続6日を超えて行ってはならない。10日ではない。","f":[],"o":["img/R7B19_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R7B20","y":"R7","p":"B","no":20,"s":"「フロン類の使用の合理化及び管理の適正化に関する法律」の法律の目的に関する文中、 内に当てはまる用語の組合せとして、正しいものはどれか。この法律は、人類共通の課題であるオゾン層の保護及び地球温暖化の防止に積極的に取り組むことが重要であることに鑑み、オゾン層を破壊し又は地球温暖化に深刻な影響をもたらすフロン類の Ａ するため、フロン類の使用の合理化及び特定製品に使用されるフロン類の Ｂ に関する指針並びにフロン類及びフロン類使用製品の製造業者等並びに特定製品の管理者の責務等を定めるとともに、フロン類の使用の合理化及び特定製品に使用されるフロン類の Ｂ のための措置等を講じ、もって現在及び将来の国民の健康で文化的な生活の確保に寄与するとともに人類の福祉に貢献することを目的とする。","c":["使用を制限 製造の制限","使用を制限 管理の適正化","大気中への排出を抑制 製造の制限","大気中への排出を抑制 管理の適正化"],"a":[4],"m":"exact","n":"","e":"フロン排出抑制法の目的は、フロン類の「大気中への排出を抑制」するため、使用の合理化及び特定製品に使用されるフロン類の「管理の適正化」を図ること。","f":["img/R7B20_f0.png"],"o":["img/R7B20_o0.png"],"g":null,"cat":"B法規","neg":false},{"id":"R7B21","y":"R7","p":"B","no":21,"s":"産業廃棄物の処理に関する記述のうち、「廃棄物の処理及び清掃に関する法律」上、誤っているものはどれか。","c":["事業者が産業廃棄物の運搬又は処分を委託する場合において、委託契約書及び添付書面を保存しなければならない期間は、その契約の終了の日から3年間である。","建設工事に伴って発生したゴムくずは、安定型産業廃棄物である。","産業廃棄物管理票を交付された処分受託者が当該処分を終了したときは、当該管理票の交付の日から90日以内（特別管理産業廃棄物に係る管理票にあっては、60日以内）に管理票交付者に当該管理票の写しを送付しなければならない。","事業者は、自らその産業廃棄物（特別管理産業廃棄物を除く。）の運搬又は処分を行う場合には、産業廃棄物処理基準に従わなければならない。"],"a":[1],"m":"exact","n":"","e":"委託契約書及び添付書面の保存期間は、契約終了の日から5年間。","f":[],"o":["img/R7B21_o0.png"],"g":null,"cat":"B法規","neg":true},{"id":"R7B22","y":"R7","p":"B","no":22,"s":"公共工事における施工計画等に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["総合施工計画書は、受注者の責任において作成されるものであるため、設計図書に特記された事項についても監督員の承諾を受ける必要はない。","完成検査は、設計事務所の監理者検査、官庁検査を受ける前に、施主又はその代理人が事前の検査をすることである。","総合工程表は、現場の仮設工事から、完成時における試運転調整、後片付け、清掃までの全工程の予定を表すものである。","設計図書に品質が明示されていない工事材料の場合、中等の品質を有するものとする。"],"a":[1,2],"m":"exact","n":"","e":"⑴設計図書に特記された事項は、監督員の承諾を受ける必要がある。⑵完成検査は工事完成時に発注者側が行う検査。記述は受注者の社内（自主）検査の説明に近い。","f":[],"o":["img/R7B22_o0.png"],"g":81,"cat":"C応用能力","neg":true},{"id":"R7B23","y":"R7","p":"B","no":23,"s":"工程管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["工程表作成の検討時には、下請能力、資機材の製作日数、現場の安全確認等、施工全般との関連を考慮する。","ネットワーク工程表において、当該作業のフリーフロートを使用すると、後続作業に遅れが生じる。","ネットワーク工程表は、作業の関連性がはっきりとし、工事遅延した際の計画変更に対応しやすい。","ネットワーク工程表において工期短縮を検討する際、作業の順序入れ替えを行ってはいけない。"],"a":[2,4],"m":"exact","n":"","e":"⑵フリーフロートは使用しても後続作業に影響しない余裕。⑷作業順序の入替え（並行作業化）も工期短縮の有効な手段。","f":[],"o":["img/R7B23_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R7B24","y":"R7","p":"B","no":24,"s":"品質管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["管工事の品質は、設計図書によって、寸法、材質、適用される法規、JIS等が示され、下限が定められている。","ISO規格は、企業の品質システムが要求事項に照らして妥当であるかについて、第三者機関である審査登録機関がチェックすることで認証される。","抜取検査には、計数抜取検査と計量抜取検査があり、ダクトの板厚や寸法の検査を行う場合は計数抜取検査で確認する。","電線等の連続体や防火ダンパー用ヒューズの作動試験は、全数検査で確認する。"],"a":[3,4],"m":"exact","n":"","e":"⑶板厚や寸法など計量値で判定する検査は計量抜取検査。⑷電線等の連続体や、ヒューズの作動試験のような破壊検査は抜取検査とする。","f":[],"o":["img/R7B24_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R7B25","y":"R7","p":"B","no":25,"s":"建設工事における安全管理に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["地盤面への掘削で手掘りを行う場合、掘削面の高さは3mまでとし、3mを超えるときは土止め支保工を設ける。","建設工事に使用する高さ8m以上の登り桟橋には、高さ7m以内ごとに踊場を設ける。","建設業の三大災害とは「墜落・転落災害」「建設機械・クレーン等災害」「倒壊・崩落災害」のことをいう。","安全データシート（SDS）は、化学物質等を使用する際の安全性を確保するため、取り扱う側から供給者側に危険性・有害性に関する情報を報告するためのものである。"],"a":[1,4],"m":"exact","n":"","e":"⑴手掘り掘削の掘削面の高さ・勾配は地山の種類ごとに定められている（例：岩盤・堅い粘土は5m未満で90度以下）。一律に3mまでとする規定ではない。⑷SDSは供給者側から取り扱う側へ情報を提供するもの。向きが逆。","f":[],"o":["img/R7B25_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R7B26","y":"R7","p":"B","no":26,"s":"機器の据付けに関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["2台の冷却塔を近接して設置する場合、ルーバー面の高さの1.5倍以上離して設置する。","接着系あと施工アンカーの打設間隔は、呼び径の8倍以上を標準とする。","横型ポンプを2台以上並べて設置する場合、各ポンプ基礎の間隔は、一般的に、500mm以上とする。","機器側のアンカーボルト用の穴径は、アンカーボルト呼び径の+2mm程度がよい。"],"a":[1,2],"m":"exact","n":"","e":"⑴冷却塔を近接して並べる場合は、排気の再吸込み（ショートサーキット）を防ぐため、ルーバー面の高さの1.5倍では足りず、一般に2倍以上離す。⑵接着系あと施工アンカーの打設間隔は、呼び径の10倍以上を標準とする。","f":[],"o":["img/R7B26_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R7B27","y":"R7","p":"B","no":27,"s":"配管及び配管附属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["通気管末端の通気口は、外気取入れ口や窓等の開口部の上端より600mm以上立ち上げる。","揚水管の水圧試験は、ポンプの全揚程に相当する2倍の圧力（最小0.75MPa）とし、最小保持時間は60分とする。","強制循環式の上向き給湯配管の場合、給湯管と返湯管は、ともに先上り勾配とする。","冷凍機の冷水出口配管には、ストレーナを取り付ける。"],"a":[3,4],"m":"exact","n":"","e":"⑶上向き給湯配管では、給湯管は先上り、返湯管は先下り勾配とする。⑷ストレーナは冷凍機の冷水「入口」側配管に取り付け、機器内に異物が入らないようにする。","f":[],"o":["img/R7B27_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R7B28","y":"R7","p":"B","no":28,"s":"ダクト及びダクト附属品の施工に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["アングルフランジ工法では、低圧ダクトと高圧ダクトのダクトの吊り間隔は同じである。","低圧ダクトは、通常の運転時におけるダクト内圧が、−980Paから+980Paの範囲内で使用する。","亜鉛鉄板製スパイラルダクトは、亜鉛鉄板をらせん状に甲はぜ機械掛けしたもので、高圧ダクトには使用できない。","亜鉛鉄板製の排煙ダクトと排煙機の接続は、原則として、たわみ継手等を介さずに、直接フランジ接合とする。"],"a":[2,3],"m":"exact","n":"","e":"⑵低圧ダクトの常用圧力は±500Pa以内。⑶スパイラルダクトは高圧ダクトにも使用できる。","f":[],"o":["img/R7B28_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R7B29","y":"R7","p":"B","no":29,"s":"ボイラーの試運転調整に関する記述のうち、適当でないものはどれか。適当でないものは二つあるので、二つとも答えなさい。","c":["蒸気ボイラーの試運転では、低水位燃焼遮断装置用の水位検出器の水位を上げることにより、バーナーが停止し、警報装置が作動することを確認する。","蒸気ボイラーの試運転では、火炎監視装置の前面をふさぎ、始動時の不着火、燃焼中の失火でバーナーが停止することを確認する。","温水ボイラーの試運転では、温水入口及び温水出口の弁を閉じて循環ポンプを起動する。","温水ボイラーの試運転では、缶体に水を張り、水高計により圧力を確認する。"],"a":[1,3],"m":"exact","n":"","e":"⑴低水位燃焼遮断装置は、水位を「下げる」ことでバーナー停止・警報作動を確認する。⑶温水ボイラーは温水出入口の弁を開けてから循環ポンプを起動する。","f":[],"o":["img/R7B29_o0.png"],"g":null,"cat":"C応用能力","neg":true},{"id":"R8A01","y":"R8","p":"A","no":1,"s":"北緯35度の地点の夏至の日における、終日の直達日射量の最も大きいものとして、適当なものはどれか。\nただし、終日快晴とし、日射を遮る要素はないものとする。なお、北緯35度線が通る都市としては、京都市、南房総市等がある。","c":["南向き鉛直面","東向き鉛直面","北東向き鉛直面","北向き鉛直面"],"a":[2],"m":"exact","n":"","e":"北緯35度の夏至の日の終日直達日射量は、水平面が最大で、鉛直面では東向き・西向きが大きく、南向きは太陽高度が高いため小さい。選択肢では東向き鉛直面が最大。","f":[],"o":["img/R8A01_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R8A02","y":"R8","p":"A","no":2,"s":"水平な円管の直管部を流体が流れている場合、「管摩擦係数」、「管内径」及び「平均流速」の組合せのうち、単位長さ当たりの圧力損失が最も大きいものとして、適当なものはどれか。\nただし、他の条件は同じとし、圧力損失はダルシー・ワイスバッハの式によるものとする。\n［管摩擦係数］ ［管内径（mm）］ ［平均流速（m/s）］","c":["0.02 200 1.0","0.02 300 1.5","0.03 200 1.5","0.03 300 1.0"],"a":[3],"m":"exact","n":"","e":"単位長さ当たりの圧力損失∝λv²/d。⑴0.02×1.0²/0.2＝0.10、⑵0.02×1.5²/0.3＝0.15、⑶0.03×1.5²/0.2≒0.34、⑷0.03×1.0²/0.3＝0.10で⑶が最大。","f":[],"o":["img/R8A02_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R8A03","y":"R8","p":"A","no":3,"s":"下図に示す水平な円管内を空気が流れている場合、断面Ｂにおける風速として、適当なものはどれか。\nただし、断面Ａにおける管の内径は200mm、風速は2m/s、断面Ｂにおける管の内径は100mmとし、空気は非圧縮性かつ等温で、それぞれの断面内での各部の風速は等しいものとする。","c":["1m/s","2m/s","4m/s","8m/s"],"a":[4],"m":"exact","n":"","e":"連続の式（風量一定）より風速は断面積（内径の2乗）に反比例：2×(200/100)²＝8m/s。","f":["img/R8A03_f0.png"],"o":["img/R8A03_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R8A04","y":"R8","p":"A","no":4,"s":"流体に関する記述のうち、適当でないものはどれか。","c":["ベルヌーイの定理は、流体の持っている運動エネルギー、重力による位置エネルギー及び圧力によるエネルギーの総和が流線に沿って一定に保たれることを示している。","レイノルズ数は、慣性力と粘性力の比で表される無次元数であり、層流と乱流の判定の目安となる。","ポンプ及び配管系に外部から強制的な力が与えられていないにもかかわらず、流体の流量と圧力が周期的に変動する現象を、ウォーターハンマーという。","流動する液体が局部的にその温度での飽和蒸気圧以下となり気泡が発生する現象を、キャビテーションという。"],"a":[3],"m":"exact","n":"","e":"記述はサージング。ウォーターハンマーは弁の急閉などで流速が急変したとき圧力波が生じる現象。","f":[],"o":["img/R8A04_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R8A05","y":"R8","p":"A","no":5,"s":"熱に関する記述のうち、適当でないものはどれか。","c":["カルノーサイクルの熱効率は、高温熱源と低温熱源の温度比の二乗に比例する。","断熱状態において不可逆変化が生じると、エントロピーは増加する。","異なる2種類の金属線の両端同士を接合して作った回路において、直流電流を流すと、一方の接合点の温度が下がり、他方の接合点の温度が上がる。","気体では、定圧比熱は定容比熱より大きい。"],"a":[1],"m":"exact","n":"","e":"カルノーサイクルの熱効率は1－T₂/T₁で、高温・低温熱源の絶対温度の比で決まる。温度比の2乗に比例するのではない。","f":[],"o":["img/R8A05_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R8A06","y":"R8","p":"A","no":6,"s":"下図に示す等質な材料でできた両面が平行な平面壁内を、高温側壁面から低温側壁面へ壁を通して2秒間で移動する熱量が32Jの場合、壁の熱伝導率の値として適当なものはどれか。\nただし、高温側壁面と低温側壁面の温度差は5K、壁の表面積は各2m²、厚さは1mとする。","c":["0.4W/（m・K）","1.6W/（m・K）","6.4W/（m・K）","25.6W/（m・K）"],"a":[2],"m":"exact","n":"","e":"熱流量＝32J÷2s＝16W。16＝λ×2m²×5K÷1m より λ＝1.6W/(m・K)。","f":["img/R8A06_f0.png"],"o":["img/R8A06_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R8A07","y":"R8","p":"A","no":7,"s":"下図に示す湿り空気線図において、状態点Ａの空気が熱交換器の表面に十分に接触し、その空気の露点温度より低い温度まで冷却された場合、熱交換器の表面に接する空気層の状態点として、適当なものはどれか。","c":["①","②","③","④"],"a":[3],"m":"exact","n":"","e":"露点温度より低く冷却されると、熱交換器表面に接する空気層は表面温度における飽和空気となり、飽和空気線上の点（③）で表される。","f":["img/R8A07_f0.png"],"o":["img/R8A07_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R8A08","y":"R8","p":"A","no":8,"s":"下図は、温室効果ガスである二酸化炭素、メタン、一酸化二窒素及びハイドロフルオロカーボン類（HFCs）の日本の排出量の算定値（CO₂換算）の1990年度から2023年度（ただし、HFCsは1990年から2023年）までの推移である。二酸化炭素の排出量の算定値（CO₂換算）の推移を表したものとして、適当なものはどれか。なお、下図は、環境省が発表した日本の温室効果ガスの排出量の算定値（CO₂換算）を用いて、作成したものである。","c":["①","②","③","④"],"a":[1],"m":"exact","n":"","e":"CO₂は温室効果ガス排出量の大半を占め、2013年度頃をピークに減少傾向にある①。","f":["img/R8A08_f0.png"],"o":["img/R8A08_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R8A09","y":"R8","p":"A","no":9,"s":"冬季の外壁に接する室における室内側壁面の表面結露に関する記述のうち、適当でないものはどれか。","c":["外壁2面に接する隅の部分は、一般的に、中央部より結露を生じやすい。","天井から温風を吹出す暖房をしている室内では、一般的に、天井付近に比べて、床付近の方が結露を生じやすい。","室内空気の流動が少なくなると、結露を生じやすくなる。","外壁に断熱材を設けると、熱通過率が小さくなるため、結露を生じやすくなる。"],"a":[4],"m":"exact","n":"","e":"外壁に断熱材を設けると熱通過率が小さくなり、室内側表面温度が上がるため、結露は生じにくくなる。","f":[],"o":["img/R8A09_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R8A10","y":"R8","p":"A","no":10,"s":"音、振動及び腐食に関する記述のうち、適当でないものはどれか。","c":["NC曲線で示される音圧レベルの許容値は、周波数が高いほど小さい。","金属バネより防振ゴムの方が、加振力の振動数が低い系の防振材料として適している。","酸素を含む水中での鉄の腐食速度は、水温の影響を受ける。","水中でイオン化傾向が異なる金属を接触させた場合、イオン化傾向が大きい金属の方が腐食しやすい。"],"a":[2],"m":"exact","n":"","e":"加振力の振動数が低い系には、固有振動数を低くできる金属ばねが適している。防振ゴムは比較的高い振動数に適する。","f":[],"o":["img/R8A10_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R8A11","y":"R8","p":"A","no":11,"s":"低圧三相誘導電動機の保護に用いられる保護継電器（2Eリレー）の保護目的として、適当なものはどれか。","c":["過負荷保護及び欠相保護","過負荷保護及び短絡保護","欠相保護及び反相保護","短絡保護及び反相保護"],"a":[1],"m":"exact","n":"","e":"2Eリレー（2要素保護継電器）は過負荷保護と欠相保護を行う。","f":[],"o":["img/R8A11_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":false},{"id":"R8A12","y":"R8","p":"A","no":12,"s":"工事後に点検できなくなる隠ぺい場所に低圧屋内配線を施設する工事として、適当でないものはどれか。\nただし、事務所ビル内の乾燥した場所（湿気の多い場所又は水気のある場所ではない。）に施設するものとする。","c":["合成樹脂管（PF管）工事","ライティングダクト工事","ケーブル工事","金属可とう電線管工事"],"a":[2],"m":"exact","n":"","e":"ライティングダクト工事は、点検できない隠ぺい場所には施設できない。","f":[],"o":["img/R8A12_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R8A13","y":"R8","p":"A","no":13,"s":"鉄筋コンクリート造の建築物に関する記述のうち、適当でないものはどれか。","c":["耐震壁は、地震に対して有効であり、バランスよく配置しなければならない。","鉄筋とコンクリートは、常温では線膨張係数がほぼ等しく、付着性がよい。","ラーメン構造は、柱と梁の接合部をピン接合とした構造形式である。","構造体は、建築物に作用する荷重及び外力に対して安全な構造とする。"],"a":[3],"m":"exact","n":"","e":"ラーメン構造は柱と梁の接合部を剛接合とした構造形式。ピン接合ではない。","f":[],"o":["img/R8A13_o0.png"],"g":82,"cat":"A基礎・電気・建築","neg":true},{"id":"R8A14","y":"R8","p":"A","no":14,"s":"鉄筋コンクリート造の建築物の梁に関する記述のうち、適当でないものはどれか。","c":["梁の主筋は、梁の材軸方向に配する。","梁貫通孔が並列する場合は、その中心間隔は梁貫通孔の径の平均値の3倍以上とする。","主筋を引張側だけに入れる梁を単筋梁、引張側と圧縮側に入れる梁を複筋梁という。","梁貫通孔の径は、梁せいの1/2以下とする。"],"a":[4],"m":"exact","n":"","e":"梁貫通孔の径は、梁せいの1/3以下とする。","f":[],"o":["img/R8A14_o0.png"],"g":null,"cat":"A基礎・電気・建築","neg":true},{"id":"R8A15","y":"R8","p":"A","no":15,"s":"省エネルギーを目的とする空調計画に関する記述として、適当でないものはどれか。","c":["予冷予熱時に、最大限の外気を取り入れるように制御する。","空調対象室のCO₂濃度を計測し、外気取入れ量を制御する。","熱源機器を適切な容量・台数に分割し台数制御を行う。","冷温水の大温度差空調システムを採用し、ポンプの搬送動力を削減する。"],"a":[1],"m":"exact","n":"","e":"予冷・予熱時は外気を取り入れない（外気遮断）ことで、立上り時の熱負荷を減らす。","f":[],"o":["img/R8A15_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R8A16","y":"R8","p":"A","no":16,"s":"空気調和方式に関する記述のうち、適当でないものはどれか。","c":["定風量単一ダクト方式は、各空調対象室間で時刻別負荷変動パターンが異なる場合、各室内温度のアンバランスが生じやすい。","ペリメーター空気処理方式は、コールドドラフトの防止に有効である。","変風量単一ダクト方式に用いる変風量（VAV）ユニットは、試運転時の風量調整が行いやすい。","床吹出し方式は、暖房運転時の居住域における垂直方向の温度差が大きい。"],"a":[4],"m":"exact","n":"","e":"床吹出し方式は暖房時に足元から温風を供給するため、居住域の上下温度差は小さい。","f":[],"o":["img/R8A16_o0.png"],"g":6,"cat":"A空調","neg":true},{"id":"R8A17","y":"R8","p":"A","no":17,"s":"下図に示す冷房時の湿り空気線図における空気調和機のコイルの冷却負荷の値として適当なものはどれか。\nただし、送風量は9,000m³/h、空気の密度は1.2kg/m³とする。","c":["42kW","57kW","60kW","75kW"],"a":[3],"m":"exact","n":"","e":"冷却負荷＝(9,000×1.2÷3,600)×(66－46)＝3×20＝60kW。","f":["img/R8A17_f0.png"],"o":["img/R8A17_o0.png"],"g":3,"cat":"A空調","neg":false},{"id":"R8A18","y":"R8","p":"A","no":18,"s":"変風量単一ダクト方式の自動制御設備において、「制御する機器」と「検出要素」の組合せとして、適当でないものはどれか。\n［制御する機器］ ［検出要素］","c":["空気調和機の冷温水コイルの制御弁 空気調和機の給気温度","空気調和機の給気用送風機 外気温度","加湿器 還気ダクト内の空気湿度","変風量（VAV）ユニット 室内温度"],"a":[2],"m":"exact","n":"","e":"給気用送風機の制御（変風量）に用いる検出要素は給気ダクト内の静圧。外気温度ではない。","f":[],"o":["img/R8A18_o0.png"],"g":1,"cat":"A空調","neg":true},{"id":"R8A19","y":"R8","p":"A","no":19,"s":"熱負荷に関する記述のうち、適当でないものはどれか。","c":["暖房負荷計算では、一般的に、土間床及び地中壁からの熱負荷を見込む。","人体からの発生熱量は、室内温度が変わっても全発熱量はほとんど変わらないが、室温が上がるほど顕熱量が小さくなり、潜熱量が大きくなる。","冷房負荷計算では、窓ガラスを通過する熱負荷は、太陽日射熱のみを見込む。","日射及び夜間放射の影響を受ける外壁の熱負荷計算は、一般的に、実効温度差を用いる。"],"a":[3],"m":"exact","n":"","e":"窓ガラスからの熱負荷には、日射熱に加えて室内外温度差による貫流熱も見込む。","f":[],"o":["img/R8A19_o0.png"],"g":null,"cat":"A空調","neg":true},{"id":"R8A20","y":"R8","p":"A","no":20,"s":"地域冷暖房に関する記述のうち、適当でないものはどれか。","c":["地域冷暖房の熱需用者側の建物は、熱源機器の設置が不要なため床面積の利用率が高くなる。","地域冷暖房は、発電設備を併設することにより、これの排熱を利用することができる。","地域冷暖房とは、1箇所又は数箇所の熱源プラントから、地域内の多種・多数の施設等に、蒸気、温水あるいは冷水等の熱媒を、配管を通じて供給するものである。","地域冷暖房を計画する際は、冷暖房の使用時間帯が同じような需要者を広く求める必要がある。"],"a":[4],"m":"exact","n":"","e":"地域冷暖房は、使用時間帯の異なる需要者を組み合わせることで負荷が平準化し効率が上がる。","f":[],"o":["img/R8A20_o0.png"],"g":85,"cat":"A空調","neg":true},{"id":"R8A21","y":"R8","p":"A","no":21,"s":"蓄熱方式に関する記述のうち、適当でないものはどれか。","c":["蓄熱槽を利用した空調方式は、ピークカットによる熱源機器の容量を低減することができる。","二次側配管系を開放回路とした場合、密閉回路に比べてポンプ揚程が小さくなる。","水蓄熱槽には、建物の二重スラブ内等を利用する完全混合型、水深の深い水槽を用いる温度成層型等がある。","氷蓄熱方式は、氷の融解潜熱を利用するため、水蓄熱方式に比べて蓄熱槽容量を小さくできる。"],"a":[2],"m":"exact","n":"","e":"開放回路では実揚程が加わるため、密閉回路よりポンプ揚程は「大きく」なる。","f":[],"o":["img/R8A21_o0.png"],"g":26,"cat":"A空調","neg":true},{"id":"R8A22","y":"R8","p":"A","no":22,"s":"在室人員30人の居室の二酸化炭素濃度を1.0×10⁻³m³/m³以下に保つために、必要な最小換気量として、適当なものはどれか。\nただし、外気中の二酸化炭素濃度は0.4×10⁻³m³/m³、人体からの二酸化炭素発生量は0.02m³/（h・人）とする。","c":["600m³/h","800m³/h","1,000m³/h","1,200m³/h"],"a":[3],"m":"exact","n":"","e":"Q＝(30×0.02)÷(1.0×10⁻³－0.4×10⁻³)＝0.6÷0.0006＝1,000m³/h。","f":[],"o":["img/R8A22_o0.png"],"g":2,"cat":"A換気・排煙","neg":false},{"id":"R8A23","y":"R8","p":"A","no":23,"s":"換気に関する記述のうち、適当でないものはどれか。","c":["密閉式燃焼器具のみを設けた室には、火気を使用する室としての換気設備を設けなくてよい。","誘引誘導換気システムは、一般的に、地下駐車場等の極めて広い範囲を第一種機械換気するときに使用される。","ボイラー室の換気は、室内発熱を除去するため、第三種機械換気方式とする。","開放式燃焼器具のフードにⅡ型フードを用いる場合、火源からフード下端までの高さは1m以内としなければならない。"],"a":[3],"m":"exact","n":"","e":"ボイラー室は燃焼用空気の確保が必要なため、第一種機械換気方式とする。第三種（排気のみ）では室が負圧となり燃焼に支障が出る。","f":[],"o":["img/R8A23_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R8A24","y":"R8","p":"A","no":24,"s":"下図に示す2階建ての建築物の機械排煙設備において、各部が受け持つ必要最小排煙風量として、適当でないものはどれか。\nただし、本設備は「建築基準法」の避難安全検証法（区画、階、全館）及び特殊な構造によらないものとする。また、上下階の排煙口は同時開放しないものとし、隣接する2防煙区画は同時開放の可能性があるものとする。","c":["ダクトＡ部：24,000m³/h","ダクトＢ部：27,000m³/h","ダクトＣ部：42,000m³/h","排煙機 ：54,000m³/h"],"a":[2],"m":"exact","n":"","e":"ダクトB部（1階全体を受け持つ）は隣接2区画の同時開放：400＋450＝850m³/min＝51,000m³/hが必要で、27,000m³/hでは不足。","f":["img/R8A24_f0.png"],"o":["img/R8A24_o0.png"],"g":29,"cat":"A換気・排煙","neg":true},{"id":"R8A25","y":"R8","p":"A","no":25,"s":"機械排煙設備に関する記述のうち、適当でないものはどれか。\nただし、本設備は「建築基準法」の避難安全検証法（区画、階、全館）及び特殊な構造によらないものとする。","c":["排煙口は、防煙区画の各部分から水平距離で50m以下となるように設ける。","排煙口は、避難方向と煙の流れが反対になるように設ける。","排煙口は、不燃材料とする。","排煙口の手動開放装置を壁に設ける場合、手で操作する部分の高さは、床面から80cm以上1.5m以下の高さとする。"],"a":[1],"m":"exact","n":"","e":"排煙口は防煙区画の各部分から水平距離30m以下となるように設ける。","f":[],"o":["img/R8A25_o0.png"],"g":null,"cat":"A換気・排煙","neg":true},{"id":"R8A26","y":"R8","p":"A","no":26,"s":"上水道の浄水施設に関する記述のうち、適当でないものはどれか。","c":["凝集池の混和池では、フロックを大きく成長させるため、かく拌しない。","沈殿池は、フロックを沈殿除去し、ろ過池の負荷を軽くする池である。","ろ過池は、原水をろ過する速度によって、緩速ろ過池、急速ろ過池がある。","高度浄水処理には、活性炭処理、オゾン処理、生物処理等が用いられる。"],"a":[1],"m":"exact","n":"","e":"混和池では凝集剤を急速かく拌で十分に混和させ、続くフロック形成池で緩速かく拌してフロックを成長させる。","f":[],"o":["img/R8A26_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R8A27","y":"R8","p":"A","no":27,"s":"下水道に関する記述のうち、適当でないものはどれか。","c":["分流式の汚水管きょは、合流式の管きょに比べ小口径のため、管きょの勾配が急になり埋設が深くなる場合がある。","管きょは、固形物の停滞を防ぐため、流量が大きくなる下流ほど勾配が急になるようにする。","硬質塩化ビニル管等の可とう性がある管きょの基礎は、自由支承の砂又は砕石基礎としてよい。","分流式の下水道において、管きょ内の計画下水量に対する最小流速は、汚水管きょに比べて雨水管きょの方が大きい。"],"a":[2],"m":"exact","n":"","e":"管きょの勾配は、下流ほど流量が増えるため「緩やか」にし、流速は下流ほど漸増させる。","f":[],"o":["img/R8A27_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R8A28","y":"R8","p":"A","no":28,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["負荷流量の算定に使用される器具の同時使用率は、同一の設置器具数が多くなるほど低くなる。","水道用直結加圧形ポンプユニットの給水量は、時間平均予想給水量とする。","受水タンクの有効容量は、一般的に、1日使用水量の半分程度とする。","逆サイホン作用は、水受け容器中に吐出された水等が、給水管内に生じた負圧により管内に逆流することである。"],"a":[2],"m":"exact","n":"","e":"水道用直結加圧形ポンプユニットの給水量は、瞬時最大予想給水量とする。","f":[],"o":["img/R8A28_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R8A29","y":"R8","p":"A","no":29,"s":"給水設備に関する記述のうち、適当でないものはどれか。","c":["大便器の器具給水負荷単位は、ロータンク方式より洗浄弁方式の方が小さい。","揚水管の横引き配管が長くなる場合、水柱分離が生じないように下層階で横引きをする。","受水タンクにおいて、地震時に水面が波動を起こし、水の自由表面がタンクの天井面や側面に衝突する現象をスロッシングという。","飲料用給水配管と空調配管を弁を介して接続する場合、クロスコネクションに該当する。"],"a":[1],"m":"exact","n":"","e":"大便器の器具給水負荷単位は、瞬時流量の大きい洗浄弁方式の方がロータンク方式より大きい。","f":[],"o":["img/R8A29_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R8A30","y":"R8","p":"A","no":30,"s":"中央式給湯設備に関する記述のうち、適当でないものはどれか。","c":["下向き循環方式の場合、配管の空気抜きを考慮して、給湯管、返湯管とも先下り勾配とする。","密閉式膨張タンクの給湯系統への接続位置は、給水管が貯湯タンクへ接続される直近とする。","給湯用循環ポンプの循環湯量は、循環配管路の熱損失と許容温度降下等により決定する。","給湯用循環ポンプの揚程は、貯湯タンクと最高所の給湯栓との高低差により決定する。"],"a":[4],"m":"exact","n":"","e":"給湯循環ポンプの揚程は、循環経路（最長の循環管路）の摩擦損失から決める。高低差では決まらない。","f":[],"o":["img/R8A30_o0.png"],"g":41,"cat":"A衛生","neg":true},{"id":"R8A31","y":"R8","p":"A","no":31,"s":"排水設備に関する記述のうち、適当でないものはどれか。","c":["排水ポンプの容量は、排水槽への排水流入量がほぼ一定の場合、毎時平均排水流入量の1.2～1.5倍程度とする。","排水ポンプは、2台一組とし、平常時は2台交互運転、非常時は2台同時運転ができるようにすることが望ましい。","汚物用水中モーターポンプは、53mmの球形固形物を排出できるものとする。","雑排水用水中モーターポンプは、地下からの湧水、空調機の排水等の固形物をほとんど含まない水を排出するためのポンプである。"],"a":[4],"m":"exact","n":"","e":"固形物をほとんど含まない湧水や空調排水を排出するのは「汚水用」ポンプ。雑排水用は厨房排水など小さな固形物を含む排水用。","f":[],"o":["img/R8A31_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R8A32","y":"R8","p":"A","no":32,"s":"排水・通気設備に関する記述のうち、適当でないものはどれか。","c":["管径100mmの延長が長い排水横走り管の掃除口の設置間隔は、15m以内とする。","通気弁は、大気に開放された伸頂通気管のように正圧緩和の効果も期待できる。","排水トラップの封水深とは、トラップのあふれ面とトラップの水底面頂部との間の垂直距離をいう。","ループ通気管の管径は、その排水横枝管と通気立て管の管径のうち、いずれか小さい方の1/2以上とする。"],"a":[2],"m":"exact","n":"","e":"通気弁は負圧時に空気を吸い込むだけで、正圧緩和の効果はない。","f":[],"o":["img/R8A32_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R8A33","y":"R8","p":"A","no":33,"s":"排水設備に関する記述のうち、適当でないものはどれか。","c":["自己サイホン作用とは、トラップのあふれ縁に毛髪や糸くず等が垂れ下がっていると、徐々にトラップ封水が吸い出されていく現象である。","排水槽は、定期的に清掃する必要があるため、保守点検用のマンホールを設ける。","器具排水口からトラップのあふれ面までの垂直距離は、600mmを超えないようにする。","排水槽の吸込ピットは、排水用水中モーターポンプ吸込部の周囲及び下部に200mm以上の間隔を持たせる。"],"a":[1],"m":"exact","n":"","e":"記述は毛管作用。自己サイホン作用は器具自身の排水でトラップ内が満流となり封水が引き出される現象。","f":[],"o":["img/R8A33_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R8A34","y":"R8","p":"A","no":34,"s":"スプリンクラー設備に関する記述のうち、適当でないものはどれか。","c":["開放型スプリンクラーヘッドを用いたスプリンクラー設備は、火災感知器等と連動して作動するか、又は手動で一斉開放弁を開いて放水する。","閉鎖型スプリンクラーヘッドを用いた予作動式スプリンクラー設備は、流水検知装置の二次側配管内を加圧空気で満たしている。","閉鎖型スプリンクラーヘッドを用いた乾式スプリンクラー設備は、冬期に凍結の恐れがある部分等に用いられる。","閉鎖型スプリンクラーヘッドを用いた湿式スプリンクラー設備は、ヘッドと火災感知器等の両方が作動しない限り放水しない。"],"a":[4],"m":"exact","n":"","e":"閉鎖型湿式スプリンクラーはヘッドの作動のみで放水する。ヘッドと感知器の両方の作動で放水するのは予作動式。","f":[],"o":["img/R8A34_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R8A35","y":"R8","p":"A","no":35,"s":"ガス設備に関する記述のうち、適当でないものはどれか。","c":["LPガスのガス漏れ警報器は、ガス燃焼器具のある室の天井面が0.6m以上の梁等により区画されている場合は、燃焼器側の天井面から下方0.3m以内に設置する。","LPガスのバルク供給方式のバルク貯槽は、地盤面に対して固定し移動ができないものである。","液化天然ガス（LNG）は、無色・無臭の液体であり、硫黄分やその他の不純物を含んでいない。","都市ガスの引込み管内径が70mm以上となる建物では、引込み管ガス遮断装置を設置する。"],"a":[1],"m":"exact","n":"","e":"LPGは空気より重いため、警報器の検知部は燃焼器から水平距離4m以内、かつ上端が床面から0.3m以内に設ける。天井面・梁の規定は空気より軽い都市ガスの場合。","f":[],"o":["img/R8A35_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R8A36","y":"R8","p":"A","no":36,"s":"JISに規定する「建築物の用途別による屎尿浄化槽の処理対象人員算定基準」に定められている「建築用途」と「算定単位」の組合せとして、適当でないものはどれか。\n［建築用途］ ［算定単位］","c":["工場 定員（人）","飲食店 延べ面積（m²）","高等学校 教室数（室）","ホテル 延べ面積（m²）"],"a":[3],"m":"exact","n":"","e":"高等学校の処理対象人員の算定単位は定員〔人〕（n＝0.25P）。教室数ではない。","f":[],"o":["img/R8A36_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R8A37","y":"R8","p":"A","no":37,"s":"浄化槽に関する記述のうち、適当でないものはどれか。","c":["合併処理の二次処理工程では、微生物を利用した生物学的処理方式が採用され、生物膜法と活性汚泥法に大別される。","生物膜法は、接触材の表面に付着した生物膜により、浄化する方式である。","浄化槽の設置は風通しの良い場所とし、積雪寒冷地を除き、車庫、建築物内への設置は避ける。","生物膜法には、長時間ばっ気方式と回転板接触方式がある。"],"a":[4],"m":"exact","n":"","e":"長時間ばっ気方式は活性汚泥法（浮遊生物法）。生物膜法には接触ばっ気方式、回転板接触方式、散水ろ床方式などがある。","f":[],"o":["img/R8A37_o0.png"],"g":null,"cat":"A衛生","neg":true},{"id":"R8A38","y":"R8","p":"A","no":38,"s":"空気調和機に関する記述のうち、適当でないものはどれか。","c":["デシカント空気調和機は、建物からの排熱を導入外気と熱交換させる全熱交換器を機内に備えたものである。","ユニット形空気調和機の冷温水兼用コイルは、一般的に、コイル面通過風速を2.5m/s以下として選定する。","大温度差送風方式の空気調和機は、冷房時の送風温度差を大きくとることで送風量を減らし、送風搬送動力を削減するものである。","潜熱・顕熱分離形のユニット形空気調和機は、外気負荷を処理するコイルと室内負荷を処理するコイルを機内に備えたものである。"],"a":[1],"m":"exact","n":"","e":"デシカント空気調和機は、吸着剤（デシカントロータ）で空気中の水分を吸着して除湿するもの。全熱交換器を備えた空調機ではない。","f":[],"o":["img/R8A38_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R8A39","y":"R8","p":"A","no":39,"s":"冷却塔に関する記述のうち、適当でないものはどれか。","c":["密閉形冷却塔は、開放形冷却塔に比べて熱交換器等の空気抵抗が大きくなるため、送風機動力が大きくなる。","外気温度が低い冬期に冷却塔を運転する場合、白煙防止対策として、冷却塔の吹出し空気を加熱してから大気に放出する方法等がある。","冷却水のスケールは、補給水中のカルシウム等の硬度成分が濃縮されて塩類が析出したもので、連続的なブロー等により、スケール障害を抑制する。","レンジとは、冷却塔出口空気と入口空気の温度差をいう。"],"a":[4],"m":"exact","n":"","e":"冷却塔のレンジは、冷却水の入口水温と出口水温の差。空気の温度差ではない。","f":[],"o":["img/R8A39_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R8A40","y":"R8","p":"A","no":40,"s":"保温及び保冷に関する記述のうち、適当でないものはどれか。","c":["ロックウール保温材のブランケットは、密度により1号と2号に区分される。","ポリスチレンフォーム保温材は、主に防露や保冷用として使われる。","人造鉱物繊維保温材には、ロックウール保温材とグラスウール保温材があり、ロックウール保温材の方が使用温度の上限が低い。","ポリスチレンフォーム保温材は、独立気泡体を有しており、吸水・吸湿がほとんどないので、水分による断熱性能の低下が小さい。"],"a":[3],"m":"exact","n":"","e":"ロックウール保温材の方がグラスウール保温材より使用温度の上限が高い。","f":[],"o":["img/R8A40_o0.png"],"g":86,"cat":"A機材・設計図書・約款","neg":true},{"id":"R8A41","y":"R8","p":"A","no":41,"s":"配管材料及び配管附属品に関する記述のうち、適当でないものはどれか。","c":["水道用亜鉛めっき鋼管は、配管用炭素鋼鋼管の白管に比べて亜鉛の付着量が多い。","水道用硬質塩化ビニルライニング鋼管の使用に適した流体の温度は、60℃以下である。","配管用炭素鋼鋼管の最高使用圧力は、1.0MPa程度である。","脱亜鉛腐食対策を必要とする青銅弁の弁体及び弁棒は、耐脱亜鉛黄銅材料とする。"],"a":[2],"m":"exact","n":"","e":"水道用硬質塩化ビニルライニング鋼管の使用温度は40℃以下。60℃以下ではない（給湯には耐熱性ライニング鋼管を用いる）。","f":[],"o":["img/R8A41_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R8A42","y":"R8","p":"A","no":42,"s":"ダクト及びダクト附属品に関する記述のうち、適当でないものはどれか。","c":["長方形ダクトのかどの継目の構造には、ピッツバーグはぜ又はボタンパンチスナップはぜを使用する。","厨房用排気フードにグリス除去装置として使用するグリスエクストラクターは、除去した油脂分等を自動的に洗浄できる機能を持っている。","低圧ダクトは、常用圧力において正圧、負圧ともに500Pa以内で使用する。","風量調節ダンパーの風量調節性能は、対向翼ダンパーよりも平行翼ダンパーの方が優れている。"],"a":[4],"m":"exact","n":"","e":"風量調節性能は対向翼ダンパーの方が平行翼ダンパーより優れている。","f":[],"o":["img/R8A42_o0.png"],"g":77,"cat":"A機材・設計図書・約款","neg":true},{"id":"R8A43","y":"R8","p":"A","no":43,"s":"「公共工事標準請負契約約款」に関する記述のうち、適当でないものはどれか。","c":["発注者は、完成通知を受けたときは、通知を受けた日から14日以内に完成検査を完了し、検査結果を受注者に通知しなければならない。","発注者は、引渡し前においても、工事目的物の全部又は一部を受注者の承諾を得て使用することができる。","設計図書の表示が明確でない場合は、監督員に通知して、発注者による確認を請求しなければならない。","発注者は、完成検査合格後、受注者から請負代金の支払い請求があったときは、請求を受けた日から60日以内に請負代金を支払わなければならない。"],"a":[4],"m":"exact","n":"","e":"完成検査合格後の請負代金の支払いは、請求を受けた日から40日以内。","f":[],"o":["img/R8A43_o0.png"],"g":9,"cat":"A機材・設計図書・約款","neg":true},{"id":"R8A44","y":"R8","p":"A","no":44,"s":"設計図書に記載する「配管材料」に関する記述のうち、適当でないものはどれか。","c":["銅管のＬタイプは、Ｍタイプより管の肉厚が大きい。","水道用硬質ポリ塩化ビニル管のVPとHIVPでは、HIVPの方が管の肉厚が大きい。","圧力配管用炭素鋼鋼管は、スケジュール番号の大きい方が管の肉厚が大きい。","水道用硬質塩化ビニルライニング鋼管の原管は、排水用硬質塩化ビニルライニング鋼管の原管より管の肉厚が大きい。"],"a":[2],"m":"exact","n":"","e":"VPとHIVPは外径・肉厚とも同じ寸法。HIVPは耐衝撃性を高めた材質の管。","f":[],"o":["img/R8A44_o0.png"],"g":null,"cat":"A機材・設計図書・約款","neg":true},{"id":"R8B01","y":"R8","p":"B","no":1,"s":"工事の「申請書等」と「提出先」の組合せとして適当でないものはどれか。\n［申請書等］ ［提出先］","c":["騒音規制法の特定建設作業実施届出書 ―― 市町村長","道路の道路占用許可申請書 ―― 警察署長","労働安全衛生法の第一種圧力容器設置届 ―― 労働基準監督署長","建設工事に係る資材の再資源化等に関する法律における対象建設工事の届出書 ―― 都道府県知事、又は政令で定めた市区町長及び条例で定めのある市町村"],"a":[2,4],"m":"any","n":"正答訂正：⑵⑷いずれも正解として採点","e":"⑵道路占用許可申請書の提出先は道路管理者（警察署長は道路使用許可）。⑷も提出先の表記に不備があったため正答として扱われた（正答訂正）。","f":[],"o":["img/R8B01_o0.png"],"g":null,"cat":"B施工管理","neg":true},{"id":"R8B02","y":"R8","p":"B","no":2,"s":"下図に示すネットワーク工程表に関する記述のうち、適当でないものはどれか。\nただし、図中のイベント間のＡ～Ｋは作業内容、日数は作業日数を表す。","c":["クリティカルパスは1本で所要日数は24日である。","イベント⑨の最遅完
